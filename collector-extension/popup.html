<meta charset="utf-8">
<style>
  body{width:340px;margin:0;padding:14px;font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;font-size:13px;color:#1e293b}
  h1{font-size:15px;margin:0 0 10px}
  .row{display:flex;gap:6px;margin-bottom:8px}
  input{flex:1;padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px;font-size:12.5px}
  button{padding:7px 12px;border:0;border-radius:6px;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer}
  button.ghost{background:#e2e8f0;color:#334155}
  .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin:8px 0;line-height:1.7}
  .b{font-weight:800}
  .ok{color:#16a34a}.bad{color:#dc2626}
  /* 오늘 진척·이번 시간대 구획 — 두 숫자가 다른 축이라 눈으로 갈리게 한다 */
  .sec{margin:7px 0;padding-top:7px;border-top:1px solid #e2e8f0}
  .sec:first-of-type{border-top:0;padding-top:0}
  .dim{color:#64748b;font-size:11.5px}
  .bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:5px 0 3px}
  .bar>i{display:block;height:100%;background:#3b82f6;border-radius:99px;transition:width .4s}
  #logs{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:9px;height:130px;overflow:auto;font-size:11px;line-height:1.55;white-space:pre-wrap}
</style>
<h1>메타아이앤씨 순위 수집기</h1>
<!-- 버전은 manifest 에서 읽어 넣는다. 숫자를 여기 박아두면 폴더를 교체해도 옛 버전으로
     보여 「안 바뀌었다」는 오판을 부른다(2026-08-12 플레이스 추적기 실사고). -->
<div id="ver" style="margin:-6px 0 10px;font-size:11.5px;color:#64748b"></div>
<!-- ⚠️ .row 는 display:flex 다 — 이 안에 넣은 것은 전부 가로로 늘어선다.
     여러 대 설정 박스를 여기 넣었다가 토큰칸·저장버튼과 나란히 놓여 화면이
     망가졌다(2026-08-27). 한 줄에 둘 것만 넣고 나머지는 밖으로 뺀다. -->
<div class="row">
  <input id="token" type="password" placeholder="수집기 토큰 붙여넣기" style="flex:1">
  <!-- 다른 기계에 옮겨 적으려면 눈으로 봐야 한다 —
       종전엔 password 칸이라 저장된 토큰을 꺼낼 방법이 개발자도구뿐이었다. -->
  <button id="peek" type="button" title="토큰 보기"
          style="padding:7px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155">👁</button>
  <button id="save">저장</button>
</div>

<!-- 여러 대로 나눠 돌릴 때만 쓴다. 1대면 그대로 두면 된다(2026-08-27). -->
<div style="margin-bottom:8px;padding:10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc">
  <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:6px">
    여러 대로 나눠 돌릴 때만
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <input id="workerNo" type="number" min="1" max="9" value="1"
           style="width:52px;flex:0 0 auto" title="이 기계가 몇 번인가">
    <span style="font-size:12px;color:#475569;white-space:nowrap">번 기계 /</span>
    <input id="workerCount" type="number" min="1" max="9" value="1"
           style="width:52px;flex:0 0 auto" title="전부 몇 대인가">
    <span style="font-size:12px;color:#475569;white-space:nowrap">대 중</span>
  </div>
  <div style="font-size:11px;color:#94a3b8;margin-top:6px;line-height:1.5">
    1대만 쓰면 그대로 두세요. 2대면 한쪽은 <b>1 / 2</b>, 다른 쪽은 <b>2 / 2</b>.
    키워드가 글자 기준으로 갈려 <b>겹치지도 빠지지도 않습니다.</b>
  </div>
</div>
<div class="stat" id="stat">상태를 불러오는 중…</div>
<div class="row">
  <button id="run">지금 수집 실행</button>
  <button id="refresh" class="ghost">새로고침</button>
</div>
<div id="logs"></div>
<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:#475569">🔬 수집 원본 샘플(필드명 검증용)</summary><pre id="raw" style="max-height:150px;overflow:auto;font-size:10.5px">아직 없음 — 수집 1회 실행 후 표시</pre></details>
<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12px;color:#475569">📢 광고 제외 현황 · 광고 상품 원본(1건)</summary><pre id="rawAd" style="max-height:150px;overflow:auto;font-size:10.5px">아직 없음</pre></details>
<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12px;color:#475569">🩺 마지막 판독 실패(원인 진단용)</summary><pre id="readFail" style="max-height:150px;overflow:auto;font-size:10.5px">없음 — 정상</pre></details>
<script src="popup.js"></script>
