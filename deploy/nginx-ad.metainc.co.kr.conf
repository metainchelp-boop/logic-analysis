# /etc/nginx/sites-available/ad.metainc.co.kr  (또는 conf.d/)
# 설치:  sudo ln -s /etc/nginx/sites-available/ad.metainc.co.kr /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo nginx -s reload
# HTTPS: sudo certbot --nginx -d ad.metainc.co.kr   (인증서 자동 설정·갱신)

server {
    listen 80;
    server_name ad.metainc.co.kr;

    # 광고 앱(Docker, 127.0.0.1:5051)으로 역프록시
    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
