# server {} 안에 넣는 검토용 include. 기존 nginx 파일 전체를 바꾸는 파일이 아니다.
# 대상은 운영 dashboard 호스트를 확인한 기존 ③ server 블록 하나뿐이다.
# ①/②/스튜디오 server 블록에 넣거나 이 파일만 conf.d에 복사하면 안 된다.
#
# 쿼리·Referer를 포함한 원문 접근 기록을 끈다. / 경로뿐 아니라 favicon/오류에서도
# SSO 값이 기록되지 않게 이 server 전체에 적용한다. 기존 하위 location이 access_log를
# 다시 켜는지 nginx -T로 반드시 확인한다. 로그 복원이 필요하면 주소·Referer 없는
# 별도 log_format을 http {}에서 검토하고 적용한다(기본 combined 사용 금지).
access_log off;

location = /naver {
    proxy_pass http://127.0.0.1:5051;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer "";
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
}

location ^~ /naver/ {
    proxy_pass http://127.0.0.1:5051;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer "";
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
}

location ^~ /api/naver-auto {
    proxy_pass http://127.0.0.1:5051;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer "";
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    client_max_body_size 64k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
}

# 별도 게이트: 현재 default_server(80/443, IPv4/IPv6)가 모르는 Host를 444로 끊는지
# 확인한다. 이 include에서 default_server를 추가하면 기존 공유 서버와 충돌하므로
# 여기에는 listen/server_name/server 블록을 넣지 않는다. 기존 / 프록시의
# X-Real-IP $remote_addr 덮어쓰기, 상속된 error_page/redirect의 헤더도 별도로 확인한다.
