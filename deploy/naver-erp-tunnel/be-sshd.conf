# 새 계정 하나만 제한한다. root/기존 사용자/백업 Match·키는 수정하지 않는다.
# native sshd -t/-T로 전체 include 문맥과 타계정 정책 불변을 확인하기 전 설치 금지.
Match User naver-erp-tunnel
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PubkeyAcceptedAlgorithms ssh-ed25519
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    HostbasedAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/naver-erp-tunnel
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    MaxSessions 0
    PermitTTY no
    PermitUserRC no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:18081
    PermitListen none
    AllowStreamLocalForwarding no
    GatewayPorts no
Match all
