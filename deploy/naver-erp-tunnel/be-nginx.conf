# BE의 새 /etc/nginx/conf.d/naver-erp-ingress.conf 후보. 기존 HTTP 파일 대체 금지.
# sales_be_up은 기존 blue/green 전환이 소유한다. 여기서 재정의하지 않는다.
map "$request_method:$request_uri" $naver_erp_route {
    default 0;
    "~^GET:/api/ad-sync/contracts[?]stage=[A-Za-z0-9%+_-]+&has_contract=true$" 1;
    "GET:/api/ad-sync/org-snapshot" 1;
    "GET:/api/ad-sync/naver-customer-ids" 1;
    "GET:/api/ad-sync/naver-account-catalog" 1;
    "POST:/api/sso/exchange" 1;
}
map "$request_method:$http_content_length:$http_transfer_encoding" $naver_erp_framing {
    default 0;
    "GET::" 1;
    "GET:0:" 1;
    "~^POST:[1-9][0-9]*:$" 1;
}
server {
    listen 127.0.0.1:18081 default_server;
    server_name _;
    # 정규화 전 URI와 method를 함께 검사: HEAD 자동허용·다른 query·경로 변형 금지.
    if ($naver_erp_route = 0) { return 400; }
    if ($naver_erp_framing = 0) { return 400; }
    access_log off;
    error_log /dev/null;
    client_max_body_size 1k;
    client_body_buffer_size 2k;
    client_header_buffer_size 2k;
    large_client_header_buffers 2 2k;
    client_header_timeout 8s;
    client_body_timeout 8s;
    send_timeout 30s;
    keepalive_timeout 0;
    gzip off;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 8s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    # 임의 header·쿠키·직원 JWT·신뢰 IP 표시는 전달하지 않는다.
    proxy_pass_request_headers off;
    proxy_set_header Host api.metainc.co.kr;
    proxy_set_header Connection close;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent "Python-urllib/3 NaverControl";
    proxy_set_header X-Metainc-Naver-Ingress 1;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header X-Sso-Client-Key $http_x_sso_client_key;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    # 앱은 marker를 신뢰확대로 쓰지 않고, UA/IP와 무관한 engine/NAVER_CONTROL 키 제한으로만 쓴다.
    # location에는 proxy_set_header를 추가하지 않는다(위 whitelist 상속 보호).
    location = /api/ad-sync/contracts { proxy_pass http://sales_be_up; }
    location = /api/ad-sync/org-snapshot { proxy_pass http://sales_be_up; }
    location = /api/ad-sync/naver-customer-ids { proxy_pass http://sales_be_up; }
    location = /api/ad-sync/naver-account-catalog { proxy_pass http://sales_be_up; }
    location = /api/sso/exchange { proxy_pass http://sales_be_up; }
    location / { return 404; }
}
