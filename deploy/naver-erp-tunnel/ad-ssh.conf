# 전용 service의 -F로만 사용한다. 개인/시스템 SSH config 또는 agent를 합치지 않는다.
# @BE_SSH_IPV4@는 검증한 숫자 IPv4로 치환. known_hosts는 확인된 ECDSA P-256 host key만.
Host naver-erp-tunnel
    HostName @BE_SSH_IPV4@
    Port 22
    User naver-erp-tunnel
    AddressFamily inet
    CanonicalizeHostname no
    BatchMode yes
    IdentitiesOnly yes
    IdentityAgent none
    IdentityFile /etc/metainc/naver-erp-tunnel/id_ed25519
    PubkeyAcceptedAlgorithms ssh-ed25519
    HostKeyAlgorithms ecdsa-sha2-nistp256
    UserKnownHostsFile /etc/metainc/naver-erp-tunnel/known_hosts
    GlobalKnownHostsFile /dev/null
    KnownHostsCommand none
    StrictHostKeyChecking yes
    UpdateHostKeys no
    VerifyHostKeyDNS no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PreferredAuthentications publickey
    ForwardAgent no
    ForwardX11 no
    PermitLocalCommand no
    ProxyCommand none
    ProxyJump none
    ControlMaster no
    ControlPath none
    ControlPersist no
    RequestTTY no
    SessionType none
    StdinNull yes
    ConnectTimeout 10
    ConnectionAttempts 1
    ExitOnForwardFailure yes
    ServerAliveInterval 15
    ServerAliveCountMax 2
    TCPKeepAlive no
    StreamLocalBindMask 0117
    StreamLocalBindUnlink no
    LogLevel ERROR
    LocalForward /run/metainc-naver-erp-tunnel/erp.sock 127.0.0.1:18081
