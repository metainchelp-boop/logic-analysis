name: Read fixed proof historical preflight

on:
  push:
    branches:
      - codex/naver-proof-historical-read-20261021
    paths:
      - .github/workflows/naver-proof-prepare-historical.yml

permissions: {}

jobs:
  prepare-historical:
    if: ${{ github.repository == 'metainchelp-boop/logic-analysis' && github.event_name == 'push' && github.ref == 'refs/heads/codex/naver-proof-historical-read-20261021' && github.run_attempt == 1 }}
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fixed repository branch event and first attempt only
        run: |
          set -eu
          python3 -I -B - <<'PY'
          import os
          import sys
          EXPECTED = {"GITHUB_EVENT_NAME": "push", "GITHUB_REF": "refs/heads/codex/naver-proof-historical-read-20261021", "GITHUB_REPOSITORY": "metainchelp-boop/logic-analysis", "GITHUB_RUN_ATTEMPT": "1"}
          def validate(environment):
              if any(type(environment.get(k)) is not str or environment.get(k) != v for k, v in EXPECTED.items()):
                  raise ValueError("CONTEXT")
          if __name__ == "__main__":
              try:
                  validate(os.environ)
              except Exception:
                  print("NAVER_PROOF_HISTORICAL_CONTEXT_REFUSED_V1")
                  sys.exit(1)
          PY
      - name: Read fixed historical preflight only
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
