name: 네이버 엔진 개발 검증 (배포 없음)

on:
  push:
    branches: [codex/naver-runtime-20260930]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-runtime-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    if: github.ref == 'refs/heads/codex/naver-runtime-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: 소스 받기 (자격 저장 없음)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 시험 의존성 준비 (업무 호출 없음)
        id: prepare
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/naver-browsers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/naver-ci" "$RUNNER_TEMP/naver-ci-home"
          python -m pip install -r backend/requirements.txt httpx 'bcrypt<4'
          python -m pip freeze > "$RUNNER_TEMP/naver-ci/python-packages.txt"
          npm install --prefix "$RUNNER_TEMP/naver-node" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/naver-node/node_modules/.bin/playwright" install --with-deps chromium
          python --version
          node --version
          openssl version
          docker compose version
      - name: 외부망 없는 비루트 namespace 시험
        run: |
          set -euo pipefail
          sudo unshare --net -- /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --clear-groups --no-new-privs \
              env -i "PATH=$3" "HOME=$4" "TMPDIR=$4" LANG=C.UTF-8 \
              "PYTHONPATH=$5/backend:$5" PYTHONDONTWRITEBYTECODE=1 \
              "NODE_PATH=$7" "PLAYWRIGHT_BROWSERS_PATH=$8" \
              NAVER_SCREEN_REQUIRE_BROWSER=1 NAVER_RELAY_REQUIRE_APP=1 \
              /bin/bash "$5/tools/naver-runtime-ci-tests.sh" "$5" "$6"
          ' naver-ci "$(id -u)" "$(id -g)" "$PATH" "$RUNNER_TEMP/naver-ci-home" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/naver-ci" \
            "$RUNNER_TEMP/naver-node/node_modules" "$RUNNER_TEMP/naver-browsers"
      - name: 엔진 이미지 빌드와 비루트 무통신 시험 (push 없음)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker build --file Dockerfile.naver-engine --tag "naver-runtime-ci:$GITHUB_SHA" .
          image_args=(--rm --network none --read-only --user 10001:10001 --cap-drop ALL
            --security-opt no-new-privileges:true --pids-limit 64
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777)
          docker run "${image_args[@]}" "naver-runtime-ci:$GITHUB_SHA" \
            python -m naver_runtime check-config | tee "$RUNNER_TEMP/naver-ci/image-check-config.txt"
          docker run "${image_args[@]}" "naver-runtime-ci:$GITHUB_SHA" \
            python -m naver_runtime dry-run | tee "$RUNNER_TEMP/naver-ci/image-dry-run.txt"
          docker run "${image_args[@]}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/naver_runtime/tests,target=/opt/naver-engine/naver_runtime/tests,readonly" \
            "naver-runtime-ci:$GITHUB_SHA" \
            python -m unittest -v naver_runtime.tests.test_backup_transport.CryptoTest \
              naver_runtime.tests.test_linux_runtime naver_runtime.tests.test_server \
              naver_runtime.tests.test_writer naver_runtime.tests.test_main \
            2>&1 | tee "$RUNNER_TEMP/naver-ci/image-crypto-tests.txt"
          docker image inspect "naver-runtime-ci:$GITHUB_SHA" --format '{{.Id}}' \
            | tee "$RUNNER_TEMP/naver-ci/image-id.txt"
          python tools/naver-runtime-image-test.py "naver-runtime-ci:$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/naver-ci/image-compose-raw.txt"
      - name: 시험 증거 보관 (7일)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naver-runtime-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/naver-ci/
          retention-days: 7
          if-no-files-found: error
