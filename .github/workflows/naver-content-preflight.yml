name: 콘텐츠 보존 전 메타데이터 관찰 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      container_id:
        description: '직전 app-inventory의 콘텐츠 컨테이너 ID 64자리'
        required: true
        type: string
      expected_image:
        description: '같은 관찰의 sha256: 이미지 ID'
        required: true
        type: string
      expected_init_pid:
        description: '같은 관찰의 호스트 init PID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-logic-analysis
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 대표 계정·main·명시한 대상 형식 확인
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          TARGET_ID: ${{ inputs.container_id }}
          TARGET_IMAGE: ${{ inputs.expected_image }}
          TARGET_PID: ${{ inputs.expected_init_pid }}
          HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$TRIGGERING_ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$REF" != refs/heads/main ]; then echo MAIN_REQUIRED; exit 1; fi
          if ! [[ "$TARGET_ID" =~ ^[0-9a-f]{64}$ ]]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          if ! [[ "$TARGET_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          if ! [[ "$TARGET_PID" =~ ^[1-9][0-9]{0,9}$ ]]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          if [ "$TARGET_PID" -gt 4294967295 ]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          if ! [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then echo TRUSTED_HOST_FINGERPRINT_REQUIRED; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 메타데이터 도구 합성 검사 (DB·키·서버 없음)
        run: python -I -B -m unittest discover -s deploy/naver/tests -v
      - name: 검사한 helper 한 파일 준비
        run: |
          set -euo pipefail
          mkdir preflight-ship
          cp deploy/naver/content_runtime_preflight.py preflight-ship/
          echo "NSP_SHA=$(sha256sum preflight-ship/content_runtime_preflight.py | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NSP_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: 충돌 없는 관리자 전용 임시 폴더 준비
        id: prepare_remote
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NSP_RUN
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NSP_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            [ -d /tmp ]
            [ ! -L /tmp ]
            umask 077
            mkdir "/tmp/metainc-content-preflight-$NSP_RUN"
      - name: helper 한 파일 전송 (제품·데이터 없음)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 45s
          source: preflight-ship/content_runtime_preflight.py
          target: /tmp/metainc-content-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: false
      - name: 고정 콘텐츠 대상의 메타데이터만 관찰
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          NSP_CONTAINER: ${{ inputs.container_id }}
          NSP_IMAGE: ${{ inputs.expected_image }}
          NSP_PID: ${{ inputs.expected_init_pid }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NSP_RUN,NSP_SHA,NSP_CONTAINER,NSP_IMAGE,NSP_PID
          command_timeout: 45s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NSP_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            printf '%s' "$NSP_SHA" | grep -Eq '^[0-9a-f]{64}$'
            printf '%s' "$NSP_CONTAINER" | grep -Eq '^[0-9a-f]{64}$'
            printf '%s' "$NSP_IMAGE" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s' "$NSP_PID" | grep -Eq '^[1-9][0-9]{0,9}$'
            incoming="/tmp/metainc-content-preflight-$NSP_RUN"
            helper="$incoming/content_runtime_preflight.py"
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            trap 'rm -f -- "$helper" 2>/dev/null; rmdir -- "$incoming" 2>/dev/null || true' EXIT
            [ -f "$helper" ]
            [ ! -L "$helper" ]
            [ "$(stat -c '%u' "$helper")" = 0 ]
            [ "$(sha256sum "$helper" | cut -d' ' -f1)" = "$NSP_SHA" ]
            rc=0
            out=$(timeout -k 1s 20s python3 -I -B "$helper" --container-id "$NSP_CONTAINER" --expected-image "$NSP_IMAGE" --expected-init-pid "$NSP_PID" 2>/dev/null) || rc=$?
            case "$rc" in 0|2) ;; *) echo CONTENT_PREFLIGHT_FAILED; exit 1 ;; esac
            printf 'CONTENT_RUNTIME_PREFLIGHT=%s\n' "$out"
            exit "$rc"
      - name: 이번 실행의 helper와 빈 임시 폴더만 정리
        if: always() && steps.prepare_remote.outcome == 'success'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NSP_RUN
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NSP_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            incoming="/tmp/metainc-content-preflight-$NSP_RUN"
            helper="$incoming/content_runtime_preflight.py"
            if [ ! -e "$incoming" ] && [ ! -L "$incoming" ]; then exit 0; fi
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            if [ -e "$helper" ] || [ -L "$helper" ]; then
              [ -f "$helper" ]
              [ ! -L "$helper" ]
              [ "$(stat -c '%u' "$helper")" = 0 ]
              rm -f -- "$helper" 2>/dev/null
            fi
            if ! rmdir -- "$incoming" 2>/dev/null; then echo CONTENT_PREFLIGHT_CLEANUP_INCOMPLETE; exit 1; fi
