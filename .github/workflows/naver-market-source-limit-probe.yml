name: 시장자료 읽기 제한 분기 단일 진단
on:
  push:
    branches: [codex/naver-claude-reference-ops-20261011]
    paths:
      - .github/workflows/naver-market-source-limit-probe.yml
      - backend/tools/naver_market_source_limit_probe.py
      - backend/tools/naver_market_source_limit_probe_host.py
      - backend/tests/test_naver_market_source_limit_probe.py
      - backend/tests/test_naver_market_source_limit_probe_host.py
      - backend/tests/test_naver_market_source_limit_probe_namespace.py
  workflow_dispatch:
    inputs:
      confirm:
        description: '원상한으로 시장DB 1회 읽기. 분기만출력, DB·서비스·보고서·광고 변경 없음.'
        required: true
        type: choice
        options: [READ_MARKET_SOURCE_LIMIT_ONCE]
permissions:
  contents: read
  actions: read
jobs:
  synthetic:
    if: github.ref == 'refs/heads/codex/naver-claude-reference-ops-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 고정 원천제한 진단 및 전송 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_market_source_limit_probe test_naver_market_source_limit_probe_host -v
      - name: Linux 격리 읽기전용 WAL 실제 경계 검사
        run: |
          set -euo pipefail
          sudo env -i "PATH=$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_market_source_limit_probe_namespace -v
  one-shot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/naver-claude-reference-ops-20261011' && inputs.confirm == 'READ_MARKET_SOURCE_LIMIT_ONCE'
    needs: synthetic
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 정확한 소스 전체 native 성공 및 고정 프로그램 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,re,subprocess,sys
          EXPECTED_HOST_SHA256 = '21df3f2cdc6d69d5dde3d2b6169e9d86af7628f216601c0017b111269aef078c'  # Root registers the reviewed host.
          if type(EXPECTED_HOST_SHA256) is not str or not re.fullmatch('[0-9a-f]{64}', EXPECTED_HOST_SHA256):
              raise SystemExit('HOST_PIN_REQUIRED')
          runs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/naver-product-export-tests.yml/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=10']))['workflow_runs']
          candidates=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='codex/naver-claude-reference-ops-20261011' and r['status']=='completed' and r['conclusion']=='success']
          if not candidates:raise SystemExit('EXACT_NATIVE_SUCCESS_REQUIRED')
          folder=pathlib.Path('backend/tools')
          host=(folder/'naver_market_source_limit_probe_host.py').read_bytes()
          if hashlib.sha256(host).hexdigest()!=EXPECTED_HOST_SHA256:raise SystemExit('HOST_SOURCE_CHANGED')
          sys.path.insert(0,str(folder))
          import naver_market_source_limit_probe_host as H
          core=(folder/'naver_market_source_limit_probe.py').read_bytes()
          sources={role:pathlib.Path(name).read_bytes() for role,name in H.SOURCE_FILES.items()}
          wire=H.encode(core,sources,host)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('MARKET_SOURCE_LIMIT_WIRE='+wire+'\n')
          print('NATIVE_GATE='+json.dumps({'head_sha':os.environ['GITHUB_SHA'],'native_run_id':candidates[0]['id'],'status':'success'}))
          PYCODE
      - name: 호스트에서 원상한으로 시장 원천 정확 1회 읽기
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          MARKET_SOURCE_LIMIT_WIRE: ${{ env.MARKET_SOURCE_LIMIT_WIRE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MARKET_SOURCE_LIMIT_WIRE
          command_timeout: 2m
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PYCODE'
            import base64,hashlib,json,lzma,os,re,types
            EXPECTED_HOST_SHA256 = '21df3f2cdc6d69d5dde3d2b6169e9d86af7628f216601c0017b111269aef078c'  # Root registers the same reviewed host.
            result={'version':1,'transport':'market-source-limit-probe','transport_ok':False,'error_code':'HOST_REFUSED','result':None}
            try:
                wire=os.environ.pop('MARKET_SOURCE_LIMIT_WIRE')
                os.environ.clear();os.environ.update(PATH='/usr/sbin:/usr/bin:/sbin:/bin',LANG='C')
                if type(EXPECTED_HOST_SHA256) is not str or not re.fullmatch('[0-9a-f]{64}',EXPECTED_HOST_SHA256):raise ValueError('HOST_PIN_REQUIRED')
                if not 0<len(wire)<=65536 or not wire.isascii():raise ValueError('WIRE_SIZE')
                decoder=lzma.LZMADecompressor(format=lzma.FORMAT_XZ,memlimit=33554432)
                raw=decoder.decompress(base64.b85decode(wire),max_length=131073)
                if len(raw)>131072 or not decoder.eof or decoder.unused_data:raise ValueError('PACKAGE_SIZE')
                def unique(pairs):
                    value={}
                    for key,item in pairs:
                        if key in value:raise ValueError('PACKAGE_JSON')
                        value[key]=item
                    return value
                package=json.loads(raw,object_pairs_hook=unique,parse_constant=lambda _:(_ for _ in ()).throw(ValueError('PACKAGE_JSON')))
                if type(package) is not dict or set(package)!={'version','host','core','sources'} or type(package['version']) is not int or package['version']!=1:raise ValueError('PACKAGE_SHAPE')
                if type(package['host']) is not str or type(package['core']) is not str or type(package['sources']) is not dict or any(type(v) is not str for v in package['sources'].values()):raise ValueError('PACKAGE_SHAPE')
                host=package['host'].encode('utf-8')
                if not 0<len(host)<=32768 or hashlib.sha256(host).hexdigest()!=EXPECTED_HOST_SHA256:raise ValueError('HOST_SOURCE_CHANGED')
                module=types.ModuleType('fixed_market_source_limit_probe_host');exec(compile(host,'<pinned-market-source-limit-host>','exec'),module.__dict__)
                result=module.run(package['core'].encode('utf-8'),{k:v.encode('utf-8') for k,v in package['sources'].items()})
            except Exception:
                pass
            print('NAVER_MARKET_SOURCE_LIMIT_V1='+json.dumps(result,sort_keys=True,allow_nan=False))
            PYCODE
