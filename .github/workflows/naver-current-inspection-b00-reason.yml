          CONFIRM='READ_FOODIN_20261018_DAILY_REASON_ONCE'
          PREFIX='naver-current-inspection-b00-reason-'
          Q_PATH='backend/tools/naver_market_operation_ledger/qualification.py'
          Q_PIN='06a302a5744bb24423b1f52703f5432fd2bfd40bf50a27f83eff0f4229ae0058'
          PINS={'backend/tools/naver_current_inspection_b00_reason.py': '1b9b7b05bb2d600bcaa5a1ca4f9fd82e06d490584c7ed5997d45493c6acdb4a9', 'backend/tools/naver_current_inspection_b00_reason_transport.py': '935cfaab5356410aea11d11d90ef29e70d262835a457281943fdee5403bee713', 'backend/tests/test_naver_current_inspection_b00_reason.py': '24124bb2dbe270c7ac23f2344b0d5fe36920496fa0bacd8c0d3d1f7df254f71b', 'backend/tools/naver_erp_tunnel_service_install.py': '236cdd596bae2f8d5e0dfea5822bdd7216c44addac2bbb643306dfbff00fdd3a', 'backend/tools/naver_preview_release.py': '7288d51eba4e2c0320d196b8da2ee14f852b87f33304c221878c218cd1dacb84', 'backend/tools/naver_current_inspection_diagnostics.py': '04fecbd6538524b3b58f9b3a121294ff1d662154360c9346137567cdc49adf1e'}
          STEPS=('Checkout exact source','Python 3.12','Check fixed readonly source on Linux','Retain closed qualification only')
          TEST_IDS=('test_sqlite_readonly_authorizer', 'test_old_source_package_refused', 'test_old_receipt_rejected_before_docker', 'test_namespace_target_cannot_expand', 'test_closed_output_rejects_raw_and_alias', 'test_fixed_daily_and_no_writer_calls', 'test_host_guard_function_byte_preserved', 'test_three_source_roundtrip_and_tamper')
          
          
          def initial_read(relative,pin):
           path=ROOT/relative
           if any(p.is_symlink() for p in (path,*path.parents)):raise ValueError('SOURCE_PATH')
           fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
           try:
            before=os.fstat(fd)
            if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1 or not 0<before.st_size<=131072:raise ValueError('SOURCE_FILE')
            body=os.read(fd,131073);after=os.fstat(fd);named=path.stat(follow_symlinks=False)
            identity=lambda s:(s.st_dev,s.st_ino,s.st_size,s.st_mtime_ns,s.st_ctime_ns,s.st_nlink)
            if identity(before)!=identity(after) or identity(after)!=identity(named) or len(body)!=before.st_size:raise ValueError('SOURCE_CHANGED')
           finally:os.close(fd)
           if hashlib.sha256(body).hexdigest()!=pin:raise ValueError('SOURCE_PIN')
           return body
          
          
          def load_qualifier():
           body=initial_read(Q_PATH,Q_PIN)
           m=types.ModuleType('b00_reason_existing_qualification')
           exec(compile(body,'<pinned-existing-native-qualification>','exec'),m.__dict__)
           return m
          
          
          def context(Q,event):
           Q.need(os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('GITHUB_REPOSITORY')==REPO
            and os.environ.get('GITHUB_REF')=='refs/heads/'+BRANCH and os.environ.get('GITHUB_EVENT_NAME')==event
            and os.environ.get('GITHUB_RUN_ATTEMPT')=='1','CONTEXT')
           head=os.environ.get('GITHUB_SHA');rid=os.environ.get('GITHUB_RUN_ID')
           Q.need(Q.digest(head,40) and type(rid) is str and re.fullmatch('[1-9][0-9]{0,18}',rid) is not None and Q.positive(int(rid)),'CONTEXT')
           return head,int(rid)
          
          
