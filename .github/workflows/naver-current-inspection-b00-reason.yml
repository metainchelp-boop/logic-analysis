           exec(compile(body,'<pinned-'+name+'>','exec'),m.__dict__)
           return m
          
          
          def write_closed(Q,name,body):
           path=ROOT/'foodin-reason-evidence'/name
           fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o644)
