name: Deploy to VPS

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/debug-place.yml'   # 읽기 전용 진단 — 수정이 재배포를 유발하지 않게(① debug-logs 선례)
      - '.github/workflows/debug-rank.yml'    # 〃 (순위 배치·저장소 통합 실측용, 2026-08-05)
      - '.github/workflows/debug-consumption.yml'  # 〃 (수집 키워드 실소비 산출, 2026-08-11)
      # 크롬 확장은 **서버에 배포되지 않는다**(직원 PC 에 zip 으로 설치). 그런데 이 폴더만
      # 고쳐도 재배포가 돌아 컨테이너가 교체되고, 그 순간 수집기가 502 를 맞는다
      # (2026-08-06 실사고: 확장 수정 푸시 → 10:15 배포 중 '키워드 조회 실패 HTTP 502').
      - 'collector-extension/**'
      - 'extension/**'
      - 'extension-place/**'
      # 문서만 고친 커밋이 컨테이너를 교체할 이유가 없다(연속성 메모리 CLAUDE.md 를
      # 자주 갱신하는데, 그때마다 배포가 돌아 수집기·분석 요청이 교체 순간을 맞는다).
      # ⚠️ 전제: 런타임·빌드가 .md 를 읽지 않는다(2026-08-11 전수 확인 — backend/·
      # frontend/build.js·Dockerfile·docker-compose 어디에도 참조 0). md 를 읽는
      # 코드가 생기면 이 줄을 먼저 지울 것.
      # 코드와 문서를 같이 담은 커밋은 정상적으로 배포된다(paths-ignore 는 '전부
      # 무시 대상일 때만' 건너뛴다).
      - '**/*.md'
  workflow_dispatch:   # 수동 실행 — 시크릿 변경 반영 등

# ⚠️ 배포는 한 번에 하나씩 (2026-08-27 실사고로 신설)
#
# 이 워크플로는 backend 폴더를 통째로 SCP 로 덮고 컨테이너를 다시 세운다. 그래서 두 배포가
# 겹쳐 돌면 **나중에 끝난 쪽이 자기 시점의 스냅샷으로 앞 배포를 지운다.**
#
# 실제로 그렇게 됐다. 8/27 오전 배포 두 건이 35초 차로 겹쳐 돌아 둘 다 success 로 끝났는데,
# 서버 /app/rank_link.py 에는 그날 배포한 함수가 없었다(진단에서 ImportError 로 드러남).
# 런이 초록이라 아무도 몰랐고, 그날 밤 정기 갱신이 옛 규칙으로 돌 뻔했다.
#
# cancel-in-progress 는 **false** 다 — 취소하면 그 배포가 통째로 사라진다.
# 뒤에 온 배포는 앞 배포가 끝날 때까지 기다렸다가 돈다(몇 분 늦을 뿐 안전하다).
concurrency:
  group: deploy-logic-analysis
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 담당자 변경 서비스 키 확인
        env:
          HANDOVER_TRANSFER_API_KEY: ${{ secrets.HANDOVER_TRANSFER_API_KEY }}
        run: |
          if [ -z "$HANDOVER_TRANSFER_API_KEY" ]; then
            echo "::error::HANDOVER_TRANSFER_API_KEY 저장소 Secret을 먼저 설정해야 합니다."
            exit 1
          fi

      # ── 신뢰도 회귀 테스트 — 실패 시 배포 중단(VPS 접촉 전이라 라이브 무영향) ──
      # 분석 실행 핵심 파싱 로직(가격 회수·0리뷰·월버킷팅) 재발 방지 가드.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backend regression tests
        run: |
          pip install --quiet beautifulsoup4 requests
          python backend/tests/test_analysis_regression.py

      # 프론트 번들 자동 빌드 — .jsx 수정 시 번들 재생성을 깜빡해도 항상 최신으로 배포.
      # (실패해도 이후 SCP/재시작 단계 전이라 라이브에는 영향 없음 — 무중단)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend bundle
        run: |
          npm install --no-save @babel/core @babel/preset-react
          node frontend/build.js

      - name: Deploy frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/"
          target: "/root/logic-analysis-deploy/"
          overwrite: true

      - name: Deploy backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/*"
          target: "/root/logic-analysis-deploy/"
          overwrite: true

      - name: Rebuild and restart Docker container
        uses: appleboy/ssh-action@v1.0.3
        env:
          HANDOVER_TRANSFER_API_KEY: ${{ secrets.HANDOVER_TRANSFER_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 300s
          envs: HANDOVER_TRANSFER_API_KEY
          script: |
            cd /root/logic-analysis-deploy

            # ── COLLECTOR_TOKEN 멱등 주입 (2026-08-04, 브라우저 수집기) ──
            # GitHub Secret COLLECTOR_TOKEN 이 설정돼 있고 .env 에 아직 없을 때만
            # 맨 아래에 한 줄 추가한다(기존 키들은 그대로 — 덮어쓰기 없음).
            if [ -n "${{ secrets.COLLECTOR_TOKEN }}" ] && ! grep -q '^COLLECTOR_TOKEN=' .env 2>/dev/null; then
              cp .env .env.bak-collector 2>/dev/null || true
              echo 'COLLECTOR_TOKEN=${{ secrets.COLLECTOR_TOKEN }}' >> .env
              echo "COLLECTOR_TOKEN 주입 완료 (.env.bak-collector 백업)"
            fi

            # ── 전산 계약연동 키 멱등 주입 (2026-08-20) ──
            # 전산(①) 서버의 AD_SYNC_API_KEY 와 **같은 값**을 우리 쪽 이름으로 넣는다.
            # 이 키가 있어야 매일 04:00 계약단계 동기화(자동 중지·재개·계약 종료일 반영)가 돈다.
            # 종전에는 키가 없어 "미설정 — 건너뜀" 로그만 매일 찍히고 무동작이었다.
            if [ -n "${{ secrets.ERP_AD_SYNC_API_KEY }}" ] && ! grep -q '^ERP_AD_SYNC_API_KEY=' .env 2>/dev/null; then
              cp .env .env.bak-adsync 2>/dev/null || true
              echo 'ERP_AD_SYNC_API_KEY=${{ secrets.ERP_AD_SYNC_API_KEY }}' >> .env
              echo "ERP_AD_SYNC_API_KEY 주입 완료 (.env.bak-adsync 백업)"
            fi

            # ── 담당자 변경 전용 서비스 키 갱신 (2026-08-28) ──
            # 전산 BE 저장소와 같은 Secret을 쓰며, 빈 옛 행도 제거하고 현재 값을 확실히 반영한다.
            cp .env .env.bak-handover 2>/dev/null || true
            grep -v '^HANDOVER_TRANSFER_API_KEY=' .env > .env.handover || true
            mv .env.handover .env
            printf 'HANDOVER_TRANSFER_API_KEY=%s\n' "$HANDOVER_TRANSFER_API_KEY" >> .env
            echo "HANDOVER_TRANSFER_API_KEY 갱신 완료 (.env.bak-handover 백업)"

            # ── 소상공인365 인증키 6종 멱등 주입 (2026-08-05, 상권 데이터 고도화) ──
            # 서비스(오퍼레이션)별로 개별 발급되는 인증키. COLLECTOR_TOKEN 선례와 동일하게
            # 「시크릿이 있고 .env 에 아직 없을 때만」 추가 — 기존 키 덮어쓰기 없음.
            # 미설정 키는 그냥 건너뜀(해당 API 만 조용히 비활성, 무해).
            _sbiz_backed_up=0
            for _pair in \
              "SBIZ365_KEY_SIMPLE=${{ secrets.SBIZ365_KEY_SIMPLE }}" \
              "SBIZ365_KEY_DETAIL=${{ secrets.SBIZ365_KEY_DETAIL }}" \
              "SBIZ365_KEY_SLSIDX=${{ secrets.SBIZ365_KEY_SLSIDX }}" \
              "SBIZ365_KEY_STOR=${{ secrets.SBIZ365_KEY_STOR }}" \
              "SBIZ365_KEY_SNS=${{ secrets.SBIZ365_KEY_SNS }}" \
              "SBIZ365_KEY_THEME=${{ secrets.SBIZ365_KEY_THEME }}" \
              "SBIZ_DATA_GO_KR_KEY=${{ secrets.SBIZ_DATA_GO_KR_KEY }}" ; do
              _name="${_pair%%=*}"
              _val="${_pair#*=}"
              if [ -n "$_val" ] && ! grep -q "^${_name}=" .env 2>/dev/null; then
                if [ "$_sbiz_backed_up" = "0" ]; then
                  cp .env .env.bak-sbiz365 2>/dev/null || true
                  _sbiz_backed_up=1
                fi
                echo "${_name}=${_val}" >> .env
                echo "${_name} 주입 완료"
              fi
            done

            # ── 데이터랩 검색어트렌드 전용 키 멱등 주입 (2026-08-11) ──
            # 네이버가 「데이터랩(검색어트렌드)」 **신규 등록을 막아둔** 상태라(개발자센터에서
            # 기존 앱에 추가 시 "신규로 등록할 수 없는 API" 거절), 그 권한을 이미 가진
            # 다른 앱의 키로만 이 API 를 부른다. 나머지(지역·쇼핑검색·쇼핑인사이트)는
            # 종전 NAVER_CLIENT_ID/SECRET 그대로 — 주력 경로의 한도를 남과 섞지 않기 위함.
            # 미설정이면 코드가 기존 키로 폴백(=지금과 동일, 트렌드만 조용히 비활성).
            # ⚠️ NAVER_CLIENT_ID/SECRET 은 원래 GitHub 시크릿이 아니라 **서버 .env 에 직접**
            # 들어 있었다(2026-08-11 진단에서 대조군 false 로 드러남). 지금 서버는 정상이지만
            # 서버를 새로 세우면 이 키만 안 따라가 검색·쇼핑인사이트가 통째로 죽는다.
            # → 시크릿으로 등재해 재구축 경로를 복원한다.
            # ⚠️ 아래 가드가 「.env 에 이미 있으면 건너뜀」이라 **현재 서버 값은 절대 덮이지 않는다**
            #    (= 지금 동작 변화 0). 새 서버·빈 .env 일 때만 주입된다.
            _dl_backed_up=0
            for _pair in \
              "DATALAB_SEARCH_CLIENT_ID=${{ secrets.DATALAB_SEARCH_CLIENT_ID }}" \
              "DATALAB_SEARCH_CLIENT_SECRET=${{ secrets.DATALAB_SEARCH_CLIENT_SECRET }}" \
              "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" \
              "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" ; do
              _name="${_pair%%=*}"
              _val="${_pair#*=}"
              if [ -n "$_val" ] && ! grep -q "^${_name}=" .env 2>/dev/null; then
                if [ "$_dl_backed_up" = "0" ]; then
                  cp .env .env.bak-datalab 2>/dev/null || true
                  _dl_backed_up=1
                fi
                echo "${_name}=${_val}" >> .env
                echo "${_name} 주입 완료"
              fi
            done

            # docker-compose.yml 작성
            cat > docker-compose.yml << 'COMPEOF'
            version: '3.8'
            services:
              logic-analysis:
                build: ./backend
                image: logic-analysis:latest
                container_name: logic-analysis
                restart: unless-stopped
                ports:
                  - "127.0.0.1:5050:5050"
                env_file:
                  - .env
                environment:
                  - TZ=Asia/Seoul
                volumes:
                  - ./data:/app/data
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"
            COMPEOF

            # Nginx에 .jsx MIME 타입 추가 (없으면 추가)
            if ! grep -q '\.jsx' /etc/nginx/mime.types 2>/dev/null; then
              sudo sed -i '/application\/javascript/a\    application/javascript                        jsx;' /etc/nginx/mime.types 2>/dev/null || true
            fi

            # Nginx 설정 리로드 (정적 파일 서빙 반영)
            sudo nginx -t && sudo nginx -s reload 2>/dev/null || true

            # ── 무중단 지향 교체 + 자동 롤백 ──
            # 기존: down → build(--no-cache, 수 분간 컨테이너 없음 = 긴 다운 윈도우) → up.
            # 개선: 구 컨테이너를 계속 서빙시킨 채 '먼저 빌드' → 롤백용 이미지 보존 → '빠른 교체'.
            #       다운 윈도우가 빌드시간(수 분) → 컨테이너 재생성+기동(수십 초)으로 축소.
            #       (진짜 0초 무중단은 nginx blue-green 필요 — VPS 설정 확인 후 후속)

            # 1) 현재 실행 중 이미지를 롤백용으로 보존
            if docker image inspect logic-analysis:latest >/dev/null 2>&1; then
              docker tag logic-analysis:latest logic-analysis:rollback && echo "롤백 이미지 보존 완료"
            fi

            # 2) 새 이미지 빌드 — 구 컨테이너는 그대로 서빙 중(빌드 동안 다운 없음)
            #    빌드 실패 시: 구 컨테이너를 건드리지 않고 즉시 실패 처리(사이트 무영향).
            if ! docker compose build --no-cache; then
              echo "새 이미지 빌드 실패 → 구 버전 그대로 유지(사이트 정상), 배포만 실패 처리"
              exit 1
            fi

            # 3) 새 이미지로 교체 (down 생략 → up -d가 컨테이너 재생성)
            docker compose up -d

            # 4) 빌드 캐시 자동 정리 (실행 중 컨테이너/이미지/볼륨/DB는 영향 없음)
            docker builder prune -f --keep-storage 2GB || true
            # 4b) 옛 이미지 자동 정리 — 재배포마다 이전 이미지가 dangling으로 쌓여
            #     디스크를 채우던 문제(2026-07-20 95% 실사고) 방지. 사용 중 이미지는 안전.
            docker image prune -f || true

            # 5) 헬스체크 (대용량 DB 기동 시간 고려: 초기 대기 + 최대 120초)
            echo "앱 기동 대기 중(20초)..."
            sleep 20
            echo "헬스체크 시작..."
            for i in $(seq 1 24); do
              if curl -sf http://127.0.0.1:5050/api/health > /dev/null 2>&1; then
                echo "헬스체크 성공! (${i}번째 시도)"
                docker compose ps
                exit 0
              fi
              echo "대기 중... (${i}/24)"
              sleep 5
            done

            # 6) 헬스체크 실패 → 이전 버전으로 자동 롤백 (직원 사용 보호)
            echo "새 버전 헬스체크 실패 → 이전 버전으로 자동 롤백 시도"
            docker compose logs --tail=40
            if docker image inspect logic-analysis:rollback >/dev/null 2>&1; then
              docker tag logic-analysis:rollback logic-analysis:latest
              docker compose up -d --no-build
              echo "이전 버전으로 롤백 완료 — 헬스 재확인 중"
              sleep 15
              for j in $(seq 1 12); do
                if curl -sf http://127.0.0.1:5050/api/health > /dev/null 2>&1; then
                  echo "롤백 후 헬스체크 성공 (${j}번째) — 사이트 정상, 배포만 실패 처리"
                  docker compose ps
                  exit 1
                fi
                sleep 5
              done
              echo "치명: 롤백 후에도 헬스 실패 — 수동 개입 필요"
            else
              echo "롤백 이미지 없음(최초 배포) — 수동 개입 필요"
            fi
            exit 1
