name: 전용 ERP 터널 격리 검증 (배포 없음)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel-native:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/naver-backup-recovery-20261001'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 정책과 네이티브 왕복 검사 (외부망·실제 자격 없음)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/naver-erp-tunnel/test_policy.py -v
          docker build --file deploy/naver-erp-tunnel/test.Dockerfile --tag "naver-tunnel-ci:$GITHUB_SHA" .
          timeout 180s docker run --rm --network none --pids-limit 128 "naver-tunnel-ci:$GITHUB_SHA"
