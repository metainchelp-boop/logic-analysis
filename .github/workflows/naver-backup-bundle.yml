name: NAVER 고정 두 백업 무손실 보존

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '고정 두 원본 PLAN 또는 검증 후 APPLY'
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      plan_sha256:
        description: 'APPLY 전용 PLAN SHA-256'
        type: string
        default: ''
      plan_json:
        description: 'APPLY 전용 직전 결과의 고정 closed plan JSON'
        type: string
        default: ''
      confirm:
        description: 'APPLY 전용 PRESERVE_FIXED_NAVER_BACKUP_BUNDLE_LOSSLESSLY'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-logic-analysis
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 대표 계정·main·첫 실행·신뢰한 호스트 확인
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
          HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$ACTOR" = metainchelp-boop
          test "$TRIGGERING_ACTOR" = metainchelp-boop
          test "$REF" = refs/heads/main
          test "$ATTEMPT" = 1
          [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 고정 묶음·기존 보존 합성 회귀
        run: |
          python -I -B -m unittest discover -s deploy/naver/tests -p 'test_backup_bundle*.py' -v
          python -I -B -m unittest discover -s deploy/naver/tests -p 'test_cold_backup_archive*.py' -v
      - name: 닫힌 입력 검증과 공개 helper 두 파일 준비
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PLAN: ${{ inputs.plan_sha256 }}
          INPUT_JSON: ${{ inputs.plan_json }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          python -I -B - <<'PYCODE'
          import base64,importlib.util,os
          spec=importlib.util.spec_from_file_location('bundle','deploy/naver/backup_bundle.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          mode,sha,raw,confirm=(os.environ[k] for k in ('INPUT_MODE','INPUT_PLAN','INPUT_JSON','INPUT_CONFIRM'))
          if mode=='plan':
              assert not sha and not raw and not confirm
              encoded=''
          elif mode=='apply':
              assert confirm==m.CONFIRM
              plan=m.parse_plan(raw,sha)
              encoded=base64.b64encode(m.A.canonical(plan).encode()).decode()
          else:
              raise ValueError('INPUT_REFUSED')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('NBB_PLAN_B64='+encoded+'\n')
          PYCODE
          mkdir -m 755 backup-bundle-ship
          cp deploy/naver/backup_bundle.py deploy/naver/cold_backup_archive.py backup-bundle-ship/
          sudo chown 0:0 backup-bundle-ship/*.py
          sudo chmod 644 backup-bundle-ship/*.py
          echo "NBB_SHA=$(sha256sum backup-bundle-ship/backup_bundle.py | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NBB_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: 관리자 전용 일회 helper 폴더 준비
        id: prepare_remote
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NBB_RUN
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NBB_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            [ -d /tmp ] && [ ! -L /tmp ]
            umask 077
            mkdir "/tmp/metainc-naver-backup-bundle-$NBB_RUN"
      - name: 검증한 공개 helper 두 파일만 전송
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 45s
          source: backup-bundle-ship/backup_bundle.py,backup-bundle-ship/cold_backup_archive.py
          target: /tmp/metainc-naver-backup-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: false
      - name: 고정 묶음 PLAN 또는 검증한 APPLY
        env:
          NBB_MODE: ${{ inputs.mode }}
          NBB_PLAN: ${{ inputs.plan_sha256 }}
          NBB_CONFIRM: ${{ inputs.confirm }}
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NBB_RUN,NBB_SHA,NBB_MODE,NBB_PLAN,NBB_CONFIRM,NBB_PLAN_B64
          command_timeout: 21m
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NBB_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            printf '%s' "$NBB_SHA" | grep -Eq '^[0-9a-f]{64}$'
            incoming="/tmp/metainc-naver-backup-bundle-$NBB_RUN"
            helper="$incoming/backup_bundle.py"
            cold="$incoming/cold_backup_archive.py"
            [ -d "$incoming" ] && [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            trap 'rm -f -- "$helper" "$cold" 2>/dev/null; rmdir -- "$incoming" 2>/dev/null || true' EXIT
            for item in "$helper" "$cold"; do
              [ -f "$item" ] && [ ! -L "$item" ]
              [ "$(stat -c '%u:%h:%a' "$item")" = 0:1:644 ]
            done
            [ "$(sha256sum "$helper" | cut -d' ' -f1)" = "$NBB_SHA" ]
            plan_json=$(printf '%s' "$NBB_PLAN_B64" | base64 -d)
            rc=0
            out=$(python3 -I -B "$helper" "$NBB_MODE" "$NBB_PLAN" "$NBB_CONFIRM" "$plan_json" 2>/dev/null) || rc=$?
            case "$rc" in 0|2) ;; *) echo NAVER_BACKUP_BUNDLE_FAILED; exit 1 ;; esac
            printf '%s' "$out" | python3 -I -B -c '
            import hashlib,os,stat,sys
            path,expected,rc=sys.argv[1:]
            fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)
            try:
                before=os.fstat(fd);raw=os.read(fd,131073);after=os.fstat(fd)
                assert stat.S_ISREG(before.st_mode) and before.st_uid==0 and before.st_nlink==1
                assert len(raw)<=131072 and hashlib.sha256(raw).hexdigest()==expected
                assert (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns)
            finally: os.close(fd)
            ns={"__name__":"closed_validator","__file__":path};exec(compile(raw,path,"exec"),ns)
            data=sys.stdin.buffer.read(16385)
            assert 0<len(data)<=16384 and b"\n" not in data
            value=ns["A"].strict_json(data);ns["validate_report"](value)
            assert (rc=="0" and value["status"] in ("planned","applied")) or (rc=="2" and value["status"]=="refused")
            ' "$helper" "$NBB_SHA" "$rc" 2>/dev/null || { echo NAVER_BACKUP_BUNDLE_OUTPUT_REFUSED; exit 1; }
            printf 'NAVER_BACKUP_BUNDLE_RESULT=%s\n' "$out"
            exit "$rc"
      - name: 이번 공개 helper와 빈 일회 폴더만 정리
        if: always() && steps.prepare_remote.outcome == 'success'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 30s
          envs: NBB_RUN
          script: |
            set -eu
            printf '%s' "$NBB_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            incoming="/tmp/metainc-naver-backup-bundle-$NBB_RUN"
            [ -d "$incoming" ] && [ ! -L "$incoming" ] || exit 0
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            rm -f -- "$incoming/backup_bundle.py" "$incoming/cold_backup_archive.py"
            rmdir -- "$incoming" 2>/dev/null || true
