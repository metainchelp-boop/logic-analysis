name: Debug Consumption (수집 키워드 실소비 산출)

# 업체를 못 찾는 추적 상품 35개 — 누가 등록했나 (읽기 전용).
# ⚠️ 저장소 공개 — 직원 이름·업체명·URL 전문 출력 금지(역할·집계만).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Orphan tracked products owner (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, re, sys
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            cols = [r[1] for r in conn.execute("PRAGMA table_info(tracked_products)")]
            print("[tracked_products 컬럼]", ", ".join(cols))

            def slug(u):
                m = re.search(r"smartstore\.naver\.com/([^/?#]+)", str(u or ""))
                return m.group(1).lower() if m else ""

            bslug = set()
            for r in conn.execute("SELECT naver_store_url FROM clients"
                                  " WHERE status='active' AND COALESCE(vertical,'store')='store'"):
                s = slug(r["naver_store_url"])
                if s: bslug.add(s)
            linked = {r[0] for r in conn.execute("SELECT DISTINCT tracked_product_id FROM rank_link")}

            orphans = []
            for r in conn.execute("SELECT * FROM tracked_products"):
                if r["id"] in linked: continue
                s = slug(r["product_url"])
                if s and s in bslug: continue      # 스토어로 이을 수 있는 것(83개)은 제외
                orphans.append(dict(r))
            print(f"\n[대상] 스토어로도 업체를 못 찾는 추적 상품: {len(orphans)}개")

            ucol = "user_id" if "user_id" in cols else None
            if ucol:
                urole = {}
                for r in conn.execute("SELECT id, role FROM users"):
                    urole[r["id"]] = r["role"] or "(없음)"
                from collections import Counter
                by = Counter(urole.get(o.get(ucol), "(삭제된 계정)") for o in orphans)
                print("\n[등록자 역할별]")
                for k, v in by.most_common():
                    print(f"  {k}: {v}개")
            else:
                print("\n[등록자 컬럼이 없어 역할 확인 불가]")

            print("\n[등록 시점]")
            dcol = next((c for c in ("created_at","added_at","registered_at") if c in cols), None)
            if dcol:
                from collections import Counter
                by = Counter((o.get(dcol) or "")[:7] for o in orphans)
                for k in sorted(by):
                    print(f"  {k or '(없음)'}: {by[k]}개")

            print("\n[이 상품들이 물고 있는 추적 키워드 수]")
            ids = [o["id"] for o in orphans]
            ph = ",".join("?"*len(ids)) or "NULL"
            n = conn.execute(f"SELECT COUNT(*) FROM tracked_keywords WHERE product_id IN ({ph})",
                             ids).fetchone()[0] if ids else 0
            print(f"  키워드 {n}개 — 지우면 수집 유니버스에서 그만큼 빠진다")

            print("\n[순위 기록이 쌓여 있나 — 지우면 사라지는 것]")
            try:
                m = conn.execute(f"SELECT COUNT(*) FROM rankings WHERE product_id IN ({ph})",
                                 ids).fetchone()[0] if ids else 0
                print(f"  순위 기록 {m}건")
            except Exception as e:
                print(f"  (순위 표 조회 실패: {e})")
            PY
