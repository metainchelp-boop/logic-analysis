name: Debug Consumption (수집 키워드 실소비 산출)

# 주간 보고서 배포 후 실서버 검증 (읽기 전용).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Weekly report deploy verification (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            echo "=== ① 배포된 코드 ==="
            echo "  weekly_report.py: $(docker exec logic-analysis sh -c 'test -f /app/weekly_report.py && echo 있음 || echo 없음')"
            echo "  스케줄러 잡 등록: $(docker logs --since 60m logic-analysis 2>&1 | grep -c '주간 보고서')"
            docker logs --since 60m logic-analysis 2>&1 | grep "스케줄러 시작" | tail -1

            echo ""
            echo "=== ②③⑤ DDL · 저장위치 · 예상 건수 ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, sys
            sys.path.insert(0, "/app")
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)

            cols = [r[1] for r in c.execute("PRAGMA table_info(reports)")]
            print("  reports 컬럼:", ", ".join(cols))
            print("  is_auto 컬럼:", "있음" if "is_auto" in cols else "없음(문제)")
            idx = [r[1] for r in c.execute("PRAGMA index_list('reports')")]
            print("  is_auto 인덱스:", "있음" if "idx_reports_is_auto" in idx else "없음")
            print("  현재 보고서:", c.execute("SELECT COUNT(*) FROM reports").fetchone()[0], "건")

            import reports
            print("  REPORTS_DIR =", reports.REPORTS_DIR)
            print("  폴더 존재:", reports.REPORTS_DIR.exists())

            n = c.execute("SELECT COUNT(DISTINCT ca.client_id) FROM client_analyses ca"
                          " JOIN clients cl ON cl.id=ca.client_id"
                          " WHERE ca.analyzed_date >= date('now','localtime','-6 day')"
                          "   AND ca.report_html IS NOT NULL AND ca.report_html <> ''"
                          "   AND cl.status='active' AND COALESCE(cl.role,'advertiser')='advertiser'"
                          "   AND COALESCE(cl.vertical,'store')='store'"
                          "   AND COALESCE(cl.auto_analysis,1)=1").fetchone()[0]
            print(f"  월요일 09:40 예상 생성: 약 {n}건 · 12주 평형 총량 약 {round(n*12*18/1024)}MB")
            PY

            echo ""
            echo "=== ③-2 호스트에서 같은 폴더가 보이나 (마운트 확인) ==="
            ls -ld /root/logic-analysis-deploy/data/reports 2>/dev/null || echo "  아직 파일 없음(폴더 미생성일 수 있음 — 첫 생성 때 만들어짐)"
            echo "  data 볼륨: $(ls -ld /root/logic-analysis-deploy/data | awk '{print $NF}')"

            echo ""
            echo "=== ⑥ 디스크 여유 ==="
            df -h / | tail -1
