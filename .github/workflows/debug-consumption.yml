name: Debug Consumption (수집 키워드 실소비 산출)

# 배포 후 검증 — 영업사원 한도 30회. 읽기 전용.

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Verify viewer daily limit (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "=== ① 배포된 서버 코드 ==="
            F=$(docker exec logic-analysis find /app -maxdepth 2 -name client_dashboard.py | head -1)
            docker exec logic-analysis grep -n "VIEWER_DAILY_LIMIT" "$F"
            echo "컨테이너 기동: $(docker inspect -f '{{.State.StartedAt}}' logic-analysis)"

            echo ""
            echo "=== ② 실제 진입점 호출 (내부 재현 금지) ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sys; sys.path.insert(0, "/app")
            import client_dashboard as cd
            print("서버 상수 VIEWER_DAILY_LIMIT =", cd.VIEWER_DAILY_LIMIT)
            # 존재하지 않는 사용자 id 로 호출 = 사용 0회로 읽히며 DB 를 쓰지 않는다
            for role in ("viewer", "manager", "admin"):
                d = cd.check_usage({"id": -999, "role": role})["data"]
                print(f"  {role:10} 한도 {d['limit']:>3} · 잔여 {d['remaining']:>3} · 분석가능 {d['can_query']}")
            PY

            echo ""
            echo "=== ③ 라이브 화면 안내 문구 ==="
            REF=$(curl -sL http://logic.metainc.co.kr/ | grep -o 'app\.[a-f0-9]*\.js' | head -1)
            B=/root/logic-analysis-deploy/frontend/dist/$REF
            echo "라이브 번들: $REF ($(wc -c < "$B") bytes)"
            echo "  서버 값 참조 코드: $(grep -c 'usageRes.data.limit' "$B")"
            echo "  하드코딩 '제한(15회)': $(grep -c '제한(15회)' "$B" || true)"
            echo "화면 HTTP: $(curl -s -o /dev/null -w '%{http_code}' -L http://logic.metainc.co.kr/)"
            echo "API 헬스: $(curl -s -o /dev/null -w '%{http_code}' -L http://logic.metainc.co.kr/api/health)"

            echo ""
            echo "=== ④ 오늘 한도에 걸린 직원이 있었나 (읽기 전용) ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            rows = c.execute(
                "SELECT COUNT(*), COALESCE(MAX(query_count),0), COALESCE(SUM(query_count),0)"
                " FROM daily_usage WHERE usage_date = date('now','localtime')").fetchone()
            print(f"오늘 분석한 직원 {rows[0]}명 · 최다 {rows[1]}회 · 합계 {rows[2]}회")
            n15 = c.execute("SELECT COUNT(*) FROM daily_usage"
                            " WHERE usage_date=date('now','localtime') AND query_count>=15").fetchone()[0]
            print(f"오늘 15회 이상 쓴 직원: {n15}명 (종전 한도라면 여기서 막혔을 인원)")
            PY
