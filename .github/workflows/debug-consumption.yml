name: Debug Consumption (수집 키워드 실소비 산출)

# 배포 후 실서버 검증 v4 — 실제 소스 문구로 마커 재확인. ⚠️ 저장소 공개 — 키 값 미출력.

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Live bundle markers v4 (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 120s
          script: |
            REF=$(curl -sL http://logic.metainc.co.kr/ | grep -o 'app\.[a-f0-9]*\.js' | head -1)
            F=/root/logic-analysis-deploy/frontend/dist/$REF
            echo "라이브 번들: $REF"
            echo "[새 UI — 실제 소스 문구]"
            for m in "매일 순위 추적 시작" "추적 기간" "종료일이 지나면 추적이 자동으로 멈춥니다" \
                     "이번 분석 결과만 저장됩니다" "이 업체에 키워드만 추가" "취소"; do
              printf '  %-40s %s\n' "$m" "$(grep -c -- "$m" "$F")"
            done
