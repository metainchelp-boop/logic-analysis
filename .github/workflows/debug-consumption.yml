name: Debug Consumption (수집 키워드 실소비 산출)

# 수집 유니버스(확장이 매일 도는 대상) 중 실제 소비되는 규모를 소비 축별로 분해.
# 범위 축소 결정용. 수동 실행 전용 · 전 쿼리 읽기 전용(SELECT) · deploy.yml paths-ignore 등재로 재배포 미유발.

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Keyword consumption sizing (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "== 전산 계약연동 키 실검증 (읽기 전용·값 미출력) =="
            docker exec -i -e ERPKEY="${{ secrets.ERP_AD_SYNC_API_KEY }}" logic-analysis python3 - <<'PY7'
            import os, re, json, sqlite3, requests
            key = os.getenv("ERPKEY", "")
            base = os.getenv("ERP_BASE_URL", "http://api.metainc.co.kr").rstrip("/")
            print(f"① GitHub Secret: {'설정됨(len=%d)' % len(key) if key else '❌ 비어 있음 — 등록 확인 필요'}")
            print(f"② 서버 .env 반영: {'있음' if os.getenv('ERP_AD_SYNC_API_KEY') else '아직 없음(배포 시 주입 예정)'}")
            if not key:
                raise SystemExit(0)

            PAUSE = ["계약 만료", "환불중", "홀딩중"]; RESUME = ["진행중", "전략 관리", "사후 관리"]
            _norm = lambda s: re.sub(r"\s+", "", str(s or "")).lower()
            def slug(u):
                m = re.search(r"smartstore\.naver\.com/([^/?#]+)", str(u or ""))
                return m.group(1).lower() if m else ""

            r = requests.get(f"{base}/api/ad-sync/contracts",
                             params={"stage": "진행중", "has_contract": "true"},
                             headers={"X-Api-Key": key}, timeout=25)
            print(f"③ 전산 API 응답: HTTP {r.status_code}  {'✅ 키 유효' if r.status_code==200 else '❌ 키 거부 또는 오류'}")
            if r.status_code != 200:
                print("   본문 앞부분:", r.text[:200]); raise SystemExit(0)

            items = ((r.json() or {}).get("result") or {}).get("items") or []
            print(f"④ 진행중 계약 업체: {len(items)}건")
            if items:
                print(f"   응답 필드: {sorted(items[0].keys())}")
                withc = [i for i in items if i.get("contracts")]
                print(f"   계약 상세 보유: {len(withc)}건")
                if withc:
                    cf = sorted(withc[0]["contracts"][0].keys())
                    print(f"   계약 필드: {cf}")
                    ends = [ct.get("end_date") for i in withc for ct in i["contracts"] if ct.get("end_date")]
                    print(f"   ⭐ end_date 채워진 계약: {len(ends)}건")
                    if ends:
                        print(f"      가장 이른 종료일 {min(ends)} · 가장 늦은 종료일 {max(ends)}")
                        import datetime as dt
                        today = dt.date.today().isoformat()
                        past = [e for e in ends if e < today]
                        print(f"      이미 종료일이 지난 계약: {len(past)}건  <- 날짜 기준 자동종료가 잡아낼 대상")

            by_name, by_slug, got = {}, {}, 0
            for st in PAUSE + RESUME:
                try:
                    rr = requests.get(f"{base}/api/ad-sync/contracts",
                                      params={"stage": st, "has_contract": "true"},
                                      headers={"X-Api-Key": key}, timeout=25)
                    if rr.status_code != 200: continue
                    got += 1
                    for it in ((rr.json() or {}).get("result") or {}).get("items") or []:
                        n = _norm(it.get("company_name"))
                        if n: by_name[n] = st
                        sg = slug(it.get("store_url"))
                        if sg: by_slug[sg] = st
                except Exception as e:
                    print(f"   {st} 조회 실패: {e}")
            print(f"⑤ 단계별 조회 {got}/6 성공 · 상호 {len(by_name)}건 · 스토어URL {len(by_slug)}건")

            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            rows = conn.execute(
                "SELECT id, name, business_name, naver_store_url, COALESCE(auto_analysis,1) a "
                "FROM clients WHERE status='active' AND COALESCE(role,'advertiser')='advertiser' "
                "AND COALESCE(vertical,'store')='store'").fetchall()
            m_slug = m_name = miss = 0; stage_cnt = {}; would_pause = would_resume = 0
            for c in rows:
                st = None
                sg = slug(c["naver_store_url"])
                if sg and sg in by_slug: st = by_slug[sg]; m_slug += 1
                else:
                    for nm in (c["name"], c["business_name"]):
                        k = _norm(nm)
                        if k and k in by_name: st = by_name[k]; m_name += 1; break
                if st is None: miss += 1; continue
                stage_cnt[st] = stage_cnt.get(st, 0) + 1
                if st in PAUSE and c["a"] != 0: would_pause += 1
                if st in RESUME and c["a"] == 0: would_resume += 1
            tot = len(rows)
            print(f"⑥ 우리 활성 광고주 {tot}곳 → 스토어URL 매칭 {m_slug} · 상호 매칭 {m_name} · ❌ 실패 {miss} ({round(miss*100/max(tot,1))}%)")
            print(f"   매칭 단계 분포: {stage_cnt}")
            print(f"⑦ 첫 동기화 시 예상 변화: 자동 중지 {would_pause}건 · 자동 재개 {would_resume}건")
            PY7
            echo
            echo "== 수집 키워드 실소비 산출 (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()
            _n = lambda k: "".join(str(k or "").split()).lower()

            # 전체 수집 유니버스 = 지금 확장이 매일 도는 대상(collector._keyword_universe 재현)
            uni = {}
            for r in c.execute("SELECT DISTINCT keyword FROM tracked_keywords"):
                k=(r[0] or "").strip()
                if k: uni.setdefault(_n(k), k)
            for r in c.execute("SELECT DISTINCT keyword FROM client_analyses"):
                k=(r[0] or "").strip()
                if k: uni.setdefault(_n(k), k)
            for r in c.execute("SELECT main_keywords FROM clients WHERE status='active' "
                               "AND COALESCE(auto_analysis,1)=1 AND COALESCE(role,'advertiser')='advertiser' "
                               "AND COALESCE(vertical,'store')='store'"):
                for k in (r[0] or "").split(","):
                    k=k.strip()
                    if k: uni.setdefault(_n(k), k)
            U=set(uni)
            print(f"[전체 수집 유니버스] {len(U)}개 (확장이 매일 도는 대상)")

            def belongs(sql, *a):
                s=set()
                for r in c.execute(sql, a):
                    v=r[0]
                    if v is None: continue
                    for part in str(v).split(","):
                        p=_n(part)
                        if p: s.add(p)
                return s & U

            # 소비 축 1: 전산① portal-summary (계약상 최우선) — 활성 광고주 분석 키워드
            adv_ids=[r[0] for r in c.execute(
                "SELECT id FROM clients WHERE status='active' AND COALESCE(role,'advertiser')='advertiser' "
                "AND COALESCE(vertical,'store')='store'")]
            ph=",".join("?"*len(adv_ids)) or "NULL"
            portal = belongs(f"SELECT DISTINCT keyword FROM client_analyses WHERE client_id IN ({ph})", *adv_ids)
            print(f"[소비1·전산① 노출] 활성광고주 분석키워드 {len(portal)}개 — 계약상 반드시 유지")

            # 소비 축 2: 최근 실제로 분석된 키워드(직원이 화면에서 본 흔적)
            for days in (7,30,90):
                recent = belongs(
                    "SELECT DISTINCT keyword FROM client_analyses "
                    "WHERE analyzed_date >= date('now','localtime',?)", f"-{days} day")
                print(f"[소비2·최근분석] 최근 {days}일 내 분석된 키워드 {len(recent)}개")

            # 소비 축 3: 홈탭 추적상품(등록 상품이 이 키워드로 추적 중)
            home = belongs("SELECT DISTINCT keyword FROM tracked_keywords")
            print(f"[소비3·홈탭 추적] tracked_products 등록 키워드 {len(home)}개")

            # 소비 축 4: 활성 광고주 main_keywords (담당자가 대표키워드로 지정)
            mainkw = belongs("SELECT main_keywords FROM clients WHERE status='active' "
                             "AND COALESCE(role,'advertiser')='advertiser' AND COALESCE(vertical,'store')='store'")
            print(f"[소비4·대표키워드] 활성광고주 main_keywords {len(mainkw)}개")

            # 핵심 소비 합집합 = 실제로 쓰이는 것
            core = portal | home | mainkw | belongs(
                "SELECT DISTINCT keyword FROM client_analyses WHERE analyzed_date >= date('now','localtime','-30 day')")
            print(f"\n[★ 핵심 소비 합집합] {len(core)}개 (전산①∪홈탭∪대표키워드∪최근30일분석)")
            cut = len(U)-len(core)
            print(f"[축소 여지] {cut}개 = 유니버스의 {round(cut*100/max(len(U),1))}% — 오래전 1회 분석 후 방치된 키워드")

            # 방치분의 정체
            orphan = U - core
            stale_only = belongs(
                "SELECT DISTINCT keyword FROM client_analyses WHERE client_id IN "
                "(SELECT id FROM clients WHERE status!='active' OR COALESCE(role,'advertiser')!='advertiser' "
                "OR COALESCE(auto_analysis,1)=0)") & orphan
            print(f"  - 비활성·영업대상·자동꺼짐 업체 잔상: {len(stale_only)}개")
            print(f"  - 그 외(90일+ 방치 등): {len(orphan)-len(stale_only)}개")

            # 시간당 부하 환산
            print(f"\n[부하 환산] 하루 페이지 이동 수 (300위·pagingSize80=4페이지 기준)")
            for label, n in (("현재 전체", len(U)), ("핵심만", len(core)), ("전산①만", len(portal))):
                print(f"  {label:8} {n:4}키워드 x 4 = {n*4:5}페이지/일 · 24시간 분산 시 시간당 {round(n*4/24)}")
            PY
