name: Debug Consumption (수집 키워드 실소비 산출)

# 04:00 계약단계 동기화 첫 실행 결과 확인 (읽기 전용).
# ⚠️ 배포 직전(2026-08-20 20:3x KST) 기준선 — 아래 숫자와 대조한다:
#    활성 스토어 광고주 609 · 추적 켜짐 609 · 꺼짐 0 · 종료일 설정 0
#    자동분석 꺼짐 43 · 자격 업체 566 · 수집 유니버스 953
#    시뮬레이션 예상: 자동 중지 63건 · 자동 재개 11건 · 종료일 반영
# ⚠️ 저장소 공개 — 키 값·업체 개인정보 출력 금지(집계와 개수만).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Contract sync result (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            echo "=== ① 동기화가 실제로 돌았나 (로그) ==="
            docker logs --since 24h logic-analysis 2>&1 \
              | grep -iE "계약단계|ad.?sync|자동 중지|자동 재개|track_until" | tail -20 \
              || echo "(관련 로그 없음)"
            echo ""
            echo "컨테이너 기동: $(docker inspect -f '{{.State.StartedAt}}' logic-analysis)"
            echo "서버 현재 시각: $(date '+%Y-%m-%d %H:%M %Z')"

            echo ""
            echo "=== ② DB 실제 변화 (기준선 대조) ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, sys
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()

            BASE = {"광고주": 609, "추적켜짐": 609, "추적꺼짐": 0,
                    "종료일설정": 0, "자동분석꺼짐": 43, "자격업체": 566, "유니버스": 953}

            r = c.execute(
                "SELECT COUNT(*) tot,"
                " SUM(CASE WHEN COALESCE(track_enabled,1)=1 THEN 1 ELSE 0 END) tk_on,"
                " SUM(CASE WHEN COALESCE(track_enabled,1)=0 THEN 1 ELSE 0 END) tk_off,"
                " SUM(CASE WHEN track_until IS NOT NULL AND track_until<>'' THEN 1 ELSE 0 END) until_,"
                " SUM(CASE WHEN COALESCE(auto_analysis,1)=0 THEN 1 ELSE 0 END) auto_off,"
                " SUM(CASE WHEN COALESCE(auto_analysis_manual,0)=1 THEN 1 ELSE 0 END) man"
                " FROM clients WHERE status='active' AND COALESCE(role,'advertiser')='advertiser'"
                " AND COALESCE(vertical,'store')='store'").fetchone()

            import collector
            ids = collector._tracking_client_ids(conn)
            uni = collector._keyword_universe(conn)

            now = {"광고주": r["tot"], "추적켜짐": r["tk_on"], "추적꺼짐": r["tk_off"],
                   "종료일설정": r["until_"], "자동분석꺼짐": r["auto_off"],
                   "자격업체": len(ids), "유니버스": len(uni)}

            print(f"{'항목':<14}{'배포직전':>8}{'지금':>8}{'변화':>8}")
            print("-" * 40)
            for k, before in BASE.items():
                after = now[k]
                d = after - before
                print(f"{k:<14}{before:>8}{after:>8}{(('+' if d>0 else '')+str(d)) if d else '  -':>8}")
            print(f"{'수동토글보호':<14}{'':>8}{r['man']:>8}   (계약연동이 안 건드림)")

            print("\n[종료일 분포]")
            for lab, sql in (
                ("오늘 이전(만료)", "date(track_until) <  date('now','localtime')"),
                ("오늘~30일 내",   "date(track_until) BETWEEN date('now','localtime') AND date('now','localtime','+30 day')"),
                ("31일 이후",      "date(track_until) >  date('now','localtime','+30 day')")):
                n = c.execute(
                    "SELECT COUNT(*) FROM clients WHERE status='active'"
                    " AND COALESCE(role,'advertiser')='advertiser' AND COALESCE(vertical,'store')='store'"
                    f" AND track_until IS NOT NULL AND track_until<>'' AND {sql}").fetchone()[0]
                print(f"  {lab:<16} {n:>4}곳")

            print("\n[오늘 수집 실적]")
            for d in (0, 1):
                n = c.execute("SELECT COUNT(DISTINCT keyword) FROM collected_serp"
                              " WHERE collected_date = date('now','localtime',?)",
                              (f"-{d} day",)).fetchone()[0]
                print(f"  {d}일 전: {n}개 / 유니버스 {len(uni)}개"
                      f" ({round(n*100/max(len(uni),1))}%)")
            PY
