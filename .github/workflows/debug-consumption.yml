name: Debug Consumption (수집 키워드 실소비 산출)

# Deploy #395 배포 후 실서버 검증 (읽기 전용).
on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Post-deploy verification (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            echo "=== ① 배포된 서버 코드 ==="
            CD=$(docker exec logic-analysis find /app -maxdepth 2 -name client_dashboard.py | head -1)
            SC=$(docker exec logic-analysis find /app -maxdepth 2 -name scheduler.py | head -1)
            WR=$(docker exec logic-analysis find /app -maxdepth 2 -name weekly_report.py | head -1)
            echo "  keyword_product_url:  $(docker exec logic-analysis grep -c 'keyword_product_url' $CD)"
            echo "  set_keyword_product:  $(docker exec logic-analysis grep -c 'set_keyword_product' $CD)"
            echo "  scheduler kw_product: $(docker exec logic-analysis grep -c 'kw_product' $SC)"
            echo "  보관기간 통지 주석:   $(docker exec logic-analysis grep -c '① *(메타 전산)에 사전 통지' $WR)"
            echo "  컨테이너 기동: $(docker inspect -f '{{.State.StartedAt}}' logic-analysis)"

            echo ""
            echo "=== ② DDL — 키워드별 상품 등록부 ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            t = [r[0] for r in c.execute(
                "SELECT name FROM sqlite_master WHERE type='table' AND name='client_keyword_product'")]
            print("  client_keyword_product 테이블:", "있음" if t else "없음(문제)")
            if t:
                cols = [r[1] for r in c.execute("PRAGMA table_info(client_keyword_product)")]
                print("  컬럼:", ", ".join(cols))
                print("  현재 지정 건수:", c.execute("SELECT COUNT(*) FROM client_keyword_product").fetchone()[0], "건")
            PY

            echo ""
            echo "=== ③ 라이브 번들 — 두 기능이 다 실렸나 ==="
            REF=$(curl -sL http://logic.metainc.co.kr/ | grep -o 'app\.[a-f0-9]*\.js' | head -1)
            F=/root/logic-analysis-deploy/frontend/dist/$REF
            echo "  번들: $REF ($(wc -c < "$F") bytes)"
            for m in "이 키워드로 추적할 상품" "개별 상품" "상품 정보를 불러오지 못했습니다" "기다려도 채워지지 않습니다"; do
              printf '    %-30s %s\n' "$m" "$(grep -c -- "$m" "$F")"
            done
            echo "  [무회귀]"
            for m in "＋ 추적 키워드 등록" "경쟁사 비교 · 격차 분석" "기록 대기"; do
              printf '    %-30s %s\n' "$m" "$(grep -c -- "$m" "$F")"
            done

            echo ""
            echo "=== ④ 서비스 ==="
            echo "  화면: $(curl -s -o /dev/null -w '%{http_code}' -L http://logic.metainc.co.kr/)"
            echo "  헬스: $(curl -s -o /dev/null -w '%{http_code}' -L http://logic.metainc.co.kr/api/health)"
            echo "  keyword-products(인증없음=401 정상): $(curl -s -o /dev/null -w '%{http_code}' -L 'http://logic.metainc.co.kr/api/cd/1/keyword-products')"
