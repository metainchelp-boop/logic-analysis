            erp = {}
            for line in ERP_RAW.strip().splitlines():
                p = line.split()
                if len(p) != 2: continue
                erp.setdefault(int(p[0]), set()).add(p[1])
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            c = conn.cursor()
            names = {r[0]: r[1] for r in c.execute("SELECT username, name FROM users")}
            conn_clients = len(erp)
            no_client=matched=mismatched=0
            stuck_reports=0
            from collections import Counter
            per_pair = Counter()   # (owner->mgr) 어긋남 보고서수
            for cid, mgrs in erp.items():
                row = c.execute("SELECT u.username, (SELECT COUNT(*) FROM reports r WHERE r.client_id=?) "
                                "FROM clients cl JOIN users u ON cl.created_by=u.id WHERE cl.id=?",
                                (cid, cid)).fetchone()
                if row is None:
                    no_client += 1; continue
                owner, nrp = row[0], row[1]
                if owner in mgrs:
                    matched += 1
                else:
                    mismatched += 1
                    stuck_reports += nrp
                    tgt = sorted(mgrs)[0]
                    per_pair[(owner, tgt)] += nrp
            print("[연결 업체(중복 client id 제거)] %d" % conn_clients)
            print("[② 에 client 없음(연결이 유령 id 가리킴)] %d" % no_client)
            print("[★ 소유자 일치] %d개 업체" % matched)
            print("[★ 소유자 어긋남] %d개 업체 · 그 업체들의 보고서 %d건 = 지금 새 담당자가 못 보는 보고서" % (mismatched, stuck_reports))
            print("[어긋남 상위 — 현재소유자 → 실제담당자 (보고서수)]")
            for (owner, mgr), n in per_pair.most_common(20):
                print("  %s(%s) → %s(%s) : %d건" % (owner, names.get(owner,'?'), mgr, names.get(mgr,'?'), n))
            PY
