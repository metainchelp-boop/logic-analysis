name: Debug Consumption (수집 키워드 실소비 산출)

# rank_link 가 왜 일부 추적 상품을 업체에 못 잇는지 (읽기 전용).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Why rank_link misses (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, sys
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            from naver_crawler import extract_product_id_from_url as pid

            print("=== 추적 상품(A) 쪽 ===")
            a_tot = a_key = 0
            a_nokey = []
            akeys = {}
            for r in conn.execute("SELECT id, product_url FROM tracked_products"):
                a_tot += 1
                k = (pid(r["product_url"] or "") or "").strip()
                if k:
                    a_key += 1; akeys.setdefault(k, []).append(r["id"])
                else:
                    a_nokey.append(r["product_url"] or "")
            print(f"  전체 {a_tot}개 · 상품번호 뽑힘 {a_key}개 · ⚠️ 못 뽑음 {len(a_nokey)}개")
            print("  못 뽑은 주소 형태(앞 60자, 3건):")
            for u in a_nokey[:3]:
                print("   ", (u[:60] or "(빈 값)"))

            print("\n=== 업체(B) 쪽 ===")
            b_tot = b_key = 0
            b_nokey = 0
            bkeys = {}
            for r in conn.execute("SELECT id, naver_store_url FROM clients"
                                  " WHERE status='active' AND COALESCE(vertical,'store')='store'"):
                b_tot += 1
                k = (pid(r["naver_store_url"] or "") or "").strip()
                if k:
                    b_key += 1; bkeys.setdefault(k, []).append(r["id"])
                else:
                    b_nokey += 1
            print(f"  활성 스토어 업체 {b_tot}곳 · 상품번호 뽑힘 {b_key}곳 · ⚠️ 못 뽑음 {b_nokey}곳")

            print("\n=== 왜 안 이어지나 — 원인별 분해 ===")
            linked = {r["tracked_product_id"] for r in conn.execute(
                "SELECT DISTINCT tracked_product_id FROM rank_link")}
            unlinked = [i for ids in akeys.values() for i in ids if i not in linked]
            print(f"  rank_link 연결된 상품: {len(linked)}개")
            print(f"  ⚠️ 상품번호는 있는데 안 이어진 것: {len(unlinked)}개")
            print(f"  ⚠️ 상품번호 자체를 못 뽑아 후보도 못 된 것: {len(a_nokey)}개")

            both = set(akeys) & set(bkeys)
            only_a = set(akeys) - set(bkeys)
            print(f"\n  상품번호 기준 — 양쪽에 다 있는 번호: {len(both)}개")
            print(f"  ⚠️ 추적 상품에만 있고 업체 쪽엔 없는 번호: {len(only_a)}개")
            print("     ↑ 업체의 naver_store_url 이 '그 상품' 이 아니라")
            print("       다른 상품(첫 등록분)이라 번호가 안 맞는 경우다")

            n_a = sum(len(akeys[k]) for k in only_a)
            print(f"     해당 추적 상품 수: {n_a}개  ← 이게 못 잇는 주된 몫")

            print("\n=== 그 상품들이 실제로 업체를 못 찾는 게 맞나 (스토어 이름으로 대조) ===")
            import re
            def slug(u):
                m = re.search(r"smartstore\.naver\.com/([^/?#]+)", str(u or ""))
                return m.group(1).lower() if m else ""
            bslug = {}
            for r in conn.execute("SELECT id, naver_store_url FROM clients"
                                  " WHERE status='active' AND COALESCE(vertical,'store')='store'"):
                s = slug(r["naver_store_url"])
                if s: bslug.setdefault(s, []).append(r["id"])
            hit = miss = 0
            for r in conn.execute("SELECT id, product_url FROM tracked_products"):
                if r["id"] in linked: continue
                s = slug(r["product_url"])
                if s and s in bslug: hit += 1
                else: miss += 1
            print(f"  ⭐ 스토어 주소로는 업체를 찾을 수 있는 것: {hit}개")
            print(f"     그래도 못 찾는 것: {miss}개")
            PY
