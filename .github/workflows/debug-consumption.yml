name: Debug Consumption (수집 키워드 실소비 산출)

# 이예은 신고(2026-08-18) — 업체 1개에 상품 1개 전제로 인한 오분석 규모 실측 (읽기 전용).
# ⚠️ 저장소 공개 — 업체명·URL 등 식별정보 출력 금지(집계와 개수만).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Multi-product mismatch sizing (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, re
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            c.row_factory = sqlite3.Row

            def pid(u):
                m = re.search(r"/products/(\d+)", u or "")
                return m.group(1) if m else None

            rows = c.execute(
                "SELECT id, naver_store_url, main_keywords FROM clients"
                " WHERE status='active' AND COALESCE(role,'advertiser')='advertiser'"
                "   AND COALESCE(vertical,'store')='store' AND COALESCE(auto_analysis,1)=1").fetchall()

            multi = [r for r in rows
                     if len([k for k in (r["main_keywords"] or "").split(",") if k.strip()]) >= 2]
            print(f"[대상] 자동분석 켜진 활성 광고주 {len(rows)}곳")
            print(f"  그중 키워드 2개 이상: {len(multi)}곳 ({round(len(multi)*100/max(len(rows),1))}%)")

            # 업체가 실제로 몇 개 상품을 쓰는가 — client_analyses 에 남은 product_url 종류
            print("\n[업체가 실제로 분석에 쓴 상품 수] client_analyses 기준")
            from collections import Counter
            dist = Counter()
            multi_prod = []
            for r in rows:
                us = {pid(x[0]) for x in c.execute(
                    "SELECT DISTINCT product_url FROM client_analyses WHERE client_id=?", (r["id"],))
                    if pid(x[0])}
                dist[len(us)] += 1
                if len(us) >= 2: multi_prod.append(r["id"])
            for k in sorted(dist): print(f"  상품 {k}종: {dist[k]}곳")

            # ⭐ 핵심 — 키워드는 여럿인데 순위 이력이 한 상품으로만 기록된 업체
            print("\n[⭐ 의심 대상] 키워드 2개 이상인데 특정 키워드만 계속 미노출")
            suspect = 0
            for r in multi:
                kws = [k.strip() for k in (r["main_keywords"] or "").split(",") if k.strip()]
                ranked, never = [], []
                for kw in kws:
                    n = c.execute(
                        "SELECT COUNT(*) FROM client_rank_history"
                        " WHERE client_id=? AND keyword=? AND rank_position IS NOT NULL",
                        (r["id"], kw)).fetchone()[0]
                    tot = c.execute(
                        "SELECT COUNT(*) FROM client_rank_history WHERE client_id=? AND keyword=?",
                        (r["id"], kw)).fetchone()[0]
                    if tot >= 3:
                        (ranked if n > 0 else never).append(kw)
                # 어떤 키워드는 순위가 잡히는데 어떤 키워드는 한 번도 안 잡힘
                if ranked and never:
                    suspect += 1
            print(f"  한 키워드는 순위가 잡히는데 다른 키워드는 한 번도 안 잡힌 업체: {suspect}곳")
            print("  ↑ 전부가 상품 불일치는 아니다(진짜 순위 밖일 수도) — 상한선으로 읽을 것")

            # 축A(쇼핑 순위 추적)는 상품 단위라 이미 여러 상품을 지원한다
            print("\n[축A 현황] tracked_products = 상품 단위 추적")
            tp = c.execute("SELECT COUNT(*) FROM tracked_products").fetchone()[0]
            tk = c.execute("SELECT COUNT(*) FROM tracked_keywords").fetchone()[0]
            print(f"  추적 상품 {tp}개 · 추적 키워드 {tk}개")
            link = c.execute("SELECT COUNT(*) FROM rank_link").fetchone()[0]
            multi_link = c.execute(
                "SELECT COUNT(*) FROM (SELECT client_id FROM rank_link"
                " GROUP BY client_id HAVING COUNT(*) >= 2)").fetchone()[0]
            print(f"  rank_link 연결 {link}쌍 · 상품을 2개 이상 이어 둔 업체 {multi_link}곳")
            print("  ↑ 축A 는 이미 업체당 여러 상품을 표현할 수 있다(브리지도 다대다)")
            PY
