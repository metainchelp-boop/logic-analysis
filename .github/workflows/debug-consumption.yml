name: Debug Consumption (수집 키워드 실소비 산출)

# 구간 분할(업체 순번 1~200 / 201~400) 실현 가능성 실측 (읽기 전용).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Split feasibility (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, sys
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            import collector
            uni = collector._keyword_universe(conn)
            ids = collector._tracking_client_ids(conn)
            print(f"[대상] 자격 업체 {len(ids)}곳 · 수집 키워드 {len(uni)}개")

            _n = lambda k: "".join(str(k or "").split()).lower()

            # 키워드 → 그 키워드를 쓰는 업체 id 집합
            owner = {}
            ph = ",".join("?" * len(ids)) or "NULL"
            for sql in (
                f"SELECT id AS cid, main_keywords AS kw FROM clients WHERE id IN ({ph})",
            ):
                for r in conn.execute(sql, ids):
                    for k in (r["kw"] or "").split(","):
                        k = _n(k)
                        if k in uni or k in {_n(x) for x in ()}:
                            owner.setdefault(k, set()).add(r["cid"])
            for r in conn.execute(
                    f"SELECT client_id AS cid, keyword AS kw FROM client_analyses WHERE client_id IN ({ph})", ids):
                k = _n(r["kw"])
                owner.setdefault(k, set()).add(r["cid"])

            uni_n = {_n(k) for k in uni}
            owned = {k: v for k, v in owner.items() if k in uni_n}
            print(f"\n[① 키워드가 업체에 1:1 로 붙나]")
            print(f"  업체를 찾을 수 있는 키워드: {len(owned)}개 / {len(uni)}개")
            solo = sum(1 for v in owned.values() if len(v) == 1)
            share = len(owned) - solo
            print(f"  업체 1곳 전용: {solo}개 ({round(solo*100/max(len(owned),1))}%)")
            print(f"  ⚠️ 2곳 이상 공유: {share}개 ({round(share*100/max(len(owned),1))}%)")
            print(f"  ⚠️ 주인을 못 찾는 키워드: {len(uni)-len(owned)}개 (추적 상품 전용 등)")

            print(f"\n[② 업체를 순번으로 반 갈랐을 때 키워드가 균등한가]")
            srt = sorted(ids)
            half = len(srt) // 2
            a, b = set(srt[:half]), set(srt[half:])
            ka = sum(1 for k, v in owned.items() if v & a)
            kb = sum(1 for k, v in owned.items() if v & b)
            both = sum(1 for k, v in owned.items() if (v & a) and (v & b))
            print(f"  앞쪽 {len(a)}곳 → 키워드 {ka}개")
            print(f"  뒤쪽 {len(b)}곳 → 키워드 {kb}개")
            print(f"  ⚠️ 양쪽에 걸친 키워드: {both}개 (누가 할지 정해야 하는 것)")
            print(f"  불균형: {abs(ka-kb)}개 차이 ({round(abs(ka-kb)*100/max(max(ka,kb),1))}%)")

            print(f"\n[③ 업체당 키워드 수 — 균등 분할이 되나]")
            cnt = {}
            for k, v in owned.items():
                for c in v:
                    cnt[c] = cnt.get(c, 0) + 1
            vals = sorted(cnt.values())
            if vals:
                print(f"  평균 {round(sum(vals)/len(vals),2)}개 · 최소 {vals[0]} · 최대 {vals[-1]}")
                print(f"  키워드 1개인 업체: {sum(1 for v in vals if v==1)}곳")
                print(f"  키워드 3개 이상: {sum(1 for v in vals if v>=3)}곳")
            PY
