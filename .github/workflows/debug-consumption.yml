name: Debug Consumption (수집 키워드 실소비 산출)

# 박서연 신고(2026-08-13) — 경쟁사 비교/격차 분석이 「로딩 중」에서 멈추는 원인 확인 (읽기 전용).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Competitor analysis failure sizing (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            echo "=== ① 서버 로그 — 상품 조회가 실제로 비는가 (최근 72h) ==="
            for p in "쇼핑 검색 API 404" "광고주분석: 쇼핑 API 결과 0건" "광고주분석 보완 매칭 성공" "크롤캐시. 히트"; do
              echo "  [$p] $(docker logs --since 72h logic-analysis 2>&1 | grep -c "$p")건"
            done
            echo ""
            echo "  최근 404 로그 3줄:"
            docker logs --since 72h logic-analysis 2>&1 | grep "쇼핑 검색 API 404" | tail -3 | sed 's/^/    /'

            echo ""
            echo "=== ②③ 분석 이력에 상품명이 비어 있는 비율 ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, json
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            c.row_factory = sqlite3.Row

            for days in (7, 30):
                rows = c.execute(
                    "SELECT advertiser_json FROM client_analyses"
                    " WHERE analyzed_date >= date('now','localtime',?)"
                    "   AND advertiser_json IS NOT NULL AND advertiser_json <> ''",
                    (f"-{days} day",)).fetchall()
                tot = named = 0
                for r in rows:
                    try:
                        d = json.loads(r["advertiser_json"] or "{}")
                    except Exception:
                        continue
                    pi = (d.get("product_info") or d.get("productInfo") or {})
                    if not isinstance(pi, dict):
                        continue
                    tot += 1
                    if (pi.get("product_name") or "").strip():
                        named += 1
                if tot:
                    print(f"  최근 {days}일 광고주분석 {tot}건 — 상품명 있음 {named}건"
                          f" · 비어 있음 {tot-named}건 ({round((tot-named)*100/tot)}%)")
                else:
                    print(f"  최근 {days}일 광고주분석 기록 없음")

            print("\n[수집분에 없는 키워드는 상품 정보를 못 얻는다]")
            uni = {(r[0] or "").strip() for r in
                   c.execute("SELECT DISTINCT keyword FROM collected_serp"
                             " WHERE collected_date >= date('now','localtime','-1 day')")}
            print(f"  오늘·어제 수집된 키워드: {len(uni)}개")
            recent = [(r[0] or "").strip() for r in
                      c.execute("SELECT DISTINCT keyword FROM client_analyses"
                                " WHERE analyzed_date >= date('now','localtime','-7 day')")]
            miss = [k for k in recent if k and k not in uni]
            print(f"  최근 7일 분석한 키워드 {len(recent)}개 중 수집분에 없는 것 {len(miss)}개"
                  f" ({round(len(miss)*100/max(len(recent),1))}%)")
            print("  ↑ 이 키워드들은 공식 API(2026-07-31 종료)로 넘어가 빈 결과를 받는다")
            PY
