name: Debug Consumption (수집 키워드 실소비 산출)

# [일시 진단 — 신고 #256] 보고서 담당자 정렬 배포 검증용. 읽기 전용(dry_run).
# deploy.yml paths-ignore 등재로 재배포 미유발. 검증 후 main 원복.

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Report owner sync preview (read-only, #256)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "== [#256] 스케줄러 등록 확인 =="
            docker logs logic-analysis 2>&1 | grep -F "보고서 담당자 정렬" | tail -3 || echo "(스케줄러 로그 라인 없음)"
            echo "== [#256] 보고서 담당자 정렬 미리보기 (dry_run · 읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import json
            from report_owner_sync import run_report_owner_sync
            r = run_report_owner_sync(dry_run=True)
            print(json.dumps(r, ensure_ascii=False))
            PY
