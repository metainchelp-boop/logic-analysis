name: Debug Consumption (수집 키워드 실소비 산출)

# 주간 보고서 첫 실행(2026-08-24 월 09:40) 결과 확인 + 08:30 분석 잡 소요 시간 측정.
# ⚠️ 저장소 공개 — 업체명·해시 등 식별정보 출력 금지(집계만).
# 예상: 약 566건 생성 · is_auto=1 · 12주 보관정책 함께 실행 · ① 은 10:30 에 가져감.

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Weekly report first run (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            echo "=== ① 주간 보고서 잡이 돌았나 (로그) ==="
            docker logs --since 24h logic-analysis 2>&1 \
              | grep -E "주간 보고서|보고서 정리|보관" | tail -12 || echo "  (관련 로그 없음)"
            echo ""
            echo "=== ② ⭐ 08:30 분석 잡 소요 시간 (① 에 통지 약속분) ==="
            docker logs --since 24h logic-analysis 2>&1 \
              | grep -E "전체 분석 \+ 보고서 생성 시작|전체 분석 완료|전체 분석 실패" | tail -6 \
              || echo "  (로그 없음 — 오전에 배포가 있었으면 사라진다)"
            echo "  ↑ 시작~완료 간격이 09:40 을 넘으면 주간 잡 시각을 뒤로 미루고 ① 에 통지할 것"
            echo ""
            echo "  컨테이너 기동: $(docker inspect -f '{{.State.StartedAt}}' logic-analysis)"
            echo "  서버 현재 시각: $(date '+%Y-%m-%d %H:%M %Z')"

            echo ""
            echo "=== ③ 실제 생성 결과 ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            c.row_factory = sqlite3.Row
            q = lambda s, *a: c.execute(s, a).fetchone()[0]

            tot = q("SELECT COUNT(*) FROM reports")
            auto = q("SELECT COUNT(*) FROM reports WHERE COALESCE(is_auto,0)=1")
            man = tot - auto
            print(f"  전체 보고서 {tot}건 — 자동 {auto} · 수동 {man}")
            print(f"  이번 주 자동 생성: {q(chr(34)+'SELECT COUNT(*) FROM reports WHERE COALESCE(is_auto,0)=1 AND date(created_at) >= date(\\'now\\',\\'localtime\\',\\'-6 day\\')'+chr(34))}건")
            print(f"  업체 수(자동): {q('SELECT COUNT(DISTINCT client_id) FROM reports WHERE COALESCE(is_auto,0)=1')}곳")
            r = c.execute("SELECT MIN(created_at) a, MAX(created_at) b FROM reports"
                          " WHERE COALESCE(is_auto,0)=1").fetchone()
            print(f"  생성 시각 범위: {r['a']} ~ {r['b']}  (소요 = 이 간격)")

            print("\n  [키워드 수 분포 — report_data 의 keywords]")
            import json
            from collections import Counter
            dist = Counter()
            for x in c.execute("SELECT report_data FROM reports WHERE COALESCE(is_auto,0)=1 LIMIT 2000"):
                try:
                    ks = json.loads(x["report_data"] or "{}").get("keywords") or []
                    dist[len(ks)] += 1
                except Exception:
                    dist[-1] += 1
            for k in sorted(dist):
                print(f"    키워드 {k}개: {dist[k]}건")

            print("\n  [빈 보고서가 섞이지 않았나]")
            print("    제목 없음:", q("SELECT COUNT(*) FROM reports WHERE COALESCE(is_auto,0)=1 AND (title IS NULL OR title='')"))
            print("    해시 없음:", q("SELECT COUNT(*) FROM reports WHERE COALESCE(is_auto,0)=1 AND (report_hash IS NULL OR report_hash='')"))
            PY

            echo ""
            echo "=== ④ 파일이 실제로 남았나 (마운트 볼륨) ==="
            D=/root/logic-analysis-deploy/data/reports
            echo "  파일 수: $(ls -1 $D 2>/dev/null | wc -l)개 · 용량: $(du -sh $D 2>/dev/null | cut -f1)"
            echo "  ↑ 배포로 컨테이너가 바뀌어도 남아 있어야 한다(2026-08-20 저장 위치 이전분)"

            echo ""
            echo "=== ⑤ 광고주가 실제로 열리나 (해시 하나로 무작위 확인) ==="
            docker exec -i logic-analysis python3 - > /tmp/_h.txt <<'PY'
            import sqlite3
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            r = c.execute("SELECT report_hash FROM reports WHERE COALESCE(is_auto,0)=1 LIMIT 1").fetchone()
            print(r[0] if r else "")
            PY
            H=$(tr -d '\r\n' < /tmp/_h.txt)
            if [ -n "$H" ]; then
              echo "  공개 열람 HTTP: $(curl -s -o /dev/null -w '%{http_code}' -L "http://logic.metainc.co.kr/api/reports/view/$H")  (200 이어야 정상)"
            else
              echo "  (자동 보고서가 아직 없음)"
            fi

            echo ""
            echo "=== ⑥ 디스크 ==="; df -h / | tail -1
