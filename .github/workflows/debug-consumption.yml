        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "== 신고 #256 — ② 보고서 소유자 vs ERP 현재 담당자 어긋남 (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            # ERP 프로브(debug-logs report_owner_mismatch)에서 뽑은 LOGIC_CLIENT 연결 154건: "② client id  ERP 담당자 로그인"
