name: Debug Consumption (수집 키워드 실소비 산출)

# 집 IP 투입 전 상태 확인 (읽기 전용).
# ⚠️ 저장소 공개 — IP 는 앞 두 자리만 출력(뒤 두 자리 마스킹).

on:
  workflow_dispatch:

jobs:
  consumption:
    runs-on: ubuntu-latest
    steps:
      - name: Collector IP status (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            echo "=== ① 최근 7일 수집기 접속 IP 별 활동 (뒤 두 자리 마스킹) ==="
            for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
              [ -f "$f" ] && cat "$f"
            done 2>/dev/null \
              | grep -E "/api/collector/(keywords|serp)" \
              | awk '{ip=$1; split(ip,a,"."); k=a[1]"."a[2]".x.x";
                       if ($0 ~ /\/serp/) up[k]++; else ask[k]++ }
                     END { printf "  %-16s %10s %10s\n", "IP", "일감요청", "결과업로드";
                           for (i in ask) printf "  %-16s %10d %10d\n", i, ask[i], up[i]+0;
                           for (i in up) if (!(i in ask)) printf "  %-16s %10d %10d\n", i, 0, up[i] }' \
              || echo "  (nginx 로그 없음)"
            echo "  ↑ 일감요청은 많은데 결과업로드가 0 이면 = 그 IP 는 네이버에 막혀 있다"

            echo ""
            echo "=== ② 일자별 수집 실적 (한 대 기준 현재 수준) ==="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            rows = c.execute(
                "SELECT collected_date d, COUNT(DISTINCT keyword) n FROM collected_serp"
                " WHERE collected_date >= date('now','localtime','-7 day')"
                " GROUP BY collected_date ORDER BY d DESC").fetchall()
            for d, n in rows:
                print(f"  {d}: {n}개")
            import collector
            uni = collector._keyword_universe(c)
            print(f"\n  수집 대상(유니버스): {len(uni)}개")
            if rows:
                avg = sum(n for _, n in rows) / len(rows)
                print(f"  최근 평균: {round(avg)}개 = 커버리지 {round(avg*100/max(len(uni),1))}%")
                print(f"  전량 수집까지 필요한 배수: 약 {round(len(uni)/max(avg,1),1)}배")
            PY

            echo ""
            echo "=== ③ 확장이 서버에 붙을 때 쓰는 것 (새 기계 준비물) ==="
            echo "  · 서버 주소: https://logic.metainc.co.kr"
            echo "  · 헤더: X-Collector-Token (기존 기계와 같은 값 사용 — 기계별 발급 아님)"
            echo "  · 토큰 설정 여부: $(grep -c '^COLLECTOR_TOKEN=' /root/logic-analysis-deploy/.env 2>/dev/null)건 (값은 출력 안 함)"
