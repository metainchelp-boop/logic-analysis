name: NAVER 합성 출력 문법 1회 사전검증

# 수동 1회만. 제품 배포·DB 열기·보고서 저장·서비스 재시작 없음.
# private 제품의 합성 factory만 요청 형식을 만들며 원문/키는 공개 로그에 내지 않는다.
on:
  workflow_dispatch:
    inputs:
      product_commit:
        description: '합성 factory와 후보 형식을 포함한 비공개 제품 커밋 40자리'
        type: string
        required: true
      confirm:
        description: 'RUN_ONE_SYNTHETIC_GRAMMAR — 운영 모델로 합성 요청 정확 1회(과금 가능)'
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: deploy-logic-analysis
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 대표 main 수동 1회 조건 확인
        id: guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ inputs.product_commit }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$ACTOR" = metainchelp-boop
          test "$TRIGGERING_ACTOR" = metainchelp-boop
          test "$REF" = refs/heads/main
          test "$EVENT" = workflow_dispatch
          test "$ATTEMPT" = 1
          test "$CONFIRM" = RUN_ONE_SYNTHETIC_GRAMMAR
          printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo 'allowed=true' >> "$GITHUB_OUTPUT"

      - name: 고정 도구 소스 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: 도구 합성 검증
        run: python -I -B -m unittest discover -s deploy/naver/tests -p test_grammar_preflight.py -v

      - name: 제품 읽기 전용 키 확인
        env:
          KEY_SET: ${{ secrets.NAVER_PRODUCT_DEPLOY_KEY != '' }}
        run: test "$KEY_SET" = true

      - name: 비공개 제품 정확한 커밋 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: metainchelp-boop/metainc-ad-dashboard
          ref: ${{ inputs.product_commit }}
          ssh-key: ${{ secrets.NAVER_PRODUCT_DEPLOY_KEY }}
          path: product
          persist-credentials: false

      - name: 합성 형식 생성과 전송 해시 결속
        env:
          COMMIT: ${{ inputs.product_commit }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C product rev-parse HEAD)" = "$COMMIT"
          mkdir naver-grammar-transfer "$RUNNER_TEMP/grammar-private"
          chmod 700 naver-grammar-transfer "$RUNNER_TEMP/grammar-private"
          cp deploy/naver/grammar_preflight.py naver-grammar-transfer/grammar_preflight.py
          chmod 600 naver-grammar-transfer/grammar_preflight.py
          # private 제품 import 오류나 원문은 러너 임시파일에만 남긴다(업로드 없음).
          if ! env -i PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -I -B deploy/naver/grammar_preflight.py build product "$COMMIT" \
              naver-grammar-transfer/package.json \
              > "$RUNNER_TEMP/grammar-private/build.log" 2>&1; then
            echo 'NAVER_GRAMMAR_BUILD_ERROR=REFUSED'; exit 1
          fi
          test "$(stat -c %a naver-grammar-transfer/package.json)" = 600
          helper_sha=$(sha256sum naver-grammar-transfer/grammar_preflight.py | cut -d' ' -f1)
          package_sha=$(sha256sum naver-grammar-transfer/package.json | cut -d' ' -f1)
          echo "PREFLIGHT_HELPER_SHA=$helper_sha" >> "$GITHUB_ENV"
          echo "PREFLIGHT_PACKAGE_SHA=$package_sha" >> "$GITHUB_ENV"
          echo "합성 요청 묶음 SHA256: $package_sha"

      - name: 서버 전용 임시 폴더 만들기
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          PREFLIGHT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: PREFLIGHT_RUN
          command_timeout: 1m
          script: |
            set -eu
            test "$(id -u)" = 0
            printf '%s' "$PREFLIGHT_RUN" | grep -Eq '^[0-9]+-1$'
            parent=/var/lib/metainc/naver-grammar-preflight
            test ! -L "$parent"
            install -d -m 700 "$parent"
            base="$parent/$PREFLIGHT_RUN"
            test ! -e "$base"
            install -d -m 700 "$base"
            echo NAVER_GRAMMAR_PRIVATE_DIRECTORY_READY

      - name: 합성 요청과 도구만 비공개 경로로 전송
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: naver-grammar-transfer
          target: /var/lib/metainc/naver-grammar-preflight/${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: false

      - name: 현재 엔진에서 합성 HTTP 정확 1회
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          PREFLIGHT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: PREFLIGHT_RUN,PREFLIGHT_HELPER_SHA,PREFLIGHT_PACKAGE_SHA
          command_timeout: 5m
          script: |
            set -eu
            test "$(id -u)" = 0
            printf '%s' "$PREFLIGHT_RUN" | grep -Eq '^[0-9]+-1$'
            printf '%s' "$PREFLIGHT_HELPER_SHA" | grep -Eq '^[0-9a-f]{64}$'
            printf '%s' "$PREFLIGHT_PACKAGE_SHA" | grep -Eq '^[0-9a-f]{64}$'
            base="/var/lib/metainc/naver-grammar-preflight/$PREFLIGHT_RUN"
            test -d "$base" && test ! -L "$base"
            test "$(stat -c %u:%a "$base")" = 0:700
            test ! -L "$base/grammar_preflight.py"
            test "$(stat -c %u:%a "$base/grammar_preflight.py")" = 0:600
            test "$(sha256sum "$base/grammar_preflight.py" | cut -d' ' -f1)" = "$PREFLIGHT_HELPER_SHA"
            test -d /var/lib/metainc/naver-deploy
            test ! -L /var/lib/metainc/naver-deploy/lock
            # 같은 서버의 진행 중 배포/정리와 겹치지 않는다. 기다리거나 재시도하지 않는다.
            exec 9>>/var/lib/metainc/naver-deploy/lock
            flock -n 9 || { echo NAVER_GRAMMAR_PREFLIGHT_ERROR=LOCKED; exit 1; }
            python3 -I -B "$base/grammar_preflight.py" host "$base/package.json" "$PREFLIGHT_PACKAGE_SHA" 2>/dev/null

      - name: 지정한 합성 임시 파일만 정리
        if: always() && steps.guard.outputs.allowed == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          PREFLIGHT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: PREFLIGHT_RUN
          command_timeout: 1m
          script: |
            set -eu
            test "$(id -u)" = 0
            printf '%s' "$PREFLIGHT_RUN" | grep -Eq '^[0-9]+-1$'
            base="/var/lib/metainc/naver-grammar-preflight/$PREFLIGHT_RUN"
            test ! -L "$base"
            if [ -d "$base" ]; then
              test "$(stat -c %u:%a "$base")" = 0:700
              rm -f "$base/grammar_preflight.py" "$base/package.json"
              rmdir "$base"
            fi
            echo NAVER_GRAMMAR_PRIVATE_FILES_REMOVED
