            echo "[백업 폴더 상세]"; sudo ls -lhtr /root/logic-analysis-deploy/data/backups 2>/dev/null; sudo du -sh /root/logic-analysis-deploy/data/backups 2>/dev/null
            if [ -n "${{ inputs.backup_keep }}" ]; then
