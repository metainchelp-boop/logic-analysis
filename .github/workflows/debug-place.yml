          script: |
            echo "== 0) 컨테이너 =="
            docker inspect -f 'StartedAt={{.State.StartedAt}}' logic-analysis
            docker exec -i logic-analysis python3 - <<'PY'
            # 로직분석 결과값 전수조사 (2026-09-23 · 읽기 전용)
            # ⚠️ 저장소 공개 — 업체명·키워드·상품명·주소를 절대 찍지 않는다. 칸 이름(코드 식별자)과 건수만.
            import os, re, json, sqlite3, time, collections
            from datetime import datetime, timedelta

            DB = os.getenv("AUDIT_DB", "/app/data/logic_data.db")
            IDENT = re.compile(r"^[A-Za-z_][A-Za-z0-9_]{0,40}$")
            t0 = time.time()

            def hdr(s):
                print(); print("== " + s + " =="); print(flush=True)

            def ro():
                c = sqlite3.connect(f"file:{DB}?mode=ro", uri=True, timeout=20)
                c.row_factory = sqlite3.Row
                return c

            def q(c, sql, args=()):
                try:
                    return c.execute(sql, args).fetchall()
                except Exception as e:
                    print(f"  ⚠️ 못 쟀다: {str(e)[:120]}")
                    return None

            def empty(v):
                if v is None: return True
                if isinstance(v, (list, dict, tuple)): return len(v) == 0
                if isinstance(v, str): return v.strip() in ("", "-", "0", "0.0", "미확인", "없음", "null", "None")
                if isinstance(v, bool): return False
                if isinstance(v, (int, float)): return v == 0
                return False

            def flat(obj, prefix="", depth=0, out=None):
                """칸 경로 → 값. ASCII 식별자 키만 쓴다(한글 키 = 동적 키 → <동적>)."""
                if out is None: out = {}
                if not isinstance(obj, dict): return out
                for k, v in obj.items():
                    key = k if IDENT.match(str(k)) else "<동적>"
                    p = f"{prefix}.{key}" if prefix else key
                    if key == "<동적>":
                        out.setdefault(p, [])
                        out[p].append(v)
                        continue
                    if isinstance(v, dict) and depth < 2 and v and all(IDENT.match(str(x)) for x in list(v.keys())[:5]):
                        out.setdefault(p + "{}", []).append(v)
                        flat(v, p, depth + 1, out)
                    else:
                        out.setdefault(p, []).append(v)
                return out

            def field_table(label, jsons, min_share=0.05, top=70):
                """jsons = dict 목록. 칸마다 (있는 행, 빈 행) 을 센다."""
                n = len(jsons)
                print(f"  [{label}] 행 {n}개")
                if not n: return
                pres = collections.Counter(); emp = collections.Counter()
                for j in jsons:
                    f = flat(j)
                    for p, vals in f.items():
                        if p.endswith("{}"): continue
                        pres[p] += 1
                        if all(empty(v) for v in vals): emp[p] += 1
                rows = [(p, pres[p], emp[p]) for p in pres if pres[p] >= max(2, n * min_share)]
                rows.sort(key=lambda r: (-(r[2] / r[1]), r[0]))
                print(f"    {'칸':<48} {'있음':>5} {'빈값':>5} {'빈값%':>6}")
                for p, a, e in rows[:top]:
                    flag = " ⚠️" if a and e / a >= 0.5 else ("  ·" if e else "")
                    print(f"    {p:<48} {a:>5} {e:>5} {e*100//max(a,1):>5}%{flag}")
                miss = [(p, n - pres[p]) for p in pres if pres[p] >= n * 0.3 and pres[p] < n]
                if miss:
                    miss.sort(key=lambda r: -r[1])
                    print("    칸 자체가 없는 행(30%↑ 행에 있는 칸 기준): " +
                          ", ".join(f"{p}={m}" for p, m in miss[:15]))

            def dq_count(obj, acc):
                if isinstance(obj, dict):
                    for k, v in obj.items():
                        if k == "data_quality" and isinstance(v, dict):
                            for mk, mv in v.items():
                                if isinstance(mv, dict) and "status" in mv and IDENT.match(str(mk)):
                                    acc[(mk, str(mv.get("status")))] += 1
                        else:
                            dq_count(v, acc)
                elif isinstance(obj, list):
                    for x in obj[:50]: dq_count(x, acc)

            def loads(s, default):
                try:
                    v = json.loads(s) if s else default
                    return v if v is not None else default
                except Exception:
                    return None

            c = ro()
            today = datetime.now().strftime("%Y-%m-%d")
            print(f"  기준 시각(서버) {datetime.now():%Y-%m-%d %H:%M} · DB {DB}")

            # ── 1) 매일 배치가 실제로 만든 것 (최근 8일) ─────────────────────────────
            hdr("1) 배치 산출물 — 일별 건수 (최근 8일)")
            rows = q(c, """SELECT analyzed_date d, COUNT(*) n, COUNT(DISTINCT client_id) cl,
                            SUM(CASE WHEN shop_products_json IS NULL OR shop_products_json IN ('','[]') THEN 1 ELSE 0 END) no_prod,
                            SUM(CASE WHEN volume_json IS NULL OR volume_json IN ('','{}') THEN 1 ELSE 0 END) no_vol,
                            SUM(CASE WHEN related_json IS NULL OR related_json IN ('','{}') THEN 1 ELSE 0 END) no_rel,
                            SUM(CASE WHEN product_url IS NULL OR product_url='' THEN 1 ELSE 0 END) no_url,
                            SUM(CASE WHEN advertiser_json IS NULL OR advertiser_json IN ('','{}') THEN 1 ELSE 0 END) no_adv
                         FROM client_analyses WHERE analyzed_date >= date('now','localtime','-7 day')
                         GROUP BY d ORDER BY d""")
            if rows is not None:
                print("  자동 분석(client_analyses) — 날짜 · 행 · 업체 · 상품목록 빔 · 검색량 빔 · 연관 빔 · 상품주소 없음 · 광고주분석 빔")
                for r in rows:
                    print(f"    {r['d']}  {r['n']:>4}행 {r['cl']:>4}곳  상품목록빔 {r['no_prod']:>4}  검색량빔 {r['no_vol']:>4}  연관빔 {r['no_rel']:>4}  주소없음 {r['no_url']:>4}  광고주빔 {r['no_adv']:>4}")
            rows = q(c, """SELECT substr(checked_at,1,10) d, COUNT(*) n, SUM(CASE WHEN rank_position IS NULL THEN 1 ELSE 0 END) nul,
                            COUNT(DISTINCT client_id) cl
                         FROM client_rank_history WHERE checked_at >= date('now','localtime','-7 day') GROUP BY d ORDER BY d""")
            if rows is not None:
                print("  업체 순위 기록(client_rank_history) — 날짜 · 기록 · 미노출(NULL) · 업체")
                for r in rows: print(f"    {r['d']}  {r['n']:>5}  미노출 {r['nul']:>5}  {r['cl']:>4}곳")
            rows = q(c, """SELECT substr(checked_at,1,10) d, COUNT(*) n, SUM(CASE WHEN rank_position IS NULL OR rank_position=0 THEN 1 ELSE 0 END) nul
