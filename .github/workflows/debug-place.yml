            show("키 설정 여부(값 미출력)", envs)
            PY
            docker exec logic-analysis sh -c 'cat /app/*.py' > /tmp/_src.txt 2>/dev/null
            docker logs --timestamps --since 48h logic-analysis > /tmp/_dl.txt 2>&1
            cat > /tmp/_audit_logs.py <<'PY'
            # 로직분석 오류 로그·화면 요청 결과 집계 (호스트에서 실행 · 읽기 전용)
            # ⚠️ 저장소 공개 — IP·키워드·업체명·주소·쿼리스트링을 찍지 않는다. 경로 모양·상태코드·건수만.
            import re, sys, glob, gzip, os, collections
            from datetime import datetime, timedelta

            IP = re.compile(r"\b\d{1,3}(?:\.\d{1,3}){3}(?::\d+)?\b")
            URL = re.compile(r"https?://[^\s'\"」]+")
            HANGUL = re.compile(r"[가-힣]+")
            SRC_WORDS = set()
            try:
                SRC_WORDS = set(HANGUL.findall(open(os.environ.get("AUDIT_SRC", "/tmp/_src.txt"), errors="ignore").read()))
            except Exception:
                pass
            SEG_OK = re.compile(r"^[a-z][a-z0-9_\-]{0,30}$")

            def norm_path(p):
                p = p.split("?", 1)[0]
                segs = p.split("/")
                return "/".join(s if (s == "" or SEG_OK.match(s)) else "{x}" for s in segs)[:70]

            def sanitize(msg):
                m = IP.sub("IP", msg)
                m = URL.sub("URL", m)
                m = re.sub(r"\[[^\]]*\]", "[K]", m)
                m = re.sub(r"'[^']*'|\"[^\"]*\"|「[^」]*」|‘[^’]*’", "'…'", m)
                m = re.sub(r"\d+", "N", m)
                # 코드에 적힌 한글 낱말만 남긴다 — 그 밖의 한글(키워드·업체명일 수 있다)은 가린다
                m = HANGUL.sub(lambda w: w.group(0) if w.group(0) in SRC_WORDS else "…", m)
                m = re.sub(r"\s+", " ", m).strip()
                return m[:110]

            # ── A) 컨테이너 로그 (docker logs --timestamps --since 48h) ───────────────
            print(f"  (소스 한글 낱말 {len(SRC_WORDS)}개 기준으로 그 밖의 한글은 가림)")
            print("== 6) 컨테이너 로그 — 오류·경고 유형 (최근 48시간 · 현재 컨테이너) ==")
            lines = open(sys.argv[1], errors="ignore").read().splitlines() if len(sys.argv) > 1 else []
            print(f"  읽은 줄 {len(lines)}")
            err = collections.Counter(); warn = collections.Counter(); hour = collections.Counter()
            acc = collections.Counter(); acc5 = collections.Counter(); acc_day = collections.Counter()
            ACC = re.compile(r'"(GET|POST|PUT|PATCH|DELETE|OPTIONS) (\S+) HTTP/[\d.]+" (\d{3})')
            for ln in lines:
                ts, _, body = ln.partition(" ")
                hr = ts[:13].replace("T", " ")
                a = ACC.search(body)
                if a:
                    path = norm_path(a.group(2))
                    if path.startswith("/api/"):
                        st = a.group(3)
                        acc[(a.group(1), path, st[0] + "xx")] += 1
                        acc_day[(ts[:10], st[0] + "xx")] += 1
                        if st[0] == "5": acc5[(a.group(1), path, st)] += 1
                    continue
                low = body.lower()
                if "error" in low or "traceback" in low or "exception" in low:
                    err[sanitize(body)] += 1; hour[hr] += 1
                elif "warning" in low or "실패" in body or "오류" in body:
                    warn[sanitize(body)] += 1
            print(f"  ERROR 계열 {sum(err.values())}줄 · 경고/실패 계열 {sum(warn.values())}줄")
            print("  ERROR 계열 유형 상위 30")
            for m, n in err.most_common(30): print(f"    {n:>5}  {m}")
            print("  경고/실패 계열 유형 상위 40")
            for m, n in warn.most_common(40): print(f"    {n:>5}  {m}")
            print("  ERROR 시간대별(시)")
            for h, n in sorted(hour.items())[-48:]: print(f"    {h}시  {n}")

            print()
            print("== 7) 앱이 돌려준 응답 — API 경로별 상태 (컨테이너 접근 로그 · 48시간) ==")
            if not acc:
                print("  접근 로그 줄이 없다(앱이 접근 로그를 안 남기는 설정일 수 있다) — nginx 쪽으로 본다")
            else:
                for (d, cls), n in sorted(acc_day.items()): print(f"    {d} {cls} {n}")
                per = collections.defaultdict(collections.Counter)
                for (m, p, cls), n in acc.items(): per[(m, p)][cls] += n
                print(f"    {'경로':<56} {'2xx':>6} {'3xx':>5} {'4xx':>5} {'5xx':>5}")
                for (m, p), cc in sorted(per.items(), key=lambda kv: -sum(kv[1].values()))[:70]:
                    print(f"    {m:<6} {p:<49} {cc['2xx']:>6} {cc['3xx']:>5} {cc['4xx']:>5} {cc['5xx']:>5}{'  ⚠️' if cc['5xx'] else ''}")
                if acc5:
                    print("  5xx 상세")
                    for (m, p, st), n in acc5.most_common(30): print(f"    {st} {m} {p}  {n}")

            # ── B) nginx 접근 로그 (최근 7일 · 회전분 포함) ─────────────────────────
            print()
            print("== 8) nginx 접근 로그 — API 경로별 상태 (최근 7일 · IP 미출력) ==")
            files = sorted(glob.glob("/var/log/nginx/*access*.log*"))
            for f in files:
                try: print(f"  파일 {os.path.basename(f)} {os.path.getsize(f)//1024}KB")
                except Exception: pass
            logic_files = [f for f in files if "logic" in os.path.basename(f)] or files
            print(f"  집계 대상: {', '.join(os.path.basename(f) for f in logic_files) or '없음'}")
            NG = re.compile(r'\[(\d{2})/(\w{3})/(\d{4}):(\d{2}):\d{2}:\d{2} [^\]]+\] "(GET|POST|PUT|PATCH|DELETE|OPTIONS) (\S+) [^"]*" (\d{3})')
            MON = {m: i for i, m in enumerate(["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], 1)}
            cut = datetime.now() - timedelta(days=7)
            per = collections.defaultdict(collections.Counter); day = collections.defaultdict(collections.Counter); s5 = collections.Counter()
            for f in logic_files:
                try:
                    fh = gzip.open(f, "rt", errors="ignore") if f.endswith(".gz") else open(f, errors="ignore")
                    for ln in fh:
                        m = NG.search(ln)
                        if not m: continue
                        d = datetime(int(m.group(3)), MON.get(m.group(2), 1), int(m.group(1)), int(m.group(4)))
                        if d < cut: continue
                        path = norm_path(m.group(6))
                        if not path.startswith("/api/"): continue
                        st = m.group(7)
                        per[(m.group(5), path)][st[0] + "xx"] += 1
                        if st in ("499", "502", "503", "504") or st[0] == "5": s5[(st, m.group(5), path)] += 1
                        day[d.strftime("%m-%d")][st[0] + "xx"] += 1
                except Exception as e:
                    print(f"  ⚠️ {os.path.basename(f)} 못 읽음: {str(e)[:80]}")
            print("  일별 — 2xx · 4xx · 5xx")
            for d in sorted(day): print(f"    {d}  {day[d]['2xx']:>6} {day[d]['4xx']:>5} {day[d]['5xx']:>5}")
            print(f"    {'경로':<56} {'2xx':>6} {'4xx':>5} {'5xx':>5}")
            for (m, p), cc in sorted(per.items(), key=lambda kv: -sum(kv[1].values()))[:80]:
                print(f"    {m:<6} {p:<49} {cc['2xx']:>6} {cc['4xx']:>5} {cc['5xx']:>5}{'  ⚠️' if cc['5xx'] else ''}")
            if s5:
                print("  5xx·499 상세 (상태 · 방식 · 경로 · 건수)")
                for (st, m, p), n in s5.most_common(40): print(f"    {st} {m} {p}  {n}")
            PY
            sudo -n true 2>/dev/null && S="sudo -n" || S=""
            $S python3 /tmp/_audit_logs.py /tmp/_dl.txt
            rm -f /tmp/_dl.txt /tmp/_src.txt /tmp/_audit_logs.py

      # ── 신고 #276 플레이스 분석 캡처 판독 재현 (2026-09-23 · 읽기 전용) ──
