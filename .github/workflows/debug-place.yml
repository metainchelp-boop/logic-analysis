      # ── 맞춤제안서(플레이스) enrich 재현 진단 (2026-08-05) ──────────────
      # 실제 제안서와 같은 입력으로 서버 안에서 같은 함수를 호출해, 어느 단계에서
      # 값이 비는지(검색량/순위/상권) 단계별로 드러낸다. 전부 읽기 전용 조회.
      - name: 제안서 enrich 재현 진단
        if: ${{ github.event.inputs.enrich_probe != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROBE: ${{ github.event.inputs.enrich_probe }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 300s
          envs: PROBE
          script: |
            docker exec -i -e PROBE="$PROBE" logic-analysis python3 - <<'PY'
            import os, time, json, traceback

            parts = (os.getenv("PROBE", "") or "").split("|")
            region   = (parts[0] if len(parts) > 0 else "").strip()
            industry = (parts[1] if len(parts) > 1 else "").strip()
            keyword  = (parts[2] if len(parts) > 2 else "").strip()
            name     = (parts[3] if len(parts) > 3 else "").strip()
            print("=" * 66)
            print(f"입력  지역={region!r} 업종={industry!r} 키워드={keyword!r} 업체명={name!r}")

            def step(title):
                print("-" * 66); print(f"[{title}]")

            # 0) 인증키 등록 상태 — 존재 여부만(값 미출력)
            step("0. 인증키 등록 상태")
            try:
                import sbiz365
                ks = sbiz365._env_keys()
                for k, v in ks.items():
                    print(f"  {k:8s}: {'등록됨 len=' + str(len(v)) if v else '없음'}")
            except Exception as e:
                print("  sbiz365 import 실패:", e); traceback.print_exc()

            # 1) 검색량 — 제안서 '월 검색량' 칸의 원천
            step("1. 검색량(검색광고 API)")
            try:
                import main as _m
                combined = _m._combine_region_keyword(region, keyword)
                print(f"  합성 키워드: {combined!r}")
                from naver_crawler import get_keyword_volume
                t0 = time.time()
                rows = get_keyword_volume([combined]) or []
                print(f"  소요 {time.time()-t0:.1f}s · 응답 {len(rows)}건")
                print("  원문:", json.dumps(rows[:2], ensure_ascii=False)[:600])
            except Exception as e:
                print("  실패:", type(e).__name__, e); traceback.print_exc()

            # 2) 순위 이력 — '순위 추이' 슬라이드의 원천
            step("2. 무인 추적 순위 이력")
            try:
                import place_crawler
                from database import get_place_rank_history, get_place_tracked_keywords
                bk = f"nm:{place_crawler._norm(name)}|{place_crawler._norm(region)}" if name else ""
                print(f"  business_key: {bk!r}")
                series = get_place_rank_history(bk, combined, days=90) if bk else []
                print(f"  순위 점: {len(series)}개  (2개 미만이면 추이 슬라이드 생략)")
                tracked = get_place_tracked_keywords(bk) if bk else []
                print(f"  추적 중 키워드: {len(tracked)}개")
                if tracked:
                    print("  ", [t.get('keyword') for t in tracked[:8]])
            except Exception as e:
                print("  실패:", type(e).__name__, e); traceback.print_exc()

            # 3) 상권 체인 — '우리 동네 상권' 6장의 원천. 단계별로 어디서 끊기는지 본다.
            step("3. 상권(소상공인365) 체인")
            try:
                t0 = time.time()
                admi = sbiz365._resolve_admi(region)
                print(f"  ③-1 지역→행정동  {time.time()-t0:.1f}s  →  {admi}")
                up = sbiz365._resolve_upjong(industry)
                print(f"  ③-2 업종→분류코드  →  {up}")
                if admi and admi.get("admiCd") and up:
                    t1 = time.time()
                    avg = sbiz365._fetch_avg(admi["admiCd"], up["code"], region)
                    print(f"  ③-3 매출 조회  {time.time()-t1:.1f}s  →  {'수신' if avg else 'None'}")
                    if avg:
                        print("      키:", sorted(avg.keys()))
                        print("      saleAmt(천원):", avg.get("saleAmt"), " guAmt:", avg.get("guAmt"), " siAmt:", avg.get("siAmt"))
                else:
                    print("  ③-3 건너뜀(행정동 또는 업종 매칭 실패)")
                t2 = time.time()
                block = sbiz365.get_place_sbiz(region, industry)
                print(f"  ③-4 최종 블록  {time.time()-t2:.1f}s  →  {'생성됨' if block else 'None(상권 슬라이드 생략)'}")
                if block:
                    print("      ", json.dumps(block, ensure_ascii=False)[:900])
            except Exception as e:
                print("  실패:", type(e).__name__, e); traceback.print_exc()


            # 4) 실패 격리 매트릭스 — parts[4]=="matrix" 일 때만
            if len(parts) > 4 and parts[4].strip() == "matrix":
                step("4. 실패 격리 매트릭스 (업종코드 × simpleLoc)")
                try:
                    pairs = sbiz365._upjong_pairs() or []
                    cands = [(c, n) for c, n in pairs if "음식" in n][:10]
                    print(f"  '음식' 포함 업종 후보 {len(cands)}개 — 같은 행정동({admi['admiCd']})에 하나씩 시험")
                    for c, n in cands:
                        r = sbiz365._fetch_avg(admi["admiCd"], c, region)
                        print(f"    {c}  {'OK saleAmt=' + str(r.get('saleAmt')) if r else '실패'}   {n[:44]}")
                    print("  simpleLoc 변형 시험 (업종 = 위 진단이 고른 코드)")
                    for loc in [region, admi.get("admiNm", ""), f"서울특별시 {admi.get('guNm','')} {admi.get('admiNm','')}", ""]:
                        r = sbiz365._fetch_avg(admi["admiCd"], up["code"], loc)
                        print(f"    simpleLoc={loc!r:34s} → {'OK' if r else '실패'}")
                    print("  대조군 — 검증 성공했던 행정동(역삼1동 11680640)에 같은 업종 코드")
                    r = sbiz365._fetch_avg("11680640", up["code"], "역삼동")
                    print(f"    11680640 × {up['code']} → {'OK saleAmt=' + str(r.get('saleAmt')) if r else '실패'}")
                except Exception as e:
                    print("  실패:", type(e).__name__, e); traceback.print_exc()


            # 5) 수정안 사전 검증 — parts[4]=="verify". 배포 전에 고친 로직이 실제로 통하는지 확인.
            #    (서버 컨테이너는 아직 옛 코드라, 고친 규칙을 이 자리에서 그대로 재현해 본다)
            if len(parts) > 4 and parts[4].strip() == "verify":
                step("5. 수정안 사전 검증")
                try:
                    import urllib.parse, urllib.request
                    # (A) 행정동 조회가 정식 주소 3필드를 실제로 주는지
                    coord = sbiz365._region_coord(region)
                    print(f"  A-1 좌표: {coord}")
                    key = sbiz365._env_keys()["datago"]
                    qs = urllib.parse.urlencode({"radius": "500", "cx": coord[0], "cy": coord[1],
                                                 "type": "json", "numOfRows": "1", "pageNo": "1"})
                    u = f"http://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius?serviceKey={key}&{qs}"
                    with urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json"}), timeout=12) as r:
                        it = ((json.loads(r.read().decode("utf-8", "replace")).get("body") or {}).get("items") or [{}])[0]
                    sido, gu, dong = it.get("ctprvnNm"), it.get("signguNm"), it.get("adongNm")
                    loc = " ".join(x for x in (sido, gu, dong) if x)
                    print(f"  A-2 주소 3필드: 시도={sido!r} 시군구={gu!r} 행정동={dong!r}")
                    print(f"  A-3 조립된 simpleLoc: {loc!r}")
                    # (B) 그 주소로 매출 조회
                    got = sbiz365._fetch_avg(it.get("adongCd"), up["code"], loc)
                    print(f"  B   매출 조회 → {'✅ 성공' if got else '❌ 실패'}")
                    if got:
                        print(f"      점포당 월평균 {got.get('saleAmt')}천원 · 시군구평균 {got.get('guAmt')} · 시도평균 {got.get('siAmt')}")
                        print(f"      월별 시계열 {len(got.get('series') or [])}개 · 업소수 시계열 {len(got.get('shopSeries') or [])}개")
                    # (C) 검색량 — 공백 제거 키워드
                    from naver_crawler import get_keyword_volume as _kv
                    stripped = combined.replace(" ", "")
                    rows = _kv([stripped]) or []
                    print(f"  C   검색량('{stripped}') → {len(rows)}건")
                    if rows:
                        r0 = rows[0]
                        pc, mo = r0.get("monthlyPcQcCnt"), r0.get("monthlyMobileQcCnt")
                        print(f"      keyword={r0.get('keyword')!r} PC={pc} 모바일={mo} 경쟁={r0.get('compIdx')}")
                    # (D) 업종 대표성 비교 — 같은 동네에서 코드별 매출 차이
                    print("  D   업종 코드별 점포당 매출(같은 행정동) — 대표 코드 선정 근거")
                    for c, n in [(c, n) for c, n in (sbiz365._upjong_pairs() or []) if "음식 >" in n][:12]:
                        rr = sbiz365._fetch_avg(it.get("adongCd"), c, loc)
                        if rr and rr.get("saleAmt") is not None:
                            print(f"      {c}  {str(rr.get('saleAmt')):>8}천원  {n[:40]}")
                except Exception as e:
                    print("  실패:", type(e).__name__, e); traceback.print_exc()


            # 6) 고친 규칙 전체 재현 — parts[4]=="fixed". 배포 후 실제로 나올 값을 미리 본다.
            if len(parts) > 4 and parts[4].strip() == "fixed":
                step("6. 수정 후 예상 결과(실서버 데이터로 재현)")
                try:
                    import urllib.parse, urllib.request
                    pairs = sbiz365._upjong_pairs() or []
                    print(f"  업종 트리 {len(pairs)}건")

                    def residual(n):
                        last = str(n or "").split(">")[-1].strip()
                        return last.startswith("기타") or ("그 외" in last)

                    def cands(label, limit=3):
                        terms = []
                        for lk, ts in sbiz365._UPJONG_SEARCH_TERMS.items():
                            if lk in label or label in lk:
                                terms.extend(ts)
                        terms.append(label)
                        sc, seen = [], set()
                        for rank, term in enumerate(terms):
                            if not term:
                                continue
                            for c, n in pairs:
                                if term in n and c not in seen:
                                    seen.add(c); sc.append((residual(n), rank, len(c), c, n))
                        sc.sort()
                        return [(c, n) for _, _, _, c, n in sc[:limit]]

                    # 좌표 → 정식 주소
                    coord = sbiz365._region_coord(region)
                    key = sbiz365._env_keys()["datago"]
                    qs = urllib.parse.urlencode({"radius": "500", "cx": coord[0], "cy": coord[1],
                                                 "type": "json", "numOfRows": "1", "pageNo": "1"})
                    u = f"http://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius?serviceKey={key}&{qs}"
                    with urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json"}), timeout=12) as r:
                        it = ((json.loads(r.read().decode("utf-8", "replace")).get("body") or {}).get("items") or [{}])[0]
                    loc = " ".join(x for x in (it.get("ctprvnNm"), it.get("signguNm"), it.get("adongNm")) if x)
                    print(f"  행정동: {it.get('adongCd')} · simpleLoc={loc!r}")

                    cs = cands(industry)
                    print(f"  업종 후보(고친 규칙): " + ", ".join(f"{c}={n.split('>')[-1].strip()}" for c, n in cs))
                    chosen = None
                    for c, n in cs:
                        got = sbiz365._fetch_avg(it.get("adongCd"), c, loc)
                        amt = got.get("saleAmt") if got else None
                        print(f"    시도 {c} ({n.split('>')[-1].strip()}) → saleAmt={amt}")
                        if got and amt:
                            chosen = (c, n, got); break
                    if chosen:
                        c, n, got = chosen
                        print(f"  ✅ 채택: {c} {n.split('>')[-1].strip()}")
                        print(f"     점포당 월평균 {int(got['saleAmt']*1000):,}원 · 시군구평균 {int((got.get('guAmt') or 0)*1000):,}원 · 시도평균 {int((got.get('siAmt') or 0)*1000):,}원")
                        gu = got.get("guAmt") or 0
                        if gu:
                            print(f"     → 제안서 헤드라인: 시군구 평균 대비 {round((got['saleAmt']/gu-1)*100):+d}%")
                        print(f"     업소수 {got.get('saleCnt')} · 매출 시계열 {len(got.get('series') or [])}개 · 업소수 시계열 {len(got.get('shopSeries') or [])}개")
                        print(f"     → 상권 슬라이드 렌더 가능 ✅")
                    else:
                        print("  ❌ 후보 3개 모두 값 없음 → 상권 슬라이드 생략(정상 폴백)")

                    from naver_crawler import get_keyword_volume as _kv
                    rows = _kv([combined.replace(" ", "")]) or []
                    if rows:
                        r0 = rows[0]
                        pc = r0.get("monthlyPcQcCnt"); mo = r0.get("monthlyMobileQcCnt")
                        def _i(v):
                            try: return int(str(v).replace("<", "").strip())
                            except Exception: return 0
                        print(f"  ✅ 검색량: {_i(pc)+_i(mo):,}회/월 (PC {pc} · 모바일 {mo}) · 경쟁 {r0.get('compIdx')}")
                    else:
                        print("  ❌ 검색량 없음")
                except Exception as e:
                    print("  실패:", type(e).__name__, e); traceback.print_exc()


            # 7) 업종 상위분류 집계 가능 여부 — parts[4]=="agg"
            #    "업종을 세분화하지 않고 '음식점 전체'로 볼 수 있나?" 를 실측으로 판정한다.
            if len(parts) > 4 and parts[4].strip() == "agg":
                step("7. 업종 상위분류(종합) 집계 가능 여부")
                try:
                    import urllib.parse, urllib.request
                    coord = sbiz365._region_coord(region)
                    key = sbiz365._env_keys()["datago"]
                    qs = urllib.parse.urlencode({"radius": "500", "cx": coord[0], "cy": coord[1],
                                                 "type": "json", "numOfRows": "1", "pageNo": "1"})
                    u = f"http://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius?serviceKey={key}&{qs}"
                    with urllib.request.urlopen(urllib.request.Request(u, headers={"Accept": "application/json"}), timeout=12) as r:
                        it = ((json.loads(r.read().decode("utf-8", "replace")).get("body") or {}).get("items") or [{}])[0]
                    cd = it.get("adongCd")
                    loc = " ".join(x for x in (it.get("ctprvnNm"), it.get("signguNm"), it.get("adongNm")) if x)
                    print(f"  기준: {cd} · {loc}")
                    print("  (A) 상위분류 코드를 그대로 넣으면 집계해 주는가")
                    for code in ["I20101", "I201", "I20", "I2", "I", ""]:
                        got = sbiz365._fetch_avg(cd, code, loc)
                        amt = got.get("saleAmt") if got else None
                        cnt = got.get("saleCnt") if got else None
                        print(f"    upjongCd={code!r:9s} → {'응답O' if got else '응답X'}  saleAmt={amt}  업소수={cnt}")
                    print("  (B) 소분류를 우리가 직접 합산할 때의 비용·결과 — '음식' 전 소분류 실측")
                    tot_amt = tot_cnt = 0.0
                    nz = []
                    import time as _t
                    t0 = _t.time()
                    foods = [(c, n) for c, n in (sbiz365._upjong_pairs() or []) if n.startswith("음식")]
                    for c, n in foods:
                        got = sbiz365._fetch_avg(cd, c, loc)
                        a = (got or {}).get("saleAmt") or 0
                        k = (got or {}).get("saleCnt") or 0
                        if a and k:
                            nz.append((c, n.split(">")[-1].strip(), a, k))
                            tot_amt += a * k; tot_cnt += k
                    print(f"    음식 소분류 {len(foods)}개 조회 · 소요 {_t.time()-t0:.0f}초 · 값 있는 분류 {len(nz)}개")
                    for c, n, a, k in sorted(nz, key=lambda x: -x[3])[:8]:
                        print(f"      {c} {n[:22]:24s} {int(a*1000):>12,}원 · {int(k)}곳")
                    if tot_cnt:
                        print(f"    ⇒ 업소수 가중평균(=음식점 종합) {int(tot_amt/tot_cnt*1000):,}원 · 총 {int(tot_cnt)}곳")
                except Exception as e:
                    print("  실패:", type(e).__name__, e); traceback.print_exc()


            # 8) 실제 엔드포인트 그대로 호출 — parts[4]=="real"
            #    앞의 단계별 프로브는 내부 로직을 '흉내'내므로 수정 검증이 안 된다.
            #    제안서가 실제로 부르는 함수를 그대로 호출해 응답을 그대로 본다.
            if len(parts) > 4 and parts[4].strip() == "real":
                step("8. 실제 엔드포인트 응답 (제안서가 받는 그대로)")
                try:
                    from main import place_proposal_enrich, PlaceProposalEnrichRequest
                    t0 = time.time()
                    res = place_proposal_enrich(
                        PlaceProposalEnrichRequest(name=name, region=region,
                                                   keyword=keyword, industry=industry),
                        {"role": "admin", "username": "probe"})
                    took = time.time() - t0
                    d = (res or {}).get("data") or {}
                    sb = d.get("sbiz") or {}
                    mj = (sb.get("major") or {}) if sb else {}
                    sal = (sb.get("sales") or {}) if sb else {}
                    print(f"  success={res.get('success')} · 소요 {took:.1f}s")
                    print(f"  businessKey : {d.get('businessKey')!r}")
                    print(f"  검색량       : {d.get('volume')}")
                    print(f"  원 키워드 병기: {d.get('baseKeyword')} {d.get('baseVolume')}")
                    print(f"  현재 순위    : {d.get('rank')} ({d.get('rankState')})")
                    print(f"  순위 추이    : {len(d.get('rankSeries') or [])}점   → 슬라이드 {'노출' if len(d.get('rankSeries') or []) >= 2 else '생략'}")
                    print(f"  추적 키워드  : {len(d.get('trackedKeywords') or [])}개")
                    print(f"  상권 블록    : {'있음' if sb else '없음'}   → 슬라이드 {'노출' if sb else '생략'}")
                    if sb:
                        print(f"     점포당 월평균 {sal.get('avgAmt')} · 시군구평균 {sal.get('guAvgAmt')} · 업종 {sb.get('industryNm')}")
                        print(f"     업종 종합 {mj.get('label')} {mj.get('avgAmt')}원 · {mj.get('shopCnt')}곳")
                except Exception as e:
                    print("  실패:", type(e).__name__, e); traceback.print_exc()

            print("=" * 66)
            PY

      # ── 상권 매출 「단위」 실측 검증 (2026-08-05) ────────────────────────
      # 대표 지적: 점포당 월평균 297만원은 음식점 실감과 안 맞는다(몇 천만원대여야).
      # saleAmt 단위를 천원으로 보고 있는데 실제로 만원일 가능성 → 원문 값·공식 화면
      # 표기·업종별 분포를 함께 찍어 단위를 확정한다. 전부 읽기 전용·키 값 미출력.
      - name: 상권 매출 단위 검증
        if: ${{ github.event.inputs.unit_check != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          UNITQ: ${{ github.event.inputs.unit_check }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 300s
          envs: UNITQ
          script: |
            docker exec -i -e UNITQ="$UNITQ" logic-analysis python3 - <<'PY'
            import os, re, json, ssl, urllib.parse, urllib.request, traceback
            import sbiz365

            region = (os.getenv("UNITQ", "") or "").strip() or "구로동"
            print("=" * 68)
            print(f"[단위 검증] 지역={region!r}")

            # 1) 행정동 매핑
            admi = sbiz365._resolve_admi(region)
            if not admi:
                print("  행정동 매핑 실패 — 중단"); raise SystemExit(0)
            print(f"  admiCd={admi.get('admiCd')} · simpleLoc={admi.get('simpleLoc')!r}")
            loc = sbiz365._pick_simple_loc(admi, region, "I20101") or admi.get("simpleLoc")
            print(f"  응답 오는 simpleLoc 표기: {loc!r}")

            # 2) 업종 트리에서 고기·음식 계열 코드 몇 개 뽑기
            pairs = sbiz365._upjong_pairs() if hasattr(sbiz365, "_upjong_pairs") else []
            if not pairs:
                try:
                    pairs = sbiz365._fetch_upjong_tree() or []
                except Exception:
                    pairs = []
            def find(*words):
                out = []
                for c, n in pairs:
                    if all(w in n for w in words):
                        out.append((c, n))
                return out
            cands = []
            for ws in (("돼지",), ("구이",), ("갈비",), ("백반",), ("한식",)):
                cands += find(*ws)
            seen, picks = set(), []
            for c, n in cands:
                if c not in seen:
                    seen.add(c); picks.append((c, n))
            picks = picks[:8]
            print(f"  업종 후보 {len(picks)}개: " + " / ".join(f"{c}={n.split('>')[-1].strip()}" for c, n in picks))

            # 3) 업종별 RAW 값 — 어떤 변환도 하지 않고 그대로 출력
            print("-" * 68)
            print("[RAW getAvgAmtInfo — 변환 없음]")
            hdr = f"{'코드':8s} {'saleAmt':>10s} {'minAmt':>10s} {'maxAmt':>12s} {'guAmt':>10s} {'siAmt':>10s} {'saleCnt':>9s}  업종"
            print(hdr)
            for c, n in picks:
                try:
                    got = sbiz365._fetch_avg(admi["admiCd"], c, loc)
                except Exception as e:
                    print(f"  {c}  예외 {type(e).__name__}: {e}"); continue
                if not got:
                    print(f"  {c}  무응답"); continue
                print(f"  {c:8s} {str(got.get('saleAmt')):>10s} {str(got.get('minAmt')):>10s} "
                      f"{str(got.get('maxAmt')):>12s} {str(got.get('guAmt')):>10s} "
                      f"{str(got.get('siAmt')):>10s} {str(got.get('saleCnt')):>9s}  {n.split('>')[-1].strip()}")
                if got.get("series"):
                    print("           월별 avgList(원문): " + ", ".join(f"{r['ym']}={r['amt']}" for r in got["series"][-4:]))
                if got.get("shopSeries"):
                    print("           업소수 시계열(원문): " + ", ".join(f"{r.get('ym')}={r.get('cnt')}" for r in got["shopSeries"][-4:]))

            # 4) 판정 근거 — 최고 점포(maxAmt)를 두 단위로 환산해 상식과 대조
            print("-" * 68)
            print("[단위 판정 — maxAmt(상권 내 최고 1개 점포)를 두 해석으로 환산]")
            print("  * 음식점 최고 점포의 월매출이 어느 쪽이 상식적인지로 판정한다.")
            for c, n in picks[:3]:
                got = None
                try:
                    got = sbiz365._fetch_avg(admi["admiCd"], c, loc)
                except Exception:
                    pass
                if not got or got.get("maxAmt") is None:
                    continue
                mx, av = got["maxAmt"], got.get("saleAmt")
                print(f"  {n.split('>')[-1].strip()}")
                print(f"    천원 해석 → 최고 {mx/1000:,.0f}만원/월 · 평균 {(av or 0)/1000:,.0f}만원/월")
                print(f"    만원 해석 → 최고 {mx:,.0f}만원/월 · 평균 {(av or 0):,.0f}만원/월")

            # 5) 공식 화면(iframe)에서 단위 표기 문자열 찾기
            print("-" * 68)
            print("[공식 화면 HTML 의 단위 표기 탐색]")
            try:
                key = sbiz365._env_keys().get("simple", "")
                url = "https://bigdata.sbiz.or.kr/openApiIfrm/simple?certKey=" + urllib.parse.quote(key, safe="")
                ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
                with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}),
                                            timeout=20, context=ctx) as r:
                    html = r.read().decode("utf-8", "replace")
                print(f"  HTML {len(html):,}B 수신")
                for pat in ("만원", "천원", "단위", "백만원", "억원"):
                    hits = [m.start() for m in re.finditer(pat, html)][:6]
                    if hits:
                        for h in hits:
                            frag = re.sub(r"\s+", " ", html[max(0, h - 70):h + 25])
                            print(f"    '{pat}' … {frag}")
                    else:
                        print(f"    '{pat}' 없음")
            except Exception as e:
                print("  화면 조회 실패:", type(e).__name__, e)

            print("=" * 68)
            PY

      # ── 플레이스 분석 「시장·상권·기회」 블록 실호출 검증 (2026-08-11) ──────
      # ⚠️ 내부 로직을 재현하지 않고 **실제 진입점**(_place_market_block / get_search_trend)을
      #    그대로 호출한다 — 「내부 흉내 진단은 수정 검증에 쓸 수 없다」 교훈.
      #    특히 데이터랩 통합검색어 트렌드(/v1/datalab/search)는 이번에 처음 붙인 경로라
      #    실응답을 한 번은 봐야 한다. 키 값은 출력하지 않는다.
      - name: 플레이스 시장 블록 실호출
        if: ${{ github.event.inputs.market_probe != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          MPROBE: ${{ github.event.inputs.market_probe }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 420s
          envs: MPROBE
          script: |
            docker exec -i -e MPROBE="$MPROBE" logic-analysis python3 - <<'PY'
            import os, time, json, traceback

            parts = (os.getenv("MPROBE", "") or "").split("|")
            region   = (parts[0] if len(parts) > 0 else "").strip()
            industry = (parts[1] if len(parts) > 1 else "").strip()
            keyword  = (parts[2] if len(parts) > 2 else "").strip()
            name     = (parts[3] if len(parts) > 3 else "").strip()
            print("=" * 68)
            print(f"입력  지역={region!r} 업종={industry!r} 키워드={keyword!r} 업체명={name!r}")

            def step(t):
                print("-" * 68); print(f"[{t}]")

            try:
                import main
            except Exception as e:
                print("main import 실패:", e); traceback.print_exc(); raise SystemExit(1)

            combined = main._combine_region_keyword(region, keyword)
            print(f"합성 키워드: {combined!r}")

            step("1. _place_market_block 실호출 (분석 화면이 부르는 그 함수)")
            t0 = time.time()
            mk = main._place_market_block(
                region=region, base_kw=keyword, combined_kw=combined,
                industry=industry, biz_name=name, business_key="",
                place_in={"visitor_reviews": 376, "blog_reviews": 88},
                competitors=[{"rank": 1, "visitor_reviews": 1284, "blog_reviews": 312},
                             {"rank": 2, "visitor_reviews": 942, "blog_reviews": 198},
                             {"rank": 3, "visitor_reviews": 600, "blog_reviews": 100}],
            ) or {}
            print(f"  소요 {time.time() - t0:.1f}초")

            step("2. 검색량")
            print(f"  지역 키워드 {mk.get('keyword')!r} → {mk.get('volume')}")
            print(f"  원 키워드   {mk.get('baseKeyword')!r} → {mk.get('baseVolume')}")
            print(f"  경쟁 {mk.get('compIdx')!r} · 평균 광고 개수 {mk.get('adDepth')}")

            step("3. 동네 상권(소상공인365)")
            sb = mk.get("sbiz")
            if not sb:
                print("  없음 — 업종 미선택·행정동 매칭 실패·키 미설정 중 하나(상권 카드만 생략)")
            else:
                d, sl = sb.get("district") or {}, sb.get("sales") or {}
                print(f"  행정동 {d.get('admiNm')} ({d.get('admiCd')}) · 업종 {sb.get('industryNm')!r} · 기준 {sb.get('baseYm')}")
                print(f"  점포당 {sl.get('avgAmt')} · 시군구평균 {sl.get('guAvgAmt')} · 시도평균 {sl.get('siAvgAmt')}")
                sh = sb.get("shops") or {}
                print(f"  업소수 {sh.get('count')} · 대분류 종합 {(sb.get('major') or {}).get('label')} "
                      f"{(sb.get('major') or {}).get('avgAmt')} / {(sb.get('major') or {}).get('shopCnt')}곳")

            step("4. 연관·황금 키워드")
            rel, gold = mk.get("related") or [], mk.get("golden") or []
            print(f"  연관 {len(rel)}건")
            for r in rel[:5]:
                print(f"    {r.get('keyword')!r} {r.get('volume')} → {r.get('combined')!r} {r.get('combinedVolume')} "
                      f"(경쟁 {r.get('compIdx')}, 내 순위 {r.get('rank')})")
            print(f"  황금 {len(gold)}건")
            for g in gold[:5]:
                print(f"    {g.get('keyword')!r} {g.get('volume')} · {g.get('compIdx')} · {g.get('priority')}")

            step("5. ⭐ 검색 트렌드 (데이터랩 통합검색어 — 이번 신규 경로)")
            tr = mk.get("trend")
            if not tr:
                try:
                    import datalab
                    print(f"  없음 — PLACE_TREND_ENABLED={datalab.PLACE_TREND_ENABLED} "
                          f"· 한도소진={datalab.datalab_quota_exhausted()}")
                except Exception as e:
                    print("  없음 (datalab 확인 실패:", e, ")")
            else:
                ms = tr.get("months") or []
                print(f"  기준 키워드 {tr.get('keyword')!r} · 월별 {len(ms)}점")
                print(f"  성수기 {tr.get('peakMonth')} · 비수기 {tr.get('lowMonth')} · 전년대비 {tr.get('yoyRate')}")
                print(f"  요일 {[(w.get('label'), w.get('ratio')) for w in (tr.get('weekdays') or [])]}")
                print(f"  피크 요일 {tr.get('peakWeekday')}")
                print(f"  성별 {tr.get('gender')} · 연령 {tr.get('ages')} · 주 연령 {tr.get('topAge')}")

            step("6. 리뷰 격차")
            print(" ", json.dumps(mk.get("reviewGap"), ensure_ascii=False))

            step("7. 개선 시뮬레이션·로드맵 (_place_improve_plan 실호출)")
            import place_crawler
            scored = place_crawler.score_place(
                {"rank": 7, "visitor_reviews": 376, "blog_reviews": 88},
                competitors=[{"visitor_reviews": 1284}, {"visitor_reviews": 942}])
            ms_src = {"rank": "measured", "visitor_review": "measured", "blog_review": "measured",
                      "relevance": "default", "review_keyword": "default", "photo": "default",
                      "save": "default", "booking": "default", "activity": "default", "info": "default"}
            im = main._place_improve_plan(scored.get("scores") or {}, scored.get("weights") or {},
                                          scored.get("labels") or {}, ms_src) or {}
            for s2 in (im.get("steps") or []):
                print(f"  {s2.get('label')}: {s2.get('total')} (+{s2.get('delta')}) ← {', '.join(s2.get('focus') or [])}")
            for ph in (im.get("roadmap") or []):
                print(f"  {ph.get('phase')}: " + " / ".join(ph.get("items") or []))

            print("=" * 68)
            PY

      # 데이터랩은 「쇼핑인사이트」와 「통합검색어 트렌드」가 **서로 다른 API 등록 항목**이다.
      # 같은 앱 키(NAVER_CLIENT_ID/SECRET)를 쓰지만 개발자센터에서 각각 등록해야 한다.
      # 「데이터랩 이미 쓰고 있는데 왜 안 되나」를 추측이 아니라 **같은 키로 나란히 호출해** 답한다.
      # ⚠️ 키 값은 절대 출력하지 않는다(설정 여부·길이만).
      - name: 데이터랩 스코프 대조 (쇼핑인사이트 vs 통합검색어)
        if: ${{ github.event.inputs.datalab_scope_check == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import os, json, datetime, requests

            cid = os.getenv("NAVER_CLIENT_ID", "")
            sec = os.getenv("NAVER_CLIENT_SECRET", "")
            tid = os.getenv("DATALAB_SEARCH_CLIENT_ID", "")
            tsec = os.getenv("DATALAB_SEARCH_CLIENT_SECRET", "")
            print("=" * 68)
            print(f"기본 앱 키(지역·쇼핑검색·쇼핑인사이트) — ID {'있음' if cid else '없음'}(len={len(cid)}) · "
                  f"SECRET {'있음' if sec else '없음'}(len={len(sec)})")
            print(f"트렌드 전용 키(DATALAB_SEARCH_*)        — ID {'있음' if tid else '없음'}(len={len(tid)}) · "
                  f"SECRET {'있음' if tsec else '없음'}(len={len(tsec)})")
            if not tid:
                print("※ 전용 키 미설정 → 트렌드도 기본 키로 호출(= 지금까지와 동일).")

            H = {"X-Naver-Client-Id": cid, "X-Naver-Client-Secret": sec,
                 "Content-Type": "application/json"}
            HT = {"X-Naver-Client-Id": tid or cid, "X-Naver-Client-Secret": tsec or sec,
                  "Content-Type": "application/json"}
            end = datetime.date.today().replace(day=1) - datetime.timedelta(days=1)
            start = (end - datetime.timedelta(days=180)).replace(day=1)
            sd, ed = start.isoformat(), end.isoformat()

            def call(label, url, body, hdr=None):
                print("-" * 68)
                print(f"[{label}]")
                print(f"  {url}")
                try:
                    r = requests.post(url, json=body, headers=(hdr or H), timeout=10)
                    print(f"  HTTP {r.status_code}")
                    txt = (r.text or "")[:220]
                    if r.status_code == 200:
                        try:
                            d = r.json()
                            res = d.get("results") or []
                            n = len(((res[0] if res else {}) or {}).get("data") or [])
                            print(f"  ✅ 정상 — results {len(res)}개 · 데이터 포인트 {n}개")
                        except Exception:
                            print(f"  ✅ 200 (본문 파싱 생략) {txt}")
                    else:
                        print(f"  ❌ 실패 — {txt}")
                except Exception as e:
                    print(f"  호출 오류: {e}")

            call("A. 데이터랩 쇼핑인사이트 (지금 스토어 분석이 쓰는 것)",
                 "https://openapi.naver.com/v1/datalab/shopping/categories",
                 {"startDate": sd, "endDate": ed, "timeUnit": "month",
                  "category": [{"name": "패션의류", "param": ["50000000"]}]})

            call(f"B. 데이터랩 통합검색어 트렌드 ({'전용 키' if tid else '기본 키'}로 호출)",
                 "https://openapi.naver.com/v1/datalab/search",
                 {"startDate": sd, "endDate": ed, "timeUnit": "month",
                  "keywordGroups": [{"groupName": "마사지", "keywords": ["마사지"]}]},
                 HT)

            print("-" * 68)
            print("판독: A 200 + B 200  → 트렌드 켜짐(서버 재기동 후 카드 자동 노출).")
            print("      A 200 + B 401  → 그 앱에 「검색어트렌드」 미등록.")
            print("                        네이버가 신규 등록을 막아둔 API 라, **이미 등록된 앱**의 키를")
            print("                        DATALAB_SEARCH_CLIENT_ID / _SECRET 시크릿으로 넣어야 합니다.")
            print("      A 401          → 기본 키 자체 문제(스토어 분석도 영향 — 우선 확인).")
            print("=" * 68)
            PY
