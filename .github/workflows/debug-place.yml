            print(f"  client_analyses.analysis_json      {mb('SELECT SUM(LENGTH(analysis_json)) FROM client_analyses'):8.0f} MB")
            print(f"  client_analyses.shop_products_json {mb('SELECT SUM(LENGTH(shop_products_json)) FROM client_analyses'):8.0f} MB")
