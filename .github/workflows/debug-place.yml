                    m2 = re.search(r"\b(4\d\d|5\d\d)\b|timeout|timed out|quota|credit|rate|overload|invalid", m, re.I)
                    k[m2.group(0).lower() if m2 else "기타"] += 1
                print(f"  실패 사유 분류: {dict(k) or '없음'}")
            c.close()
            print(f"\n  (DB 조사 {time.time()-t0:.1f}s)")
