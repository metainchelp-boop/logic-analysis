            # ⚠️ 저장소가 공개다 — 업체명·키워드·지역은 한 글자도 찍지 않는다(해시·개수·일치 여부만).
            import os, sys, sqlite3, hashlib, re, json, time, difflib, urllib.request, urllib.parse
            from collections import Counter, defaultdict

            MODE = (os.getenv("PCPROBE") or "").strip()
