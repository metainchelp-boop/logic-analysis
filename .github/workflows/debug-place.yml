name: Debug Place Tracking (읽기 전용 진단)

# 플레이스 무인 추적 상태 점검 — 수동 실행 전용(push 트리거 없음 = 재배포 미유발).
# 작업 브랜치 ref 로 dispatch 해 main 을 건드리지 않는다(전산 ① debug-logs 선례).
# 전 쿼리 읽기 전용(SELECT) — 데이터 변경 없음.

on:
  workflow_dispatch:
    inputs:
      prune:
        description: '디스크 정리 실행 (dangling 이미지+빌드 캐시+저널 — 롤백 이미지·실행 컨테이너·DB 보존)'
        default: 'false'
      backup_keep:
        description: 'DB 백업 정리 — 최신 N개만 보관(빈 값=미실행). 예: 2'
        default: ''

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Place tracking read-only query
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "== 컨테이너 상태 =="
            docker ps --filter name=logic-analysis --format '{{.Names}} {{.Status}}'
            echo
            echo "== 플레이스 추적 DB (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()

            c.execute("SELECT COUNT(*) n, SUM(active) a FROM place_track_target")
            r = c.fetchone()
            print(f"[등록 대상] 총 {r['n']}건 / 활성 {r['a']}건")
            for t in c.execute("SELECT business_name, region, keyword, place_id, active FROM place_track_target ORDER BY id"):
                pid = t["place_id"] or "-"
                print(f"  - {t['business_name']} | {t['region']} | {t['keyword']} | ID:{pid} | {'ON' if t['active'] else 'OFF'}")

            print()
            print("[최근 48시간 수집 기록] (checked_at KST)")
            rows = c.execute("""
                SELECT business_name, keyword, rank_position, rank_state, checked_at
                FROM place_rank_history
                WHERE checked_at >= datetime('now', '+9 hours', '-48 hours')
                ORDER BY checked_at DESC LIMIT 40
            """).fetchall()
            if not rows:
                print("  (없음)")
            for h in rows:
                rk = h["rank_position"] if h["rank_position"] is not None else "-"
                print(f"  {h['checked_at']} | {h['business_name']} | {h['keyword']} | {rk}위 | {h['rank_state']}")

            print()
            last = c.execute("SELECT MAX(checked_at) m, COUNT(*) n FROM place_rank_history").fetchone()
            print(f"[전체] 누적 {last['n']}행 / 마지막 기록 {last['m']}")
            PY
            echo
            echo "== 최근 ingest 요청 로그 =="
            docker logs --tail 400 logic-analysis 2>&1 | grep -i 'place/ingest\|place/track-targets' | tail -12 || echo "(로그 매칭 없음)"
            echo
            echo "== 재시작 계수·기동 시각 =="
            docker inspect -f 'RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' logic-analysis
            echo
            echo "== 직전 오류 흔적 (unfiltered tail 80) =="
            docker logs --tail 80 logic-analysis 2>&1 | tail -40
            echo
            echo "== 호스트 메모리/디스크 =="
            free -m | head -2; df -h / | tail -1
            echo
            echo "== 디스크 구성 (증설 가능성 판단 — 읽기 전용) =="
            lsblk -e7 -o NAME,SIZE,TYPE,MOUNTPOINT 2>/dev/null || true
            sudo pvs 2>/dev/null || true
            sudo vgs 2>/dev/null || true
            sudo lvs 2>/dev/null || true
            sudo dmidecode -s system-manufacturer 2>/dev/null || true
            sudo dmidecode -s system-product-name 2>/dev/null || true
            echo
            echo "== 무엇이 공간을 먹나 (증가 요인 분석 — 읽기 전용) =="
            echo "[도커 총량]"; docker system df
            echo "[우리 DB 크기]"; ls -lh /root/logic-analysis-deploy/data/*.db 2>/dev/null | awk '{print $9, $5}'
            echo "[동거 서비스별 배포 디렉터리 상위]"; sudo du -xh -d1 /root 2>/dev/null | sort -h | tail -10
            echo "[전체 루트 상위 소비]"; sudo du -xh -d1 / 2>/dev/null | sort -h | tail -8
            echo "[logic-analysis-deploy 내부 — 15G 정체 규명]"; sudo du -xh -d1 /root/logic-analysis-deploy 2>/dev/null | sort -h | tail -8
            echo "[data 디렉터리 — DB·백업 누적 여부]"; sudo ls -lhS /root/logic-analysis-deploy/data 2>/dev/null | head -20
            echo "[백업 폴더 상세]"; sudo ls -lhtr /root/logic-analysis-deploy/data/backups 2>/dev/null; sudo du -sh /root/logic-analysis-deploy/data/backups 2>/dev/null
            echo
            echo "== DB 테이블별 크기·가장 오래된 데이터 (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            c = conn.cursor()
            print("[테이블별 실제 차지 크기]")
            try:
                for name, b in c.execute("SELECT name, SUM(pgsize) FROM dbstat GROUP BY name ORDER BY 2 DESC LIMIT 14"):
                    print(f"  {name:28s} {b/1048576:8.1f} MB")
            except Exception as e:
                print(f"  (dbstat 불가: {e} — 행 수로 대체)")
            print()
            print("[테이블별 행 수·기간(가장 오래된→최신)]")
            spec = [
                ("rankings", "checked_at"), ("competitor_snapshots", "captured_at"),
                ("shopping_search_cache", "datetime(created_at,'unixepoch','localtime')"),
                ("api_usage_logs", "called_at"), ("notification_logs", "created_at"),
                ("place_rank_history", "checked_at"),
            ]
            for tbl, col in spec:
                try:
                    n, lo, hi = c.execute(f"SELECT COUNT(*), MIN({col}), MAX({col}) FROM {tbl}").fetchone()
                    print(f"  {tbl:24s} {n:>9,}행  {str(lo)[:16]} → {str(hi)[:16]}")
                except Exception as e:
                    print(f"  {tbl:24s} (조회 불가: {e})")
            conn.close()
            PY
            if [ -n "${{ inputs.backup_keep }}" ]; then
              echo
              echo "== DB 백업 정리 — 최신 ${{ inputs.backup_keep }}개만 보관 =="
              BK=/root/logic-analysis-deploy/data/backups
              echo "정리 전:"; sudo du -sh "$BK" 2>/dev/null
              # logic_analysis_backup_*.db 를 시간 오래된 순으로 나열, 최신 N개 제외한 나머지 삭제
              sudo bash -c '
                BK="'"$BK"'"; KEEP='"${{ inputs.backup_keep }}"'
                mapfile -t files < <(ls -1tr "$BK"/logic_analysis_backup_*.db 2>/dev/null)
                total=${#files[@]}; drop=$((total - KEEP))
                echo "  백업 $total개 발견 · $drop개 삭제 예정 · $KEEP개 보관"
                if [ "$drop" -gt 0 ]; then
                  for ((i=0;i<drop;i++)); do echo "  🗑️ ${files[$i]##*/}"; rm -f "${files[$i]}"; done
                fi
              '
              echo "정리 후:"; sudo du -sh "$BK" 2>/dev/null; df -h / | tail -1
            fi
            if [ "${{ inputs.prune }}" = "true" ]; then
              echo
              echo "== 디스크 사용 내역 (정리 전) =="
              docker system df
              sudo du -xh -d1 /var/lib/docker 2>/dev/null | sort -h | tail -6
              echo
              echo "== 정리 실행 (롤백 이미지·실행 컨테이너·데이터 볼륨 보존) =="
              docker image prune -f
              docker builder prune -af
              docker container prune -f
              sudo journalctl --vacuum-size=200M 2>/dev/null | tail -1 || true
              sudo apt-get clean 2>/dev/null || true
              echo
              echo "== 정리 후 =="
              docker system df
              df -h / | tail -1
              docker images | head -8
            fi
