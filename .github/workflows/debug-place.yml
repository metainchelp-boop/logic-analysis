name: Debug Place Tracking (읽기 전용 진단)

# 플레이스 무인 추적 상태 점검 — 수동 실행 전용(push 트리거 없음 = 재배포 미유발).
# 작업 브랜치 ref 로 dispatch 해 main 을 건드리지 않는다(전산 ① debug-logs 선례).
# 전 쿼리 읽기 전용(SELECT) — 데이터 변경 없음.

on:
  workflow_dispatch:
    inputs:
      place:
        description: '플레이스 추적 현황 — off(기본) / on. ⚠️ 가게 이름이 실행 기록에 남는다 — 이 저장소는 공개다. 결과를 받은 뒤 그 런의 로그를 지울 것.'
        required: false
        default: 'off'
      prune:
        description: '디스크 정리 실행 (dangling 이미지+빌드 캐시+저널 — 롤백 이미지·실행 컨테이너·DB 보존)'
        default: 'false'
      backup_keep:
        description: 'DB 백업 정리 — 최신 N개만 보관(빈 값=미실행). 예: 2'
        default: ''
      retention:
        description: 'client_analyses 보관정책 — preview(미리보기만) / apply(실제 삭제, B안=최근30일+키워드별 최신)'
        default: ''
      sbiz_check:
        description: '소상공인365 인증키 6종 실응답 검증 (true — 키 값 미출력·읽기 전용·한국 IP=VPS에서 호출)'
        default: ''
      datago_check:
        description: '공공데이터포털(data.go.kr) 상가정보 인증키 검증 (true — 행정동코드 매핑용·키 값 미출력)'
        default: ''
      sns_theme_check:
        description: 'SNS·테마상권·유동인구(시간대/요일) 실응답 탐색 (true — 잔여 3종·키 값 미출력)'
        default: ''
      enrich_probe:
        description: '맞춤제안서 실데이터 재현 — "지역|업종|키워드|업체명" (예: 구로동|음식점|고기|메타). 읽기 전용'
        default: ''
      unit_check:
        description: '상권 매출 단위 검증 — 지역명만 (예: 구로동). saleAmt 원문·업종별 분포·공식 화면 표기로 천원/만원 확정'
        default: ''
      market_probe:
        description: '플레이스 분석 시장 블록 실호출 — "지역|업종|키워드|업체명" (예: 조원동|미용·뷰티|마사지|프로힐링지압안마원). 읽기 전용'
        default: ''

      datalab_scope_check:
        description: '데이터랩 스코프 대조 — 같은 앱 키로 쇼핑인사이트 vs 통합검색어 트렌드 각각 호출해 어느 쪽이 되는지 확인(true). 키 값은 출력 안 함'
        default: ''

      secret_check:
        description: '시크릿 배선 점검 — GitHub 에 등록됐는지 / 서버 .env 까지 갔는지 두 층을 각각 확인(true). 값은 출력 안 하고 설정 여부만'
        default: ''

      trend_raw:
        description: '검색어트렌드 원문 확인 — 성별·연령 필터 응답이 요청마다 따로 정규화되는지(=서로 비교 불가인지) 실측. 키워드 입력(예: 마사지)'
        default: ''

      admi_probe:
        description: '행정동 매칭 정확도 실측 — 지역명 쉼표 구분(예: 역삼동,성사동,구로동,미사동). 반경 안 상가를 여러 건 받아 행정동 분포·최빈값·시군구 일치를 본다. 읽기 전용'
        default: ''

      addr_probe:
        description: '주소 기반 해석 가능성 실측 — "업체명|지역" 세미콜론 구분(예: 밀밭칼국수|성사동;프로힐링지압안마원|조원동). 지역검색이 주는 주소·상가 응답 필드를 본다. 읽기 전용'
        default: ''

      gu_fallback_check:
        description: '동 단위 통계가 없을 때 시군구 평균이 같은 응답에 실려 오는지 실측 — "지역|업종"(예: 조원동|미용·뷰티). 소분류를 여러 개 돌며 saleAmt/guAmt/siAmt 유무를 대조. 읽기 전용'
        default: ''
      backup_verify:
        description: 'DB 백업이 실제로 복구 가능한지 검증 — true. 압축본을 끝까지 풀어 CRC·크기를 대조하고, 남아 있는 비압축본은 SQLite 무결성까지 본다(읽기 전용·디스크 쓰기 0·업체명 미출력).'
        required: false
        default: ''

      dbsize:
        description: 'DB 용량 분석 — off(기본) / on. ⚠️ 3.1GB DB 를 통째로 스캔한다(테이블별 COUNT + JSON 컬럼 SUM(LENGTH)). 느려서 스텝 예산(240s)을 넘기면 뒤 스텝이 전부 안 돈다 — 필요할 때만 켠다.'
        required: false
        default: 'off'
      key_check:
        description: '소상공인365 503 이 키 문제인지 서버 문제인지 가른다 — true. 진짜 키 / 틀린 키 / 키 없음 / 포털 첫 화면을 각각 불러 상태코드를 대조(읽기 전용·키 값 미출력).'
        required: false
      sbiz_since:
        description: '소상공인365 실패가 언제부터인지 — true. 컨테이너 로그의 [sbiz365] 실패를 시간대별로 센다(읽기 전용·업체명 미출력).'
        required: false
      autobid_traffic:
        description: '자동입찰 에이전트가 실제로 보고하고 있나 — true. 우리 nginx 접속기록에서 /autobid 요청과 우리 수집기 요청이 같은 IP 인지 대조한다(읽기 전용 · ⚠️ IP 원문은 출력하지 않고 일치 여부·건수만).'
        required: false
      hang_probe:
        description: '진단 스텝이 어디서 멈추는지 — true. 이 워크플로가 쓰는 명령을 하나씩 timeout 을 씌워 걸리는 지점을 찾는다(읽기 전용).'
        required: false
      analysis_audit:
        description: '로직분석 결과값 전수조사 — true(1차) / preload(4차: PRELOADED 자리) / detail2(5차: 판매가·본 상품 주소가 HTML 어디에) / ld(6차: JSON-LD 값 모양) / detail(2차: 상세 HTML 구조·수집 커버리지·정확한 상태코드). 자동 분석 결과 칸별 빈값 · 배치 산출물 일별 · 외부 데이터원 1회 실호출 · 오류 로그 유형 · API 경로별 상태코드(읽기 전용 · 업체명·키워드·IP 미출력 · 그래도 읽은 뒤 런 로그 삭제)'
        required: false
      place_capture_probe:
        description: '신고 #276 — 플레이스 분석 캡처 판독 재현. db = 기록 집계만 / auto = 9/22·9/23 사람 분석 행으로 네이버 목록 1~2회 받아 서버 판독기로 읽기 / at:시각;시각 = 그 시각 행을 그대로 재현 / at!:시각 = 같은데 이름을 그대로 찍는다(⚠️ 읽은 즉시 런 로그 삭제) / find!:업체명|검색어;검색어 = 이름으로 찾아 그 번호가 각 목록 몇 번째인지(⚠️ 로그 삭제) / depth:검색어;검색어 = 기록된 순위 분포 + 목록 데이터 칸 구조 / 그 밖의 글자 = 그 검색어로 1회. 업체명·키워드는 해시로만 찍는다(읽기 전용).'
        required: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      # ── 로직분석 결과값 전수조사 (2026-09-23 · 읽기 전용) ──
      # 대표 질문 「로직분석 실행했을 때 나오는 값이 정확한가 · 안 나오거나 오류인 게 있나」에 서버에서 답한다.
      # ⚠️ 저장소 공개 — 칸 이름(코드 식별자)·건수·상태코드만 찍는다. 한글은 소스에 있는 낱말만 남기고 가린다.
      - name: 로직분석 결과값 전수조사 6차 — JSON-LD 판매가·카테고리·상품 번호 모양 (읽기 전용)
        if: ${{ github.event.inputs.analysis_audit == 'ld' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 240s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            # 전수조사 6차 — JSON-LD Product 의 판매가·카테고리·상품 번호 **모양**과, 그 번호로 상품 주소를 만들 수 있나
            # (읽기 전용 · 모양·건수만 · 업체명·상품명·번호 원문 미출력)
            import sqlite3, re, sys, json, collections, os
            sys.path.insert(0, "/app")
            try:
                from detail_html_store import _unpack
            except Exception:
                _unpack = lambda x: x if isinstance(x, str) else (x or b"").decode("utf-8", "ignore")

            DB = os.environ.get("PROBE_DB", "file:/app/data/logic_data.db?mode=ro")
            c = sqlite3.connect(DB, uri=True, timeout=20)
            LD_RE = re.compile(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', re.DOTALL | re.I)
            FULL_RE = re.compile(r'https?://(?:m\.)?(smartstore|brand)\.naver\.com/([A-Za-z0-9_-]+)/products/(\d+)')
            SLUG_RE = re.compile(r'(?:https?:)?//(?:m\.)?(smartstore|brand)\.naver\.com/([A-Za-z0-9_-]+)')
            BAD = {"main", "inflow", "i", "category", "products", "search", "profile", "v2", "api"}
            UNDEF = re.compile(r'(?<=[:\[,])(\s*)undefined\b')
            PRE_RE = re.compile(r'window\.__PRELOADED_STATE__\s*=\s*({.+?})\s*;?\s*</script>', re.DOTALL)
            KC = re.compile(r'<meta[^>]+(?:property|name)=["\']kakao:commerce:(price|regular_price|category)["\'][^>]+content=["\']([^"\']*)["\']', re.I)


            def vshape(v):
                if v is None:
                    return "없음"
                if isinstance(v, bool):
                    return "참거짓"
                if isinstance(v, (int, float)):
                    return "숫자"
                if isinstance(v, str):
                    s = v.strip()
                    if re.fullmatch(r'\d+', s):
                        return f"숫자글자({len(s)}자리)"
                    if re.fullmatch(r'[\d,.]+', s):
                        return "숫자글자(쉼표·점)"
                    if ">" in s:
                        return f"글자·'>'{s.count('>') + 1}단"
                    if s.startswith("http"):
                        return "주소"
                    return "글자"
                if isinstance(v, dict):
                    return "묶음{" + ",".join(sorted(k for k in v.keys() if re.fullmatch(r'[@A-Za-z_]{1,30}', str(k))))[:80] + "}"
                if isinstance(v, list):
                    return f"목록({len(v)})"
                return type(v).__name__


            def num(v):
                try:
                    return float(str(v).replace(",", ""))
                except Exception:
                    return None


            def ushape(u):
                m = re.match(r'https?://([^/]+)(/.*)?', str(u))
                if not m:
                    return "기타"
                segs = ["{n}" if s.isdigit() else (s if s in ("products", "main") else "{x}") for s in (m.group(2) or "").split("?")[0].split("/")[1:] if s]
                return m.group(1) + "/" + "/".join(segs)


            S = collections.Counter()
            shapes = collections.defaultdict(collections.Counter)
            n = 0
            for (html,) in c.execute("SELECT html FROM client_detail_html"):
                h = _unpack(html) or ""
                if len(h) < 100:
                    continue
                n += 1
                hh = h.replace("\\/", "/") if "\\/" in h else h
                prod = None
                for blk in LD_RE.findall(h):
                    try:
                        d = json.loads(blk.strip())
                    except Exception:
                        continue
                    for it in (d if isinstance(d, list) else [d]):
                        if isinstance(it, dict) and str(it.get("@type")) == "Product":
                            prod = it
                            break
                    if prod:
                        break
                if not prod:
                    S["JSON-LD Product 없음"] += 1
                    continue
                off = prod.get("offers")
                if isinstance(off, list):
                    S["offers 가 목록"] += 1
                    off = off[0] if off else {}
                off = off if isinstance(off, dict) else {}
                for k in ("productID", "sku", "mpn", "category"):
                    shapes[k][vshape(prod.get(k))] += 1
                for k, v in off.items():
                    if re.fullmatch(r'[@A-Za-z_]{1,30}', str(k)):
                        shapes["offers." + k][vshape(v)] += 1
                if off.get("url"):
                    shapes["offers.url 모양"][ushape(off["url"])] += 1
                pid = str(prod.get("productID") or "").strip()
                sku = str(prod.get("sku") or "").strip()
                mpn = str(prod.get("mpn") or "").strip()
                S["productID=sku" if pid and pid == sku else "productID≠sku"] += 1
                S["productID=mpn" if pid and pid == mpn else "productID≠mpn"] += 1
                fulls = FULL_RE.findall(hh)
                nums = {x[2] for x in fulls}
                S["productID 가 본문 상품 주소 번호에 " + ("있음" if pid in nums else ("없음(주소 있음)" if nums else "없음(주소 0)"))] += 1
                S["sku 가 본문 상품 주소 번호에 " + ("있음" if sku in nums else "없음")] += 1
                # productID 와 같은 번호의 주소가 몇 번 나오나 — 그 주소의 스토어 슬러그가 본문 대표 슬러그와 같나
                if pid in nums:
                    same = [x for x in fulls if x[2] == pid]
                    S["productID 주소 등장 " + ("1회" if len(same) == 1 else "2회+")] += 1
                slugs = collections.Counter((x[0], x[1]) for x in SLUG_RE.findall(hh) if x[1] not in BAD)
                S["스토어 슬러그 " + ("0" if not slugs else ("1종" if len(slugs) == 1 else "2종+"))] += 1
                if slugs and len(slugs) >= 2:
                    top, n1 = slugs.most_common(1)[0]
                    n2 = slugs.most_common(2)[1][1]
                    S["2종+ 중 최빈이 2위의 2배 이상" if n1 >= 2 * n2 else "2종+ 중 최빈이 뚜렷하지 않음"] += 1
                ou = str(off.get("url") or "")
                om = re.search(r'/products/(\d+)', ou)
                S["offers.url 번호 = productID" if om and om.group(1) == pid else ("offers.url 에 번호 없음" if not om else "offers.url 번호 ≠ productID")] += 1
                # 판매가 — offers.price 가 할인가인가 정가인가 (kakao 메타 · PRELOADED 없음 → kakao 로만)
                op = num(off.get("price") or off.get("lowPrice"))
                kc = {k.lower(): v for k, v in KC.findall(h)}
                kp, kr = num(kc.get("price")), num(kc.get("regular_price"))
                if kp is not None and op is not None:
                    S["offers.price = kakao 판매가" if op == kp else ("offers.price = kakao 정가" if kr is not None and op == kr else "offers.price 가 kakao 두 값과 다름")] += 1
                    if kr is not None and kp is not None:
                        S["kakao 판매가<정가(할인 있음)" if kp < kr else "kakao 판매가=정가"] += 1
                if op is not None:
                    S["offers.price 범위 안(100~1억)" if 100 <= op <= 1e8 else "offers.price 범위 밖"] += 1
                # 카테고리 — JSON-LD 와 PRELOADED(본 상품 id 가 simpleProductForDetailPage 에 있을 때) 비교
                cat = prod.get("category")
                if isinstance(cat, str) and pid:
                    m = PRE_RE.search(h)
                    if m:
                        try:
                            st = json.loads(UNDEF.sub(r'\1null', m.group(1)))
                            sp = ((st.get("simpleProductForDetailPage") or {}).get("A") or {})
                            if str(sp.get("id")) == pid and isinstance(sp.get("category"), dict):
                                wc = sp["category"].get("wholeCategoryName") or ""
                                S["JSON-LD category = PRELOADED wholeCategoryName" if cat.strip() == wc.strip() else "JSON-LD category ≠ PRELOADED wholeCategoryName"] += 1
                                dp = num(sp.get("dispSalePrice")) or num((sp.get("benefitsView") or {}).get("discountedSalePrice"))
                                if dp is not None and op is not None:
                                    S["offers.price = PRELOADED 할인가" if op == dp else ("offers.price = PRELOADED salePrice" if op == num(sp.get("salePrice")) else "offers.price 가 PRELOADED 두 값과 다름")] += 1
                        except Exception:
                            pass

            print(f"== 저장 HTML {n}건 — JSON-LD Product 값 모양 ==")
            for k, v in sorted(S.items()):
                print(f"  {k:<44} {v}")
            for k in sorted(shapes):
                print(f"== {k} ==")
                for s, v in shapes[k].most_common(8):
                    print(f"  {v:>4}  {s}")
            PY
      - name: 로직분석 결과값 전수조사 5차 — 판매가·본 상품 주소가 HTML 어디에 (읽기 전용)
        if: ${{ github.event.inputs.analysis_audit == 'detail2' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 240s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            # 전수조사 5차 — 저장된 상세 HTML 에서 판매가·카테고리·본 상품 주소가 **HTML 어디에** 있나
            # (읽기 전용 · 칸 이름·건수·모양만 · 업체명·상품명·키워드 미출력)
            import sqlite3, re, sys, json, collections, os
            sys.path.insert(0, "/app")
            try:
                from detail_html_store import _unpack
            except Exception:
                _unpack = lambda x: x if isinstance(x, str) else (x or b"").decode("utf-8", "ignore")

            DB = os.environ.get("PROBE_DB", "file:/app/data/logic_data.db?mode=ro")
            c = sqlite3.connect(DB, uri=True, timeout=20)

            UNDEF = re.compile(r'(?<=[:\[,])(\s*)undefined\b')
            PRE_RE = re.compile(r'window\.__PRELOADED_STATE__\s*=\s*({.+?})\s*;?\s*</script>', re.DOTALL)
            LD_RE = re.compile(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', re.DOTALL | re.I)
            META_RE = re.compile(r'<meta\b[^>]*>', re.I)
            ATTR_RE = lambda a: re.compile(a + r'\s*=\s*["\']([^"\']*)["\']', re.I)
            A_PROP, A_NAME, A_CONT = ATTR_RE("property"), ATTR_RE("name"), ATTR_RE("content")
            FULL_RE = re.compile(r'https?://(?:[a-z0-9-]+\.)*(?:smartstore|brand|shopping)\.naver\.com(?:/[A-Za-z0-9_-]+)?/(?:products|catalog)/\d+')
            TEST_RE = re.compile(r'naver\.com/(?:[\w-]+/)*(?:products|catalog)/\d+')
            BLIND_RE = re.compile(r'<span[^>]*class=["\'][^"\']*\bblind\b[^"\']*["\'][^>]*>([^<]{1,20})</span>', re.I)
            WON_RE = re.compile(r'([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{3,9})\s*(?:</span>\s*)?(?:<span[^>]*>\s*)?원')
            KEY_OK = re.compile(r'^[A-Za-z_@][A-Za-z0-9_]{0,40}$')


            def shape(u):
                u = str(u).split("?")[0].split("#")[0]
                m = re.match(r'(?:https?:)?//([^/]+)(/.*)?$', u)
                if not m:
                    return "(상대/기타)"
                host, path = m.group(1), m.group(2) or ""
                segs = ["{n}" if s.isdigit() else (s if s in ("products", "main", "category", "catalog", "profile") else "{x}")
                        for s in path.split("/")[1:] if s]
                return host + "/" + "/".join(segs)


            def meta_val(tag, want):
                p = A_PROP.search(tag) or A_NAME.search(tag)
                if not p or p.group(1).lower() != want:
                    return None
                cc = A_CONT.search(tag)
                return cc.group(1) if cc else ""


            def old_extract(h):       # 제안서 지금 규칙
                for tag in META_RE.findall(h):
                    v = meta_val(tag, "og:url")
                    if v is not None:
                        if re.search(r'naver\.com/.*/products/\d+', v):
                            return v.split("?")[0], "og"
                        break
                m = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]*href=["\']([^"\']+)["\']', h, re.I)
                if m and re.search(r'naver\.com/.*/products/\d+', m.group(1)):
                    return m.group(1).split("?")[0], "canon"
                allu = re.findall(r'https?://smartstore\.naver\.com/[A-Za-z0-9_-]+/products/\d+', h)
                if allu:
                    cnt = collections.Counter(u.split("?")[0] for u in allu)
                    best, n = cnt.most_common(1)[0]
                    if n >= 2:
                        return best, "freq2"
                return "", ""


            def new_extract(h):       # 로직분석 화면 지금 규칙(utils.js)
                hh = h.replace("\\/", "/") if "\\/" in h else h
                for tag in META_RE.findall(hh):
                    v = meta_val(tag, "og:url")
                    if v is not None:
                        if TEST_RE.search(v):
                            return v.split("?")[0], "og"
                        break
                m = (re.search(r'<link[^>]+rel=["\']canonical["\'][^>]*href=["\']([^"\']+)["\']', hh, re.I)
                     or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]*rel=["\']canonical["\']', hh, re.I))
                if m and TEST_RE.search(m.group(1)):
                    return m.group(1).split("?")[0], "canon"
                allu = FULL_RE.findall(hh)
                if allu:
                    cnt = collections.Counter(u.split("?")[0] for u in allu)
                    best, n = cnt.most_common(1)[0]
                    if n >= 2:
                        return best, "freq2"
                    if len(cnt) == 1:
                        return best, "single"
                return "", ""


            def find_paths(o, target, path, depth, out):
                """target(상품 번호 글자)과 같은 값이 들어 있는 자리 — 그 dict 가 가진 가격·카테고리 칸 이름"""
                if depth > 10 or len(out) > 6:
                    return
                if isinstance(o, dict):
                    for k, v in o.items():
                        kk = str(k) if KEY_OK.match(str(k)) else ("{n}" if str(k).isdigit() else "{k}")
                        p = f"{path}.{kk}" if path else kk
                        if not isinstance(v, (dict, list)) and str(v) == target:
                            keys = sorted(x for x in o.keys() if re.search(r'price|categ|name', str(x), re.I))[:8]
                            out.append(f"{p}  (옆 칸: {','.join(keys) or '-'})")
                        elif isinstance(v, (dict, list)):
                            find_paths(v, target, p, depth + 1, out)
                elif isinstance(o, list):
                    for v in o[:60]:
                        find_paths(v, target, path + "[]", depth + 1, out)


            n = 0
            S = collections.Counter()
            og_shape, canon_shape = collections.Counter(), collections.Counter()
            ld_types, ld_keys = collections.Counter(), collections.Counter()
            meta_names = collections.Counter()
            blind = collections.Counter()
            own_paths = collections.Counter()
            full_kinds = collections.Counter()
            for (html,) in c.execute("SELECT html FROM client_detail_html"):
                h = _unpack(html) or ""
                if len(h) < 100:
                    continue
                n += 1
                # ── 본 상품 주소 ──
                og = None
                for tag in META_RE.findall(h):
                    v = meta_val(tag, "og:url")
                    if v is not None:
                        og = v
                        break
                og_shape["없음" if og is None else shape(og)] += 1
                cm = (re.search(r'<link[^>]+rel=["\']canonical["\'][^>]*href=["\']([^"\']+)["\']', h, re.I)
                      or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]*rel=["\']canonical["\']', h, re.I))
                canon_shape["없음" if not cm else shape(cm.group(1))] += 1
                hh = h.replace("\\/", "/") if "\\/" in h else h
                cnt = collections.Counter(u.split("?")[0] for u in FULL_RE.findall(hh))
                full_kinds["상품 주소 종류 " + ("0" if not cnt else ("1" if len(cnt) == 1 else ("2~5" if len(cnt) <= 5 else "6+")))] += 1
                if cnt:
                    full_kinds["가장 많이 나온 주소 횟수 " + str(min(cnt.most_common(1)[0][1], 5)) + ("+" if cnt.most_common(1)[0][1] >= 5 else "")] += 1
                o_url, o_how = old_extract(h)
                n_url, n_how = new_extract(h)
                S["제안서 지금 규칙 성공 · " + (o_how or "실패")] += 1
                S["로직분석 화면 규칙 성공 · " + (n_how or "실패")] += 1
                S["두 규칙 결과 같음" if o_url == n_url else ("제안서만 실패" if not o_url and n_url else "결과 다름")] += 1
                own_no = ""
                for u in (n_url, og or "", cm.group(1) if cm else ""):
                    mm = re.search(r'/(?:products|catalog)/(\d+)', u or "")
                    if mm:
                        own_no = mm.group(1)
                        break
                S["본 상품 번호 " + ("앎" if own_no else "모름")] += 1
                # ── JSON-LD ──
                lds = LD_RE.findall(h)
                S["JSON-LD 있음" if lds else "JSON-LD 없음"] += 1
                ld_price = ld_cat = False
                for blk in lds:
                    try:
                        d = json.loads(blk.strip())
                    except Exception:
                        S["JSON-LD 해석 실패 블록"] += 1
                        continue
                    for it in (d if isinstance(d, list) else ([d] + (d.get("@graph") or [] if isinstance(d, dict) else []))):
                        if not isinstance(it, dict):
                            continue
                        ld_types[str(it.get("@type"))[:30]] += 1
                        for k in it.keys():
                            if KEY_OK.match(str(k)):
                                ld_keys[str(it.get("@type"))[:20] + "." + str(k)] += 1
                        off = it.get("offers")
                        offs = off if isinstance(off, list) else [off]
                        for of in offs:
                            if isinstance(of, dict):
                                try:
                                    pv = float(str(of.get("price") or of.get("lowPrice") or 0).replace(",", ""))
                                    if 100 <= pv <= 1e8:
                                        ld_price = True
                                except Exception:
                                    pass
                        if it.get("category"):
                            ld_cat = True
                S["JSON-LD 판매가 있음(범위 안)" if ld_price else "JSON-LD 판매가 없음"] += 1
                S["JSON-LD 카테고리 있음" if ld_cat else "JSON-LD 카테고리 없음"] += 1
                # ── meta 이름 ──
                seen = set()
                for tag in META_RE.findall(h):
                    p = A_PROP.search(tag) or A_NAME.search(tag)
                    if p:
                        nm = p.group(1).lower()
                        if re.search(r'price|amount|categ|product|og:', nm) and nm not in seen and len(nm) <= 40:
                            seen.add(nm)
                            cc = A_CONT.search(tag)
                            num = bool(cc and re.fullmatch(r'[\d.,]+', cc.group(1).strip() or "x"))
                            meta_names[nm + (" [숫자]" if num else "")] += 1
                # ── 화면에 그려진 글자(렌더된 DOM 인가) ──
                S["화면 그려짐(구매하기 글자)" if "구매하기" in h else "구매하기 글자 없음"] += 1
                S["se-viewer(상세 설명) 있음" if "se-viewer" in h or "se-main-container" in h else "se-viewer 없음"] += 1
                for t in set(x.strip() for x in BLIND_RE.findall(h)):
                    if t and len(t) <= 10 and not re.search(r'\d', t):
                        blind[t] += 1
                won = WON_RE.findall(h)
                S["'N원' 글자 " + ("0" if not won else ("1~5" if len(won) <= 5 else ("6~30" if len(won) <= 30 else "31+")))] += 1
                # ── 상태 안에서 본 상품 번호가 있는 자리 ──
                m = PRE_RE.search(h)
                st = None
                if m:
                    try:
                        st = json.loads(UNDEF.sub(r'\1null', m.group(1)))
                    except Exception:
                        S["상태 해석 실패"] += 1
                if isinstance(st, dict):
                    prod = st.get("product") or {}
                    sp = prod.get("salePrice") if isinstance(prod, dict) else None
                    S["product.salePrice 값 " + ("없음" if sp is None else ("0" if sp == 0 else ("범위 안" if isinstance(sp, (int, float)) and 100 <= sp <= 1e8 else "기타")))] += 1
                    if isinstance(prod, dict) and isinstance(prod.get("A"), dict):
                        S["product.A 있음(칸 " + str(min(len(prod["A"]), 50)) + ")"] += 1
                    if own_no:
                        out = []
                        find_paths(st, own_no, "", 0, out)
                        S["상태 안에 본 상품 번호 " + ("있음" if out else "없음")] += 1
                        for p in out[:4]:
                            own_paths[p] += 1

            print(f"== 저장 HTML {n}건 — 판매가·카테고리·본 상품 주소가 있는 자리 ==")
            for k, v in sorted(S.items()):
                print(f"  {k:<40} {v}")
            print("== og:url 모양 ==")
            for k, v in og_shape.most_common(10):
                print(f"  {v:>4}  {k}")
            print("== canonical 모양 ==")
            for k, v in canon_shape.most_common(10):
                print(f"  {v:>4}  {k}")
            print("== 상품 주소(완성형 · \\/ 복원 뒤) ==")
            for k, v in sorted(full_kinds.items()):
                print(f"  {k:<32} {v}")
            print("== JSON-LD 종류 ==", ld_types.most_common(10))
            print("== JSON-LD 칸(상위 30) ==")
            for k, v in ld_keys.most_common(30):
                print(f"  {v:>4}  {k}")
            print("== 가격·카테고리·상품 관련 meta 이름(상위 30) ==")
            for k, v in meta_names.most_common(30):
                print(f"  {v:>4}  {k}")
            print("== 가려진 안내 글자(blind · 50건 이상 · 상위 30) ==")
            for k, v in blind.most_common(30):
                if v >= 50:
                    print(f"  {v:>4}  {k}")
            print("== 상태 안에서 본 상품 번호가 들어 있는 자리(상위 15) ==")
            for k, v in own_paths.most_common(15):
                print(f"  {v:>4}  {k}")
            PY
      - name: 로직분석 결과값 전수조사 4차 — PRELOADED 자리 (읽기 전용)
        if: ${{ github.event.inputs.analysis_audit == 'preload' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 240s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            # 전수조사 4차 — 저장된 상세 HTML 의 __PRELOADED_STATE__ 안에서
            # 판매가·카테고리·상품 번호·스토어 주소가 **어느 자리에** 있는지 (읽기 전용 · 칸 이름·건수·모양만)
            import sqlite3, re, sys, json, collections, os
            sys.path.insert(0, "/app")
            try:
                from detail_html_store import _unpack
            except Exception:
                _unpack = lambda x: x if isinstance(x, str) else (x or b"").decode("utf-8", "ignore")

            DB = os.environ.get("PROBE_DB", "file:/app/data/logic_data.db?mode=ro")
            c = sqlite3.connect(DB, uri=True, timeout=20)

            CODE_RE = re.compile(r'window\.__PRELOADED_STATE__\s*=\s*({.+?})\s*;?\s*</script>', re.DOTALL)
            START_RE = re.compile(r'__PRELOADED_STATE__\s*=\s*')
            KEY_OK = re.compile(r'^[A-Za-z_][A-Za-z0-9_]{0,40}$')

            PRICE = {"salePrice", "discountedSalePrice", "dispSalePrice", "dispDiscountedSalePrice",
                     "mobileDiscountedSalePrice", "pcDiscountedSalePrice", "benefitsDiscountedSalePrice"}
            CAT = {"wholeCategoryName", "wholeCategoryId", "categoryName", "categoryId", "category1Name", "lastCategoryName"}
            PID = {"productNo", "channelProductNo", "originProductNo", "productId", "id"}
            URLK = re.compile(r'url$', re.I)
            WISH = {"wishCount", "zzimCount", "keepCount"}
            REV = {"totalReviewCount", "reviewCount", "averageReviewScore", "reviewScore"}


            def mkey(k):
                k = str(k)
                if k.isdigit():
                    return "{n}"
                return k if KEY_OK.match(k) else "{k}"


            def shape(u):
                u = str(u).split("?")[0].split("#")[0]
                m = re.match(r'(?:https?:)?//([^/]+)(/.*)?$', u)
                if not m:
                    return "(상대/기타:" + ("/" if u.startswith("/") else "") + ")"
                host, path = m.group(1), m.group(2) or ""
                segs = []
                for s in path.split("/")[1:]:
                    if not s:
                        continue
                    segs.append("{n}" if s.isdigit() else (s if s in ("products", "main", "category", "profile") else "{x}"))
                return host + "/" + "/".join(segs)


            def walk(o, path, depth, out):
                if depth > 9:
                    return
                if isinstance(o, dict):
                    for k, v in o.items():
                        p = path + "." + mkey(k) if path else mkey(k)
                        leaf = str(k)
                        if leaf in PRICE:
                            ok = isinstance(v, (int, float)) and 100 <= v <= 100_000_000
                            out["price"].add((p, "숫자(범위 안)" if ok else type(v).__name__))
                        elif leaf in CAT:
                            out["cat"].add((p, ("글자·'>'포함" if isinstance(v, str) and ">" in v else type(v).__name__)))
                        elif leaf in PID and depth <= 5:
                            good = (isinstance(v, int) and v > 0) or (isinstance(v, str) and v.isdigit())
                            out["pid"].add((p, "숫자" if good else type(v).__name__))
                        elif leaf in WISH:
                            out["wish"].add((p, type(v).__name__))
                        elif leaf in REV:
                            out["rev"].add((p, type(v).__name__))
                        if URLK.search(leaf) and isinstance(v, str) and v:
                            out["url"].add((p, shape(v)))
                        if isinstance(v, (dict, list)):
                            walk(v, p, depth + 1, out)
                elif isinstance(o, list):
                    for v in o[:5]:
                        walk(v, path + "[]", depth + 1, out)


            IDENT = re.compile(r'[A-Za-z_$][A-Za-z0-9_$]*')
            JS_TOK = {"undefined", "NaN", "Infinity", "true", "false", "null", "new", "function", "void"}


            def tok_at(txt, pos):
                frag = txt[pos:pos + 16]
                m = IDENT.match(frag)
                if m:
                    return m.group(0) if m.group(0) in JS_TOK else "{식별자}"
                ch = frag[:1]
                if not ch:
                    return "{끝}"
                return repr(ch) if ord(ch) < 128 else "{비ASCII}"


            UNDEF = re.compile(r'(?<=[:\[,])(\s*)undefined\b')


            def sanitize(t):
                t = UNDEF.sub(r'\1null', t)
                t = re.sub(r'new Date\(([^)]*)\)', r'"\1"', t)
                return t


            n = 0
            stat = collections.Counter()
            errtok = collections.Counter()
            agg = {g: collections.Counter() for g in ("price", "cat", "pid", "url", "wish", "rev")}
            top_keys = collections.Counter()
            raw_pid = collections.Counter()
            build = collections.Counter()
            for (html,) in c.execute("SELECT html FROM client_detail_html"):
                h = _unpack(html) or ""
                if len(h) < 100:
                    continue
                n += 1
                # ③ 재료 — HTML 글자 그대로에서 상품 번호·스토어 주소 (해석 성공과 무관하게 센다)
                pids = set(re.findall(r'"productNo"\s*:\s*"?(\d{6,})"?', h))
                raw_pid["productNo 값 종류 " + ("0" if not pids else ("1" if len(pids) == 1 else "2+"))] += 1
                slugs = collections.Counter(re.findall(r'(?:https?:)?//(?:m\.)?smartstore\.naver\.com/([A-Za-z0-9_-]+)', h))
                bslugs = collections.Counter(re.findall(r'(?:https?:)?//(?:m\.)?brand\.naver\.com/([A-Za-z0-9_-]+)', h))
                for bad in ("main", "inflow", "i", "category", "products", "search", "profile"):
                    slugs.pop(bad, None); bslugs.pop(bad, None)
                build["스마트스토어 주소 슬러그 있음" if slugs else ("브랜드스토어 주소 슬러그 있음" if bslugs else "스토어 주소 슬러그 없음")] += 1
                build["슬러그 종류 " + ("0" if not (slugs or bslugs) else ("1" if len(slugs) + len(bslugs) == 1 else "2+"))] += 1
                full = collections.Counter(x.split("?")[0] for x in re.findall(r'https?://(?:m\.)?(?:smartstore|brand)\.naver\.com/[A-Za-z0-9_-]+/products/\d+', h))
                build["상품 주소 완성형 " + ("0회" if not full else ("1회" if full.most_common(1)[0][1] == 1 else "2회+"))] += 1
                build["완성형 속 번호 = productNo " + ("예" if full and pids and any(u.rsplit('/', 1)[-1] in pids for u in full) else ("완성형 없음" if not full else "아니오"))] += 1
                if "__PRELOADED_STATE__" not in h:
                    stat["PRELOADED 글자 없음"] += 1
                    continue
                m = CODE_RE.search(h)
                st = None
                txt = None
                if m:
                    txt = m.group(1)
                    try:
                        st = json.loads(txt); stat["지금 코드 정규식+json 성공"] += 1
                    except json.JSONDecodeError as e:
                        stat["지금 코드 정규식 맞음·json 실패"] += 1
                        errtok[tok_at(txt, e.pos)] += 1
                else:
                    stat["지금 코드 정규식 안 맞음"] += 1
                if st is None and txt is not None:
                    try:
                        st = json.loads(sanitize(txt)); stat["undefined→null 치환 뒤 성공"] += 1
                    except json.JSONDecodeError as e:
                        stat["치환 뒤에도 실패"] += 1
                        errtok["(치환 뒤) " + tok_at(sanitize(txt), e.pos)] += 1
                if not isinstance(st, dict):
                    continue
                for k in list(st.keys())[:60]:
                    top_keys[mkey(k)] += 1
                out = {g: set() for g in agg}
                walk(st, "", 0, out)
                for g in agg:
                    for t in out[g]:
                        agg[g][t] += 1

            print(f"== 저장 HTML {n}건 — __PRELOADED_STATE__ 읽기 ==")
            for k, v in stat.most_common():
                print(f"  {k:<44} {v}")
            print("  json 이 막힌 자리의 글자:", errtok.most_common(12))
            print("  최상위 키(상위 20):", top_keys.most_common(20))
            for g, title in (("price", "판매가 자리"), ("cat", "카테고리 자리"), ("pid", "상품 번호 자리(깊이 5 이내)"),
                             ("url", "주소 칸 자리·모양"), ("wish", "찜 자리"), ("rev", "리뷰 자리")):
                print(f"== {title} (문서 수 · 상위 14) ==")
                for (p, t), v in agg[g].most_common(14):
                    print(f"  {v:>4}  {p}  [{t}]")
            print("== ③ 재료 (HTML 글자) ==")
            for k, v in sorted(raw_pid.items()):
                print(f"  {k:<36} {v}")
            for k, v in sorted(build.items()):
                print(f"  {k:<36} {v}")
            PY

