name: NAVER 백업 상태 읽기 전용 확인

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-logic-analysis
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 대표 계정·main·신뢰한 호스트 확인
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
          HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$TRIGGERING_ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$REF" != refs/heads/main ]; then echo MAIN_REQUIRED; exit 1; fi
          if [ "$ATTEMPT" != 1 ]; then echo FIRST_ATTEMPT_REQUIRED; exit 1; fi
          if ! [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then echo TRUSTED_HOST_FINGERPRINT_REQUIRED; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 읽기 진단 도구 합성 검사
        run: python -I -B -m unittest discover -s deploy/naver/tests -p 'test_backup_status*.py' -v
      - name: 검사한 helper 한 파일 준비
        run: |
          set -euo pipefail
          mkdir -m 755 backup-status-ship
          cp deploy/naver/backup_status.py backup-status-ship/
          sudo chown 0:0 backup-status-ship/backup_status.py
          sudo chmod 644 backup-status-ship/backup_status.py
          echo "NBS_SHA=$(sha256sum backup-status-ship/backup_status.py | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NBS_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: 관리자 전용 임시 폴더 준비
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        id: prepare_remote
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NBS_RUN
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NBS_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            [ -d /tmp ]
            [ ! -L /tmp ]
            umask 077
            mkdir "/tmp/metainc-naver-backup-status-$NBS_RUN"
      - name: 공개 helper 한 파일만 전송
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 45s
          source: backup-status-ship/backup_status.py
          target: /tmp/metainc-naver-backup-status-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: false
      - name: 고정 상태와 파일 metadata만 읽고 닫힌 결과 검증
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NBS_RUN,NBS_SHA
          command_timeout: 5m
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NBS_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            printf '%s' "$NBS_SHA" | grep -Eq '^[0-9a-f]{64}$'
            incoming="/tmp/metainc-naver-backup-status-$NBS_RUN"
            helper="$incoming/backup_status.py"
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            trap 'rm -f -- "$helper" 2>/dev/null; rmdir -- "$incoming" 2>/dev/null || true' EXIT
            [ -f "$helper" ]
            [ ! -L "$helper" ]
            [ "$(stat -c '%u:%h:%a' "$helper")" = 0:1:644 ]
            [ "$(sha256sum "$helper" | cut -d' ' -f1)" = "$NBS_SHA" ]
            rc=0
            out=$(python3 -I -B "$helper" 2>/dev/null) || rc=$?
            case "$rc" in 0|2) ;; *) echo NAVER_BACKUP_STATUS_FAILED; exit 1 ;; esac
            printf '%s' "$out" | python3 -I -B -c '
            import hashlib,json,os,stat,sys
            path,expected,rc=sys.argv[1:]
            fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)
            try:
                before=os.fstat(fd)
                assert stat.S_ISREG(before.st_mode) and before.st_uid==0 and before.st_nlink==1
                code=os.read(fd,131073)
                assert len(code)<=131072 and hashlib.sha256(code).hexdigest()==expected
                after=os.fstat(fd)
                assert (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns)
            finally: os.close(fd)
            ns={"__name__":"closed_result_validator"};exec(compile(code,path,"exec"),ns)
            raw=sys.stdin.buffer.read(32769)
            assert 0<len(raw)<=32768 and b"\n" not in raw
            value=ns["strict_json"](raw);ns["validate_report"](value)
            assert (rc=="0" and value["status"] in ("observed","partial")) or (rc=="2" and value["status"]=="unavailable")
            ' "$helper" "$NBS_SHA" "$rc" 2>/dev/null || { echo NAVER_BACKUP_STATUS_OUTPUT_REFUSED; exit 1; }
            printf 'NAVER_BACKUP_STATUS_RESULT=%s\n' "$out"
            exit "$rc"
      - name: 이번 helper와 빈 임시 폴더만 정리
        if: always() && steps.prepare_remote.outcome == 'success'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NBS_RUN
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NBS_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            incoming="/tmp/metainc-naver-backup-status-$NBS_RUN"
            helper="$incoming/backup_status.py"
            if [ ! -e "$incoming" ] && [ ! -L "$incoming" ]; then exit 0; fi
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            if [ -e "$helper" ] || [ -L "$helper" ]; then
              [ -f "$helper" ]
              [ ! -L "$helper" ]
              [ "$(stat -c '%u:%h:%a' "$helper")" = 0:1:644 ]
              rm -f -- "$helper" 2>/dev/null
            fi
            if ! rmdir -- "$incoming" 2>/dev/null; then echo NAVER_BACKUP_STATUS_CLEANUP_INCOMPLETE; exit 1; fi
