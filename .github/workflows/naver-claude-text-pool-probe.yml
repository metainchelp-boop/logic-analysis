name: Claude 텍스트 풀 형식 1회 검증
on:
  push:
    branches: [codex/naver-claude-reference-ops-20261011]
  workflow_dispatch:
    inputs:
      confirm:
        description: '기존 모델과 키로 합성 텍스트 풀 형식 1회 요청. 보고서 및 광고 변경 없음.'
        required: true
        default: RUN_ONE_TEXT_POOL
permissions:
  contents: read
  actions: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 고정 요청 및 비밀 비노출 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_claude_text_pool_probe test_naver_claude_text_pool_probe_host -v
  one-shot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ad-deploy-prep-20261001' && inputs.confirm == 'RUN_ONE_TEXT_POOL'
    needs: synthetic
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 정확한 소스 전체 native 성공 및 고정 프로그램 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,hashlib,json,os,pathlib,subprocess,sys
          sys.path.insert(0,'backend/tools')
          runs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/naver-product-export-tests.yml/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=10']))['workflow_runs']
          candidates=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['head_branch']=='codex/naver-claude-reference-ops-20261011' and r['status']=='completed' and r['conclusion']=='success']
          if not candidates:raise SystemExit('EXACT_NATIVE_SUCCESS_REQUIRED')
          core=pathlib.Path('backend/tools/naver_claude_text_pool_probe.py').read_bytes()
          pins=pathlib.Path('backend/tools/naver_claude_minimal_probe_pins.json').read_bytes()
          host=pathlib.Path('backend/tools/naver_claude_text_pool_probe_host.py').read_bytes()
          if hashlib.sha256(host).hexdigest()!='f4833829667964bd66689f638cb238731cc3dba878dba65ba9fab676d357ec11':raise SystemExit('HOST_SOURCE_CHANGED')
          import naver_claude_text_pool_probe_host as H
          H.script(core,json.loads(pins))
          package=json.dumps({'host':base64.b64encode(host).decode(),'core':base64.b64encode(core).decode(),'pins':json.loads(pins)},separators=(',',':')).encode()
          if len(package)>65536:raise SystemExit('PACKAGE_SIZE')
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('CLAUDE_TEXT_POOL_PROBE_B64='+base64.b64encode(package).decode()+'\n')
          print('NATIVE_GATE='+json.dumps({'head_sha':os.environ['GITHUB_SHA'],'native_run_id':candidates[0]['id'],'status':'success'}))
          PYCODE
      - name: 실행 중인 엔진에서 합성 텍스트 풀 형식 정확 1회
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          CLAUDE_TEXT_POOL_PROBE_B64: ${{ env.CLAUDE_TEXT_POOL_PROBE_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CLAUDE_TEXT_POOL_PROBE_B64
          command_timeout: 2m
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PYCODE'
            import base64,hashlib,json,os,types
            result={'ok':False,'stage':'host-failed','provider_calls':None}
            try:
                wire=os.environ.pop('CLAUDE_TEXT_POOL_PROBE_B64')
                if len(wire)>90000:raise ValueError('WIRE_SIZE')
                raw=base64.b64decode(wire,validate=True)
                if len(raw)>65536:raise ValueError('PACKAGE_SIZE')
                package=json.loads(raw)
                if type(package) is not dict or set(package)!={'host','core','pins'}:raise ValueError('PACKAGE_SHAPE')
                host=base64.b64decode(package['host'],validate=True)
                if hashlib.sha256(host).hexdigest()!='f4833829667964bd66689f638cb238731cc3dba878dba65ba9fab676d357ec11':raise ValueError('HOST_SOURCE_CHANGED')
                module=types.ModuleType('fixed_claude_probe_host');exec(compile(host,'fixed_claude_probe_host','exec'),module.__dict__)
                os.environ.clear();os.environ.update(PATH='/usr/sbin:/usr/bin:/sbin:/bin',LANG='C')
                result=module.run(base64.b64decode(package['core'],validate=True),package['pins'])
            except Exception:
                pass
            print('NAVER_CLAUDE_TEXT_POOL_PROBE_V1='+json.dumps(result,sort_keys=True,allow_nan=False))
            PYCODE
