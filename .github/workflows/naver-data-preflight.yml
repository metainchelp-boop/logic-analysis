name: 세 앱 자료 보존 전 범위 관찰 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      ad_container_id:
        description: '같은 app-inventory의 광고센터 전체 ID'
        required: true
        type: string
        default: '6f37ec7da0dea75b4630fd177ff0f51ae0087e6b310d68df5a6e6803c015890f'
      ad_init_pid:
        description: '같은 관찰의 광고센터 호스트 init PID'
        required: true
        type: string
        default: '1679637'
      content_container_id:
        description: '같은 app-inventory의 콘텐츠 전체 ID'
        required: true
        type: string
        default: '740ea62adf12d41571a1297ea4bb623ca62177f1c4def4d2c290f7b5ee07c9b5'
      content_init_pid:
        description: '같은 관찰의 콘텐츠 호스트 init PID'
        required: true
        type: string
        default: '1669091'

permissions:
  contents: read

concurrency:
  group: naver-retirement-data-preflight
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 대표 계정·main·새 대상·신뢰한 호스트 확인
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          AD_ID: ${{ inputs.ad_container_id }}
          AD_PID: ${{ inputs.ad_init_pid }}
          CONTENT_ID: ${{ inputs.content_container_id }}
          CONTENT_PID: ${{ inputs.content_init_pid }}
          HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$TRIGGERING_ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$REF" != refs/heads/main ]; then echo MAIN_REQUIRED; exit 1; fi
          for target in "$AD_ID" "$CONTENT_ID"; do
            if ! [[ "$target" =~ ^[0-9a-f]{64}$ ]]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          done
          if [ "$AD_ID" = "$CONTENT_ID" ]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          for target in "$AD_PID" "$CONTENT_PID"; do
            if ! [[ "$target" =~ ^[1-9][0-9]{0,9}$ ]]; then echo TARGET_FORMAT_INVALID; exit 1; fi
            if [ "$target" -gt 4294967295 ]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          done
          if [ "$AD_PID" = "$CONTENT_PID" ]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          if ! [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then echo TRUSTED_HOST_FINGERPRINT_REQUIRED; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 자료 preflight 합성 검사 (DB·키·서버 없음)
        # 전체 회귀는 정확한 PR 커밋 CI에서 실행한다.
        run: python -I -B -m unittest discover -s deploy/naver/tests -p 'test_retirement_data*.py' -v
      - name: 검사한 공개 helper 한 파일 준비
        run: |
          set -euo pipefail
          umask 077
          mkdir data-preflight-ship
          cp deploy/naver/retirement_data_preflight.py data-preflight-ship/
          # drone-scp UID1000이 읽을 수 있는 공개 사본이며 원격에서만 0700/0600으로 제한한다.
          chmod 755 data-preflight-ship
          chmod 644 data-preflight-ship/retirement_data_preflight.py
          echo "NRD_SHA=$(sha256sum data-preflight-ship/retirement_data_preflight.py | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NRD_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: 실행별 관리자 전용 임시 폴더 준비
        id: prepare_remote
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NRD_RUN
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NRD_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            [ -d /tmp ]
            [ ! -L /tmp ]
            [ "$(stat -c '%u' /tmp)" = 0 ]
            umask 077
            mkdir "/tmp/metainc-data-preflight-$NRD_RUN"
      - name: 공개 helper 한 파일만 전송
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 45s
          source: data-preflight-ship/retirement_data_preflight.py
          target: /tmp/metainc-data-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: false
      - name: 고정 범위만 읽고 공개 JSON 계약 재검증
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          NRD_AD: ${{ inputs.ad_container_id }}
          NRD_AD_PID: ${{ inputs.ad_init_pid }}
          NRD_CONTENT: ${{ inputs.content_container_id }}
          NRD_CONTENT_PID: ${{ inputs.content_init_pid }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NRD_RUN,NRD_SHA,NRD_AD,NRD_AD_PID,NRD_CONTENT,NRD_CONTENT_PID
          command_timeout: 110s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NRD_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            printf '%s' "$NRD_SHA" | grep -Eq '^[0-9a-f]{64}$'
            for target in "$NRD_AD" "$NRD_CONTENT"; do printf '%s' "$target" | grep -Eq '^[0-9a-f]{64}$'; done
            [ "$NRD_AD" != "$NRD_CONTENT" ]
            for target in "$NRD_AD_PID" "$NRD_CONTENT_PID"; do
              printf '%s' "$target" | grep -Eq '^[1-9][0-9]{0,9}$'
              [ "$target" -le 4294967295 ]
            done
            [ "$NRD_AD_PID" != "$NRD_CONTENT_PID" ]
            incoming="/tmp/metainc-data-preflight-$NRD_RUN"
            helper="$incoming/retirement_data_preflight.py"
            [ -d /tmp ]
            [ ! -L /tmp ]
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            [ -f "$helper" ]
            [ ! -L "$helper" ]
            [ "$(stat -c '%h' "$helper")" = 1 ]
            chown 0:0 -- "$helper"
            chmod 600 "$helper"
            [ "$(stat -c '%u:%a:%h' "$helper")" = 0:600:1 ]
            [ "$(sha256sum "$helper" | cut -d' ' -f1)" = "$NRD_SHA" ]
            rc=0
            out=$(timeout -k 5s 80s python3 -I -B "$helper" --ad-container-id "$NRD_AD" --ad-init-pid "$NRD_AD_PID" --content-container-id "$NRD_CONTENT" --content-init-pid "$NRD_CONTENT_PID" 2>/dev/null) || rc=$?
            case "$rc" in 0|2) ;; *) echo RETIREMENT_DATA_PREFLIGHT_FAILED; exit 1 ;; esac
            if ! printf '%s' "$out" | python3 -I -B -c '
            import json,sys
            def unique(pairs):
                result={}
                for key,value in pairs:
                    if key in result:raise ValueError()
                    result[key]=value
                return result
            def require(test):
                if not test:raise ValueError()
            def count(value,maximum=18446744073709551615):
                require(type(value) is int and 0<=value<=maximum)
            def fields(value,keys):
                require(isinstance(value,dict) and set(value)==set(keys.split()))
            def metadata(value):
                fields(value,"device inode mode uid gid links bytes")
                for number in value.values():count(number)
                count(value["mode"],4095)
            def tree(value,alias=False):
                fields(value,"files directories bytes blocks_bytes directory_identity"+(" alias" if alias else ""))
                for name in ("files","directories","bytes","blocks_bytes"):count(value[name])
                count(value["files"],100000);count(value["directories"],100000)
                metadata(value["directory_identity"])
                if alias:require(value["alias"] in {"ad","content","autobid"})
            try:
                raw=sys.stdin.buffer.read(65537)
                require(0<len(raw)<=65536 and len(raw.splitlines())==1 and b"root" not in raw)
                data=json.loads(raw,object_pairs_hook=unique,parse_constant=lambda x:(_ for _ in ()).throw(ValueError()))
                require(isinstance(data,dict))
                minimal={"status","error","read_only","stop_safety"}
                full=minimal|{"runtime_selection","data_sets","candidates","host","routes","checks"}
                require(set(data)==minimal or set(data) in (full,full|{"tmp"}))
                require(data["status"] in {"coverage_complete","incomplete"} and data["read_only"] is True and data["stop_safety"]=="not_determined")
                success=data["status"]=="coverage_complete"
                require(success==(sys.argv[1]=="0"))
                errors={"autobid_container_present","candidate_uncovered","command_failed","command_limit","container_changed","cwd_unconfirmed","database_driver_or_path_uncovered","database_path_uncovered","db_config_ambiguous","deleted_limit","deleted_ref_limit","depth_limit","fd_changed","fd_limit","fd_metadata_invalid","fd_set_changed","file_count_limit","filesystem_boundary","hardlink_unresolved","invalid_metadata","link_or_special_uncovered","maps_changed","maps_invalid","mount_identity_mismatch","mount_unconfirmed","mount_uncovered","namespace_changed","observation_failed","output_limit","path_changed","path_uncovered","pid_limit","pid_set_changed","pid_visibility_limit","pid_visibility_incomplete","relevant_file_changed","relevant_process_changed","privilege_required","process_changed","process_identity_invalid","process_or_fd_changed","read_limit","request_or_deadline_refused","request_refused","source_unreviewed","time_limit","tree_changed","unsafe_directory","unsafe_file","volume_uncovered","worker_changed","workers_unconfirmed","writers_unresolved"}
                require(data["error"] is None if success else data["error"] in errors)
                if set(data)!=minimal:
                    require(data["runtime_selection"]=="not_proven")
                    checks={"container_mount_volume","reviewed_route_sources","route_coverage","tree_coverage","host_scan","final_guards"}
                    require(isinstance(data["checks"],dict) and set(data["checks"])<=checks and all(v is True for v in data["checks"].values()))
                    require(isinstance(data["data_sets"],list) and len(data["data_sets"])<=3)
                    seen=set()
                    for value in data["data_sets"]:
                        tree(value,True);require(value["alias"] not in seen);seen.add(value["alias"])
                    if "tmp" in data:tree(data["tmp"])
                    require(isinstance(data["candidates"],list) and len(data["candidates"])<=32)
                    aliases=set()
                    for value in data["candidates"]:
                        require(isinstance(value,dict) and value.get("status") in {"absent","present"})
                        count(value["alias"],32);require(value["alias"]>=1 and value["alias"] not in aliases);aliases.add(value["alias"])
                        if value["status"]=="absent":fields(value,"alias status")
                        else:
                            fields(value,"alias status device inode mode uid gid links bytes")
                            metadata({k:v for k,v in value.items() if k not in {"alias","status"}})
                    routes=data["routes"]
                    if routes is not None:
                        fields(routes,"configured_routes fallback_routes coverage runtime_selection")
                        require(type(routes["configured_routes"]) is int and routes["configured_routes"]==11 and type(routes["fallback_routes"]) is int and routes["fallback_routes"]==6)
                        require(routes["coverage"]=="configured_and_all_known_fallbacks_covered" and routes["runtime_selection"]=="not_proven")
                    host=data["host"]
                    if host is not None:
                        keys={"pids","fds","shared_writable_maps","covered_writable_fds","covered_shared_writable_maps","external_writers","target_uncovered_writers","exited_pids","deleted_identities","deleted_unique_count","content_deleted_unique_count","prior_four_zero_pattern_matches","host_passes","unrelated_fd_changes","unrelated_mapping_changes","unrelated_process_changes","late_processes_scanned"}
                        require(isinstance(host,dict) and set(host) in (keys,keys|{"readonly_observer_pid"}))
                        for name in keys-{"deleted_identities","prior_four_zero_pattern_matches"}:count(host[name])
                        count(host["pids"],4096);count(host["fds"],131072);count(host["deleted_unique_count"],64);require(host["host_passes"]==2);count(host["late_processes_scanned"],64)
                        require(type(host["prior_four_zero_pattern_matches"]) is bool)
                        if "readonly_observer_pid" in host:count(host["readonly_observer_pid"],4294967295);require(host["readonly_observer_pid"]>0)
                        require(isinstance(host["deleted_identities"],list) and len(host["deleted_identities"])==host["deleted_unique_count"])
                        references=0
                        for value in host["deleted_identities"]:
                            fields(value,"device inode mode uid gid links bytes mount_id writable app references heartbeat_path_compatible memory_backed_hint readonly_hint")
                            metadata({k:v for k,v in value.items() if k in {"device","inode","mode","uid","gid","links","bytes"}})
                            count(value["mount_id"]);count(value["references"],256);require(value["references"]>0 and value["links"]==0)
                            references+=value["references"]
                            require(value["app"] in {"ad","content","shared"})
                            for name in ("writable","heartbeat_path_compatible","memory_backed_hint","readonly_hint"):require(type(value[name]) is bool)
                        require(references<=256 and host["content_deleted_unique_count"]<=host["deleted_unique_count"])
                    if success:
                        require(set(data["checks"])==checks and seen=={"ad","content","autobid"} and "tmp" in data and len(aliases)==32 and routes is not None and host is not None)
                        require(host["external_writers"]==host["target_uncovered_writers"]==0)
                else:require(not success)
                print("NAVER_RETIREMENT_DATA_PREFLIGHT="+json.dumps(data,sort_keys=True,separators=(",",":")))
            except Exception:raise SystemExit(1)
            ' "$rc" 2>/dev/null; then echo RETIREMENT_DATA_PREFLIGHT_OUTPUT_REFUSED; exit 1; fi
            exit "$rc"
      - name: 이번 공개 helper와 빈 임시 폴더만 정리
        if: always() && steps.prepare_remote.outcome == 'success'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NRD_RUN,NRD_SHA
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NRD_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            printf '%s' "$NRD_SHA" | grep -Eq '^[0-9a-f]{64}$'
            incoming="/tmp/metainc-data-preflight-$NRD_RUN"
            helper="$incoming/retirement_data_preflight.py"
            [ -d /tmp ]
            [ ! -L /tmp ]
            if [ ! -e "$incoming" ] && [ ! -L "$incoming" ]; then exit 0; fi
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            if [ -e "$helper" ] || [ -L "$helper" ]; then
              [ -f "$helper" ]
              [ ! -L "$helper" ]
              [ "$(stat -c '%h' "$helper")" = 1 ]
              [ "$(sha256sum "$helper" | cut -d' ' -f1)" = "$NRD_SHA" ]
              rm -f -- "$helper" 2>/dev/null
            fi
            if ! rmdir -- "$incoming" 2>/dev/null; then echo RETIREMENT_DATA_PREFLIGHT_CLEANUP_INCOMPLETE; exit 1; fi
