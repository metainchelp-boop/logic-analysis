name: 앱 철거 nginx·재기동 통제 관찰 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      ad_container_id:
        description: '같은 app-inventory의 광고센터 전체 ID'
        required: true
        type: string
        default: '6f37ec7da0dea75b4630fd177ff0f51ae0087e6b310d68df5a6e6803c015890f'
      ad_init_pid:
        description: '같은 관찰의 광고센터 호스트 init PID'
        required: true
        type: string
        default: '1679637'
      content_container_id:
        description: '같은 app-inventory의 콘텐츠 전체 ID'
        required: true
        type: string
        default: '740ea62adf12d41571a1297ea4bb623ca62177f1c4def4d2c290f7b5ee07c9b5'
      content_init_pid:
        description: '같은 관찰의 콘텐츠 호스트 init PID'
        required: true
        type: string
        default: '1669091'

permissions:
  contents: read

concurrency:
  group: naver-retirement-control-preflight
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 대표 계정·main·새 대상·신뢰한 호스트 확인
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          AD_ID: ${{ inputs.ad_container_id }}
          AD_PID: ${{ inputs.ad_init_pid }}
          CONTENT_ID: ${{ inputs.content_container_id }}
          CONTENT_PID: ${{ inputs.content_init_pid }}
          HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$TRIGGERING_ACTOR" != metainchelp-boop ]; then echo ACTOR_NOT_AUTHORIZED; exit 1; fi
          if [ "$REF" != refs/heads/main ]; then echo MAIN_REQUIRED; exit 1; fi
          for target in "$AD_ID" "$CONTENT_ID"; do
            if ! [[ "$target" =~ ^[0-9a-f]{64}$ ]]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          done
          if [ "$AD_ID" = "$CONTENT_ID" ]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          for target in "$AD_PID" "$CONTENT_PID"; do
            if ! [[ "$target" =~ ^[1-9][0-9]{0,9}$ ]]; then echo TARGET_FORMAT_INVALID; exit 1; fi
            if [ "$target" -gt 4294967295 ]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          done
          if [ "$AD_PID" = "$CONTENT_PID" ]; then echo TARGET_FORMAT_INVALID; exit 1; fi
          if ! [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then echo TRUSTED_HOST_FINGERPRINT_REQUIRED; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 통제 preflight 합성 검사 (DB·키·서버 없음)
        # 전체 회귀는 정확한 PR 커밋 CI에서 실행한다.
        run: python -I -B -m unittest discover -s deploy/naver/tests -p 'test_retirement_control*.py' -v
      - name: 검사한 공개 helper 한 파일 준비
        run: |
          set -euo pipefail
          umask 077
          mkdir control-preflight-ship
          cp deploy/naver/retirement_control_preflight.py control-preflight-ship/
          # drone-scp UID1000이 읽을 수 있는 공개 사본이며 원격에서만 0700/0600으로 제한한다.
          chmod 755 control-preflight-ship
          chmod 644 control-preflight-ship/retirement_control_preflight.py
          echo "NRC_SHA=$(sha256sum control-preflight-ship/retirement_control_preflight.py | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "NRC_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: 실행별 관리자 전용 임시 폴더 준비
        id: prepare_remote
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NRC_RUN
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NRC_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            [ -d /tmp ]
            [ ! -L /tmp ]
            [ "$(stat -c '%u' /tmp)" = 0 ]
            umask 077
            mkdir "/tmp/metainc-control-preflight-$NRC_RUN"
      - name: 공개 helper 한 파일만 전송
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 45s
          source: control-preflight-ship/retirement_control_preflight.py
          target: /tmp/metainc-control-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: false
      - name: 고정 범위만 읽고 공개 JSON 계약 재검증
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          NRC_AD: ${{ inputs.ad_container_id }}
          NRC_AD_PID: ${{ inputs.ad_init_pid }}
          NRC_CONTENT: ${{ inputs.content_container_id }}
          NRC_CONTENT_PID: ${{ inputs.content_init_pid }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NRC_RUN,NRC_SHA,NRC_AD,NRC_AD_PID,NRC_CONTENT,NRC_CONTENT_PID
          command_timeout: 110s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NRC_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            printf '%s' "$NRC_SHA" | grep -Eq '^[0-9a-f]{64}$'
            for target in "$NRC_AD" "$NRC_CONTENT"; do printf '%s' "$target" | grep -Eq '^[0-9a-f]{64}$'; done
            [ "$NRC_AD" != "$NRC_CONTENT" ]
            for target in "$NRC_AD_PID" "$NRC_CONTENT_PID"; do
              printf '%s' "$target" | grep -Eq '^[1-9][0-9]{0,9}$'
              [ "$target" -le 4294967295 ]
            done
            [ "$NRC_AD_PID" != "$NRC_CONTENT_PID" ]
            incoming="/tmp/metainc-control-preflight-$NRC_RUN"
            helper="$incoming/retirement_control_preflight.py"
            [ -d /tmp ]
            [ ! -L /tmp ]
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            [ -f "$helper" ]
            [ ! -L "$helper" ]
            [ "$(stat -c '%h' "$helper")" = 1 ]
            chown 0:0 -- "$helper"
            chmod 600 "$helper"
            [ "$(stat -c '%u:%a:%h' "$helper")" = 0:600:1 ]
            [ "$(sha256sum "$helper" | cut -d' ' -f1)" = "$NRC_SHA" ]
            rc=0
            out=$(timeout -k 5s 80s python3 -I -B "$helper" --ad-container-id "$NRC_AD" --ad-init-pid "$NRC_AD_PID" --content-container-id "$NRC_CONTENT" --content-init-pid "$NRC_CONTENT_PID" 2>/dev/null) || rc=$?
            case "$rc" in 0|2) ;; *) echo RETIREMENT_CONTROL_PREFLIGHT_FAILED; exit 1 ;; esac
            if ! printf '%s' "$out" | python3 -I -B -c '
            import json,re,sys
            from collections import Counter
            
            def require(test):
                if not test:raise ValueError()
            def unique(pairs):
                result={}
                for key,value in pairs:
                    require(key not in result);result[key]=value
                return result
            def fields(value,names):require(isinstance(value,dict) and set(value)==set(names.split()))
            def count(value,maximum=18446744073709551615):require(type(value) is int and 0<=value<=maximum)
            def digest(value):require(isinstance(value,str) and re.fullmatch("[0-9a-f]{64}",value))
            def config_path(value,enabled=False):
                require(isinstance(value,str) and re.fullmatch("/etc/nginx/sites-"+("enabled" if enabled else "(?:enabled|available)")+"/[A-Za-z0-9._-]{1,96}",value))
                require(value.rsplit("/",1)[1] not in {".",".."})
            def span(value,size,allowed):
                fields(value,"modifier path start end sha256")
                require((value["modifier"],value["path"]) in allowed)
                count(value["start"],size);count(value["end"],size);require(value["start"]<value["end"]);digest(value["sha256"])
            try:
                raw=sys.stdin.buffer.read(65537)
                require(0<len(raw)<=65536 and len(raw.splitlines())==1 and b"root" not in raw)
                data=json.loads(raw,object_pairs_hook=unique,parse_constant=lambda _:(_ for _ in ()).throw(ValueError()))
                minimal={"status","error","read_only","changes_applied"}
                full=minimal|{"routing_scope","startup_scope","loaded_config_verified","workflow_state_observed","files","containers"}
                require(isinstance(data,dict) and set(data) in (minimal,full))
                require(data["status"] in {"observed","incomplete"} and data["read_only"] is True and data["changes_applied"] is False)
                success=data["status"]=="observed"
                require(sys.argv[1] in {"0","2"} and success==(sys.argv[1]=="0"))
                errors={"docker_config_refused","nginx_syntax_unsupported", "candidate_total_limit", "vhost_names_unresolved", "location_unsupported", "path_refused", "file_refused", "relay_location_unresolved", "privilege_required", "output_limit", "studio_source_ambiguous", "nginx_token_limit", "symlink_refused", "observation_failed", "app_location_unresolved", "nginx_depth_limit", "container_inspect_failed", "vhost_ambiguous", "vhost_missing", "child_teardown_failed", "container_changed", "configuration_changed", "fixed_source_missing", "directory_refused", "command_limit", "file_limit", "time_limit", "candidate_set_changed", "request_refused", "basename_refused", "metadata_invalid", "path_changed", "restart_unconfirmed", "candidate_limit"}
                require(data["error"] is None if success else data["error"] in errors)
                if set(data)==minimal:require(not success)
                else:
                    require(data["routing_scope"]=="direct_selected_locations_only" and data["startup_scope"]=="known_controls_only" and
                            data["loaded_config_verified"] is False and data["workflow_state_observed"] is False)
                    require(isinstance(data["files"],list) and len(data["files"])<=3 and isinstance(data["containers"],list) and len(data["containers"])<=2)
                    seen=set();paths=set()
                    relay={("=","/naver"),("^~","/naver/"),("=","/api/naver-auto"),("^~","/api/naver-auto/")}
                    for row in data["files"]:
                        fields(row,"aliases enabled_paths resolved_path metadata sha256 locations protected_locations protected_bytes_sha256 matching_servers")
                        require(isinstance(row["aliases"],list) and 0<len(row["aliases"])<=3 and all(isinstance(v,str) and v in {"ad","logic","studio"} for v in row["aliases"]))
                        require(row["aliases"]==sorted(set(row["aliases"])) and not seen.intersection(row["aliases"]))
                        seen.update(row["aliases"])
                        config_path(row["resolved_path"]);require(row["resolved_path"] not in paths);paths.add(row["resolved_path"])
                        require(isinstance(row["enabled_paths"],list) and 0<len(row["enabled_paths"])<=3 and row["enabled_paths"]==sorted(set(row["enabled_paths"])))
                        for value in row["enabled_paths"]:config_path(value,True)
                        metadata=row["metadata"];fields(metadata,"device inode mode uid gid links bytes")
                        for number in metadata.values():count(number)
                        count(metadata["mode"],4095);count(metadata["bytes"],262144)
                        require(metadata["bytes"]>0 and metadata["uid"]==0 and metadata["links"]==1 and not metadata["mode"]&18)
                        digest(row["sha256"]);digest(row["protected_bytes_sha256"])
                        require(type(row["matching_servers"]) is int and row["matching_servers"]==len(row["aliases"]))
                        allowed={("", "/")} if set(row["aliases"]) & {"ad","studio"} else set()
                        if "logic" in row["aliases"]:allowed|={("", "/studio/"),("=", "/studio"),("", "/autobid/"),("=", "/autobid")}
                        require(isinstance(row["locations"],list) and 0<len(row["locations"])<=6)
                        previous=0;actual=Counter()
                        for value in row["locations"]:
                            span(value,metadata["bytes"],allowed);require(value["start"]>=previous);previous=value["end"]
                            key=(value["modifier"],value["path"]);actual[key]+=1
                        expected=Counter()
                        for alias in row["aliases"]:
                            expected.update({("", "/"):1} if alias in {"ad","studio"} else {("", "/studio/"):1,("=", "/studio"):1,("", "/autobid/"):1,("=", "/autobid"):1})
                        require(actual==expected)
                        require(isinstance(row["protected_locations"],list) and len(row["protected_locations"])==(4 if "ad" in row["aliases"] else 0))
                        actual=set()
                        for value in row["protected_locations"]:
                            span(value,metadata["bytes"],relay);key=(value["modifier"],value["path"]);require(key not in actual);actual.add(key)
                            require(all(value["end"]<=v["start"] or v["end"]<=value["start"] for v in row["locations"]))
                        require(actual==(relay if "ad" in row["aliases"] else set()))
                    aliases=set()
                    for row in data["containers"]:
                        fields(row,"alias pid paused restart_policy maximum_retry_count")
                        require(row["alias"] in {"ad","content"} and row["alias"] not in aliases);aliases.add(row["alias"])
                        count(row["pid"],4294967295);require(row["pid"]>0 and type(row["paused"]) is bool)
                        require(row["restart_policy"] in {"no","always","unless-stopped","on-failure"});count(row["maximum_retry_count"],4294967295)
                    if success:require(seen=={"ad","logic","studio"} and aliases=={"ad","content"})
                print("NAVER_RETIREMENT_CONTROL_PREFLIGHT="+json.dumps(data,sort_keys=True,separators=(",",":")))
            except Exception:raise SystemExit(1)
            ' "$rc" 2>/dev/null; then echo RETIREMENT_CONTROL_PREFLIGHT_OUTPUT_REFUSED; exit 1; fi
            exit "$rc"
      - name: 이번 공개 helper와 빈 임시 폴더만 정리
        if: always() && steps.prepare_remote.outcome == 'success'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: NRC_RUN,NRC_SHA
          command_timeout: 30s
          script: |
            set -eu
            [ "$(id -u)" = 0 ]
            printf '%s' "$NRC_RUN" | grep -Eq '^[0-9]+-[0-9]+$'
            printf '%s' "$NRC_SHA" | grep -Eq '^[0-9a-f]{64}$'
            incoming="/tmp/metainc-control-preflight-$NRC_RUN"
            helper="$incoming/retirement_control_preflight.py"
            [ -d /tmp ]
            [ ! -L /tmp ]
            if [ ! -e "$incoming" ] && [ ! -L "$incoming" ]; then exit 0; fi
            [ -d "$incoming" ]
            [ ! -L "$incoming" ]
            [ "$(stat -c '%u:%a' "$incoming")" = 0:700 ]
            if [ -e "$helper" ] || [ -L "$helper" ]; then
              [ -f "$helper" ]
              [ ! -L "$helper" ]
              [ "$(stat -c '%h' "$helper")" = 1 ]
              [ "$(sha256sum "$helper" | cut -d' ' -f1)" = "$NRC_SHA" ]
              rm -f -- "$helper" 2>/dev/null
            fi
            if ! rmdir -- "$incoming" 2>/dev/null; then echo RETIREMENT_CONTROL_PREFLIGHT_CLEANUP_INCOMPLETE; exit 1; fi
