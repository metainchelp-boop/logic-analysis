name: 시장 원천 진단 Linux 합성 격리 위치 확인
on:
  push:
    branches: [codex/naver-market-probe-linux-fixture-20261017]
permissions:
  contents: read
jobs:
  fixture:
    if: github.ref == 'refs/heads/codex/naver-market-probe-linux-fixture-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 합성 DB 단일 namespace 관측
        run: |
          set -euo pipefail
          sudo env -i "PATH=$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_market_source_limit_probe_namespace_provenance -v
