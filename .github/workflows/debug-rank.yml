name: Collector private diagnosis and approved backup verification

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only diagnosis or separately approved on-server backup verification
        type: choice
        default: read_only
        required: true
        options:
          - read_only
          - backup_verify
          - backup_verify_existing
      verification_phase:
        description: Read-only continuation phase for the existing approved backup files
        type: choice
        default: digests
        required: false
        options:
          - digests
          - restored_metadata
      confirmation:
        description: Exact approved operation identifier is required for backup verification
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: collector-private-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/diag/codex-collector-private-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bundle public diagnostic code and public encryption certificate
        env:
          DIAG_OPERATION: ${{ inputs.operation }}
          DIAG_CONFIRMATION: ${{ inputs.confirmation }}
          DIAG_VERIFICATION_PHASE: ${{ inputs.verification_phase }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          root = pathlib.Path('.github/diagnostics')
          operation = os.environ.get('DIAG_OPERATION') or 'read_only'
          if operation not in {'read_only', 'backup_verify', 'backup_verify_existing'}:
              raise SystemExit('INVALID_OPERATION')
          if operation != 'read_only' and os.environ.get('DIAG_CONFIRMATION') != 'approved-backup-only-20260921-op1':
              raise SystemExit('BACKUP_APPROVAL_REQUIRED')
          bundle = {'hostScript': (root/'collector_host_probe.py').read_text(),
                    'dbScript': (root/'collector_db_probe.py').read_text(),
                    'operation': operation,
                    'certificate': (root/'recipient.pem').read_text()}
          if operation == 'backup_verify':
              bundle['approval'] = 'approved-backup-only-20260921-op1'
              bundle['backupScript'] = (root/'collector_backup_probe.py').read_text()
          if operation == 'backup_verify_existing':
              phase = os.environ.get('DIAG_VERIFICATION_PHASE') or 'digests'
              if phase not in {'digests', 'restored_metadata'}:
                  raise SystemExit('INVALID_VERIFICATION_PHASE')
              bundle['approval'] = 'approved-backup-only-20260921-op1'
              bundle['verificationPhase'] = phase
              bundle['backupVerificationScript'] = (root/'collector_backup_verify_existing.py').read_text()
          encoded = base64.b64encode(json.dumps(bundle).encode()).decode()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('COLLECTOR_DIAG_BUNDLE=' + encoded + '\n')
          PY
      - name: Approved bounded server operation with ciphertext-only output
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          COLLECTOR_DIAG_BUNDLE: ${{ env.COLLECTOR_DIAG_BUNDLE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COLLECTOR_DIAG_BUNDLE
          command_timeout: 270s
          script: |
            python3 - <<'PY'
            import base64, json, os, sys
            try:
                bundle = json.loads(base64.b64decode(os.environ['COLLECTOR_DIAG_BUNDLE']))
                exec(compile(bundle['hostScript'], '<private-diagnostic>', 'exec'),
                     {'__name__': '__main__', 'DIAG_BUNDLE': bundle})
            except BaseException:
                print('DIAG_FAILED_NO_PLAINTEXT_OUTPUT')
                sys.exit(1)
            PY
