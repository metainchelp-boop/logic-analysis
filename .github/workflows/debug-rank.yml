      - name: 상품 주소 모양 실측 (읽기 전용)
        if: ${{ github.event.inputs.urlshape == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            # ⚠️ 저장소가 공개라 업체명·가게 이름(슬러그)은 출력하지 않는다 — 호스트와 건수만.
            import re, sqlite3, collections
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row

            def host_of(u):
                u = str(u or "")
                if "brand.naver.com" in u:            return "brand"
                if "smartstore.naver.com" in u:       return "smartstore"
                if "shopping.naver.com/catalog" in u: return "catalog"
                if "naver.com" in u:                  return "naver(기타)"
                return "빈값" if not u.strip() else "그 외"

            def slug_of(u, host):
                pat = r"brand\.naver\.com/([^/?#]+)" if host == "brand" else r"smartstore\.naver\.com/([^/?#]+)"
                m = re.search(pat, str(u or ""))
                if not m: return ""
                sl = m.group(1).strip().lower()
                return "" if (not sl or sl.isdigit()) else sl

            SRC = [
                ("추적 상품",      "SELECT id, product_url AS u FROM tracked_products"),
                ("업체 대표주소",  "SELECT id, naver_store_url AS u FROM clients WHERE status='active' AND COALESCE(vertical,'store')='store'"),
                ("키워드별 등록부","SELECT client_id AS id, product_url AS u FROM client_keyword_product"),
            ]
            ss_slugs, br_slugs = {}, {}
            print("[호스트별 건수]")
            for label, sql in SRC:
                cnt = collections.Counter()
                try:
                    for r in conn.execute(sql):
                        h = host_of(r["u"]); cnt[h] += 1
                        sl = slug_of(r["u"], h)
                        if sl and h == "smartstore": ss_slugs.setdefault(sl, set()).add((label, r["id"]))
                        if sl and h == "brand":      br_slugs.setdefault(sl, set()).add((label, r["id"]))
                except Exception as e:
                    print(f"  {label}: 조회 실패 {e}"); continue
                total = sum(cnt.values())
                print(f"  {label} (총 {total})")
                for h, n in cnt.most_common():
                    print(f"      {h:<12} {n:>5}")

            print()
            print("[⭐ 같은 슬러그가 두 호스트에 걸쳐 있나 — 이름공간 판정]")
            both = sorted(set(ss_slugs) & set(br_slugs))
            print(f"  스마트스토어 슬러그 {len(ss_slugs)}종 · 브랜드스토어 슬러그 {len(br_slugs)}종 · 겹침 {len(both)}종")
            print("  (겹침이 있으면 같은 이름공간 = 접두어 없이 한 키로 이어도 된다는 근거)")

            print()
            print("[⭐ 브랜드스토어 슬러그가 상품쪽·업체쪽에서 서로 맞는가 — 고치면 실제로 이어지나]")
            br_by_src = {}
            for label, sql in SRC:
                try:
                    for r in conn.execute(sql):
                        if host_of(r["u"]) != "brand":
                            continue
                        sl = slug_of(r["u"], "brand")
                        if sl:
                            br_by_src.setdefault(label, set()).add(sl)
                except Exception:
                    pass
            prod = br_by_src.get("추적 상품", set())
            cli  = br_by_src.get("업체 대표주소", set()) | br_by_src.get("키워드별 등록부", set())
            print(f"  상품쪽 브랜드 슬러그 {len(prod)}종 · 업체쪽 {len(cli)}종 · 맞는 것 {len(prod & cli)}종")
            print("  ⇒ 맞는 것이 0이면 지금 당장 이어지는 건 없고, 앞으로 등록될 것에만 효과가 있다.")

            print()
            print("[주인 없는 추적 상품의 주소 모양]")
            try:
                q = ("SELECT p.product_url AS u FROM tracked_products p "
                     " WHERE COALESCE(p.disabled_at,'') = '' "
                     "   AND p.id NOT IN (SELECT tracked_product_id FROM rank_link)")
                cnt = collections.Counter(host_of(r["u"]) for r in conn.execute(q))
                print(f"  총 {sum(cnt.values())}개")
                for h, n in cnt.most_common():
                    print(f"      {h:<12} {n:>5}")
            except Exception as e:
                print(f"  조회 실패: {e}")
            conn.close()
            PY

