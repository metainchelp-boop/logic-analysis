name: Debug Rank Batch (읽기 전용 진단)

# 08:00 순위 추적 배치·수집 상태 점검 — 수동 실행 전용(push 트리거 없음 = 재배포 미유발).
# 작업 브랜치 ref 로 dispatch. 전 쿼리 읽기 전용(SELECT) — 데이터 변경 없음.

on:
  workflow_dispatch:
    inputs:
      collector:
        description: '수집기 진단 — off(기본) / on(확장이 서버에 접속했는지·큐·토큰 상태)'
        required: false
        default: 'off'
      rank_link:
        description: '순위 축 브리지 — off(기본) / stats / preview / apply'
        required: false
        default: 'off'
      capacity:
        description: '수집 소화량 — off(기본) / on. 1대가 실제로 하루 몇 개를 소화하는지·몇 시에 도는지·시간대별 몫이 고른지. 2대 배분 설계용(읽기 전용).'
        required: false
        default: 'off'
      structure:
        description: '구조 진단 — off(기본) / on. 자격 판정이 무엇을 거르는지 · 유니버스 868개의 출처 · 새는 곳 2군데 규모 · 이상적 분산(읽기 전용).'
        required: false
        default: 'off'
      expired:
        description: '추적 기간 지난 업체 목록 — off(기본) / on. 계약 살아 있는 곳과 끝난 곳을 갈라서 전수 출력(읽기 전용). ⚠️ 업체명이 실행 로그에 남는다 — 이 저장소는 공개이므로 결과를 받은 뒤 그 런의 로그를 삭제할 것.'
        required: false
        default: 'off'
      queue:
        description: '온디맨드 요청 큐 해부 — off(기본) / on. 무엇이 몇 건 쌓였고 언제 들어왔는지, 누가 넣었는지(배치 되먹임 vs 직원 화면), 재개하면 몫을 얼마나 먹는지(읽기 전용·키워드 미출력).'
        required: false
        default: 'off'
      urlshape:
        description: '상품 주소 모양 실측 — off(기본) / on. 어느 호스트(스마트스토어·브랜드스토어·카탈로그)를 쓰는지, 같은 슬러그가 두 호스트에 걸쳐 있는지(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      match_ab:
        description: '순위 매칭 A/B(정확 식별 vs 종전 폴백 · B5) — off(기본) / on. 배포된 매처로 최근 14일 수집분에 추적 대상 전부를 대조해 「정확 식별만」·「지금 규칙(정확+폴백)」·「종전 규칙만」 셋의 매칭 수를 센다(읽기 전용 · 업체명·키워드 미출력). ⚠️ #256 배포 뒤에만 의미 있다(그 전엔 정확 식별 모듈이 없다).'
        required: false
        default: 'off'
      issue275:
        description: '신고 #275 — 추적 등록(/products/track) 실패 기록 · 9/22 이후 등록 상품 nvMid·연결 상태(읽기 전용 · 이름·주소 미출력)'
        required: false
        default: 'off'
      cap3:
        description: '기계별 소화량·완료율(3대 확장 판단용) — off(기본) / on. 최근 4일 기계별 시도·완료·멈춘 이유·읽은 페이지(숫자만).'
        required: false
        default: 'off'
      board_live:
        description: '🛰 수집 현황판(#286) 라이브 확인 — off(기본) / on. 파일·경로·인증·번들 표지 + 실제 DB 로 현황판 계산(숫자만 · 키워드 미출력).'
        required: false
        default: 'off'
      human_live:
        description: '📖 순위 읽기 도우미(#284) 라이브 확인 — off(기본) / on. 컨테이너 파일·경로 등록·표 존재·인증 없는 호출의 응답 코드·기동 뒤 오류 줄(읽기 전용 · 키워드 미출력).'
        required: false
        default: 'off'
      live_check:
        description: '3탭(#253) 라이브 확인 — off(기본) / on. 서버에 올라간 프론트 번들의 마커 · rank_axes.py 존재 · 오늘 /api/collector 접속처(해시 앞 6자·건수·마지막 시각 — IP 원문 미출력).'
        required: false
        default: 'off'
      done_found:
        description: '🎯 완료 규칙 효과 — 오늘 부분 수집 중 추적 대상을 다 찾고도 다시 잰 횟수 — off(기본) / on(읽기 전용 · 키워드 원문 미출력).'
        required: false
        default: 'off'
      tracked_reset:
        description: '추적 상품 소프트 내리기(9/22 배포) 확인 — off(기본) / on. 기동 로그의 [추적정리] 줄 + 마커 파일 + 활성/내려진 상품·이력 행수(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      use_branch_code:
        description: '이 브랜치의 rank_link.py 로 미리보기 — off(기본) / on. 배포 전에 새 규칙이 무엇을 이을지 먼저 보려는 용도(컨테이너 /tmp 에 얹었다 지운다·앱 파일 무접촉). apply 와 함께 쓰지 말 것.'
        required: false
        default: 'off'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 순위 매칭 A/B — 정확 식별 vs 폴백 (match_ab=on · 읽기 전용)
        if: ${{ github.event.inputs.match_ab == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 240s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sys, json, sqlite3, collections
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            try:
                from product_identity import canonical_product_id as cpid, naver_product_identity as npi
                from naver_crawler import find_product_rank_from_cache as ours, extract_product_id_from_url as xpid, extract_store_name_from_url as xstore
                from collector import _normalize_collected
            except Exception as e:
                print("(배포 전 — 정확 식별 모듈 없음):", e); raise SystemExit(0)
            def strict(url, prods, mid=""):
                ident = npi(url); m = cpid(mid) if mid else None
                if ident and ident[0] == "nvMid":
                    if m and m != ident[1]: ident = None
                    else: m = ident[1]
                c = [p for p in prods if isinstance(p, dict) and type(p.get("rank")) is int and p["rank"] > 0]
                hits = [p["rank"] for p in c if m and cpid(p.get("product_id")) == m]
                if not hits and ident:
                    for p in c:
                        raw = p.get("product_id"); has = raw is not None and not (isinstance(raw, str) and not raw.strip())
                        if has and (m or not cpid(raw)): continue
                        if npi(p.get("product_url")) == ident: hits.append(p["rank"])
                return min(hits) if hits else None
            def legacy(url, prods, mid=""):
                tm = str(mid or "").strip(); tp = xpid(url); ts = xstore(url)
                for p in prods:
                    if tm and p.get("product_id") and tm == str(p["product_id"]): return p["rank"]
                    if tp and p.get("product_id") and tp == p["product_id"]: return p["rank"]
                    if tp and p.get("product_url") and tp in p["product_url"]: return p["rank"]
                    if ts and p.get("store_name") and ts.lower() == p["store_name"].lower() and tp and tp in str(p.get("product_url","")): return p["rank"]
                return None
            # 대상 = 살아 있는 추적 상품(키워드별) + 자격 업체 대표 키워드(store url)
            targets = []
            for r in conn.execute("SELECT p.product_url, COALESCE(p.nv_mid,'') nv, k.keyword FROM tracked_products p JOIN tracked_keywords k ON k.product_id=p.id WHERE COALESCE(p.disabled_at,'')=''"):
                targets.append(("product", r["keyword"], r["product_url"], r["nv"]))
            try:
                from tracking_eligibility import eligible_clients_sql
                for r in conn.execute(eligible_clients_sql("id, naver_store_url, main_keywords")):
                    u = (r["naver_store_url"] or "").strip()
                    if not u: continue
                    for k in (r["main_keywords"] or "").split(","):
                        if k.strip(): targets.append(("client", k.strip(), u, ""))
            except Exception as e:
                print("(업체 대상 조회 실패):", e)
            serp = {}
            for r in conn.execute("SELECT keyword, products_json FROM collected_serp WHERE collected_date >= date('now','localtime','-14 day') ORDER BY collected_date"):
                serp[r["keyword"]] = r["products_json"]   # 키워드별 최신 날짜가 남는다
            cnt = collections.Counter(); axis = collections.Counter(); shapes = collections.Counter()
            for ax, kw, url, nv in targets:
                raw = serp.get(kw)
                if not raw: cnt["수집분 없음"] += 1; continue
                try: prods = [_normalize_collected(p) for p in json.loads(raw)]
                except Exception: cnt["수집분 파싱 실패"] += 1; continue
                axis[ax] += 1
                a = strict(url, prods, nv); b = ours(kw, url, prods, nv_mid=nv)[0]; c = legacy(url, prods, nv)
                key = ("정확" if a is not None else "-") + "/" + ("지금" if b is not None else "-") + "/" + ("종전" if c is not None else "-")
                cnt[key] += 1
                if b is not None and a is None:
                    # 정확 식별이 놓치고 폴백만 잡은 것 — 왜? 등록 주소 vs 수집 링크 모양
                    reg = npi(url); shapes[(reg[0] if reg else "등록주소:식별불가")] += 1
            print("[대상] 상품축", axis["product"], "· 업체축", axis["client"], "· 수집분 없음", cnt.pop("수집분 없음", 0), "· 파싱 실패", cnt.pop("수집분 파싱 실패", 0))
            print("[매칭 수 — 정확/지금/종전]  (지금 = 정확 식별 + 종전 폴백 = 배포된 규칙)")
            for k, v in sorted(cnt.items(), key=lambda x: -x[1]): print(f"  {k:>14}  {v}")
            print("[정확 식별이 놓치고 폴백만 잡은 것 — 등록 주소 유형]", dict(shapes))
            print("⇒ 「-/지금/종전」 이 크면 폴백을 지울 수 없다(B5 유지). 「정확/…」 이 종전과 같으면 폴백 삭제 가능.")
            PY
      - name: '신고 #275 확인 (issue275=on · 읽기 전용)'
        if: ${{ github.event.inputs.issue275 == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 120s
          script: |
            for f in /var/log/nginx/access.log /var/log/nginx/logic-analysis.access.log; do [ -f "$f" ] && LOG="$f" && break; done
            T=/tmp/acc275.txt; : > $T
            for f in $(ls "$LOG".*.gz 2>/dev/null | sort -V -r | tail -8); do zcat "$f" >> $T 2>/dev/null; done
            [ -f "$LOG.1" ] && cat "$LOG.1" >> $T; cat "$LOG" >> $T
            echo "== 신고 #275 ① POST /api/products/track 날짜×상태 (접속 로그 $(wc -l < $T)줄 · 가장 이른 $(head -1 $T | awk '{print substr($4,2,11)}')) =="
            grep -a '"POST /api/products/track' $T | awk '{split($4,t,":"); d=substr(t[1],2); n[d" "$9]++} END {for (k in n) print "  " k " x" n[k]}' | sort -t/ -k2,2M -k1,1n
            echo "== ② 9/22·9/23 한 줄씩 (시각 · 상태 · 응답 바이트 · 출처 해시) — track 과 nvmid-lookup =="
            grep -a -E '"POST /api/products/(track|nvmid-lookup)' $T | grep -a -E '2[23]/Sep/2026' | awk '{ip=$1; cmd="printf %s " ip " | sha256sum | cut -c1-6"; cmd | getline h; close(cmd); p=$7; sub(/.*\/products\//,"",p); print "  " substr($4,2) "  " p "  " $9 "  " $10 "B  " h}'
            echo "== ③ 9/22 11:30~13:30 track 을 부른 출처의 요청 흐름 (경로만 · 질의 제거) =="
            SRC=$(grep -a '"POST /api/products/track' $T | grep -a -E '22/Sep/2026:1[123]' | awk '{print $1}' | sort -u)
            for ip in $SRC; do
              h=$(printf %s "$ip" | sha256sum | cut -c1-6); echo "  [출처 $h]"
              grep -a "^$ip " $T | grep -a -E '22/Sep/2026:(11:[3-5]|12:|13:[0-2])' | grep -a '/api/' | awk '{p=$7; sub(/\?.*/,"",p); print "    " substr($4,14) " " substr($6,2) " " p " " $9}' | grep -v -E '/api/collector/health|/api/auth/me|/api/notifications' | tail -40
            done
            rm -f $T
            echo "== ④ DB — 9/22 10:40 이후 만들어지거나 고쳐진 추적 상품 (이름·주소·키워드 미출력) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, re
            from urllib.parse import urlparse
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True); c.row_factory = sqlite3.Row
            cols = [r[1] for r in c.execute("PRAGMA table_info(tracked_products)")]
            print("  칸:", ",".join(cols))
            rows = c.execute("SELECT * FROM tracked_products WHERE created_at >= '2026-09-22 10:40:00' OR updated_at >= '2026-09-22 10:40:00' ORDER BY id").fetchall()
            print(f"  대상 {len(rows)}행")
            def shape(u):
                try:
                    pu = urlparse(u or "")
                    host = (pu.netloc or "?").split(".")[0]
                    return f"{host}{'?' if pu.query else ''}{'#' if pu.fragment else ''}"
                except Exception:
                    return "?"
            for r in rows:
                nv = (r["nv_mid"] or "") if "nv_mid" in cols else ""
                kw = c.execute("SELECT COUNT(*) FROM tracked_keywords WHERE product_id=?", (r["id"],)).fetchone()[0]
                links = [x[0] for x in c.execute("SELECT client_id FROM rank_link WHERE tracked_product_id=?", (r["id"],))]
                pid = (r["product_id"] or "").strip()
                dup = c.execute("SELECT COUNT(*) FROM tracked_products WHERE product_id=? AND product_id<>''", (pid,)).fetchone()[0] if pid else 0
                same_user_dup = c.execute("SELECT COUNT(*) FROM tracked_products WHERE product_id=? AND product_id<>'' AND user_id=?", (pid, r["user_id"])).fetchone()[0] if pid else 0
                ana = []
                for cid in links:
                    a = c.execute("SELECT product_url, created_at FROM client_analyses WHERE client_id=? ORDER BY id DESC LIMIT 1", (cid,)).fetchone()
                    if a:
                        au = (a["product_url"] or "").strip()
                        m = re.search(r"/products/(\d+)", au)
                        ana.append(f"c{cid}:분석 {a['created_at'][:16]} 주소같음={au == (r['product_url'] or '').strip()} 상품번호같음={bool(m and m.group(1) == pid)} 분석주소모양={shape(au)}")
                    else:
                        ana.append(f"c{cid}:분석 없음")
                print(f"  #{r['id']} 만든 {r['created_at'][5:16]} 고친 {(r['updated_at'] or '')[5:16]} user={r['user_id']} nvMid={'있음 '+str(len(nv))+'자리' if nv else '없음'}"
                      f" 상품번호={'있음' if pid else '없음'} 내림={'예' if (r['disabled_at'] if 'disabled_at' in cols else '') else '아니오'} 키워드 {kw}개"
                      f" 주소모양={shape(r['product_url'])} 같은상품번호 행 {dup}(같은직원 {same_user_dup}) 연결 {links or '없음'} | " + " / ".join(ana))
                # 분석한 키워드가 이 상품의 추적 키워드 안에 있나(값 미출력 · 개수만)
                pk = [x[0] for x in c.execute("SELECT keyword FROM tracked_keywords WHERE product_id=?", (r["id"],))]
                norm = lambda k: "".join(str(k or "").split()).lower()
                for cid in links:
                    aks = [x[0] for x in c.execute("SELECT DISTINCT keyword FROM client_analyses WHERE client_id=? AND created_at >= '2026-09-21'", (cid,))]
                    ex = sum(1 for k in aks if k in pk); nm = sum(1 for k in aks if norm(k) in {norm(x) for x in pk})
                    print(f"      c{cid}: 9/21 이후 분석 키워드 {len(aks)}개 중 이 상품 키워드와 글자 그대로 같음 {ex} · 띄어쓰기 무시 같음 {nm} · 상품 키워드 {len(pk)}개")
            PY

            echo "== ⑤ 배포 반영 확인 (PR #261 · 신고 #275 + db_busy) =="
            docker inspect -f '  컨테이너 기동 StartedAt={{.State.StartedAt}} 재시작={{.RestartCount}}' logic-analysis
            docker exec -i logic-analysis sh -c '
              printf "  서버 db_busy.py: "; [ -f /app/db_busy.py ] && echo 있음 || echo 없음
              printf "  collector.py write_with_retry 사용: "; grep -c "write_with_retry(DB_PATH" /app/collector.py
              printf "  nvmid.py existing_for: "; grep -c "^def existing_for" /app/nvmid.py
              printf "  main.py 폴백 호출·nv_mid_source: "; grep -c "_nv_existing(_nvc, req.product_url" /app/main.py; grep -c "\"nv_mid_source\": _nv_source" /app/main.py'
            D=/root/logic-analysis-deploy/frontend
            B=$(grep -o 'app\.[a-f0-9]*\.js' $D/index.bundle.html | head -1)
            echo "  화면이 가리키는 번들: $B ($(stat -c %s $D/dist/$B 2>/dev/null)B · $(date -r $D/dist/$B '+%m-%d %H:%M' 2>/dev/null))"
            # ⚠️ 새 코드에만 있는 문구 3개만 본다(옛 번들에도 있는 문구는 판정력이 없다)
            for m in 'nvMid (필수) \*' '키워드 상한이 차서 추가하지 못했습니다' '모두 찼습니다'; do
              printf "   [%s] %s\n" "$(grep -o -- "$m" $D/dist/$B 2>/dev/null | wc -l)" "$m"
            done
            for f in /var/log/nginx/access.log /var/log/nginx/logic-analysis.access.log; do [ -f "$f" ] && LOG2="$f" && break; done
            SINCE=$(date -d "$(docker inspect -f '{{.State.StartedAt}}' logic-analysis)" '+%d/%b/%Y:%H:%M:%S')
            SK=$(date -d "$(docker inspect -f '{{.State.StartedAt}}' logic-analysis)" '+%Y%m%d%H%M%S')
            echo "  기동 이후($SINCE~) 접속 기록 — /products/track · heartbeat · blocked 상태별 (⚠️ 자정 회전 뒤 파일 .1 까지 읽는다)"
            # ⚠️ 종전엔 기동한 날짜로만 grep 해서 자정 로그 회전 뒤 빈 출력 = 「못 잼」이었다(0건 아님)
            LN=$( { [ -f "$LOG2.1" ] && cat "$LOG2.1"; cat "$LOG2"; } | awk -v sk="$SK" 'BEGIN{split("Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec",M," "); for(i in M) mo[M[i]]=sprintf("%02d",i)}
              $7 ~ /\/api\/(products\/track|collector\/heartbeat|collector\/blocked|collector\/serp)/ {
                t=substr($4,2,20); k=substr(t,8,4) mo[substr(t,4,3)] substr(t,1,2) substr(t,13,2) substr(t,16,2) substr(t,19,2);
                if (k < sk) next; seen++; p=$7; sub(/\?.*/,"",p); sub(/.*\/api\//,"",p); n[p" "$9]++;
                if ($9 >= 500) { h[p" "$9" "substr(t,1,2)"일 "substr(t,13,2)"시"]++ } }
              END { printf "   (읽은 해당 줄 %d)\n", seen; for (k in n) printf "   %s x%d\n", k, n[k]; for (k in h) printf "   5xx 시각별: %s x%d\n", k, h[k] }')
            echo "$LN" | sort
            printf "  앱 로그 기동 이후 'database is locked' 줄 수: "
            docker logs --since "$(docker inspect -f '{{.State.StartedAt}}' logic-analysis)" logic-analysis 2>&1 | grep -c "database is locked"
            echo "  [잠금 줄의 앞뒤 — 어느 경로·배치에서 났나 (160자 · 숫자 외 질의 없음)]"
            docker logs --timestamps --since "$(docker inspect -f '{{.State.StartedAt}}' logic-analysis)" logic-analysis 2>&1 \
              | grep -B3 "database is locked" | grep -E "File |Error|HTTP/1.1|저장 보류|동기화" | cut -c1-160 | tail -40
      - name: '#265 배포 위험도 — 새 시간표 미리보기 (issue275=on · 읽기 전용)'
        if: ${{ github.event.inputs.issue275 == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 120s
          script: |
            echo "== ⑥ #265 새 시간표 미리보기(실제 유니버스 · 키워드 미출력) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sys, sqlite3, zlib, collections, datetime
            sys.path.insert(0, "/app")
            from collector import _keyword_universe, _slot_of, _effective_date
            from split_rule import worker_of
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            uni = _keyword_universe(c)
            table = [h for h in range(24) for _ in range(2 if 8 <= h <= 22 else 1)]
            new = {k: table[zlib.crc32((k or "").encode("utf-8")) % 39] for k in uni}
            old = {k: _slot_of(k, bool(p)) for k, p in uni.items()}
            cn = collections.Counter(new.values()); co = collections.Counter(old.values())
            print(f"  유니버스 {len(uni)}개")
            print("  새 시간표(두 대 합): " + " ".join(f"{h}:{cn[h]}" for h in range(24)))
            print("  옛 시간표(두 대 합): " + " ".join(f"{h}:{co[h]}" for h in range(24)))
            per_m = collections.Counter((new[k], worker_of(k, 2)) for k in uni)
            mx = max(per_m.values()) if per_m else 0
            print(f"  기계 한 대가 한 시간에 받는 최대 몫 {mx}개 (상한 15) · 15 넘는 칸 {sum(1 for v in per_m.values() if v > 15)}개")
            today = _effective_date()
            done = {r[0] for r in c.execute("SELECT keyword FROM collected_serp WHERE collected_date=?", (today,))}
            hour = datetime.datetime.now().hour
            rem = [k for k in uni if k not in done]
            ov_new = sum(1 for k in rem if new[k] < hour); ov_old = sum(1 for k in rem if old[k] < hour)
            print(f"  지금 {hour}시 · 오늘 남은 {len(rem)}개 중 이미 지난 시각에 속한 몫 — 옛 규칙 {ov_old}개 · 새 규칙 {ov_new}개")
            print(f"  남은 시간 {24 - hour}시간 × 시간당 최대 30(두 대) = {(24 - hour) * 30}개 처리 가능")
            try:
                import collect_cap
                print(f"  서버 상한(effective_cap) = {collect_cap.effective_cap()} · 서버 시간표가 새 규칙인가 = {old == new}")
            except Exception as e:
                print("  상한 조회 실패(못 쟀다):", e)
            PY
      - name: 기계별 소화량·완료율 (cap3=on · 읽기 전용)
        if: ${{ github.event.inputs.cap3 == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 180s
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sys, sqlite3, json, collections
            DB = sys.argv[1] if len(sys.argv) > 1 else "file:/app/data/logic_data.db?mode=ro"
            conn = sqlite3.connect(DB, uri=DB.startswith("file:"))
            hb = {r[0]: (r[1], r[2], r[3]) for r in conn.execute("SELECT instance_id, worker_no, worker_count, ext_version FROM collector_heartbeat")}
            days = [r[0] for r in conn.execute("SELECT DISTINCT collected_date FROM collector_observations ORDER BY 1 DESC LIMIT 4")]
            print("  날짜:", days)
            for d in days:
                per = collections.defaultdict(lambda: collections.Counter())
                pages = collections.defaultdict(list)
                hours = collections.defaultdict(collections.Counter)
                for kind, reason, meta, at in conn.execute("SELECT kind, reason, meta_json, received_at FROM collector_observations WHERE collected_date=?", (d,)):
                    try:
                        m = json.loads(meta or "{}"); o = m.get("observation") or {}
                        wid = str(o.get("workerId") or "")
                    except Exception:
                        o, wid = {}, ""
                    w = hb.get(wid, ("?",))[0] if wid else "legacy"
                    c = per[w]; c["시도"] += 1; c["kind:" + kind] += 1
                    if kind in ("positive", "evidence_only"): c["멈춤:" + (reason or "")[:14]] += 1
                    pr = o.get("pagesRead")
                    if isinstance(pr, int): pages[w].append(pr)
                    hours[w][str(at)[11:13]] += 1
                print("  ==", d)
                for w in sorted(per, key=str):
                    c = per[w]; done = c["kind:full"] + c["kind:full_positive"]
                    pg = pages[w]
                    print("   기계 %s: 시도 %d · 완료 %d(300위 %d · 대상다찾음 %d) · 완료율 %.0f%% · 읽은 페이지 평균 %.2f · 2쪽 이상 읽음 %d · 시간당 최대 %d · 가동 시간대 %d개" % (
                        w, c["시도"], done, c["kind:full"], c["kind:full_positive"], 100.0 * done / max(1, c["시도"]),
                        (sum(pg) / len(pg)) if pg else -1, sum(1 for p in pg if p >= 2), max(hours[w].values()) if hours[w] else 0, len(hours[w])))
                    stops = sorted(((k[3:], v) for k, v in c.items() if k.startswith("멈춤:")), key=lambda x: -x[1])[:4]
                    print("      멈춘 이유:", stops)
            # 오늘 기준: 안 끝난 키워드가 몇 번 시도됐나
            today = days[0] if days else None
            if today:
                done = {r[0] for r in conn.execute("SELECT keyword FROM collected_serp WHERE collected_date=? UNION SELECT keyword FROM collector_found_done WHERE collected_date=?", (today, today))}
                tries = collections.Counter(r[0] for r in conn.execute("SELECT keyword FROM collector_observations WHERE collected_date=?", (today,)))
                notdone = {k: n for k, n in tries.items() if k not in done}
                dist = collections.Counter(min(n, 4) for n in notdone.values())
                print("  오늘 시도했지만 안 끝난 키워드 %d개 · 시도 횟수 분포(4=4번 이상): %s" % (len(notdone), dict(sorted(dist.items()))))
            # 최근 7일 동안 한 번이라도 완료된 키워드 비율
            r = conn.execute("SELECT COUNT(DISTINCT keyword) FROM (SELECT keyword FROM collected_serp WHERE collected_date >= date(?, '-6 days') UNION SELECT keyword FROM collector_found_done WHERE collected_date >= date(?, '-6 days'))", (today, today)).fetchone()
            print("  최근 7일 한 번이라도 완료된 키워드:", r[0])
            print("  [시간대별 2쪽 이상 읽음/시도 — 기계 1 | 기계 2]")
            b = collections.OrderedDict()
            for at, meta in conn.execute("SELECT received_at, meta_json FROM collector_observations WHERE received_at >= '2026-09-24 10:00:00' ORDER BY received_at"):
                try:
                    o = (json.loads(meta or "{}").get("observation") or {})
                except Exception:
                    o = {}
                w = hb.get(str(o.get("workerId") or ""), ("?",))[0]
                e = b.setdefault(str(at)[5:13], {1: [0, 0], 2: [0, 0]})
                if w in (1, 2):
                    e[w][1] += 1
                    if isinstance(o.get("pagesRead"), int) and o["pagesRead"] >= 2:
                        e[w][0] += 1
            for k, e in b.items():
                print("   %s시  %2d/%-3d | %2d/%-3d" % (k, e[1][0], e[1][1], e[2][0], e[2][1]))
            PY
