          command_timeout: 4m
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sys, sqlite3, re
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            from collector import load_collected
            KW = "청귤"

            def host_of(u):
                m = re.match(r"https?://([^/]+)", u or "")
                return m.group(1) if m else ("빈링크" if not u else "형식외")
            def kind(u):
                u = u or ""
                if "smartstore" in u: return "smartstore"
                if "brand.naver" in u: return "brand"
                if "/catalog/" in u or "cr.shopping" in u: return "catalog"
