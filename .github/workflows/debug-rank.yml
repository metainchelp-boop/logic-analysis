        type: choice
        options: ['off', inspect, prepare, tunnel-keygen, tunnel-install, tunnel-activate, tunnel-native, preview-envelope, preview-prepare, preview-start, preview-backup, preview-inspect, preview-plan, preview-publish, preview-rollback, preview-lifecycle, preview-status, preview-data-audit, preview-collection-status, preview-link-audit, preview-legacy-audit, preview-upgrade-prepare, preview-upgrade, preview-code-prepare, preview-code-upgrade, preview-code-diagnose, preview-code-only-prepare, preview-code-only-upgrade, preview-code-only-rollback, preview-resource-trial, preview-report-recovery, preview-report-recovery-v19, preview-conversion-diagnostics, preview-conversion-recovery-v26, preview-completion-migration-inspect, preview-completion-archive-quarantine, preview-completion-archive-snapshot, preview-completion-restore-quarantine, preview-completion-restore-snapshot, preview-completion-export-inspect, preview-completion-export-failure-inspect, preview-completion-export-recover-failed-unit, preview-completion-export-reinstall, preview-completion-prepare, preview-completion-apply, preview-completion-rollback, preview-completion-recover-failed-apply, preview-completion-patch-prepare, preview-completion-patch-apply, preview-completion-patch-rollback, preview-claude-quality-patch-prepare, preview-claude-quality-patch-apply, preview-claude-quality-patch-rollback, preview-strategy-validation-patch-prepare, preview-strategy-validation-patch-apply, preview-strategy-validation-patch-rollback, preview-inspection-continuity-patch-prepare, preview-inspection-continuity-patch-apply, preview-inspection-continuity-patch-rollback, preview-completion-source-diagnostics, preview-current-inspection-diagnostics, preview-report-context-reuse-patch-prepare, preview-report-context-reuse-patch-apply, preview-report-context-reuse-patch-rollback, preview-provider-diagnostics-patch-prepare, preview-provider-diagnostics-patch-apply, preview-provider-diagnostics-patch-rollback, preview-report-generation-patch-prepare, preview-report-generation-patch-apply, preview-report-generation-patch-rollback, preview-report-writer-recovery-patch-prepare, preview-report-writer-recovery-patch-apply, preview-report-writer-recovery-patch-rollback, preview-report-defect-patch-prepare, preview-report-defect-patch-apply, preview-report-defect-patch-rollback, preview-detail-ai-patch-prepare, preview-detail-ai-patch-apply, preview-detail-ai-patch-rollback, preview-appeal-suffix-patch-prepare, preview-appeal-suffix-patch-apply, preview-appeal-suffix-patch-rollback, preview-daily-current-source-diagnostics-v5, preview-daily-current-source-diagnostics-v4, preview-appeal-prefix-patch-prepare, preview-appeal-prefix-patch-apply, preview-appeal-prefix-patch-rollback, preview-daily-current-source-diagnostics-v3, preview-appeal-diagnostic-patch-prepare, preview-appeal-diagnostic-patch-apply, preview-appeal-diagnostic-patch-rollback, preview-observation-binding-patch-prepare, preview-observation-binding-patch-apply, preview-observation-binding-patch-rollback, preview-observation-799-diagnostics-v2, preview-observation-799-diagnostics, preview-learning-failure-patch-prepare, preview-learning-failure-patch-apply, preview-learning-failure-patch-rollback, preview-setup-stale-diagnostics, preview-budget-draft-patch-prepare, preview-budget-draft-patch-apply, preview-budget-draft-patch-rollback, learning-center-static-check, learning-center-static-install, learning-center-static-rollback]
        required: false
        default: 'off'
      ad_expected_baseline:
        description: 'prepare/keygen: 기준 SHA-256. tunnel-install/activate: baseline·공개키지문·BE공개hostkey·꺼짐확인 4필드 JSON. 개인키 금지.'
        required: false
        default: ''
      collector:
        description: '수집기 진단 — off(기본) / on(확장이 서버에 접속했는지·큐·토큰 상태)'
        required: false
        default: 'off'
      rank_link:
        description: '순위 축 브리지 — off(기본) / stats / preview / apply'
        required: false
        default: 'off'
      capacity:
        description: '수집 소화량 — off(기본) / on. 1대가 실제로 하루 몇 개를 소화하는지·몇 시에 도는지·시간대별 몫이 고른지. 2대 배분 설계용(읽기 전용).'
        required: false
        default: 'off'
      structure:
        description: '구조 진단 — off(기본) / on. 자격 판정이 무엇을 거르는지 · 유니버스 868개의 출처 · 새는 곳 2군데 규모 · 이상적 분산(읽기 전용).'
        required: false
        default: 'off'
      expired:
        description: '추적 기간 지난 업체 목록 — off(기본) / on. 계약 살아 있는 곳과 끝난 곳을 갈라서 전수 출력(읽기 전용). ⚠️ 업체명이 실행 로그에 남는다 — 이 저장소는 공개이므로 결과를 받은 뒤 그 런의 로그를 삭제할 것.'
        required: false
        default: 'off'
      queue:
        description: '온디맨드 요청 큐 해부 — off(기본) / on. 무엇이 몇 건 쌓였고 언제 들어왔는지, 누가 넣었는지(배치 되먹임 vs 직원 화면), 재개하면 몫을 얼마나 먹는지(읽기 전용·키워드 미출력).'
        required: false
        default: 'off'
      urlshape:
        description: '상품 주소 모양 실측 — off(기본) / on. 어느 호스트(스마트스토어·브랜드스토어·카탈로그)를 쓰는지, 같은 슬러그가 두 호스트에 걸쳐 있는지(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      use_branch_code:
        description: '이 브랜치의 rank_link.py 로 미리보기 — off(기본) / on. 배포 전에 새 규칙이 무엇을 이을지 먼저 보려는 용도(컨테이너 /tmp 에 얹었다 지운다·앱 파일 무접촉). apply 와 함께 쓰지 말 것.'
        required: false
        default: 'off'

jobs:
  preview-ops:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ad-deploy-prep-20261001' && (inputs.ad_prepare == 'preview-backup' || inputs.ad_prepare == 'preview-inspect' || inputs.ad_prepare == 'preview-plan' || inputs.ad_prepare == 'preview-publish' || inputs.ad_prepare == 'preview-rollback' || inputs.ad_prepare == 'preview-lifecycle' || inputs.ad_prepare == 'preview-status' || inputs.ad_prepare == 'preview-data-audit' || inputs.ad_prepare == 'preview-collection-status' || inputs.ad_prepare == 'preview-link-audit' || inputs.ad_prepare == 'preview-legacy-audit' || inputs.ad_prepare == 'preview-upgrade' || inputs.ad_prepare == 'preview-code-upgrade' || inputs.ad_prepare == 'preview-code-diagnose' || inputs.ad_prepare == 'preview-code-only-upgrade' || inputs.ad_prepare == 'preview-code-only-rollback' || inputs.ad_prepare == 'preview-resource-trial' || inputs.ad_prepare == 'preview-report-recovery' || inputs.ad_prepare == 'preview-report-recovery-v19' || inputs.ad_prepare == 'preview-conversion-diagnostics' || inputs.ad_prepare == 'preview-conversion-recovery-v26') }}
    permissions:
      contents: read
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Code-only forward + rollback reserve: raw224KiB, wire72KiB; bounded decompression/eof/tail checks retained.
    timeout-minutes: ${{ inputs.ad_prepare == 'preview-code-only-rollback' && 65 || inputs.ad_prepare == 'preview-code-only-upgrade' && 65 || inputs.ad_prepare == 'preview-code-upgrade' && 65 || 15 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 승인된 관제 전용 작업·합성 검사
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -eu
          python3 -m unittest discover -s backend/tests -p 'test_naver_preview_*.py' -q
          python3 - <<'PY'
          import ast,base64,gzip,io,json,os,pathlib,tokenize
          def compact_sources(bundle):
              def fields(value):
                  if isinstance(value, ast.AST):
                      return (type(value).__name__, tuple((name, fields(item)) for name, item in ast.iter_fields(value)))
                  if isinstance(value, list):
                      return tuple(fields(item) for item in value)
                  return value
              def literals(items):
                  return tuple((token.type, token.string) for token in items
                      if token.type == tokenize.STRING or tokenize.tok_name[token.type].startswith('FSTRING'))
              result = dict(bundle)
              for key, source in bundle.items():
                  if key != 'source' and not key.endswith('_source'):
                      continue
                  if type(source) is not str:
                      raise ValueError('SOURCE_AST_MISMATCH')
                  lines = source.splitlines(keepends=True)
                  strings = set()
                  tokens = list(tokenize.generate_tokens(io.StringIO(source).readline))
                  for token in tokens:
                      if token.type == tokenize.STRING or tokenize.tok_name[token.type].startswith('FSTRING'):
                          strings.update(range(token.start[0], token.end[0] + 1))
                  for token in tokens:
                      if token.type == tokenize.COMMENT:
                          index = token.start[0] - 1
                          lines[index] = lines[index][:token.start[1]].rstrip() + '\n'
                  compact = ''.join(line for number, line in enumerate(lines, 1) if line.strip() or number in strings)
                  pairs, level = [], 0
                  for token in tokenize.generate_tokens(io.StringIO(compact).readline):
                      value = token.string
                      if token.type == tokenize.INDENT:
                          level += 1
                          value = ' ' * level
                      elif token.type == tokenize.DEDENT:
                          level -= 1
                      pairs.append((token.type, value))
                  compact = tokenize.untokenize(pairs)
                  if literals(tokens) != literals(tokenize.generate_tokens(io.StringIO(compact).readline)):
                      raise ValueError('SOURCE_STRING_MISMATCH')
                  if fields(ast.parse(source)) != fields(ast.parse(compact)):
                      raise ValueError('SOURCE_AST_MISMATCH')
                  result[key] = compact
              return result
          def encode_ops(bundle):
              raw=json.dumps(bundle).encode()
              if bundle['operation'] not in ('preview-code-upgrade','preview-code-diagnose','preview-collection-status','preview-code-only-upgrade','preview-code-only-rollback','preview-resource-trial','preview-report-recovery','preview-report-recovery-v19','preview-conversion-diagnostics','preview-conversion-recovery-v26'):
                  return base64.b64encode(raw).decode()
              if len(raw)>229376:
                  raise ValueError('CODE_OPS_JSON_SIZE')
              encoded='code-gzip-v1:'+base64.b64encode(gzip.compress(raw,mtime=0)).decode()
              if len(encoded)>73728:
                  raise ValueError('CODE_OPS_WIRE_SIZE')
              return encoded
          inputs=json.loads(os.environ['INPUTS_JSON'])
          operation=inputs.pop('ad_prepare')
          module,function={'preview-backup':('naver_preview_backup_probe','run'),
            'preview-status':('naver_preview_status','run'),
            'preview-data-audit':('naver_preview_data_audit','run'),
            'preview-collection-status':('naver_preview_collection_status','run'),
            'preview-report-recovery':('naver_preview_report_recovery','run'),
            'preview-report-recovery-v19':('naver_preview_report_recovery_v19','run'),
            'preview-conversion-diagnostics':('naver_preview_conversion_diagnostics','run'),
            'preview-conversion-recovery-v26':('naver_preview_conversion_recovery_v26','run'),
            'preview-resource-trial':('naver_preview_resource_trial','run'),
            'preview-link-audit':('naver_preview_link_audit','run'),
            'preview-legacy-audit':('naver_preview_legacy_audit','run'),
            'preview-upgrade':('naver_preview_upgrade','apply'),
            'preview-code-upgrade':('naver_preview_code_upgrade','apply'),
            'preview-code-only-upgrade':('naver_preview_code_only','apply'),
            'preview-code-only-rollback':('naver_preview_code_rollback','run'),
            'preview-code-diagnose':('naver_preview_code_diagnose','run'),
            'preview-inspect':('naver_preview_publish','inspect'),
            'preview-plan':('naver_preview_publish','plan'),
            'preview-publish':('naver_preview_publish','apply'),
            'preview-rollback':('naver_preview_publish','rollback'),
            'preview-lifecycle':('naver_preview_lifecycle','install')}[operation]
          package=json.loads(inputs.pop('ad_expected_baseline'))
          assert all(v=='off' for v in inputs.values())
          if operation=='preview-resource-trial':
              import sys
              sys.path.insert(0,'backend/tools')
              import naver_preview_resource_trial
              naver_preview_resource_trial.validate_package(package)
          if operation=='preview-report-recovery':
              import sys
              sys.path.insert(0,'backend/tools')
              import naver_preview_report_recovery
              naver_preview_report_recovery.validate_package(package)
          if operation=='preview-report-recovery-v19':
              import sys
              sys.path.insert(0,'backend/tools')
              import naver_preview_report_recovery_v19
              naver_preview_report_recovery_v19.validate_package(package)
          if operation=='preview-conversion-diagnostics':
              import sys
              sys.path.insert(0,'backend/tools')
              import naver_preview_conversion_diagnostics
              naver_preview_conversion_diagnostics.validate_package(package)
          if operation=='preview-conversion-recovery-v26':
              import sys
              sys.path.insert(0,'backend/tools')
              import naver_preview_conversion_recovery_v26
              naver_preview_conversion_recovery_v26.validate_package(package)
          code_module='naver_preview_code_upgrade'
          if operation in ('preview-code-only-upgrade','preview-code-only-rollback'):
              import importlib,sys
              sys.path.insert(0,'backend/tools')
              import naver_preview_code_only,naver_preview_release
              naver_preview_release.validate_package(dict(package['release'],operation='upgrade-prepare'))
              code_module=naver_preview_code_only.code_module_name(package['release']['source_commit'])
              code=importlib.import_module(code_module)
              naver_preview_code_only.require_review(code)
              code.validate_package(package['release'],naver_preview_release)
              if operation=='preview-code-only-rollback':
                  import naver_preview_code_rollback
                  naver_preview_code_rollback.validate_package(package,naver_preview_release,naver_preview_code_only,code)
          bundle={'package':package,'operation':operation,'function':function,
                  'source':pathlib.Path('backend/tools/'+module+'.py').read_text(),
                  'release_source':pathlib.Path('backend/tools/naver_preview_release.py').read_text(),
                  'host_source':pathlib.Path('backend/tools/naver_erp_tunnel_service_install.py').read_text()}
          if operation in ('preview-upgrade','preview-code-upgrade','preview-code-diagnose','preview-code-only-upgrade','preview-code-only-rollback'):
              bundle['lifecycle_source']=pathlib.Path('backend/tools/naver_preview_lifecycle.py').read_text()
          if operation in ('preview-code-upgrade','preview-code-diagnose','preview-code-only-upgrade','preview-code-only-rollback'):
              bundle['upgrade_source']=pathlib.Path('backend/tools/naver_preview_upgrade.py').read_text()
          if operation in ('preview-code-diagnose','preview-code-only-upgrade','preview-code-only-rollback'):
              bundle['code_source']=pathlib.Path('backend/tools/'+code_module+'.py').read_text()
          if operation=='preview-code-only-rollback':
              bundle['code_only_source']=pathlib.Path('backend/tools/naver_preview_code_only.py').read_text()
          if operation in ('preview-code-only-upgrade','preview-code-only-rollback') and code_module in ('naver_preview_code_upgrade_v14','naver_preview_code_upgrade_v18','naver_preview_code_upgrade_v19','naver_preview_code_upgrade_v20','naver_preview_code_upgrade_v21','naver_preview_code_upgrade_v22','naver_preview_code_upgrade_v23','naver_preview_code_upgrade_v24','naver_preview_code_upgrade_v25','naver_preview_code_upgrade_v26'):
              bundle=compact_sources(bundle)
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('PREVIEW_OPS_B64='+encode_ops(bundle)+'\n')
          PY
      - name: 새 관제만 제한 작업 — 기존 앱 유지
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          PREVIEW_OPS_B64: ${{ env.PREVIEW_OPS_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PREVIEW_OPS_B64
          command_timeout: ${{ inputs.ad_prepare == 'preview-code-only-rollback' && '60m' || inputs.ad_prepare == 'preview-code-only-upgrade' && '60m' || inputs.ad_prepare == 'preview-code-upgrade' && '60m' || '12m' }}
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PY'
            import base64,json,os,re,sys,types,zlib
            def decode_ops(encoded):
                if not encoded.startswith('code-gzip-v1:'):
                    bundle=json.loads(base64.b64decode(encoded,validate=True))
                    if bundle.get('operation') in ('preview-code-upgrade','preview-code-diagnose','preview-collection-status','preview-code-only-upgrade','preview-code-only-rollback','preview-resource-trial','preview-report-recovery','preview-report-recovery-v19','preview-conversion-diagnostics','preview-conversion-recovery-v26'):
                        raise ValueError('CODE_OPS_ENCODING')
                    return bundle
                if len(encoded)>73728:
                    raise ValueError('CODE_OPS_WIRE_SIZE')
                packed=base64.b64decode(encoded[len('code-gzip-v1:'):],validate=True)
                decoder=zlib.decompressobj(16+zlib.MAX_WBITS)
                raw=decoder.decompress(packed,229377)
                if len(raw)>229376 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail:
                    raise ValueError('CODE_OPS_GZIP')
                bundle=json.loads(raw)
                if (bundle.get('operation'),bundle.get('function')) not in (('preview-code-upgrade','apply'),('preview-code-diagnose','run'),('preview-collection-status','run'),('preview-code-only-upgrade','apply'),('preview-code-only-rollback','run'),('preview-resource-trial','run'),('preview-report-recovery','run'),('preview-report-recovery-v19','run'),('preview-conversion-diagnostics','run'),('preview-conversion-recovery-v26','run')):
                    raise ValueError('CODE_OPS_OPERATION')
                return bundle
            module=None
            code=None
            bundle={}
            try:
                bundle=decode_ops(os.environ['PREVIEW_OPS_B64'])
                os.environ.clear();os.environ.update(PATH='/usr/sbin:/usr/bin:/sbin:/bin',LANG='C')
                allowed={'preview-backup':'run','preview-status':'run','preview-data-audit':'run','preview-collection-status':'run','preview-resource-trial':'run','preview-report-recovery':'run','preview-report-recovery-v19':'run','preview-conversion-diagnostics':'run','preview-conversion-recovery-v26':'run','preview-link-audit':'run','preview-legacy-audit':'run','preview-upgrade':'apply','preview-code-upgrade':'apply','preview-code-only-upgrade':'apply','preview-code-only-rollback':'run','preview-code-diagnose':'run','preview-inspect':'inspect','preview-plan':'plan','preview-publish':'apply','preview-rollback':'rollback','preview-lifecycle':'install'}
                assert allowed[bundle['operation']]==bundle['function']
                host=types.ModuleType('approved_host');exec(bundle['host_source'],host.__dict__)
                module=types.ModuleType('approved_preview');exec(bundle['source'],module.__dict__)
                if bundle['operation'] in ('preview-upgrade','preview-code-upgrade','preview-code-diagnose','preview-code-only-upgrade','preview-code-only-rollback'):
                    release=types.ModuleType('approved_release');exec(bundle['release_source'],release.__dict__)
                    lifecycle=types.ModuleType('approved_lifecycle');exec(bundle['lifecycle_source'],lifecycle.__dict__)
                    if bundle['operation']=='preview-code-upgrade':
                        upgrade=types.ModuleType('approved_upgrade');exec(bundle['upgrade_source'],upgrade.__dict__)
                        result=module.apply(bundle['package'],host.NativeHost(),release,lifecycle,upgrade)
                    elif bundle['operation']=='preview-code-only-upgrade':
                        upgrade=types.ModuleType('approved_upgrade');exec(bundle['upgrade_source'],upgrade.__dict__)
                        code=types.ModuleType('approved_code');exec(bundle['code_source'],code.__dict__)
                        result=module.apply(bundle['package'],host.NativeHost(),release,lifecycle,upgrade,code)
                    elif bundle['operation']=='preview-code-only-rollback':
                        upgrade=types.ModuleType('approved_upgrade');exec(bundle['upgrade_source'],upgrade.__dict__)
                        code=types.ModuleType('approved_code');exec(bundle['code_source'],code.__dict__)
                        policy=types.ModuleType('approved_policy');exec(bundle['code_only_source'],policy.__dict__)
                        result=module.run(bundle['package'],host.NativeHost(),release,lifecycle,upgrade,policy,code)
                    elif bundle['operation']=='preview-code-diagnose':
                        upgrade=types.ModuleType('approved_upgrade');exec(bundle['upgrade_source'],upgrade.__dict__)
                        code=types.ModuleType('approved_code');exec(bundle['code_source'],code.__dict__)
                        result=module.run(bundle['package'],host.NativeHost(),release,lifecycle,upgrade,code)
                    else:
                        result=module.apply(bundle['package'],host.NativeHost(),release,lifecycle)
                elif bundle['operation'] in ('preview-lifecycle','preview-status','preview-data-audit','preview-collection-status','preview-link-audit','preview-legacy-audit','preview-resource-trial','preview-report-recovery','preview-report-recovery-v19','preview-conversion-diagnostics','preview-conversion-recovery-v26'):
                    release=types.ModuleType('approved_release');exec(bundle['release_source'],release.__dict__)
                    result=getattr(module,bundle['function'])(bundle['package'],host.NativeHost(),release)
                else:
                    result=getattr(module,bundle['function'])(bundle['package'],host.NativeHost())
            except Exception as error:
                result={'ok':False,'stage':getattr(module,'STAGE','preflight'),'error_kind':type(error).__name__,
                        'error_code':str(error) if re.fullmatch('[A-Z_]{1,64}',str(error)) else None}
                if bundle.get('operation')=='preview-resource-trial':
                    result={'ok':False,'stage':'preflight','error_kind':'OtherError','error_code':'UNRECOGNIZED','database_opened':False}
                    if hasattr(module,'failure_report'):
                        result={'ok':False,**module.failure_report(error)}
                elif bundle.get('operation') in ('preview-code-only-upgrade','preview-code-only-rollback'):
                    result={'ok':False,'stage':'preflight','error_kind':'OtherError','error_code':'UNRECOGNIZED'}
                    if hasattr(module,'failure_report') and code is not None:
                        result={'ok':False,**module.failure_report(error,code)}
                elif bundle.get('operation') in ('preview-code-upgrade','preview-code-diagnose'):
                    result={'ok':False,'stage':'preflight','error_kind':'OtherError','error_code':'UNRECOGNIZED'}
                    if hasattr(module,'failure_report'):
                        result={'ok':False,**module.failure_report(error)}
            print('NAVER_PREVIEW_OPS='+json.dumps(result,sort_keys=True))
            sys.exit(0 if result.get('ok') else 1)
            PY
  preview-start:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ad-deploy-prep-20261001' && inputs.ad_prepare == 'preview-start' }}
    permissions:
      contents: read
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
