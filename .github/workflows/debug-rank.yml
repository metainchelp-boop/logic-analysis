      - name: 신고 253 — 집계 56위 vs 실제 45위 (읽기 전용·업체명 미출력)
        if: ${{ github.event.inputs.report253 == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sys, sqlite3, json
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            KW = "청귤"

            print("== ① 오늘 이 키워드의 기록 (두 축) ==")
            for r in conn.execute("""SELECT r.checked_at, r.rank_position, r.page_number, r.check_type,
                                            r.product_id
                                       FROM rankings r JOIN tracked_keywords k ON k.id=r.keyword_id
                                      WHERE k.keyword=? AND DATE(r.checked_at)=DATE('now','localtime')
                                      ORDER BY r.checked_at""", (KW,)):
                print("  축A 상품#%s %s위 p%s %s (%s)" % (r["product_id"], r["rank_position"], r["page_number"], r["checked_at"], r["check_type"]))
            for r in conn.execute("""SELECT client_id, checked_at, rank_position, page_number, check_type
                                       FROM client_rank_history
                                      WHERE keyword=? AND DATE(checked_at)=DATE('now','localtime')
                                      ORDER BY checked_at""", (KW,)):
                print("  축B 업체#%s %s위 p%s %s (%s)" % (r["client_id"], r["rank_position"], r["page_number"], r["checked_at"], r["check_type"]))

            print("\n== ② 추적 대상과 수집 목록 대조 ==")
            from naver_crawler import extract_product_id_from_url, extract_store_name_from_url
            targets = conn.execute("""SELECT p.id, p.product_url
                                        FROM tracked_keywords k JOIN tracked_products p ON p.id=k.product_id
                                       WHERE k.keyword=?""", (KW,)).fetchall()
            row = conn.execute("""SELECT created_at, total, product_count, products_json
                                    FROM collected_serp
                                   WHERE keyword=? AND collected_date=DATE('now','localtime')""", (KW,)).fetchone()
            if not row:
                print("  오늘 수집분 없음"); raise SystemExit
            prods = json.loads(row["products_json"])
            print("  수집 시각 %s · 네이버 표기 총 %s개 · 저장 %d개(광고 제외·중복 제거 후)"
                  % (row["created_at"], row["total"], len(prods)))
            for t in targets:
                tid = extract_product_id_from_url(t["product_url"]) or ""
                tstore = (extract_store_name_from_url(t["product_url"]) or "").lower()
                hit_id = [p.get("rank") for p in prods if tid and (tid == str(p.get("product_id") or "") or tid in str(p.get("product_url") or ""))]
                hit_st = [p.get("rank") for p in prods if tstore and tstore == str(p.get("store_name") or "").lower()]
                print("  추적상품#%s → 상품ID 일치 자리: %s · 같은 가게 자리: %s" % (t["id"], hit_id or "없음", hit_st or "없음"))

            print("\n== ③ 40~60위 구간의 생김새 (링크 종류·가게명 유무만) ==")
            for p in prods:
                r = p.get("rank") or 0
                if 40 <= r <= 60:
                    u = str(p.get("product_url") or "")
                    kind = ("smartstore" if "smartstore" in u else "brand" if "brand.naver" in u
                            else "catalog" if "/catalog/" in u or "cr.shopping" in u else "기타")
                    print("  %2d위 %-10s 가게명%s" % (r, kind, "有" if (p.get("store_name") or "").strip() else "無"))

            print("\n== ④ 이 상품의 최근 7일 순위 (변동폭) ==")
            for t in targets:
                for r in conn.execute("""SELECT DATE(checked_at) d, MIN(rank_position) mn, MAX(rank_position) mx, COUNT(*) n
                                           FROM rankings r JOIN tracked_keywords k ON k.id=r.keyword_id
                                          WHERE k.keyword=? AND r.product_id=?
                                            AND checked_at >= datetime('now','localtime','-7 day')
                                          GROUP BY d ORDER BY d""", (KW, t["id"])):
                    print("  상품#%s %s: %s~%s위 (%d회)" % (t["id"], r["d"], r["mn"], r["mx"], r["n"]))

            print("\n== ⑤ 목록 순번 무결성 (순번이 1부터 빠짐없이 이어지나) ==")
            ranks = sorted(p.get("rank") or 0 for p in prods)
            gaps = [ (a,b) for a,b in zip(ranks, ranks[1:]) if b != a+1 ]
            print("  1위부터 %d위까지 · 빠진 구간 %d곳 %s" % (ranks[-1] if ranks else 0, len(gaps), gaps[:5]))
            ids = [str(p.get("product_id") or "") for p in prods if p.get("product_id")]
            print("  상품ID 중복: %d건" % (len(ids) - len(set(ids))))
            PY

      - name: 신고 253 2차 — 응답 형식 변화·광고 누수 판정 (읽기 전용·업체명 미출력)
