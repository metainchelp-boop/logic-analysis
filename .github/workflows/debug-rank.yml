          assert folder.resolve()==folder and path.resolve()==path
          assert sorted(p.name for p in folder.iterdir())==['runtime-secrets.cms']
          parent=folder.lstat();item=path.lstat()
          assert stat.S_ISDIR(parent.st_mode) and stat.S_IMODE(parent.st_mode)==0o700
          assert stat.S_ISREG(item.st_mode) and item.st_nlink==1 and stat.S_IMODE(item.st_mode)==0o600
          assert 0<item.st_size<=3*1024*1024 and parent.st_uid==item.st_uid==int(os.environ['SUDO_UID'])
          os.chown(path,1000,1000);os.chown(folder,1000,1000)
          PYCODE
