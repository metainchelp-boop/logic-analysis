name: Conversion diagnostic through existing VPS connection

on:
  push:
    branches: [claude/naver-conversion-pool-first-executor-20261030, codex/naver-conversion-existing-executor-20261026]
  pull_request:
    branches: [codex/naver-conversion-existing-executor-20261026]
  workflow_dispatch:
    inputs:
      ad_prepare:
        type: choice
        required: true
        default: 'off'
        options: ['off', preview-report-progress-prepare, preview-report-progress-apply, preview-report-progress-rollback]
      ad_expected_baseline:
        type: string
        required: true
        default: '{}'

permissions:
  contents: read

jobs:
  checks:
    if: github.repository == 'metainchelp-boop/logic-analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check new public qualification boundary
        run: python3 -I -B -m unittest discover -s tools -p test_conversion_executor.py -q
      - name: Verify qualified files and exact workflow
        run: python3 -I -B tools/check_conversion_executor.py
  report-progress:
    needs: checks
    if: github.repository == 'metainchelp-boop/logic-analysis' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/naver-conversion-existing-executor-20261026' && github.run_attempt == 1 && (inputs.ad_prepare == 'preview-report-progress-prepare' || inputs.ad_prepare == 'preview-report-progress-apply' || inputs.ad_prepare == 'preview-report-progress-rollback')
    permissions:
      contents: read
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: release/conversion-20261026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact qualified release before building wire
        working-directory: .
        run: python3 -I -B tools/check_conversion_executor.py --deploy
      - name: Bundle
        env:
          RUN_ID: ${{github.run_id}}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -B bundle.py
      - name: Incoming
        if: inputs.ad_prepare == 'preview-report-progress-prepare'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          P22_WIRE: ${{env.P22_WIRE}}
          P22_BOOT: ${{env.P22_BOOT}}
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          envs: P22_WIRE,P22_BOOT
          command_timeout: 2m
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PYCODE'
            import base64,hashlib,json,os,sys,types
            try:
             wire=os.environ['P22_WIRE'];source=os.environ['P22_BOOT']
             if len(source)>32768:raise ValueError('COMPLETION_TRANSPORT_SIZE')
             raw=base64.b64decode(source,validate=True)
             if hashlib.sha256(raw).hexdigest()!='58bc51e9a26f49a54ca59e4e9f5188f43c963fc9f050c4738e3ac3305aa14fd5':raise ValueError('COMPLETION_TRANSPORT_SOURCE')
             transport=types.ModuleType('approved_completion_transport');exec(raw,transport.__dict__)
             verified_transport_sha=hashlib.sha256(raw).hexdigest()
             if transport.TRANSPORT_RAW_SHA256 is not None:raise ValueError('COMPLETION_TRANSPORT_PROFILE')
             transport.TRANSPORT_RAW_SHA256=verified_transport_sha;bundle=transport.decode(wire);os.environ.clear();os.environ.update(PATH='/usr/sbin:/usr/bin:/sbin:/bin',LANG='C')
             resolved=transport.modules(bundle);result=transport.execute(bundle,incoming=True)
            except Exception:result={'ok':False,'stage':'incoming','error_code':'COMPLETION_INCOMING_REFUSED'}
            print('NAVER_REPORT_PROGRESS_PATCH_INCOMING='+json.dumps(result,sort_keys=True));sys.exit(0 if result.get('ok')else 1)
            PYCODE
      - name: Ownership
        if: inputs.ad_prepare == 'preview-report-progress-prepare'
        run: |
          set -eu
          sudo /usr/bin/python3 -I -B - <<'PYCODE'
          import os,pathlib,stat;folder=pathlib.Path.cwd()/'preview-payload';path=folder/'runtime-secrets.cms'
          assert folder.resolve()==folder and path.resolve()==path;assert sorted(p.name for p in folder.iterdir())==['runtime-secrets.cms'];parent=folder.lstat();item=path.lstat()
          assert stat.S_ISDIR(parent.st_mode)and stat.S_IMODE(parent.st_mode)==0o700;assert stat.S_ISREG(item.st_mode)and item.st_nlink==1 and stat.S_IMODE(item.st_mode)==0o600;assert 0<item.st_size<=3*1024*1024 and parent.st_uid==item.st_uid==int(os.environ['SUDO_UID']);os.chown(path,1000,1000);os.chown(folder,1000,1000)
          PYCODE
      - name: Transfer
        if: inputs.ad_prepare == 'preview-report-progress-prepare'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          source: release/conversion-20261026/preview-payload/runtime-secrets.cms
          target: /srv/metainc/ad-deploy-staging/incoming/${{github.run_id}}
          strip_components: 3
          overwrite: false
      - name: Patch
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          P22_WIRE: ${{ env.P22_WIRE }}
          P22_BOOT: ${{ env.P22_BOOT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: P22_WIRE,P22_BOOT
          command_timeout: 60m
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PYCODE'
            import base64,hashlib,json,os,sys,types;controller=None
            try:
             wire=os.environ['P22_WIRE'];source=os.environ['P22_BOOT']
             if len(source)>32768:raise ValueError('COMPLETION_TRANSPORT_SIZE')
             raw=base64.b64decode(source,validate=True)
             if hashlib.sha256(raw).hexdigest()!='58bc51e9a26f49a54ca59e4e9f5188f43c963fc9f050c4738e3ac3305aa14fd5':raise ValueError('COMPLETION_TRANSPORT_SOURCE')
             transport=types.ModuleType('approved_completion_transport');exec(raw,transport.__dict__)
             verified_transport_sha=hashlib.sha256(raw).hexdigest()
             if transport.TRANSPORT_RAW_SHA256 is not None:raise ValueError('COMPLETION_TRANSPORT_PROFILE')
             transport.TRANSPORT_RAW_SHA256=verified_transport_sha;bundle=transport.decode(wire);os.environ.clear();os.environ.update(PATH='/usr/sbin:/usr/bin:/sbin:/bin',LANG='C')
             resolved=transport.modules(bundle);controller=resolved['patch'];result=transport.execute(bundle)
            except Exception as error:
             result={'ok':False,'stage':'preflight','error_code':'COMPLETION_FAILED'}
             if controller is not None:result={'ok':False,**controller.failure_report(error)}
            print('NAVER_REPORT_PROGRESS_PATCH_RELEASE='+json.dumps(result,sort_keys=True));sys.exit(0 if result.get('ok')else 1)
            PYCODE
