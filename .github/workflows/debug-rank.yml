      - name: 상품 주소 모양 실측 (읽기 전용)
        if: ${{ github.event.inputs.urlshape == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            # ⚠️ 저장소가 공개라 업체명·가게 이름(슬러그)은 출력하지 않는다 — 호스트와 건수만.
            import re, sqlite3, collections
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row

            def host_of(u):
                u = str(u or "")
                if "brand.naver.com" in u:            return "brand"
                if "smartstore.naver.com" in u:       return "smartstore"
                if "shopping.naver.com/catalog" in u: return "catalog"
                if "naver.com" in u:                  return "naver(기타)"
                return "빈값" if not u.strip() else "그 외"

            def slug_of(u, host):
                pat = r"brand\.naver\.com/([^/?#]+)" if host == "brand" else r"smartstore\.naver\.com/([^/?#]+)"
                m = re.search(pat, str(u or ""))
                if not m: return ""
                sl = m.group(1).strip().lower()
                return "" if (not sl or sl.isdigit()) else sl

            SRC = [
                ("추적 상품",      "SELECT id, product_url AS u FROM tracked_products"),
                ("업체 대표주소",  "SELECT id, naver_store_url AS u FROM clients WHERE status='active' AND COALESCE(vertical,'store')='store'"),
                ("키워드별 등록부","SELECT client_id AS id, product_url AS u FROM client_keyword_product"),
            ]
            ss_slugs, br_slugs = {}, {}
            print("[호스트별 건수]")
            for label, sql in SRC:
                cnt = collections.Counter()
                try:
                    for r in conn.execute(sql):
                        h = host_of(r["u"]); cnt[h] += 1
                        sl = slug_of(r["u"], h)
                        if sl and h == "smartstore": ss_slugs.setdefault(sl, set()).add((label, r["id"]))
                        if sl and h == "brand":      br_slugs.setdefault(sl, set()).add((label, r["id"]))
                except Exception as e:
                    print(f"  {label}: 조회 실패 {e}"); continue
                total = sum(cnt.values())
                print(f"  {label} (총 {total})")
                for h, n in cnt.most_common():
                    print(f"      {h:<12} {n:>5}")

            print()
            print("[⭐ 같은 슬러그가 두 호스트에 걸쳐 있나 — 이름공간 판정]")
            both = sorted(set(ss_slugs) & set(br_slugs))
            print(f"  스마트스토어 슬러그 {len(ss_slugs)}종 · 브랜드스토어 슬러그 {len(br_slugs)}종 · 겹침 {len(both)}종")
            print("  (겹침이 있으면 같은 이름공간 = 접두어 없이 한 키로 이어도 된다는 근거)")

            print()
            print("[⭐ 브랜드스토어 슬러그가 상품쪽·업체쪽에서 서로 맞는가 — 고치면 실제로 이어지나]")
            br_by_src = {}
            for label, sql in SRC:
                try:
                    for r in conn.execute(sql):
                        if host_of(r["u"]) != "brand":
                            continue
                        sl = slug_of(r["u"], "brand")
                        if sl:
                            br_by_src.setdefault(label, set()).add(sl)
                except Exception:
                    pass
            prod = br_by_src.get("추적 상품", set())
            cli  = br_by_src.get("업체 대표주소", set()) | br_by_src.get("키워드별 등록부", set())
            print(f"  상품쪽 브랜드 슬러그 {len(prod)}종 · 업체쪽 {len(cli)}종 · 맞는 것 {len(prod & cli)}종")
            print("  ⇒ 맞는 것이 0이면 지금 당장 이어지는 건 없고, 앞으로 등록될 것에만 효과가 있다.")

            print()
            print("[주인 없는 추적 상품의 주소 모양]")
            try:
                q = ("SELECT p.product_url AS u FROM tracked_products p "
                     " WHERE COALESCE(p.disabled_at,'') = '' "
                     "   AND p.id NOT IN (SELECT tracked_product_id FROM rank_link)")
                cnt = collections.Counter(host_of(r["u"]) for r in conn.execute(q))
                print(f"  총 {sum(cnt.values())}개")
                for h, n in cnt.most_common():
                    print(f"      {h:<12} {n:>5}")
            except Exception as e:
                print(f"  조회 실패: {e}")
            conn.close()
            PY

      - name: 분석 집계 A/B (읽기 전용)
        # ⚠️ 별도 스텝으로 맨 뒤에 둔다 — 이 워크플로는 실행 전 스크립트 전문(48KB)을
        #    로그에 먼저 찍어, 큰 스크립트 안에 두면 출력이 tail 에서 잘려 못 읽는다.
        if: ${{ github.event.inputs.cagg == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "== 분석 집계 A/B (읽기 전용 · 업체명 미출력) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, os, time
            c = sqlite3.connect(os.getenv("DB_PATH", "/app/data/logic_data.db"))
            ids = [r[0] for r in c.execute("SELECT id FROM clients WHERE status='active' LIMIT 400")]
            ph = ",".join("?" * len(ids))

            def timed(label, sql, args=()):
                # 두 번 재서 둘 다 적는다 — 첫 회는 캐시가 비어 있어 체감에 가깝고,
                # 두 번째는 캐시가 찬 뒤라 「인덱스만으로 끝나는가」를 드러낸다.
                out = []
                for _ in range(2):
                    t0 = time.perf_counter()
                    n = len(c.execute(sql, args).fetchall())
                    out.append((time.perf_counter() - t0) * 1000)
                print("    %-44s %7.0f ms -> %6.0f ms · %d행" % (label, out[0], out[1], n))

            print("  -- 칸 순서(덩어리 뒤에 무엇이 있나) --")
            cols = [r[1] for r in c.execute("PRAGMA table_info(client_analyses)")]
            print("    %d개: %s" % (len(cols), ", ".join(cols)))
            big = [x for x in ("analysis_json", "report_html") if x in cols]
            if big:
                first = min(cols.index(x) for x in big)
                print("    첫 덩어리 %s(%d번째) 뒤 칸: %s"
                      % (cols[first], first + 1, ", ".join(cols[first + 1:])))

            print("  -- 실제로 도는 두 쿼리(my-clients) --")
            AGG = ("SELECT client_id, COUNT(*), MAX(updated_at), COUNT(DISTINCT keyword),"
                   " COUNT(DISTINCT analyzed_date) FROM client_analyses"
                   " WHERE client_id IN (%s) GROUP BY client_id" % ph)
            LATEST = ("SELECT client_id, keyword, product_url, analyzed_date, updated_at"
                      " FROM client_analyses WHERE client_id IN (%s)"
                      " ORDER BY analyzed_date DESC, updated_at DESC" % ph)
            timed("집계(그대로)", AGG, ids)
            timed("최신1건(그대로)", LATEST, ids)

            print("  -- 어느 칸이 값을 물어오나(한 칸씩 빼 본다) --")
            timed("집계 - keyword", AGG.replace(", COUNT(DISTINCT keyword)", ""), ids)
            timed("집계 - keyword - analyzed_date",
                  AGG.replace(", COUNT(DISTINCT keyword)", "").replace(", COUNT(DISTINCT analyzed_date)", ""), ids)
            timed("최신1건 - keyword - product_url",
                  LATEST.replace(", keyword, product_url", ""), ids)

            print("  -- 인덱스가 실제로 어떻게 쓰이나 --")
            for lbl, q in [("집계", AGG), ("최신1건", LATEST)]:
                plan = " / ".join(r[-1] for r in c.execute("EXPLAIN QUERY PLAN " + q, ids))
                print("    %-10s %s" % (lbl, plan))
            print("  -- client_analyses 에 걸린 인덱스 --")
            for r in c.execute("SELECT name, sql FROM sqlite_master WHERE type='index'"
                               " AND tbl_name='client_analyses'"):
                print("    %-36s %s" % (r[0], (r[1] or "(자동)")))

            print("  -- clients 시각: 두 경로가 섞였나 --")
            print("     clients.py 등록분은 UTC 기본값 · client_dashboard 등록분은 KST 명시.")
            print("     시각대가 두 무리로 갈리면 일괄 보정이 불가능하다는 뜻이다.")
            try:
                for r in c.execute(
                        "SELECT substr(created_at,12,2) h, COUNT(*) n FROM clients"
                        " WHERE created_at IS NOT NULL AND length(created_at) >= 13"
                        " GROUP BY h ORDER BY h"):
                    print("    %s시 · %4d곳" % (r[0], r[1]))
                bad = c.execute("SELECT COUNT(*) FROM clients WHERE created_at IS NULL"
                                " OR length(created_at) < 13").fetchone()[0]
                print("    (시각 형식이 아닌 행 %d곳)" % bad)
            except Exception as e:
                print("    조회 실패: %s" % e)
            PY

