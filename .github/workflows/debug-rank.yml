    if: ${{ inputs.ad_prepare == 'inspect' || inputs.ad_prepare == 'prepare' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ad-deploy-prep-20261001' && inputs.ad_prepare == 'tunnel-keygen') }}
    permissions:
      contents: read
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: 준비 입력 확인 — 원격 연결 전
        env:
          AD_PREPARE_MODE: ${{ inputs.ad_prepare }}
          AD_EXPECTED_BASELINE: ${{ inputs.ad_expected_baseline }}
          AD_RUN_EVENT: ${{ github.event_name }}
          AD_RUN_REF: ${{ github.ref }}
          AD_RUN_INPUTS: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          set -euo pipefail
          case "$AD_PREPARE_MODE" in
            inspect) test -z "$AD_EXPECTED_BASELINE" ;;
            prepare) [[ "$AD_EXPECTED_BASELINE" =~ ^[0-9a-f]{64}$ ]] ;;
            tunnel-keygen)
              [[ "$AD_EXPECTED_BASELINE" =~ ^[0-9a-f]{64}$ ]] || exit 1
              test "$AD_RUN_EVENT" = workflow_dispatch || exit 1
              test "$AD_RUN_REF" = refs/heads/codex/ad-deploy-prep-20261001 || exit 1
              python3 -c 'import json, os, sys; values=json.loads(os.environ["AD_RUN_INPUTS"]); allowed={"ad_prepare", "ad_expected_baseline"}; sys.exit(0 if all(value == "off" for name, value in values.items() if name not in allowed) else 1)' || exit 1
              ;;
            *) exit 1 ;;
          esac
      - name: 광고센터 전용 준비 경로 확인·준비
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          AD_PREPARE_MODE: ${{ inputs.ad_prepare }}
          AD_EXPECTED_BASELINE: ${{ inputs.ad_expected_baseline }}
        with:
          envs: AD_PREPARE_MODE,AD_EXPECTED_BASELINE
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          # script_stop은 heredoc 안에도 셸 검사문을 끼워 넣으므로 쓰지 않는다.
          # 아래 set -eu + Python의 실패 종료로 작업 전체를 중단한다.
          script: |
            set -eu
            python3 - <<'PY'
            import base64, grp, hashlib, ipaddress, json, os, pathlib, pwd, re, shutil, socket, stat, subprocess

            # 공개 실행 로그: 환경·키·DB·앱 로그를 읽지 않고 Docker 메타데이터만 선택한다.
            def command(args):
                try:
                    result = subprocess.run(args, capture_output=True, text=True, timeout=12)
                except (OSError, subprocess.TimeoutExpired):
                    raise RuntimeError('command_unavailable') from None
                if result.returncode:
                    raise RuntimeError('command_failed')
                return result.stdout.strip()

            def metadata(path):
                target = pathlib.Path(path)
                try:
                    info = target.lstat()
                except FileNotFoundError:
                    return {'exists': False}
                return {'exists': True, 'symlink': stat.S_ISLNK(info.st_mode),
                        'directory': stat.S_ISDIR(info.st_mode), 'uid': info.st_uid,
                        'gid': info.st_gid, 'mode': oct(stat.S_IMODE(info.st_mode))}

            def probe(args):
                # 선택 도구의 부재/실패는 원문 stdout/stderr 없이 unknown으로 보고한다.
                try:
                    result = subprocess.run(args, capture_output=True, text=True, timeout=5)
                except (OSError, subprocess.TimeoutExpired):
                    return None
                if result.returncode or len(result.stdout) + len(result.stderr) > 16384:
                    return None
                return result

            def tunnel_preflight():
                ssh = probe(['ssh', '-V'])
                ssh_match = re.search(r'\bOpenSSH_([0-9]{1,2}\.[0-9]{1,2}(?:p[0-9]{1,2})?)\b',
                                      ssh.stdout + '\n' + ssh.stderr) if ssh else None
                systemd = probe(['systemd', '--version'])
                systemd_text = systemd.stdout if systemd else ''
                systemd_match = re.search(r'(?m)^systemd ([0-9]{1,4})\b', systemd_text)
                feature = re.search(r'(?<!\S)([+-])BPF_FRAMEWORK(?!\S)', systemd_text)
                route = {'available': False, 'source_matches_expected': None}
                result = probe(['ip', '-json', 'route', 'get', '1.234.23.117'])
                if result:
                    try:
                        rows = json.loads(result.stdout)
                        if isinstance(rows, list) and len(rows) == 1 and isinstance(rows[0], dict):
                            selected = rows[0].get('prefsrc', rows[0].get('src'))
                            if isinstance(selected, str):
                                selected = str(ipaddress.IPv4Address(selected))
                                route = {'available': True, 'source_matches_expected': selected == '1.234.20.80'}
                    except (ValueError, TypeError):
                        pass
                try:
                    account = pwd.getpwuid(10001)
                except KeyError:
                    account = None
                try:
                    group = grp.getgrgid(10001)
                except KeyError:
                    group = None
                identity = {'uid_10001_exists': account is not None,
                            'uid_10001_primary_gid': account.pw_gid if account else None,
                            'gid_10001_exists': group is not None,
                            'gid_10001_explicit_member_count': len(group.gr_mem) if group else 0,
                            'gid_10001_primary_member_count': sum(row.pw_gid == 10001 for row in pwd.getpwall())}
                return {'ssh_version': 'OpenSSH_' + ssh_match.group(1) if ssh_match else None,
                        'systemd_version': 'systemd ' + systemd_match.group(1) if systemd_match else None,
                        'route': route, 'identity': identity,
                        'paths': {'config': metadata('/etc/metainc/naver-erp-tunnel'),
                                  'service': metadata('/etc/systemd/system/metainc-naver-erp-tunnel.service'),
                                  'runtime': metadata('/run/metainc-naver-erp-tunnel')},
                        # 읽기 지표일 뿐 실제 BPF 프로그램 부착/패킷 거절은 검증하지 않는다.
                        # 기능 probe·임시 unit 실행은 커널/서비스 변경이므로 이 진단에서 금지한다.
                        'bpf': {'systemd_framework_compiled': feature.group(1) == '+' if feature else None,
                                'cgroup_v2': pathlib.Path('/sys/fs/cgroup/cgroup.controllers').is_file(),
                                'bpffs_directory_exists': pathlib.Path('/sys/fs/bpf').is_dir(),
                                'runtime_enforcement_verified': False,
                                'assessment': 'read_only_indicators_only'}}

            def tunnel_public_file_metadata(path):
                result = metadata(path)
                result['sha256'] = None
                if not result['exists'] or result['symlink'] or result['directory']:
                    return result
                try:
                    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                    try:
                        item = os.fstat(fd)
                        if not stat.S_ISREG(item.st_mode) or item.st_uid != 0 or item.st_nlink != 1 or item.st_size > 262144:
                            return result
                        body = os.read(fd, 262145)
                        if len(body) == item.st_size:
                            result['sha256'] = hashlib.sha256(body).hexdigest()
                    finally:
                        os.close(fd)
                except OSError:
                    pass
                return result

            def tunnel_service_diagnostics():
                unit = 'metainc-naver-erp-tunnel.service'
                fields = ('ActiveState', 'SubState', 'Result', 'ExecMainCode', 'ExecMainStatus', 'NRestarts')
                state = {name: None for name in fields}
                prestart = {'code': None, 'status': None}
                shown = probe(['systemctl', 'show', unit, '--no-pager',
                               '--property=' + ','.join(fields + ('ExecStartPre',))])
                if shown:
                    for line in shown.stdout.splitlines():
                        name, _, value = line.partition('=')
                        if name in fields:
                            if name in ('ExecMainCode', 'ExecMainStatus', 'NRestarts'):
                                state[name] = int(value) if re.fullmatch(r'[0-9]{1,10}', value) else None
                            elif re.fullmatch(r'[a-z-]{1,40}', value):
                                state[name] = value
                        elif name == 'ExecStartPre':
                            code = re.search(r'(?:^|[; ])code=(exited|killed|dumped|[0-9]+)(?:[; ]|$)', value)
                            status = re.search(r'(?:^|[; ])status=([0-9]{1,5})(?:[; /}]|$)', value)
                            if code:
                                raw = code.group(1)
                                prestart['code'] = int(raw) if raw.isdigit() else {'exited': 1, 'killed': 2, 'dumped': 3}[raw]
                            prestart['status'] = int(status.group(1)) if status else None
                patterns = {'exec': r'\bEXEC\b', 'group': r'\bGROUP\b', 'namespace': r'\bNAMESPACE\b',
                            'ip_address': r'IPAddress', 'bpf': r'\bBPF\b',
                            'permission': r'permission|operation not permitted',
                            'exit_status': r'exit[- ](?:code|status)|status=[0-9]'}
                counts = {name: 0 for name in patterns}
                journal = probe(['journalctl', '--unit=' + unit, '-n', '30', '-o', 'json', '--no-pager'])
                parsed = 0
                if journal:
                    for line in journal.stdout.splitlines()[:30]:
                        try:
                            row = json.loads(line)
                            message = row.get('MESSAGE', '')
                            if not isinstance(message, str):
                                continue
                            parsed += 1
                            for name, pattern in patterns.items():
                                counts[name] += bool(re.search(pattern, message, re.IGNORECASE))
                        except (ValueError, TypeError, AttributeError):
                            pass
                tcp = {}
                # 각 목적지 1회·2초, 인증/전송 없이 연결만 닫는다. unit 실행/정책 변경 없음.
                for name, address in (('be_ssh', '1.234.23.117'), ('loopback_ssh', '127.0.0.1')):
                    try:
                        with socket.create_connection((address, 22), timeout=2):
                            pass
                        tcp[name] = {'success': True, 'errno': None}
                    except OSError as error:
                        tcp[name] = {'success': False, 'errno': error.errno if isinstance(error.errno, int) else None}
                try:
                    group = grp.getgrgid(10001)
                    group_info = {'exists': True, 'gid': group.gr_gid,
                                  'name_matches_expected': group.gr_name == 'metainc-naver-erp-tunnel',
                                  'explicit_member_count': len(group.gr_mem)}
                except KeyError:
                    group_info = {'exists': False}
                python = {'link': metadata('/usr/bin/python3'), 'target': None, 'executable': None}
                try:
                    target = pathlib.Path('/usr/bin/python3').resolve(strict=True)
                    python.update(target=metadata(target), executable=os.access(str(target), os.X_OK))
                except OSError:
                    pass
                return {'state': state, 'exec_start_pre': prestart,
                        'journal': {'available': journal is not None, 'parsed_rows': parsed, 'pattern_counts': counts},
                        'files': {name: tunnel_public_file_metadata(path) for name, path in (
                            ('unit', '/etc/systemd/system/' + unit),
                            ('ssh_config', '/etc/metainc/naver-erp-tunnel/ssh_config'),
                            ('known_hosts', '/etc/metainc/naver-erp-tunnel/known_hosts'),
                            ('bpf_probe', '/etc/metainc/naver-erp-tunnel/bpf_preflight.py'))},
                        'runtime': metadata('/run/metainc-naver-erp-tunnel'),
                        'socket': metadata('/run/metainc-naver-erp-tunnel/erp.sock'),
                        'group': group_info, 'python': python, 'tcp_once': tcp}

            def inspect():
                names = command(['docker', 'ps', '-a', '--format', '{{.Names}}']).splitlines()
                names = [n for n in names if re.fullmatch(r'[a-zA-Z0-9_.-]{1,100}', n)
                         and re.search(r'ad-api|ad-dashboard|logic-analysis|studio|autobid', n)]
                if not names or len(names) > 20:
                    raise RuntimeError('unexpected_container_inventory')
                containers = []
                for name in sorted(names):
                    item = {'name': name}
                    for field, template in {
                        'id': '{{json .Id}}', 'image_id': '{{json .Image}}',
                        'running': '{{json .State.Running}}',
                        'started_at': '{{json .State.StartedAt}}',
                        'restart_count': '{{json .RestartCount}}',
                        'project': '{{json (index .Config.Labels "com.docker.compose.project")}}',
                        'service': '{{json (index .Config.Labels "com.docker.compose.service")}}',
                        'working_dir': '{{json (index .Config.Labels "com.docker.compose.project.working_dir")}}',
                        'config_files': '{{json (index .Config.Labels "com.docker.compose.project.config_files")}}',
                        'mounts': '{{json .Mounts}}',
                    }.items():
                        item[field] = json.loads(command(['docker', 'inspect', '--format', template, name]))
                    item['mounts'] = [{k: m.get(k) for k in ('Type', 'Source', 'Destination', 'RW')}
                                      for m in item['mounts']]
                    wd = item['working_dir']
                    if isinstance(wd, str) and wd.startswith('/'):
                        item['directory_stat'] = metadata(wd)
                        item['env_stat'] = metadata(str(pathlib.Path(wd) / '.env'))
                        item['git_stat'] = metadata(str(pathlib.Path(wd) / '.git'))
                    containers.append(item)
                ad = [c for c in containers if c['service'] == 'ad-api']
                if len(ad) != 1 or not ad[0]['running']:
                    raise RuntimeError('ad_service_not_unique_running')
                mem = {}
                for line in pathlib.Path('/proc/meminfo').read_text().splitlines():
                    if line.split(':')[0] in ('MemTotal', 'MemAvailable'):
                        mem[line.split(':')[0]] = int(line.split()[1])
                disk = shutil.disk_usage('/srv')
                report = {'mode': 'inspect', 'mutations': 0, 'uid': os.geteuid(),
                          'cpu_count': os.cpu_count(), 'load_average': os.getloadavg(),
                          'memory_kib': mem, 'disk_bytes': {'total': disk.total, 'free': disk.free},
                          'docker_version': command(['docker', '--version']),
                          'compose_version': command(['docker', 'compose', 'version', '--short']),
                          'staging_stat': metadata('/srv/metainc/ad-deploy-staging'),
                          'containers': containers}
                return report

            def preview_readiness():
                # 인증서/환경파일/원격 자격은 읽지 않는다. nginx 구성은 필요한 메타데이터만 반환.
                result = probe(['nginx', '-T'])
                configs = []
                if result:
                    for section in re.split(r'(?m)^# configuration file ', result.stdout)[1:]:
                        name, _, body = section.partition(':\n')
                        if 'dashboard.metainc.co.kr' not in body:
                            continue
                        configs.append({'path': name, 'sha256': hashlib.sha256(body.encode()).hexdigest(),
                            'locations': re.findall(r'(?m)^\s*location\s+([^\n{;]{1,120})\s*\{', body),
                            'upstreams': re.findall(r'(?m)^\s*proxy_pass\s+(https?://(?:127\.0\.0\.1|localhost):[0-9]{2,5}/?);', body),
                            'tls': bool(re.search(r'listen\s+443', body))})
                return {'nginx_available': result is not None, 'dashboard_configs': configs,
                        'paths': {name: metadata(name) for name in (
                            '/etc/metainc/naver-engine', '/var/lib/metainc/naver-engine',
                            '/run/metainc/naver-engine', '/var/backups/metainc/naver-engine',
                            '/etc/metainc/naver-deploy-envelope')},
                        'openssl_available': probe(['openssl', 'version']) is not None}

            def baseline(report):
                fields = ('name', 'id', 'image_id', 'running', 'started_at',
                          'restart_count', 'project', 'service')
                value = [{key: row[key] for key in fields}
                         for row in sorted(report['containers'], key=lambda row: row['name'])]
                return hashlib.sha256(json.dumps(value, sort_keys=True,
                    separators=(',', ':')).encode('utf-8')).hexdigest()

            created = []
            def tunnel_keygen(report, expected):
                if os.geteuid() != 0 or not re.fullmatch(r'[0-9a-f]{64}', expected):
                    raise RuntimeError('invalid_keygen_context')
                if baseline(report) != expected:
                    raise RuntimeError('baseline_changed')
                folder = pathlib.Path('/etc/metainc/naver-erp-tunnel')
                # 선행 디렉터리만 검사한다. 기존 키/환경파일 내용은 열지 않는다.
                for parent in (pathlib.Path('/'), pathlib.Path('/etc'), folder.parent):
                    info = metadata(parent)
                    if not info['exists'] and parent == folder.parent:
                        continue
                    if (not info['exists'] or info['symlink'] or not info['directory']
                            or info['uid'] != 0 or info['gid'] != 0 or int(info['mode'], 8) & 0o022):
                        raise RuntimeError('unsafe_keygen_parent')
                if os.path.lexists(str(folder)):
                    raise RuntimeError('keygen_path_exists')
                old_umask = os.umask(0o077)
                try:
                    if not folder.parent.exists():
                        os.mkdir(str(folder.parent), 0o700)
                        created.append(str(folder.parent))
                    # 원자적 mkdir: 동일 모드 중복 실행도 기존 경로를 재사용하지 않는다.
                    os.mkdir(str(folder), 0o700)
                    created.append(str(folder))
                    info = folder.lstat()
                    if (not stat.S_ISDIR(info.st_mode) or info.st_uid != 0 or info.st_gid != 0
                            or stat.S_IMODE(info.st_mode) != 0o700):
                        raise RuntimeError('keygen_directory_permissions')
                    identity = (info.st_dev, info.st_ino)
                    private = folder / 'id_ed25519'
                    result = subprocess.run(['/usr/bin/ssh-keygen', '-q', '-t', 'ed25519', '-N', '',
                        '-C', 'naver-erp-tunnel', '-f', str(private)], stdin=subprocess.DEVNULL,
                        stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20,
                        env={'PATH': '/usr/bin:/bin', 'LANG': 'C'})
                    if result.returncode:
                        raise RuntimeError('keygen_failed')
                    current = folder.lstat()
                    if identity != (current.st_dev, current.st_ino):
                        raise RuntimeError('keygen_directory_changed')
                    public = None
                    files = {}
                    for target in (private, folder / 'id_ed25519.pub'):
                        fd = os.open(str(target), os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                        try:
                            item = os.fstat(fd)
                            if (not stat.S_ISREG(item.st_mode) or item.st_uid != 0 or item.st_gid != 0
                                    or item.st_nlink != 1 or stat.S_IMODE(item.st_mode) != 0o600
                                    or not 0 < item.st_size < 4096):
                                raise RuntimeError('keygen_file_permissions')
                            files[target.name] = {'uid': item.st_uid, 'gid': item.st_gid,
                                'mode': oct(stat.S_IMODE(item.st_mode)), 'links': item.st_nlink,
                                'inode_sha256': hashlib.sha256(('%s:%s' % (
                                    item.st_dev, item.st_ino)).encode('ascii')).hexdigest()}
                            if target.name.endswith('.pub'):
                                public = os.read(fd, 512).decode('ascii').strip()
                        finally:
                            os.close(fd)
                    if not public or not re.fullmatch(r'ssh-ed25519 [A-Za-z0-9+/]{68} naver-erp-tunnel', public):
                        raise RuntimeError('invalid_generated_public_key')
                    blob = base64.b64decode(public.split()[1], validate=True)
                    if len(blob) != 51 or blob[:19] != b'\x00\x00\x00\x0bssh-ed25519\x00\x00\x00\x20':
                        raise RuntimeError('invalid_generated_public_key')
                    if baseline(inspect()) != expected:
                        raise RuntimeError('container_changed_during_keygen')
                    return {'mode': 'tunnel-keygen', 'public_key': public,
                            'files': files, 'directory_mode': oct(stat.S_IMODE(current.st_mode)),
                            'baseline_sha256': expected, 'containers_unchanged': True,
                            'private_key_exported': False, 'service_installed': False}
                finally:
                    os.umask(old_umask)
                # 실패 잔재는 삭제/교체하지 않는다. created 목록으로 수동 점검 후 중단한다.

            def prepare(report, expected):
                if os.geteuid() != 0 or not re.fullmatch(r'[0-9a-f]{64}', expected):
                    raise RuntimeError('invalid_prepare_context')
                if baseline(report) != expected:
                    raise RuntimeError('baseline_changed')
                root = pathlib.Path('/srv/metainc/ad-deploy-staging')
                folders = [pathlib.Path('/srv'), root.parent, root,
                           root / 'incoming', root / 'releases', root / 'receipts']
                marker = root / 'PREPARATION_ONLY.json'
                marker_body = b'{"schema":1,"service":"ad-api","deployment_enabled":false}\n'
                # 쓰기 전에 모든 상위 경로·기존 항목을 검사한다. 기존 권한은 바꾸지 않는다.
                for folder in folders:
                    info = metadata(folder)
                    if info['exists'] and (info['symlink'] or not info['directory']
                            or info['uid'] != 0 or info['gid'] != 0
                            or int(info['mode'], 8) & 0o022
                            or (folder in folders[2:] and info['mode'] != '0o700')):
                        raise RuntimeError('unsafe_existing_directory')
                if root.exists():
                    if set(p.name for p in root.iterdir()) - {
                            'incoming', 'releases', 'receipts', 'PREPARATION_ONLY.json'}:
                        raise RuntimeError('unexpected_staging_content')
                for folder in folders[3:]:
                    if folder.exists() and any(folder.iterdir()):
                        raise RuntimeError('staging_is_in_use')
                info = metadata(marker)
                if info['exists']:
                    st = marker.lstat()
                    if (info['symlink'] or not stat.S_ISREG(st.st_mode)
                            or st.st_uid != 0 or st.st_gid != 0 or st.st_nlink != 1
                            or stat.S_IMODE(st.st_mode) != 0o600
                            or st.st_size != len(marker_body)
                            or marker.read_bytes() != marker_body):
                        raise RuntimeError('unexpected_staging_marker')
                for folder in folders[1:]:
                    if not folder.exists():
                        folder.mkdir(mode=0o750 if folder == root.parent else 0o700)
                        created.append(str(folder))
                if not info['exists']:
                    fd = os.open(str(marker), os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                    created.append(str(marker))
                    with os.fdopen(fd, 'wb') as output:
                        output.write(marker_body)
                        output.flush()
                        os.fsync(output.fileno())
                # 요청 mode와 실제 결과는 다를 수 있다(umask·그룹 상속). 고치지 말고 검증한다.
                for folder in folders[2:]:
                    actual = metadata(folder)
                    if (not actual['exists'] or actual['symlink'] or not actual['directory']
                            or actual['uid'] != 0 or actual['gid'] != 0 or actual['mode'] != '0o700'):
                        raise RuntimeError('created_directory_permissions_mismatch')
                actual = marker.lstat()
                if (not stat.S_ISREG(actual.st_mode) or actual.st_uid != 0 or actual.st_gid != 0
                        or actual.st_nlink != 1 or stat.S_IMODE(actual.st_mode) != 0o600
                        or actual.st_size != len(marker_body)):
                    raise RuntimeError('created_marker_permissions_mismatch')
                after = inspect()
                if baseline(after) != expected:
                    raise RuntimeError('container_changed_during_preparation')
                return {'mode': 'prepare', 'created': created,
                        'staging_stat': after['staging_stat'], 'baseline_sha256': expected,
                        'containers_unchanged': True, 'deployment_enabled': False,
                        'existing_environment_changed': False, 'existing_permissions_changed': False}

            try:
                mode = os.environ.get('AD_PREPARE_MODE', 'inspect')
                if mode not in ('inspect', 'prepare', 'tunnel-keygen'):
                    raise RuntimeError('invalid_mode')
                report = inspect()
                report['baseline_sha256'] = baseline(report)
                if mode == 'tunnel-keygen':
                    report = tunnel_keygen(report, os.environ.get('AD_EXPECTED_BASELINE', ''))
                elif mode == 'prepare':
                    report = prepare(report, os.environ.get('AD_EXPECTED_BASELINE', ''))
                else:
                    report['tunnel_preflight'] = tunnel_preflight()
                    report['tunnel_service'] = tunnel_service_diagnostics()
                    report['preview_readiness'] = preview_readiness()
                    if baseline(inspect()) != report['baseline_sha256']:
                        raise RuntimeError('container_changed_during_inspection')
                    report['containers_unchanged'] = True
                print('AD_DEPLOY_PREFLIGHT=' + json.dumps(report, sort_keys=True))
            except Exception as exc:
                # 예외 원문/표준 오류에는 경로·자격이 섞일 수 있어 출력하지 않는다.
                print('AD_DEPLOY_PREFLIGHT_FAILED=' + type(exc).__name__)
                print('AD_DEPLOY_CREATED_PATHS=' + json.dumps(created))
                raise SystemExit(1)
            PY

  ad-tunnel-install:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ad-deploy-prep-20261001' && (inputs.ad_prepare == 'tunnel-install' || inputs.ad_prepare == 'tunnel-activate') }}
    permissions:
      contents: read
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: 승인된 가지 소스 받기 — 자격 저장 없음
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 공개 입력 검증과 신뢰 소스 패키징 — 서버 연결 없음
        env:
          AD_RUN_EVENT: ${{ github.event_name }}
          AD_RUN_REF: ${{ github.ref }}
          AD_RUN_INPUTS: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'INSTALL_PACKAGE'
          import base64, importlib.util, json, os, pathlib, sys
          def unique_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate_field')
                  result[key] = value
              return result
          try:
              if (os.environ.get('AD_RUN_EVENT') != 'workflow_dispatch'
                      or os.environ.get('AD_RUN_REF') != 'refs/heads/codex/ad-deploy-prep-20261001'):
                  raise ValueError('invalid_context')
              inputs = json.loads(os.environ['AD_RUN_INPUTS'], object_pairs_hook=unique_pairs)
              if (inputs.get('ad_prepare') not in ('tunnel-install', 'tunnel-activate') or any(value != 'off'
                      for name, value in inputs.items() if name not in ('ad_prepare', 'ad_expected_baseline'))):
                  raise ValueError('invalid_mode')
              raw = inputs['ad_expected_baseline']
              if not isinstance(raw, str) or not 0 < len(raw) <= 16384:
                  raise ValueError('invalid_size')
              package = json.loads(raw, object_pairs_hook=unique_pairs)
              path = pathlib.Path('backend/tools/naver_erp_tunnel_service_install.py')
              spec = importlib.util.spec_from_file_location('trusted_tunnel_installer', path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              module.validate_package(package)
              installer = path.read_bytes()
              probe = path.with_name('naver_erp_tunnel_bpf_preflight.py').read_bytes()
              if not 0 < len(installer) <= 131072 or not 0 < len(probe) <= 16384:
                  raise ValueError('invalid_source_size')
              bundle = {'operation': inputs['ad_prepare'], 'package': package, 'installer_source': base64.b64encode(installer).decode('ascii'),
                        'probe_source': base64.b64encode(probe).decode('ascii')}
              encoded = base64.b64encode(json.dumps(bundle, separators=(',', ':')).encode()).decode('ascii')
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('NAVER_TUNNEL_INSTALL_BUNDLE_B64=' + encoded + '\n')
          except Exception:
              print('NAVER_TUNNEL_INSTALL_INPUT_REJECTED')
              sys.exit(1)
          INSTALL_PACKAGE
      - name: Linux 합성 안전 검사 — 실제 키·서버 연결 없음
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s backend/tests -p 'test_ad_tunnel_*.py' -q
          python3 -m unittest discover -s backend/tests -p 'test_naver_erp_tunnel_service_install.py' -q
      - name: 신규 터널 서비스만 설치 또는 검증 활성화 — 기존 앱 재시작 없음
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          NAVER_TUNNEL_INSTALL_BUNDLE_B64: ${{ env.NAVER_TUNNEL_INSTALL_BUNDLE_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NAVER_TUNNEL_INSTALL_BUNDLE_B64
          command_timeout: 180s
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'INSTALL_REMOTE'
            import base64, contextlib, io, json, os, re, sys, types
            stage = 'decode'
            module = None
            try:
                encoded = os.environ.get('NAVER_TUNNEL_INSTALL_BUNDLE_B64', '')
                os.environ.clear()
                os.environ.update({'PATH': '/usr/sbin:/usr/bin:/sbin:/bin', 'LANG': 'C'})
                if not 0 < len(encoded) <= 280000:
                    raise ValueError('invalid_bundle')
                bundle = json.loads(base64.b64decode(encoded, validate=True))
                if not isinstance(bundle, dict) or set(bundle) != {'operation', 'package', 'installer_source', 'probe_source'}:
                    raise ValueError('invalid_bundle_fields')
                if bundle['operation'] not in ('tunnel-install', 'tunnel-activate'):
                    raise ValueError('invalid_operation')
                installer = base64.b64decode(bundle['installer_source'], validate=True)
                probe = base64.b64decode(bundle['probe_source'], validate=True)
                if not 0 < len(installer) <= 131072 or not 0 < len(probe) <= 16384:
                    raise ValueError('invalid_source_size')
                stage = 'activate' if bundle['operation'] == 'tunnel-activate' else 'install'
                module = types.ModuleType('trusted_tunnel_installer')
                # 공개 입력과 소스는 고정 가지 checkout에서만 온다. 원격 임시 소스파일 없음.
                with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                    exec(compile(installer, '<trusted-tunnel-installer>', 'exec'), module.__dict__)
                    module.validate_package(bundle['package'])
                    if bundle['operation'] == 'tunnel-activate':
                        result = module.activate_installed(bundle['package'], probe_source=probe)
                    else:
                        result = module.install(bundle['package'], probe_source=probe)
                if not isinstance(result, dict) or type(result.get('ok')) is not bool:
                    raise ValueError('invalid_receipt')
            except Exception as error:
                # 통제된 설치 오류 코드만 허용한다. 일반 예외 원문/SSH stderr는 출력 금지.
                controlled = isinstance(error, getattr(module, 'InstallError', ()))
                code = str(error) if controlled and re.fullmatch(r'[A-Z0-9_]{1,80}', str(error)) else None
                result = {'ok': False, 'stage': stage, 'error_kind': type(error).__name__, 'error_code': code}
            print('NAVER_TUNNEL_SERVICE_INSTALL_V1 ' + json.dumps(result, sort_keys=True))
            sys.exit(0 if result['ok'] else 1)
            INSTALL_REMOTE

  diagnose:
    if: ${{ !inputs.ad_prepare || inputs.ad_prepare == 'off' }}
    runs-on: ubuntu-latest
    steps:
      # 브랜치 코드 미리보기용 — 평소(off)엔 받아만 두고 쓰지 않는다.
      - uses: actions/checkout@v4
      - name: 브랜치 rank_link.py 인코딩
        if: ${{ github.event.inputs.use_branch_code == 'on' }}
        run: echo "RL_SRC_GZ=$(gzip -9c backend/rank_link.py | base64 -w0)" >> "$GITHUB_ENV"

      - name: Rank batch read-only diagnosis
        uses: appleboy/ssh-action@v1.0.3
        env:
          RL_SRC_GZ: ${{ env.RL_SRC_GZ }}
          IN_COLLECTOR: ${{ github.event.inputs.collector }}
          IN_RANK_LINK: ${{ github.event.inputs.rank_link }}
          IN_CAPACITY: ${{ github.event.inputs.capacity }}
          IN_STRUCTURE: ${{ github.event.inputs.structure }}
          IN_EXPIRED: ${{ github.event.inputs.expired }}
          IN_BRANCH_CODE: ${{ github.event.inputs.use_branch_code }}
        with:
          envs: RL_SRC_GZ,IN_COLLECTOR,IN_RANK_LINK,IN_CAPACITY,IN_STRUCTURE,IN_EXPIRED,IN_BRANCH_CODE
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "== 컨테이너 상태 =="
            docker ps --filter name=logic-analysis --format '{{.Names}} {{.Status}}'
            docker inspect -f 'RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} OOMKilled={{.State.OOMKilled}}' logic-analysis
            echo
            echo "== 오늘 배치 로그 (순위/수집/스케줄러) =="
            # ⚠️ 이 줄이 검색 키워드를 공개 실행 로그에 그대로 남기고 있었다(2026-09-11 실측).
            #    개별 「검색 결과 0건」 줄은 총계가 완료 로그에 이미 있어 정보가 겹친다 — 빼고,
            #    남는 줄의 대괄호·keyword: 도 가린다. 이 저장소는 공개다.
            #    (9/8 PR #196 이 place=on 쪽만 막았고 이 자리는 입력과 무관하게 늘 실행됐다.)
            docker logs --since 12h logic-analysis 2>&1 \
              | grep -iE '순위 추적|수집 실패|검색 결과 0건|스케줄러|전체 분석|rank_tracking|daily_analysis' \
              | grep -v '검색 결과 0건 — 수집 실패로 보고' \
              | sed -E "s/\\[[^]]{1,60}\\]/[**]/g; s/keyword: [^)]*/keyword: **/g" \
              | tail -60 || echo "(매칭 없음)"
            echo
            echo "== DB 현황 (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()

            print("[client_rank_history 오늘 · check_type별]")
            for r in c.execute("""SELECT check_type, COUNT(*) n,
                                    SUM(CASE WHEN rank_position IS NULL THEN 1 ELSE 0 END) nr,
                                    MIN(checked_at) mn, MAX(checked_at) mx
                                  FROM client_rank_history
                                  WHERE DATE(checked_at)=DATE('now','localtime')
                                  GROUP BY check_type"""):
                print(f"  {r['check_type']}: {r['n']}건 (미노출 {r['nr']}) {r['mn']} ~ {r['mx']}")

            print("\n[rankings(추적상품) 오늘 · check_type별]")
            for r in c.execute("""SELECT check_type, COUNT(*) n,
                                    SUM(CASE WHEN rank_position IS NULL THEN 1 ELSE 0 END) nr,
                                    MIN(checked_at) mn, MAX(checked_at) mx
                                  FROM rankings
                                  WHERE DATE(checked_at)=DATE('now','localtime')
                                  GROUP BY check_type"""):
                print(f"  {r['check_type']}: {r['n']}건 (미노출 {r['nr']}) {r['mn']} ~ {r['mx']}")
            n = c.execute("SELECT COUNT(*) n FROM rankings WHERE DATE(checked_at)=DATE('now','localtime')").fetchone()['n']
            if not n:
                print("  (오늘 기록 없음)")

            print("\n[수집 데이터(collected_serp) 최근 3일]")
            try:
                for r in c.execute("""SELECT collected_date d, COUNT(DISTINCT keyword) kw, COUNT(*) rows
                                      FROM collected_serp
                                      WHERE collected_date >= DATE('now','localtime','-2 day')
                                      GROUP BY collected_date ORDER BY d"""):
                    print(f"  {r['d']}: 키워드 {r['kw']} · 행 {r['rows']}")
            except Exception as e:
                print("  collected_serp 조회 실패:", e)
                print("  테이블 목록:", [t[0] for t in c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%collect%'")])

            print("\n[통합 설계용 — 두 축 규모·겹침]")
            import re as _re
            def _pid(u):
                u = u or ""
                for pat in (r"[?&]nvMid=(\d+)", r"/products/(\d+)", r"/catalog/(\d+)"):
                    m = _re.search(pat, u)
                    if m: return m.group(1)
                return ""
            tp = c.execute("SELECT COUNT(*) n FROM tracked_products").fetchone()["n"]
            tk = c.execute("SELECT COUNT(*) n FROM tracked_keywords").fetchone()["n"]
            cl = c.execute("SELECT COUNT(*) n FROM clients WHERE status='active'").fetchone()["n"]
            crh = c.execute("SELECT COUNT(*) n FROM client_rank_history").fetchone()["n"]
            rk = c.execute("SELECT COUNT(*) n FROM rankings").fetchone()["n"]
            print(f"  축A 추적상품 {tp} · 추적키워드 {tk} · rankings {rk}행")
            print(f"  축B 업체(active) {cl} · client_rank_history {crh}행")
            a_pids = set()
            for r in c.execute("SELECT product_url FROM tracked_products"):
                p = _pid(r["product_url"])
                if p: a_pids.add(p)
            b_pids = set()
            for r in c.execute("SELECT naver_store_url FROM clients WHERE status='active'"):
                p = _pid(r["naver_store_url"])
                if p: b_pids.add(p)
            inter = a_pids & b_pids
            print(f"  상품ID 보유: 축A {len(a_pids)}/{tp} · 축B {len(b_pids)}/{cl}")
            pa = round(len(inter)*100/max(1,len(a_pids)))
            pb = round(len(inter)*100/max(1,len(b_pids)))
            print(f"  * 상품ID 기준 겹침 {len(inter)}건 (축A의 {pa}% / 축B의 {pb}%)")
            orph = c.execute("SELECT COUNT(*) n FROM client_rank_history WHERE client_id NOT IN (SELECT id FROM clients)").fetchone()["n"]
            print(f"  고아 순위행(업체 삭제됨): {orph}")
            kw_a = {r[0] for r in c.execute("SELECT DISTINCT keyword FROM tracked_keywords")}
            kw_b = {r[0] for r in c.execute("SELECT DISTINCT keyword FROM client_rank_history")}
            print(f"  키워드 축A {len(kw_a)} · 축B {len(kw_b)} · 공통 {len(kw_a & kw_b)} · 합집합 {len(kw_a | kw_b)}")

            print("\n[추적 상품 스토어명 슬러그]")
            import re
            tot = slug = 0
            for r in c.execute("SELECT product_url, store_name FROM tracked_products"):
                tot += 1
                m = re.search(r"smartstore\.naver\.com/([^/?#]+)", r["product_url"] or "")
                s = (r["store_name"] or "").strip().lower()
                if m and s == m.group(1).strip().lower():
                    slug += 1
            print(f"  총 {tot} / 슬러그 {slug}")
            PY
            echo
            if [ "$IN_COLLECTOR" = "on" ]; then
              echo "== 수집기 진단 =="
              echo "-- 확장이 서버에 접속한 기록(오늘) --"
              # 확장은 GET /api/collector/keywords 로 목록을 받고 POST /serp 로 올린다.
              # 한 줄도 없으면 '확장이 서버에 아예 말을 걸지 않은 것' = 맥북 쪽 문제.
              docker logs --since 24h logic-analysis 2>&1 | grep -E 'api/collector' \
                | awk '{print $0}' | tail -25 || echo "  (접속 기록 없음)"
              echo "-- 접속 횟수(경로별·24시간) --"
              docker logs --since 24h logic-analysis 2>&1 | grep -oE 'GET /api/collector/[a-z]+|POST /api/collector/[a-z]+' \
                | sort | uniq -c || echo "  (없음)"
              echo "-- 기계별 집계(24시간) — 보낸 곳은 런마다 다른 소금 해시 6자리로만 --"
              # ⚠️ 저장소가 공개라 실제 IP 를 찍지 않는다. 2026-09-16 정정: 종전엔 「앞 두 자리 + 그룹번호」로 찍었는데
              #    앞 두 옥텟만으로도 통신사·지역이 좁혀진다(공개 런 로그에 남았다). 이제 **전체 IP 를 런마다 새 소금으로
              #    해시한 6자리**만 찍는다 — 같은 런 안에서만 같은 기계를 알아볼 수 있고, 다른 런·문서와는 대조할 수 없다.
              IPSALT=$(head -c 16 /dev/urandom 2>/dev/null | od -An -tx1 | tr -d ' \n')
              for f in /var/log/nginx/access.log.1 /var/log/nginx/access.log; do
                [ -f "$f" ] && cat "$f"
              done 2>/dev/null | grep -E 'api/(collector/(serp|keywords|requests)|place/(ingest|track-targets))' \
                | awk -v salt="$IPSALT" '{ ip=$1;
                        if (!(ip in h6)) { cmd="printf %s " salt ip " | md5sum | cut -c1-6"; cmd | getline h6[ip]; close(cmd); order[++m]=ip }
                        t=$4; gsub(/^\[/,"",t); split(t,d,":"); hh=d[2];
                        p=$7; sub(/\?.*$/,"",p); sub(/^.*\/api\//,"",p); sub(/^collector\//,"",p); sub(/^place\//,"",p);
                        tot[ip]++; last[ip]=t; ep[ip" "p]++; hrs[ip" "hh]=1 }
                   END { for (i=1;i<=m;i++) { ip=order[i]; hc=0;
                           for (k in hrs) { split(k,a," "); if (a[1]==ip) hc++ }
                           printf "  [곳 %s] 총 %d건 · 활동시간대 %d/24 · 마지막 %s\n", h6[ip], tot[ip], hc, last[ip];
                           for (k in ep) { split(k,b," "); if (b[1]==ip) printf "        %-14s %d건\n", b[2], ep[k] } } }' \
                | sort -s -t'[' -k2,2 || echo "  (집계 실패)"
              echo "  ↑ 해시는 이 런 안에서만 같은 기계를 가리킨다(다른 런과 대조 불가)"
              echo "-- 지도 순위 기록(place/ingest)을 보내는 IP — 어느 기계가 플레이스를 도는지 --"
              # 플레이스 러너는 로직 탭(브라우저)을 거쳐 기록하므로 그 PC 의 IP 로 잡힌다.
              for f in /var/log/nginx/access.log.1 /var/log/nginx/access.log; do
                [ -f "$f" ] && cat "$f"
              done 2>/dev/null | grep -E 'api/place/(ingest|track-targets)' \
                | awk -v salt="$IPSALT" '{ ip=$1;
                        if (!(ip in h6)) { cmd="printf %s " salt ip " | md5sum | cut -c1-6"; cmd | getline h6[ip]; close(cmd) }
                        m="곳 " h6[ip]; t=$4; gsub(/^\[/,"",t);
                        p=$7; sub(/\?.*$/,"",p); sub(/^.*\/place\//,"",p);
                        key=m" "p; cnt[key]++; last[key]=t }
                   END { for (k in cnt) printf "  %-26s %s건 · 마지막 %s\n", k, cnt[k], last[k] }' \
                | sort || echo "  (기록 없음)"
              echo
              docker exec -i logic-analysis python3 - <<'PY'
            import os, sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()
            print("[수집 적재 — 최근 7일]")
            n = 0
            for r in c.execute("""SELECT collected_date d, COUNT(*) kw, MAX(created_at) last_at
                                    FROM collected_serp
                                   WHERE collected_date >= date('now','localtime','-6 day')
                                   GROUP BY collected_date ORDER BY d DESC"""):
                n += 1
                print(f"  {r['d']}: 키워드 {r['kw']}건 · 마지막 업로드 {r['last_at']}")
            if not n:
                print("  (최근 7일 수집 없음)")
            print("\n[온디맨드 요청 큐]")
            for r in c.execute("""SELECT status, COUNT(*) n, MIN(requested_at) oldest, MAX(attempts) mx
                                    FROM collect_requests GROUP BY status"""):
                print(f"  {r['status']}: {r['n']}건 (가장 오래된 {r['oldest']} · 최대 시도 {r['mx']})")
            print("\n[수집 깊이 실측 — pagingSize=80 이 실제로 먹히는지]")
            # 한 키워드당 몇 개를 모았는지. 300 근처면 80 이 정상 수용된 것,
            # 40·80 에서 멈춰 있으면 페이지를 더 못 넘긴 것(= 300위 추적이 깨져 있던 것).
            try:
                rows = list(c.execute("""SELECT product_count n, COUNT(*) c
                                          FROM collected_serp
                                         GROUP BY product_count ORDER BY c DESC LIMIT 8"""))
                for r in rows:
                    print(f"  {r['n']}개 수집 — 키워드 {r['c']}건")
