              echo "  (마지막 1시간 새 출처?)"; grep -a "$TODAY" "$LOG" | awk -v h="$(date +%H)" '"'"'{split($4,t,":"); if (t[2]==h) {ip=$1; cmd="printf %s " ip " | sha256sum | cut -c1-6"; cmd | getline x; close(cmd); n[x]++}} END {for (k in n) printf "  %s x%d\n", k, n[k]}'"'"'
            fi
