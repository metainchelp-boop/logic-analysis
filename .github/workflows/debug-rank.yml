                       "reports_kst_backfill_boot:scheduler.py" \
                       "is_auto, created_at:weekly_report.py" \
                       "created_by, created_at:reports.py" \
                       "created_at, updated_at:clients.py"; do
              m="${pat%%:*}"; f="${pat##*:}"
              n=$(docker exec -i logic-analysis sh -c "grep -c '$m' /app/$f 2>/dev/null" | tail -1)
              case "$n" in ''|*[!0-9]*) n=0 ;; esac
              echo "  $f  「$m」 $n 건 $([ "$n" -gt 0 ] && echo '✅' || echo '❌ 미반영')"
            done
            echo
            echo "== ② 시각 보정이 실제로 돌았나 (부팅 로그) =="
            docker logs logic-analysis 2>&1 | grep -E "시각 보정|reports_kst" | tail -5 \
              || echo "  (로그 없음 — 부팅 +1분을 아직 안 지났거나 잡이 안 돌았다)"
            docker inspect -f '  컨테이너 기동 StartedAt={{.State.StartedAt}}' logic-analysis
            echo
            echo "== ③ 보고서 시각이 실제로 바뀌었나 =="
            docker exec -i logic-analysis python3 - <<'PY'
            import os, sqlite3
            c = sqlite3.connect(os.getenv("DB_PATH", "/app/data/logic_data.db"))
            print("  지금 UTC %s / KST %s" % (
                c.execute("SELECT datetime('now')").fetchone()[0],
                c.execute("SELECT datetime('now','localtime')").fetchone()[0]))
            print("  -- 자동 보고서 시:분 (00:40=UTC 그대로 · 09:40=고쳐짐) --")
            for r in c.execute("SELECT substr(created_at,12,5) hm, COUNT(*) n,"
                               " MIN(substr(created_at,1,10)), MAX(substr(created_at,1,10))"
                               " FROM reports WHERE is_auto=1 GROUP BY hm ORDER BY n DESC LIMIT 6"):
                mark = "✅ KST" if r[0].startswith("09:4") else ("❌ 아직 UTC" if r[0].startswith("00:4") else "?")
                print("    %s · %5d건 · %s ~ %s  %s" % (r[0], r[1], r[2], r[3], mark))
            print("  -- 마커 --")
            import glob
            g = glob.glob(os.path.join(os.path.dirname(
                os.path.abspath(os.getenv("DB_PATH", "/app/data/logic_data.db"))), ".reports_kst*"))
            print("    %s" % (g or "없음 — 보정이 아직 안 돌았거나 실패했다"))

            print()
            print("== ④ 커버링 인덱스가 실제로 쓰이나 ==")
            names = [r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='index'"
                                             " AND tbl_name='client_analyses'")]
            print("  인덱스: %s" % ", ".join(names))
            ids = [r[0] for r in c.execute("SELECT id FROM clients WHERE status='active' LIMIT 400")]
            ph = ",".join("?" * len(ids))
            import time
            AGG = ("SELECT client_id, COUNT(*), MAX(updated_at), COUNT(DISTINCT keyword),"
                   " COUNT(DISTINCT analyzed_date) FROM client_analyses"
                   " WHERE client_id IN (%s) GROUP BY client_id" % ph)
            LATEST = ("SELECT client_id, keyword, product_url, analyzed_date, updated_at"
                      " FROM client_analyses WHERE client_id IN (%s)"
                      " ORDER BY analyzed_date DESC, updated_at DESC" % ph)
            for lbl, q, before in (("집계", AGG, 290), ("최신1건", LATEST, 563)):
                t = []
                for _ in range(2):
                    t0 = time.perf_counter(); n = len(c.execute(q, ids).fetchall())
                    t.append((time.perf_counter() - t0) * 1000)
                plan = " / ".join(r[-1] for r in c.execute("EXPLAIN QUERY PLAN " + q, ids))
                ok = "✅ 커버링" if "COVERING INDEX idx_client_analyses_board" in plan else "❌ 안 쓰임"
                print("  %-8s %6.0f ms -> %5.0f ms (배포 전 %d ms) · %d행 · %s"
                      % (lbl, t[0], t[1], before, n, ok))
                print("      %s" % plan[:150])
            PY

      - name: 더 줄일 수 있나 (읽기 전용 · 업체명 미출력)
        if: ${{ github.event.inputs.faster == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "== ⓪ 배포된 코드가 실제로 KST 를 적는가 (서버 파일을 그대로 실행) =="
            docker exec -i logic-analysis python3 - <<'PY'
            # ⚠️ 내 로컬 사본이 아니라 **서버에 놓인 파일**의 INSERT 문을 꺼내 실행한다.
            #    배포가 반영됐는지를 「파일에 문자열이 있다」가 아니라 「그 문이 KST 를 적는다」로 확인한다.
            import io, sqlite3
            for name, needle in (("weekly_report.py", "INSERT INTO reports"),
                                 ("reports.py", "INSERT INTO reports")):
                src = io.open("/app/" + name, encoding="utf-8").read()
                i = src.index(needle)
                # weekly_report 은 파이썬 문자열 연결, reports 는 삼중따옴표라 꺼내는 법이 다르다
                if name == "weekly_report.py":
                    seg = src[i - 200:i + 400]
                    sql = "".join(
                        ln.strip().strip('"') for ln in seg.split("\n")
                        if ln.strip().startswith('"') and "INSERT" in seg[:seg.index(ln)] + ln or
                        (ln.strip().startswith('"INSERT INTO reports')))
                else:
                    sql = src[i:src.index('"""', i)]
                has_kst = "datetime('now','localtime')" in src[i - 300:i + 600]
                print("  %-18s KST 명시 %s" % (name, "✅" if has_kst else "❌"))

            # 실제 실행 — reports.py 의 문을 서버 파일에서 꺼내 임시 표에 넣어 본다
            src = io.open("/app/reports.py", encoding="utf-8").read()
            i = src.index("INSERT INTO reports")
            sql = src[i:src.index('"""', i)]
            c = sqlite3.connect(":memory:")
            c.execute("CREATE TABLE reports (id INTEGER PRIMARY KEY AUTOINCREMENT, client_id INTEGER,"
                      " title TEXT, keyword TEXT, product_url TEXT, report_data TEXT,"
                      " report_hash TEXT UNIQUE, html_filename TEXT, status TEXT, views INTEGER DEFAULT 0,"
                      " created_by INTEGER, created_at TEXT DEFAULT CURRENT_TIMESTAMP,"
                      " is_auto INTEGER NOT NULL DEFAULT 0)")
            c.execute(sql, (1, "t", "k", "", "{}", "h", "f", "generated", 1))
            got = c.execute("SELECT created_at FROM reports").fetchone()[0]
            utc = c.execute("SELECT datetime('now')").fetchone()[0]
            kst = c.execute("SELECT datetime('now','localtime')").fetchone()[0]
            print("  서버 파일의 INSERT 실행 결과 → %s" % got)
            print("    (지금 UTC %s · KST %s)" % (utc, kst))
            print("  판정: %s" % ("✅ KST 로 적는다" if got[:16] == kst[:16]
                                  else "❌ 아직 UTC 다" if got[:16] == utc[:16] else "? 알 수 없음"))
            PY
            echo
            echo "== ① my-clients 가 도는 쿼리 전부 — 지금 무엇이 남았나 =="
            docker exec -i logic-analysis python3 - <<'PY'
            import os, sqlite3, time
            c = sqlite3.connect(os.getenv("DB_PATH", "/app/data/logic_data.db"))
            c.row_factory = sqlite3.Row
            ids = [r[0] for r in c.execute("SELECT id FROM clients WHERE status='active' LIMIT 400")]
            ph = ",".join("?" * len(ids))

            def t(q, args=()):
                out = []
                for _ in range(3):
                    t0 = time.perf_counter(); n = len(c.execute(q, args).fetchall())
                    out.append((time.perf_counter() - t0) * 1000)
                return min(out), n

            Q = [
              ("업체 목록", "SELECT id,name,status,contract_stage,created_by FROM clients WHERE status='active'", ()),
              ("분석 집계", "SELECT client_id, COUNT(*), MAX(updated_at), COUNT(DISTINCT keyword),"
                          " COUNT(DISTINCT analyzed_date) FROM client_analyses WHERE client_id IN (%s)"
                          " GROUP BY client_id" % ph, ids),
              ("최신1건(지금)", "SELECT client_id, keyword, product_url, analyzed_date, updated_at"
                          " FROM client_analyses WHERE client_id IN (%s)"
                          " ORDER BY analyzed_date DESC, updated_at DESC" % ph, ids),
              ("순위 롤업", "SELECT client_id,keyword,MAX(id) FROM client_rank_history"
                          " WHERE client_id IN (%s) GROUP BY client_id,keyword" % ph, ids),
            ]
            tot = 0
            for lbl, q, a in Q:
                ms, n = t(q, a); tot += ms
                print("  %-14s %7.1f ms · %d행" % (lbl, ms, n))
            print("  %-14s %7.1f ms" % ("합계", tot))

            print()
            print("== ② 최신1건을 업체별 1건으로 다시 쓰면 — 결과가 정말 같은가 ==")
            print("   ⚠️ 「빨라졌다」보다 「값이 한 글자도 안 바뀌었다」가 먼저다. 실데이터로 대조한다.")

            # (가) 지금 방식 — 전부 정렬해 받아 업체별 첫 행만 남긴다
            t0 = time.perf_counter()
            cur_map = {}
            for r in c.execute("SELECT client_id, keyword, product_url, analyzed_date, updated_at"
                               " FROM client_analyses WHERE client_id IN (%s)"
                               " ORDER BY analyzed_date DESC, updated_at DESC" % ph, ids):
                if r["client_id"] not in cur_map:
                    cur_map[r["client_id"]] = (r["keyword"], r["product_url"],
                                               r["analyzed_date"], r["updated_at"])
            ms_cur = (time.perf_counter() - t0) * 1000

            # (나) 업체마다 1건씩 — 같은 정렬, LIMIT 1
            t0 = time.perf_counter()
            new_map = {}
            for cid in ids:
                r = c.execute("SELECT keyword, product_url, analyzed_date, updated_at"
                              " FROM client_analyses WHERE client_id=?"
                              " ORDER BY analyzed_date DESC, updated_at DESC LIMIT 1", (cid,)).fetchone()
                if r:
                    new_map[cid] = (r["keyword"], r["product_url"], r["analyzed_date"], r["updated_at"])
            ms_new = (time.perf_counter() - t0) * 1000

            print("   (가) 지금 방식     %7.1f ms · 업체 %d곳" % (ms_cur, len(cur_map)))
            print("   (나) 업체별 1건    %7.1f ms · 업체 %d곳" % (ms_new, len(new_map)))
            same = cur_map == new_map
            print("   값 대조: %s" % ("✅ 완전히 같다(키·값 전부)" if same else "❌ 다르다"))
            if not same:
                diff = [k for k in set(cur_map) | set(new_map) if cur_map.get(k) != new_map.get(k)]
                print("   다른 업체 %d곳 (id 만 표시): %s" % (len(diff), diff[:10]))
                for k in diff[:3]:
                    print("     id=%s 지금=%r 새것=%r" % (k, cur_map.get(k), new_map.get(k)))

            print()
            print("== ③ 동점(tie)이 있나 — 있으면 정렬 밖 순서에 결과가 좌우된다 ==")
            n_tie = 0
            for cid in ids:
                rows = c.execute(
                    "SELECT COUNT(*) FROM client_analyses WHERE client_id=?"
                    "  AND analyzed_date || ' ' || COALESCE(updated_at,'') ="
                    "      (SELECT analyzed_date || ' ' || COALESCE(updated_at,'')"
                    "         FROM client_analyses WHERE client_id=?"
                    "        ORDER BY analyzed_date DESC, updated_at DESC LIMIT 1)",
                    (cid, cid)).fetchone()[0]
                if rows > 1:
                    n_tie += 1
            print("   맨 위가 동점인 업체 %d곳 / %d곳" % (n_tie, len(ids)))
            print("   ⇒ 0곳이면 두 방식이 항상 같은 행을 고른다(순서 의존 없음).")
            PY

      - name: 체감 원인 — 응답 크기·조립 시간 (읽기 전용)
        if: ${{ github.event.inputs.payload == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "== 체감 원인 — 브라우저가 실제로 기다리는 것 (읽기 전용 · 업체명 미출력) =="
            docker exec -i logic-analysis python3 - <<'PY'
            # ⚠️ 쿼리 소요(33.8ms)만 재고 「빠르다」고 말하면 안 된다. 브라우저는
            #    조립 + JSON 직렬화 + 전송까지 기다린다. 그 전체를 재고, 응답 크기가
            #    무엇 때문에 커지는지 칸별로 가른다.
            import os, sqlite3, time, json
            c = sqlite3.connect(os.getenv("DB_PATH", "/app/data/logic_data.db"))
            c.row_factory = sqlite3.Row

            COLS = ("id, name, business_name, contact_name, contact_phone, contact_email, "
                    "website_url, naver_store_url, main_keywords, notes, status, auto_analysis, "
                    "created_by, created_at, updated_at, role, expires_at, "
                    "COALESCE(vertical,'store') AS vertical, "
                    "COALESCE(track_enabled,1) AS track_enabled, track_until, "
                    "contract_stage, contract_stage_at")

            t0 = time.perf_counter()
            clients = c.execute("SELECT %s FROM clients WHERE status='active'"
                                " AND COALESCE(role,'advertiser')='advertiser'"
                                " ORDER BY updated_at DESC" % COLS).fetchall()
            ids = [r["id"] for r in clients]
            ph = ",".join("?" * len(ids))
            agg = {r["client_id"]: dict(r) for r in c.execute(
                "SELECT client_id, COUNT(*) analysis_count, MAX(updated_at) last_analyzed,"
                " COUNT(DISTINCT keyword) uk, COUNT(DISTINCT analyzed_date) td"
                " FROM client_analyses WHERE client_id IN (%s) GROUP BY client_id" % ph, ids)}
            latest = {}
            for r in c.execute("SELECT client_id, keyword, product_url, analyzed_date, updated_at"
                               " FROM client_analyses WHERE client_id IN (%s)"
                               " ORDER BY analyzed_date DESC, updated_at DESC" % ph, ids):
                latest.setdefault(r["client_id"], dict(r))
            rows = []
            for cl in clients:
                d = dict(cl)
                d.update(agg.get(cl["id"], {}))
                d["latest"] = latest.get(cl["id"])
                rows.append(d)
            t_build = (time.perf_counter() - t0) * 1000

            t0 = time.perf_counter()
            body = json.dumps({"success": True, "data": rows}, ensure_ascii=False, default=str)
            t_json = (time.perf_counter() - t0) * 1000
            size = len(body.encode("utf-8"))

            print("  업체 %d곳 · 조립 %.0f ms · JSON 직렬화 %.0f ms · 합계 %.0f ms"
                  % (len(rows), t_build, t_json, t_build + t_json))
            print("  응답 크기 %.0f KB (업체당 평균 %.0f B)" % (size / 1024, size / max(len(rows), 1)))

            print()
            print("  -- 응답 크기를 무엇이 차지하나 (칸별 바이트 합) --")
            tot = {}
            for d in rows:
                for k, v in d.items():
                    if v is None: continue
                    tot[k] = tot.get(k, 0) + len(json.dumps(v, ensure_ascii=False, default=str).encode("utf-8"))
            for k, v in sorted(tot.items(), key=lambda x: -x[1])[:10]:
                print("    %-18s %7.0f KB (%4.1f%%)" % (k, v / 1024, v * 100.0 / max(size, 1)))

            print()
            print("  -- 참고: 전송 시간 짐작 --")
            for mbps, label in ((100, "사내 유선 100Mbps"), (20, "느린 회선 20Mbps")):
                print("    %s → 약 %.0f ms" % (label, size * 8 / (mbps * 1000)))
            print("  ⇒ 조립·직렬화·전송 합이 쿼리(33.8ms)보다 크면, 체감의 주인은 쿼리가 아니다.")
            PY

      - name: 압축이 켜져 있나 (읽기 전용)
        if: ${{ github.event.inputs.gzipchk == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "== 압축 여부 (읽기 전용) =="
            echo "-- ① 앱이 직접 답할 때 (컨테이너 안 → 앱 포트) --"
            docker exec -i logic-analysis sh -c \
              "curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip, deflate' http://127.0.0.1:5050/api/health 2>/dev/null | grep -iE '^HTTP|content-encoding|content-length|content-type'" \
              || echo "  (health 경로 없음 — 아래 nginx 결과로 판단)"
            echo
            echo "-- ② nginx 를 지날 때 (https — http 는 301 이라 헤더를 못 본다) --"
            # ⚠️ nginx 의 기본 gzip_types 는 text/html **뿐**이다. 압축이 켜져 있어도
            #    JSON·JS 는 그대로 나가는 일이 흔하므로 형식별로 갈라 본다.
            for path in "/ (HTML)" "/api/health (JSON)" "/dist/APPJS (JS)"; do
              p="${path%% *}"; lbl="${path#* }"
              [ "$p" = "/dist/APPJS" ] && p="/$(docker exec -i logic-analysis sh -c 'ls /app/frontend/dist/*.js 2>/dev/null | head -1 | sed "s#/app/frontend/##"' 2>/dev/null)"
              echo "  경로 $p  $lbl"
              curl -sk -o /dev/null -D - -H 'Accept-Encoding: gzip, deflate' \
                --max-time 10 "https://logic.metainc.co.kr$p" 2>/dev/null \
                | grep -iE '^HTTP/|content-encoding|content-length|content-type' | sed 's/^/    /'
              echo "    ↑ Content-Encoding 이 없으면 그 형식은 압축 안 되고 있다"
            done
            echo
            echo "-- ②-b nginx 설정의 gzip 규칙 (읽기 전용 · 확정용) --"
            # ⚠️ 74바이트 JSON 이 압축 안 된 것만으로는 「타입 때문」인지 「크기 때문」인지 못 가른다.
            #    gzip_types 와 gzip_min_length 를 직접 읽어야 확정된다.
            #    ⚠️ nginx 는 ③ 광고센터와 함께 쓰는 자원이다 — **읽기만** 한다.
            sudo -n grep -rhiE '^\s*gzip[a-z_]*\s' /etc/nginx/nginx.conf /etc/nginx/conf.d/ \
                 /etc/nginx/sites-enabled/ 2>/dev/null | sed 's/^\s*/    /' | sort -u \
              || grep -rhiE '^\s*gzip[a-z_]*\s' /etc/nginx/nginx.conf /etc/nginx/conf.d/ \
                 /etc/nginx/sites-enabled/ 2>/dev/null | sed 's/^\s*/    /' | sort -u \
              || echo "    (설정을 읽을 권한이 없다 — 아래 큰 JSON 실측으로 판단)"
            echo
            echo "-- ②-c 큰 JSON 을 실제로 받아 본다 (크기 confound 제거) --"
            # 정적으로 서빙되는 큰 JSON 이 있으면 그것이 가장 확실한 증거다.
            for f in /dist/bundle.json /bundle.json; do
              code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "https://logic.metainc.co.kr$f")
              [ "$code" = "200" ] || continue
              echo "  경로 $f"
              curl -sk -o /dev/null -D - -H 'Accept-Encoding: gzip' --max-time 10 \
                "https://logic.metainc.co.kr$f" | grep -iE '^HTTP/|content-encoding|content-length|content-type' | sed 's/^/    /'
            done
            echo
            echo "-- ③ 547KB 응답을 압축하면 몇 KB 인가 (실제 데이터로) --"
            docker exec -i logic-analysis python3 - <<'PY'
            # ⚠️ 내용은 한 글자도 안 바꾼다. 같은 JSON 을 전송만 압축했을 때의 크기를 잰다.
            import os, sqlite3, json, gzip, time
            c = sqlite3.connect(os.getenv("DB_PATH", "/app/data/logic_data.db"))
            c.row_factory = sqlite3.Row
            COLS = ("id, name, business_name, contact_name, contact_phone, contact_email, "
                    "website_url, naver_store_url, main_keywords, notes, status, auto_analysis, "
                    "created_by, created_at, updated_at, role, expires_at, "
                    "COALESCE(vertical,'store') AS vertical, "
                    "COALESCE(track_enabled,1) AS track_enabled, track_until, "
                    "contract_stage, contract_stage_at")
            clients = c.execute("SELECT %s FROM clients WHERE status='active'"
                                " AND COALESCE(role,'advertiser')='advertiser'"
                                " ORDER BY updated_at DESC" % COLS).fetchall()
            ids = [r["id"] for r in clients]
            ph = ",".join("?" * len(ids))
            agg = {r["client_id"]: dict(r) for r in c.execute(
                "SELECT client_id, COUNT(*) analysis_count, MAX(updated_at) last_analyzed,"
                " COUNT(DISTINCT keyword) uk, COUNT(DISTINCT analyzed_date) td"
                " FROM client_analyses WHERE client_id IN (%s) GROUP BY client_id" % ph, ids)}
            latest = {}
            for r in c.execute("SELECT client_id, keyword, product_url, analyzed_date, updated_at"
                               " FROM client_analyses WHERE client_id IN (%s)"
                               " ORDER BY analyzed_date DESC, updated_at DESC" % ph, ids):
                latest.setdefault(r["client_id"], dict(r))
            rows = []
            for cl in clients:
                d = dict(cl); d.update(agg.get(cl["id"], {})); d["latest"] = latest.get(cl["id"])
                rows.append(d)
            raw = json.dumps({"success": True, "data": rows}, ensure_ascii=False, default=str).encode("utf-8")
            for lv in (1, 6, 9):
                t0 = time.perf_counter(); z = gzip.compress(raw, lv)
                ms = (time.perf_counter() - t0) * 1000
                print("    gzip 수준 %d → %6.0f KB (원본의 %4.1f%%) · 압축에 %.0f ms"
                      % (lv, len(z) / 1024, len(z) * 100.0 / len(raw), ms))
            print("    원본 %.0f KB" % (len(raw) / 1024))
            print()
            print("    -- 전송 시간이 어떻게 바뀌나 --")
            best = gzip.compress(raw, 6)
            for mbps, label in ((100, "사내 유선 100Mbps"), (20, "느린 회선 20Mbps"), (5, "모바일 5Mbps")):
                a = len(raw) * 8 / (mbps * 1000); b = len(best) * 8 / (mbps * 1000)
                print("      %-18s %5.0f ms → %4.0f ms" % (label, a, b))
            PY

      - name: 배포 #183 확인 — 압축이 실제로 붙나 (읽기 전용)
        if: ${{ github.event.inputs.after183 == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "== ① 서버 파일에 반영됐나 =="
            for m in "GZipMiddleware" "compresslevel" "minimum_size"; do
              n=$(docker exec -i logic-analysis sh -c "grep -c '$m' /app/main.py 2>/dev/null" | tail -1)
              case "$n" in ''|*[!0-9]*) n=0 ;; esac
              echo "  「$m」 $n 건 $([ "$n" -gt 0 ] && echo '✅' || echo '❌ 미반영')"
            done
            echo
            echo "== ② 부팅 로그 — 어떤 설정으로 켜졌나 =="
            docker logs logic-analysis 2>&1 | grep -E "응답 압축" | tail -3 \
              || echo "  ⚠️ 로그 없음 — 미들웨어가 안 붙었거나 기동 실패"
            docker inspect -f '  기동 StartedAt={{.State.StartedAt}} RestartCount={{.RestartCount}}' logic-analysis
            echo
            echo "== ③ 앱이 실제로 압축해 보내나 (앱에 직접 — nginx 를 지나면 누가 했는지 못 가른다) =="
            # ⚠️ 이 컨테이너에는 curl 이 없다(첫 시도에서 확인). 파이썬 표준 라이브러리로 부른다.
            docker exec -i logic-analysis python3 - <<'PY'
            import gzip, json, urllib.request
            BASE = "http://127.0.0.1:5050"
            # 인증 없이도 500B 를 넘는 경로가 필요하다 — FastAPI 의 openapi.json 이 그 조건에 맞는다.
            for path, why in (("/api/health", "74B — minimum_size(500) 미만이라 **압축 안 되는 게 정상**"),
                              ("/openapi.json", "수십 KB — 여기서 압축이 붙어야 우리 변경이 듣는 것")):
                for enc in ("gzip", "identity"):
                    req = urllib.request.Request(BASE + path, headers={"Accept-Encoding": enc})
                    try:
                        with urllib.request.urlopen(req, timeout=20) as r:
                            raw = r.read()
                            ce = r.headers.get("Content-Encoding") or "(없음)"
                            print("  %-16s Accept-Encoding:%-8s → %6d B · Content-Encoding: %s"
                                  % (path, enc, len(raw), ce))
                            if enc == "gzip" and ce == "gzip":
                                풀림 = gzip.decompress(raw)
                                print("      풀어 보니 %d B · JSON 파싱 %s"
                                      % (len(풀림), "✅" if json.loads(풀림) is not None else "❌"))
                    except Exception as e:
                        print("  %-16s %s 실패: %s" % (path, enc, str(e)[:70]))
                print("      ↑ %s" % why)
            PY
            echo
            echo "== ④ 큰 응답은 압축되나 + 본문이 원본과 같나 =="
            docker exec -i logic-analysis python3 - <<'PY'
            # ⚠️ 「압축된다」만 보면 반쪽이다. **풀었을 때 원본과 같은지**가 대표 조건이다.
            import gzip, io, json, urllib.request
            body = json.dumps({"data": [{"id": i, "name": "업체%d" % i} for i in range(400)]},
                              ensure_ascii=False).encode("utf-8")
            print("    (참고) 이 크기의 JSON: 원본 %d B → gzip6 %d B"
                  % (len(body), len(gzip.compress(body, 6))))
            # 인증이 필요한 큰 경로는 여기서 못 부른다 — 미들웨어 설정값으로 판정한다.
            import re
            src = io.open("/app/main.py", encoding="utf-8").read()
            m = re.search(r"_gzip_kwargs = (\{[^}]*\})", src)
            print("    서버 파일의 compresslevel: %s" % (m.group(1) if m else "못 찾음 — 부팅 로그로 판정"))
            try:
                import inspect
                from starlette.middleware.gzip import GZipMiddleware
                ps = inspect.signature(GZipMiddleware.__init__).parameters
                print("    이 서버 starlette 의 GZipMiddleware 인자: %s" % ", ".join(ps))
                print("    → compresslevel 지원: %s" % ("✅ (6 이 적용된다)" if "compresslevel" in ps
                                                       else "⚠️ 미지원 (기본값으로 동작 — 기동은 정상)"))
            except Exception as e:
                print("    starlette 확인 실패: %s" % e)
            PY

      - name: 신고 #248 — 기록 대기 원인 (읽기 전용 · 업체명 미출력)
        if: ${{ github.event.inputs.pending248 == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "== 신고 #248 — 추가 등록 키워드가 「기록 대기」에서 안 넘어간다 =="
            docker exec -i logic-analysis python3 - <<'PY'
            import os, sqlite3, zlib
            c = sqlite3.connect(os.getenv("DB_PATH", "/app/data/logic_data.db"))
            c.row_factory = sqlite3.Row

            # 서버 코드와 같은 규칙(collector._slot_of)을 그대로 옮긴다.
            PRIORITY_HOURS, LATE_HOURS = 15, 9
            def slot(k, pri):
                h = zlib.crc32(k.encode("utf-8"))
                return h % PRIORITY_HOURS if pri else PRIORITY_HOURS + (h % LATE_HOURS)

            print("  -- ① 수집기가 실제로 몇 시에 도나 (최근 4일 · 시간대별) --")
            print("     ⚠️ 추적 상품 전용 키워드는 **15~23시 슬롯**에만 배정된다.")
            print("        그 시간대에 수집기가 안 돌면 그 키워드는 영원히 기록 대기다.")
            rows = list(c.execute(
                "SELECT collected_date d, CAST(strftime('%H', created_at) AS INT) h, COUNT(*) n"
                "  FROM collected_serp WHERE collected_date >= date('now','localtime','-3 day')"
                " GROUP BY d, h ORDER BY d, h"))
            by = {}
            for r in rows:
                by.setdefault(r["d"], {})[r["h"]] = r["n"]
            for d in sorted(by):
                hrs = by[d]
                line = " ".join("%02d:%-3d" % (h, hrs[h]) for h in sorted(hrs))
                조간 = sum(v for h, v in hrs.items() if h < 15)
                야간 = sum(v for h, v in hrs.items() if h >= 15)
                print("    %s  0~14시 %4d건 · **15~23시 %4d건**" % (d, 조간, 야간))
                print("        %s" % line)

            print()
            print("  -- ② 축A 전용 키워드(추가 등록분)가 실제로 수집되고 있나 --")
            try:
                from tracking_eligibility import eligible_tracked_product_ids
                ok = eligible_tracked_product_ids(c)
            except Exception as e:
                ok = None
                print("    자격 판정 실패: %s" % e)
            축A = set()
            q = "SELECT DISTINCT keyword FROM tracked_keywords"
            if ok:
                q += " WHERE product_id IN (%s)" % ",".join("?" * len(ok))
                축A = {r[0].strip() for r in c.execute(q, list(ok)) if (r[0] or "").strip()}
            else:
                축A = {r[0].strip() for r in c.execute(q) if (r[0] or "").strip()}
            업체 = set()
            for r in c.execute("SELECT main_keywords FROM clients WHERE status='active'"):
                for k in (r[0] or "").split(","):
                    if k.strip(): 업체.add(k.strip())
            for r in c.execute("SELECT DISTINCT keyword FROM client_analyses"):
                if (r[0] or "").strip(): 업체.add(r[0].strip())
            전용 = 축A - 업체
            print("    축A 자격 키워드 %d개 · 그중 **업체 키워드와 안 겹치는 것 %d개**" % (len(축A), len(전용)))

            for days, lbl in ((0, "오늘"), (1, "어제"), (7, "최근 7일")):
                d = "date('now','localtime')" if days == 0 else \
                    ("date('now','localtime','-1 day')" if days == 1 else
                     "date('now','localtime','-6 day')")
                op = "=" if days < 7 else ">="
                got = {r[0] for r in c.execute(
                    "SELECT DISTINCT keyword FROM collected_serp WHERE collected_date %s %s" % (op, d))}
                a = len(전용 & got); b = len(업체 & got)
                print("    %-8s 전용 %3d/%3d (%3.0f%%) · 업체 %3d/%3d (%3.0f%%)"
                      % (lbl, a, len(전용), a * 100.0 / max(len(전용), 1),
                         b, len(업체), b * 100.0 / max(len(업체), 1)))

            print()
            print("  -- ③ 전용 키워드가 배정된 슬롯 분포 --")
            dist = {}
            for k in 전용:
                dist[slot(k, False)] = dist.get(slot(k, False), 0) + 1
            print("    %s" % " ".join("%02d시:%d" % (h, dist[h]) for h in sorted(dist)))
            print("    ⇒ 전부 15~23시다. 그 시간대 수집이 0이면 100%% 기록 대기가 된다.")

            print()
            print("  -- ④ 순위가 실제로 언제 마지막으로 쌓였나(축A) --")
            for r in c.execute(
                    "SELECT DATE(checked_at) d, COUNT(*) n FROM rankings"
                    " WHERE checked_at >= date('now','localtime','-6 day')"
                    " GROUP BY d ORDER BY d"):
                print("    %s · %d건" % (r[0], r[1]))

            print()
            print("  -- ⑤ 다른 원인 배제 --")
            n_mute = c.execute("SELECT COUNT(*) FROM client_keyword_mute").fetchone()[0]
            n_prod = c.execute("SELECT COUNT(*) FROM tracked_products").fetchone()[0]
            try:
                n_dis = c.execute("SELECT COUNT(*) FROM tracked_products"
                                  " WHERE COALESCE(disabled_at,'') <> ''").fetchone()[0]
            except Exception:
                n_dis = -1
            print("    그만 재기 %d건 · 추적 상품 %d개(비활성 %d) · 자격 통과 %s개"
                  % (n_mute, n_prod, n_dis, len(ok) if ok is not None else "판정실패"))

            print()
            print("  -- ⑥ 「영원히 기록 대기」에 걸린 키워드는 몇 개인가 --")
            print("     ⚠️ 두 가지 대기를 갈라야 한다:")
            print("        ㉠ 오늘 아직 슬롯 차례가 안 온 것 → 오후에 풀린다(정상)")
            print("        ㉡ 상품이 자격 미통과라 유니버스에 아예 없는 것 → **영영 안 풀린다**")
            tot_kw = c.execute("SELECT COUNT(DISTINCT keyword) FROM tracked_keywords").fetchone()[0]
            tot_pair = c.execute("SELECT COUNT(*) FROM tracked_keywords").fetchone()[0]
            print("    추적 키워드 전체 %d개(짝 %d건) · 자격 통과 상품의 것 %d개"
                  % (tot_kw, tot_pair, len(축A)))
            죽은 = set()
            if ok is not None:
                ph2 = ",".join("?" * len(ok)) if ok else "NULL"
                죽은 = {r[0].strip() for r in c.execute(
                    "SELECT DISTINCT keyword FROM tracked_keywords"
                    " WHERE product_id NOT IN (%s)" % ph2, list(ok)) if (r[0] or "").strip()}
                죽은 -= 축A          # 다른 상품으로도 살아 있으면 죽은 게 아니다
                죽은 -= 업체          # 업체 대표 키워드로도 도는 것은 살아 있다
            print("    ⇒ **어느 경로로도 안 도는 키워드 %d개**" % len(죽은))

            print()
            print("  -- ⑦ 그 키워드들이 왜 빠졌나 (상품 단위 사유) --")
            try:
                rows = list(c.execute("""
                    SELECT p.id,
                           CASE WHEN COALESCE(p.disabled_at,'') <> '' THEN '비활성(주인 없어 내림)'
                                WHEN NOT EXISTS (SELECT 1 FROM rank_link l WHERE l.tracked_product_id=p.id)
                                     THEN '업체에 안 이어짐'
                                ELSE '자격 없는 업체에만 이어짐' END AS 사유,
                           (SELECT COUNT(*) FROM tracked_keywords k WHERE k.product_id=p.id) AS kw
                      FROM tracked_products p"""))
            except Exception as e:
                rows = []
                print("    조회 실패: %s" % e)
            agg = {}
            for r in rows:
                if ok is not None and r[0] in ok:
                    continue
                a = agg.setdefault(r[1], [0, 0])
                a[0] += 1; a[1] += r[2]
            for 사유, (np_, nk) in sorted(agg.items(), key=lambda x: -x[1][1]):
                print("    %-24s 상품 %3d개 · 키워드 %3d건" % (사유, np_, nk))
            print("    ⚠️ 「업체에 안 이어짐」은 규칙상 **수집은 된다**(방금 등록분 보호).")
            print("       여기 나오면 disabled_at 이 붙은 것이므로 위 비활성과 같은 뜻이다.")
            PY

