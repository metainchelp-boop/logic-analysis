      - name: 추정 업체 커버리지 실측 (읽기 전용·업체명 미출력)
        if: ${{ github.event.inputs.ownerhint == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            docker exec -i logic-analysis python3 - <<'PY'
            import sys, sqlite3
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            from rank_link import _collect_candidates, _product_key, _store_key
            from tracking_eligibility import eligible_client_ids
            ok = set(eligible_client_ids(conn))
            cand = _collect_candidates(conn)
            shelved = conn.execute(
                "SELECT id, product_url FROM tracked_products WHERE COALESCE(disabled_at,'')<>''").fetchall()
            linked = {r[0] for r in conn.execute("SELECT DISTINCT tracked_product_id FROM rank_link")}
            n_l = sum(1 for p in shelved if p["id"] in linked)
            n_o = n_any = n_elig = n_multi = 0
            for p in shelved:
                if p["id"] in linked:
                    continue
                n_o += 1
                cs = {}
                for c in (cand["b_by_key"].get(_product_key(p["product_url"]), [])
                          + cand["b_by_store"].get(_store_key(p["product_url"]), [])):
                    cs[c["id"]] = c
                if cs:
                    n_any += 1
                    if any(cid in ok for cid in cs):
                        n_elig += 1
                    if len(cs) > 1:
                        n_multi += 1
            print("  보관 상품 %d개 = 이어진 것 %d + 미연결 %d" % (len(shelved), n_l, n_o))
            print("  미연결 중 추정 업체가 붙는 것: %d개 (자격 있는 후보 포함 %d · 후보 여럿 %d)" % (n_any, n_elig, n_multi))
            print("  추정이 하나도 안 붙는 것: %d개 — 스토어명·검색창 자동 채움이 전부" % (n_o - n_any))
            PY

