            echo "  [iptables DROP/REJECT 규칙(개수·해시)]"; sudo -n iptables -S 2>/dev/null | grep -E "DROP|REJECT" | wc -l; sudo -n iptables -S 2>/dev/null | grep -E "DROP|REJECT" | grep -oE "([0-9]{1,3}\.){3}[0-9]{1,3}" | sort -u | H | head -20
