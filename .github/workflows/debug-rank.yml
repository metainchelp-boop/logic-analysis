          envs: REPORT_CONTEXT_REUSE_PATCH_B64,REPORT_CONTEXT_REUSE_PATCH_TRANSPORT_B64
          command_timeout: 60m
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PYCODE'
            import base64,hashlib,json,os,sys,types
            controller=None
            try:
                wire=os.environ['REPORT_CONTEXT_REUSE_PATCH_B64'];source=os.environ['REPORT_CONTEXT_REUSE_PATCH_TRANSPORT_B64']
                if len(source)>32768:raise ValueError('COMPLETION_TRANSPORT_SIZE')
                raw=base64.b64decode(source,validate=True)
                if hashlib.sha256(raw).hexdigest()!='5a2adc3b1c54cfd3cc12ceb8630c399bef622ff868038d1280690d8090215740':raise ValueError('COMPLETION_TRANSPORT_SOURCE')
                transport=types.ModuleType('approved_completion_transport');exec(raw,transport.__dict__)
                verified_transport_sha=hashlib.sha256(raw).hexdigest()
                if transport.TRANSPORT_RAW_SHA256 is not None:raise ValueError('COMPLETION_TRANSPORT_PROFILE')
                transport.TRANSPORT_RAW_SHA256=verified_transport_sha
                bundle=transport.decode(wire)
                os.environ.clear();os.environ.update(PATH='/usr/sbin:/usr/bin:/sbin:/bin',LANG='C')
                resolved=transport.modules(bundle)
                controller=resolved['patch']
                result=transport.execute(bundle)
            except Exception as error:
                result={'ok':False,'stage':'preflight','error_code':'COMPLETION_FAILED'}
                if controller is not None:result={'ok':False,**controller.failure_report(error)}
            print('NAVER_REPORT_CONTEXT_REUSE_PATCH_RELEASE='+json.dumps(result,sort_keys=True));sys.exit(0 if result.get('ok') else 1)
            PYCODE
