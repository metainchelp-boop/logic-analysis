name: Debug Rank Batch (읽기 전용 진단)

# 진단 전용 갈래 diag/naver-engine-health — main 에 합치지 않는다.
# 네이버 관제 읽기 전용 점검 1회: 엔진 상태(naver_engine_health) 또는 저장 공간 원인(naver_engine_storage).
# 업체명·계정번호·원문 오류 미출력. 운영 변경 0 (DB 는 컨테이너 안에서 mode=ro·query_only·쓰기 거부로만 연다).
# 예외: APPLY_NAVER_SAFE_CLEANUP 만 지운다 — 대표 지시(2026-10-19 「정리는 네가 해」)로 48시간 넘게 안 쓴 도커 빌드 임시 저장분과
# 배포 도구가 참조하지 않는 옛 엔진·중계 이미지 12개 판만. DB·백업·배포 기록·지금/직전 판·참조 판은 손대지 않는다.
# APPLY_NAVER_RECLAIM(대표 「여기서 완수하자」 2026-10-20): 배포 도구가 확인하지 않는 옛 이미지 34판 삭제 · 옛 릴리스 폴더와
# 배포 전 DB 사본은 압축 보관(같은 바이트로 복원 가능) 뒤 원본 삭제. 배포 도구가 확인하는 36판·엔진 DB·백업은 손대지 않는다.
# APPLY_NAVER_RESTORE_DRILL(대표 「배포하자」 2026-10-20 후속): 최근 밤 백업을 네트워크 없는 일회용 컨테이너에서 옛/새 판으로 복원 검증.
# 임시 폴더에만 쓰고 끝나면 지운다. 운영 DB·백업·엔진 불변.
# APPLY_NAVER_ENVELOPE_RENEW(대표 「배포 봉투 인증서 갱신 … 진행해」 2026-10-20): 서버 전용 열쇠쌍 새로 생성(RSA 4096 · 365일),
# 봉인→복호 왕복 시험 통과 시에만 자리 교체, 옛 쌍은 같은 권한으로 이름만 바꿔 보관. 개인키 미출력.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '네이버 관제 점검 1회 — 엔진 상태 / 저장 공간 원인 / 정리 미리보기 / 정리 실행'
        required: true
        type: choice
        options: [READ_ONLY_NAVER_ENGINE_HEALTH, READ_ONLY_NAVER_STORAGE, READ_ONLY_NAVER_CLEANUP_PREVIEW, APPLY_NAVER_SAFE_CLEANUP, READ_ONLY_NAVER_DB_GROWTH, READ_ONLY_NAVER_RECLAIM_PREVIEW, APPLY_NAVER_RECLAIM, READ_ONLY_NAVER_RELEASE_FACTS, APPLY_NAVER_RESTORE_DRILL, READ_ONLY_NAVER_ENVELOPE_PREVIEW, APPLY_NAVER_ENVELOPE_RENEW, READ_ONLY_NAVER_BACKUP_TREND, READ_ONLY_NAVER_DB_CENSUS, READ_ONLY_NAVER_BACKUP_FACTS, READ_ONLY_NAVER_INSPECTION_FACTS, READ_ONLY_NAVER_EXPORT_FACTS, READ_ONLY_NAVER_MARKET_SOURCE_FACTS, READ_ONLY_NAVER_MARKET_EXPORT_PROBE]

permissions:
  contents: read

concurrency:
  group: naver-engine-health
  cancel-in-progress: false

jobs:
  naver-engine-health:
    if: github.ref == 'refs/heads/diag/naver-engine-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build fixed read-only script
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          case "$CONFIRM" in
            READ_ONLY_NAVER_ENGINE_HEALTH) TOOL=diag/naver_engine_health.py ;;
            READ_ONLY_NAVER_STORAGE) TOOL=diag/naver_engine_storage.py ;;
            READ_ONLY_NAVER_CLEANUP_PREVIEW|APPLY_NAVER_SAFE_CLEANUP) TOOL=diag/naver_engine_cleanup.py ;;
            READ_ONLY_NAVER_DB_GROWTH) TOOL=diag/naver_engine_dbgrowth.py ;;
            READ_ONLY_NAVER_RECLAIM_PREVIEW|APPLY_NAVER_RECLAIM) TOOL=diag/naver_engine_reclaim.py ;;
            READ_ONLY_NAVER_RELEASE_FACTS) TOOL=diag/naver_release_facts.py ;;
            APPLY_NAVER_RESTORE_DRILL) TOOL=diag/naver_restore_drill.py ;;
            READ_ONLY_NAVER_ENVELOPE_PREVIEW|APPLY_NAVER_ENVELOPE_RENEW) TOOL=diag/naver_envelope_renew.py ;;
            READ_ONLY_NAVER_BACKUP_TREND) TOOL=diag/naver_backup_trend.py ;;
            READ_ONLY_NAVER_DB_CENSUS) TOOL=diag/naver_db_census.py ;;
            READ_ONLY_NAVER_BACKUP_FACTS) TOOL=diag/naver_backup_facts.py ;;
            READ_ONLY_NAVER_INSPECTION_FACTS) TOOL=diag/naver_inspection_facts.py ;;
            READ_ONLY_NAVER_EXPORT_FACTS) TOOL=diag/naver_export_facts.py ;;
            READ_ONLY_NAVER_MARKET_SOURCE_FACTS) TOOL=diag/naver_market_source_facts.py ;;
            READ_ONLY_NAVER_MARKET_EXPORT_PROBE) TOOL=diag/naver_market_export_probe.py ;;
            *) echo 'unknown confirm'; exit 1 ;;
          esac
          export TOOL
          python3 -I -B -c "import ast,os,pathlib;ast.parse(pathlib.Path(os.environ['TOOL']).read_text())"
          python3 -I -B - <<'PY'
          import base64,hashlib,os,pathlib
          raw=pathlib.Path(os.environ['TOOL']).read_bytes()
          print('HEALTH_SOURCE_SHA256='+hashlib.sha256(raw).hexdigest())
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('HEALTH_B64='+base64.b64encode(raw).decode()+'\n')
              f.write('HEALTH_SHA='+hashlib.sha256(raw).hexdigest()+'\n')
          PY
      - name: Read naver engine health once
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          HEALTH_B64: ${{ env.HEALTH_B64 }}
          HEALTH_SHA: ${{ env.HEALTH_SHA }}
          CLEANUP_APPLY: ${{ (inputs.confirm == 'APPLY_NAVER_SAFE_CLEANUP' || inputs.confirm == 'APPLY_NAVER_RECLAIM' || inputs.confirm == 'APPLY_NAVER_ENVELOPE_RENEW') && '1' || '0' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: HEALTH_B64,HEALTH_SHA,CLEANUP_APPLY
          command_timeout: 25m
          script: |
            set -eu
            /usr/bin/python3 -I -B -c "import base64,hashlib,os;raw=base64.b64decode(os.environ['HEALTH_B64'],validate=True);assert hashlib.sha256(raw).hexdigest()==os.environ['HEALTH_SHA'];g={'__name__':'__main__'};exec(compile(raw,'naver_engine_health','exec'),g)"
