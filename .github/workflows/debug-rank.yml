            echo "  [nginx 가 듣는 포트]"; (sudo -n ss -ltnp 2>/dev/null || ss -ltn) | grep -E ':443|:80 ' | awk '{print "   " $4}'
            echo "  [9/21 07:00~08:00 접속 로그에서 사라진 출처 — 회전 로그 포함]"; for f in "$LOG" "$LOG.1"; do [ -f "$f" ] && grep -a "21/Sep/2026:07" "$f" | grep -a '/api/collector' | awk '{ip=$1; cmd="printf %s " ip " | sha256sum | cut -c1-6"; cmd | getline h; close(cmd); n[h]++; last[h]=$4} END { for (h in n) printf "   %s x%d 마지막 %s\n", h, n[h], last[h] }'; done
            echo
