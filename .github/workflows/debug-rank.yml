            import re, sqlite3, collections
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row

            def host_of(u):
                u = str(u or "")
                if "brand.naver.com" in u:            return "brand"
                if "smartstore.naver.com" in u:       return "smartstore"
                if "shopping.naver.com/catalog" in u: return "catalog"
                if "naver.com" in u:                  return "naver(기타)"
                return "빈값" if not u.strip() else "그 외"

            def slug_of(u, host):
                pat = r"brand\.naver\.com/([^/?#]+)" if host == "brand" else r"smartstore\.naver\.com/([^/?#]+)"
                m = re.search(pat, str(u or ""))
                if not m: return ""
                sl = m.group(1).strip().lower()
                return "" if (not sl or sl.isdigit()) else sl

            SRC = [
                ("추적 상품",      "SELECT id, product_url AS u FROM tracked_products"),
                ("업체 대표주소",  "SELECT id, naver_store_url AS u FROM clients WHERE status='active' AND COALESCE(vertical,'store')='store'"),
                ("키워드별 등록부","SELECT client_id AS id, product_url AS u FROM client_keyword_product"),
            ]
            ss_slugs, br_slugs = {}, {}
            print("[호스트별 건수]")
            for label, sql in SRC:
                cnt = collections.Counter()
                try:
                    for r in conn.execute(sql):
                        h = host_of(r["u"]); cnt[h] += 1
                        sl = slug_of(r["u"], h)
                        if sl and h == "smartstore": ss_slugs.setdefault(sl, set()).add((label, r["id"]))
                        if sl and h == "brand":      br_slugs.setdefault(sl, set()).add((label, r["id"]))
                except Exception as e:
                    print(f"  {label}: 조회 실패 {e}"); continue
                total = sum(cnt.values())
                print(f"  {label} (총 {total})")
                for h, n in cnt.most_common():
                    print(f"      {h:<12} {n:>5}")

            print()
            print("[⭐ 같은 슬러그가 두 호스트에 걸쳐 있나 — 이름공간 판정]")
            both = sorted(set(ss_slugs) & set(br_slugs))
            print(f"  스마트스토어 슬러그 {len(ss_slugs)}종 · 브랜드스토어 슬러그 {len(br_slugs)}종 · 겹침 {len(both)}종")
            print("  (겹침이 있으면 같은 이름공간 = 접두어 없이 한 키로 이어도 된다는 근거)")

            print()
            print("[⭐ 브랜드스토어 슬러그가 상품쪽·업체쪽에서 서로 맞는가 — 고치면 실제로 이어지나]")
            br_by_src = {}
            for label, sql in SRC:
                try:
                    for r in conn.execute(sql):
                        if host_of(r["u"]) != "brand":
                            continue
                        sl = slug_of(r["u"], "brand")
                        if sl:
                            br_by_src.setdefault(label, set()).add(sl)
                except Exception:
                    pass
            prod = br_by_src.get("추적 상품", set())
            cli  = br_by_src.get("업체 대표주소", set()) | br_by_src.get("키워드별 등록부", set())
            print(f"  상품쪽 브랜드 슬러그 {len(prod)}종 · 업체쪽 {len(cli)}종 · 맞는 것 {len(prod & cli)}종")
            print("  ⇒ 맞는 것이 0이면 지금 당장 이어지는 건 없고, 앞으로 등록될 것에만 효과가 있다.")

            print()
            print("[주인 없는 추적 상품의 주소 모양]")
            try:
                q = ("SELECT p.product_url AS u FROM tracked_products p "
                     " WHERE COALESCE(p.disabled_at,'') = '' "
                     "   AND p.id NOT IN (SELECT tracked_product_id FROM rank_link)")
                cnt = collections.Counter(host_of(r["u"]) for r in conn.execute(q))
                print(f"  총 {sum(cnt.values())}개")
                for h, n in cnt.most_common():
                    print(f"      {h:<12} {n:>5}")
            except Exception as e:
                print(f"  조회 실패: {e}")
            conn.close()
            PY

      - name: 요청 큐 해부 (읽기 전용 · 키워드 미출력)
        if: ${{ github.event.inputs.queue == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          script: |
            echo "== 온디맨드 요청 큐 해부 (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PYQ'
            import sys, sqlite3, collections
            sys.path.insert(0, "/app")
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()

            print("[① 지금 무엇이 얼마나 쌓였나]")
            for r in c.execute("SELECT status, COUNT(*) n FROM collect_requests GROUP BY status"):
                print(f"  {r['status']:<10} {r['n']:>6}건")
            print("  -- pending 의 시도 횟수 분포 (5회 소진분은 7일 뒤 정리 대상) --")
            for r in c.execute("SELECT attempts, COUNT(*) n FROM collect_requests "
                               " WHERE status='pending' GROUP BY attempts ORDER BY attempts"):
                print(f"    attempts={r['attempts']}  {r['n']:>6}건")

            print()
            print("[② 언제 들어왔나 — 최근 12일 유입]")
            for r in c.execute("SELECT substr(requested_at,1,10) d, status, COUNT(*) n "
                               "  FROM collect_requests "
                               " WHERE requested_at >= date('now','localtime','-12 day') "
                               " GROUP BY d, status ORDER BY d DESC, status"):
                print(f"  {r['d']}  {r['status']:<8} {r['n']:>5}건")
            old = c.execute("SELECT MIN(requested_at) FROM collect_requests "
                            " WHERE status='pending'").fetchone()[0]
            print(f"  가장 오래된 대기 요청: {old}")

            print()
            print("[③ 오늘 들어온 것은 누가 넣었나 — 시각 분포가 답한다]")
            print("  ⚠️ 배치(08:00·08:30)에 몰려 있으면 **배치가 스스로 되넣는 것**이다.")
            print("     고르게 퍼져 있으면 직원 화면 검색분이다.")
            hh = collections.Counter()
            for r in c.execute("SELECT substr(requested_at,12,2) h FROM collect_requests "
                               " WHERE date(requested_at)=date('now','localtime')"):
                hh[r['h']] += 1
            tot = sum(hh.values())
            print(f"  오늘 유입 {tot}건")
            if tot:
                print("  " + " ".join(f"{h}시:{hh[h]}" for h in sorted(hh)))
                mm = collections.Counter()
                for r in c.execute("SELECT substr(requested_at,12,5) hm FROM collect_requests "
                                   " WHERE date(requested_at)=date('now','localtime') "
                                   "   AND substr(requested_at,12,2) IN ('08','09')"):
                    mm[r['hm']] += 1
                if mm:
                    top = mm.most_common(6)
                    print("  08~09시 분 단위 상위: " + " · ".join(f"{k} {v}건" for k, v in top))
                    if top[0][1] >= max(10, tot * 0.3):
                        print(f"  🔴 {top[0][0]} 한 분에 {top[0][1]}건 — 배치 되먹임으로 본다"
                              f"(enqueue_on_miss 가 어딘가에서 살아 있다)")

            print()
            print("[④ 유니버스 안인가 밖인가 — 정리 규칙이 갈리는 지점]")
            print("  ⚠️ prune_self_tail_requests 는 **유니버스 안**만 턴다.")
            print("     유니버스 밖(직원 화면 검색분)은 attempts<5 로 남으면 **영원히 안 지워진다** —")
            print("     확장이 꺼져 있으면 아무도 attempts 를 올리지 않기 때문이다.")
            try:
                from collector import _keyword_universe
                uni = set(_keyword_universe(conn).keys())
            except Exception as e:
                uni = set()
                print(f"  (유니버스 계산 실패: {type(e).__name__}: {str(e)[:70]})")
            _n = lambda k: "".join(str(k or "").split()).lower()
            if uni:
                inn = out = 0
                oldest_out = None
                for r in c.execute("SELECT keyword, requested_at FROM collect_requests "
                                   " WHERE status='pending' AND attempts < 5"):
                    if _n(r['keyword']) in uni:
                        inn += 1
                    else:
                        out += 1
                        if oldest_out is None or r['requested_at'] < oldest_out:
                            oldest_out = r['requested_at']
                print(f"  처리 대기 {inn + out}건 — 유니버스 안 {inn}건 · 밖 {out}건")
                print(f"  유니버스 밖 중 가장 오래된 것: {oldest_out}")
                print(f"  ⇒ 재개하면 매시간 최대 12건이 이 큐로 간다(하루 최대 288건).")
                if out:
                    print(f"  ⇒ 그중 {100*out//(inn+out)}% 는 순위 추적과 무관한 일이다.")

            print()
            print("[⑤ 재개 시 며칠이면 큐가 비나 — 상한 기준]")
            try:
                from collector import HOURLY_CAP
            except Exception:
                HOURLY_CAP = 40
            pend = c.execute("SELECT COUNT(*) FROM collect_requests "
                             " WHERE status='pending' AND attempts < 5").fetchone()[0]
            per_day = 12 * 24
            print(f"  대기 {pend}건 · 큐 몫 하루 최대 {per_day}건(시간당 12) "
                  f"⇒ {pend / per_day:.1f}일")
            print(f"  같은 기간 순위 몫은 시간당 {HOURLY_CAP - 12}건으로 눌린다"
                  f"(상한 {HOURLY_CAP} 중 12 를 큐가 먼저 먹는다).")
            conn.close()
            PYQ

            echo
            echo "== [되먹임 범인 찾기] 배포된 파일이 정말 고쳐진 것인가 =="
            echo "-- enqueue_on_miss=False 표지 개수(파일별) --"
            for f in auto_analysis.py scheduler.py naver_crawler.py collector.py; do
              n=$(docker exec -i logic-analysis sh -c "grep -c 'enqueue_on_miss=False' /app/$f" 2>/dev/null || echo 0)
              echo "   $f : $n"
            done
            echo "-- 배포본에 PR #199 주석이 있나(1차 키워드 경로·분석 배치) --"
            docker exec -i logic-analysis sh -c "grep -c '이 줄이 빠져 있었다' /app/auto_analysis.py" 2>/dev/null | sed 's/^/   auto_analysis 정정주석: /'
            docker exec -i logic-analysis sh -c "grep -c '1차 키워드 경로는 빠졌다' /app/naver_crawler.py" 2>/dev/null | sed 's/^/   naver_crawler 정정주석: /'
            echo
            echo "== [오늘 05:50~08:40 에 무엇이 돌았나] 앱 로그 (경로·잡 이름만·키워드 가림) =="
            # ⚠️ 날짜를 박아 두면 다음 날부터 늘 0줄이 나온다(2026-09-13 실측 — 그날 이 칸이 통째로 비었다).
            #    ⭐ 진단에 날짜·시각을 쓸 때는 **서버 날짜로 만들어 넣는다.**
            #    창을 06시까지 앞으로 넓혔다 — 08시대 되먹임이 막힌 뒤 06시 유입만 남아 그 축을 봐야 한다.
            TODAY=$(date +%Y-%m-%d)
            docker logs logic-analysis 2>&1 \
              | grep -aE "$TODAY 0(5:5[0-9]|6:|7:|8:[0-3][0-9]|8:40)" \
              | grep -aviE 'keyword|검색 결과|수집분 서빙' \
              | sed -E "s/\\[[^]]{1,60}\\]/[**]/g; s#https?://[^ ]*#(주소 가림)#g; s/'[^']{1,80}'/'**'/g" \
              | tail -40 || echo "(해당 시각 로그 없음)"
            echo
            echo "-- 그 시각 HTTP 요청 경로별 건수(외부 소비자 확인용·IP 미출력) --"
            docker logs logic-analysis 2>&1 \
              | grep -aE '\"(GET|POST) /api/' \
              | awk '{for(i=1;i<=NF;i++) if($i ~ /^\/api\//) {split($i,a,"?"); print a[1]}}' \
              | sort | uniq -c | sort -rn | head -15

  learning-center-static:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ad-deploy-prep-20261001' && (inputs.ad_prepare == 'learning-center-static-check' || inputs.ad_prepare == 'learning-center-static-install' || inputs.ad_prepare == 'learning-center-static-rollback')
    permissions:
      contents: read
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact public static package
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,tarfile
          inputs=json.loads(os.environ['INPUTS_JSON'])
          assert inputs.pop('ad_prepare') in ('learning-center-static-check','learning-center-static-install','learning-center-static-rollback')
          assert inputs.pop('ad_expected_baseline','')==''
          assert set(inputs)=={'collector','rank_link','capacity','structure','expired','queue','urlshape','use_branch_code'}
          assert all(v=='off' for v in inputs.values())
          p=pathlib.Path('releases/learning-center-static-patch-20261011.tar.gz')
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2f8a6b3fb73ce5e471915a3ba45eb92da13b0ac08679e93c78f711daaf0a778b'
          expected={'install_static.py','manifest.json','original-index.html','index.html','app.17f591847ebe.js','app.367bce70601a.js'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tar:
              members=tar.getmembers()
              assert len(members)==6 and {m.name for m in members}==expected
              assert all(m.isfile() and not m.issym() and not m.islnk() for m in members)
              assert sum(m.size for m in members)<4*1024*1024
          print('Pinned package verified; single LearningCenterPage change only')
          PY
      - name: Transfer package into new staging directory
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'releases/learning-center-static-patch-20261011.tar.gz'
          target: '/srv/metainc/learning-center-staging/${{ github.run_id }}'
          overwrite: false
      - name: Verify current files then perform scoped operation
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          STATIC_MODE: ${{ inputs.ad_prepare }}
          STATIC_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STATIC_MODE,STATIC_RUN_ID
          command_timeout: 90s
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PY'
            import hashlib,io,os,pathlib,re,subprocess,tarfile
            operation=os.environ['STATIC_MODE']; run_id=os.environ['STATIC_RUN_ID']
            mode={'learning-center-static-check':'check','learning-center-static-install':'install','learning-center-static-rollback':'rollback'}[operation]
            assert mode in ('check','install','rollback') and re.fullmatch('[0-9]{1,20}',run_id)
            staging=pathlib.Path('/srv/metainc/learning-center-staging')/run_id
            archive=staging/'releases/learning-center-static-patch-20261011.tar.gz'
            assert not archive.is_symlink() and archive.is_file()
            raw=archive.read_bytes()
            assert hashlib.sha256(raw).hexdigest()=='2f8a6b3fb73ce5e471915a3ba45eb92da13b0ac08679e93c78f711daaf0a778b'
            target=staging/'package'; target.mkdir(mode=0o700)
            expected={'install_static.py','manifest.json','original-index.html','index.html','app.17f591847ebe.js','app.367bce70601a.js'}
            with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tar:
                members=tar.getmembers()
                assert len(members)==6 and {m.name for m in members}==expected
                assert all(m.isfile() and not m.issym() and not m.islnk() for m in members)
                assert sum(m.size for m in members)<4*1024*1024
                for member in members:
                    data=tar.extractfile(member).read(); assert len(data)==member.size
                    fd=os.open(target/member.name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
                    with os.fdopen(fd,'wb') as stream: stream.write(data)
            subprocess.run(['/usr/bin/python3','-I','-B',str(target/'install_static.py'),'--root','/root/logic-analysis-deploy/frontend','--mode',mode],check=True,timeout=30)
            PY

  completion-postcompletion-patch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ad-deploy-prep-20261001' && (inputs.ad_prepare == 'preview-completion-patch-prepare' || inputs.ad_prepare == 'preview-completion-patch-apply' || inputs.ad_prepare == 'preview-completion-patch-rollback')
    permissions:
      contents: read
    concurrency:
      group: deploy-logic-analysis
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Existing preview regressions and exact schema 21 code patch bundle
        env:
          RUN_ID: ${{ github.run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -eu
          PYTHONPATH=backend/tools:backend/tests python3 -m unittest discover -s backend/tests -p 'test_naver_preview_*.py' -q
          PYTHONPATH=backend/tools:backend/tests python3 -m unittest test_naver_completion_postcompletion_transport test_naver_completion_download test_naver_saved_exports test_naver_saved_exports_inspect test_naver_completion_export_diagnostics test_naver_completion_failed_apply_recovery -q
          python3 - <<'PYCODE'
          import base64,json,os,pathlib,sys
          sys.path.insert(0,'backend/tools')
          import naver_completion_postcompletion_transport as T
          import naver_completion_postcompletion_patch as P
          def patch_ssh_scripts(workflow):
              lines=workflow.splitlines(keepends=True)
              starts=[i for i,line in enumerate(lines) if line.rstrip('\r\n')=='  completion-postcompletion-patch:']
              if len(starts)!=1:raise ValueError('COMPLETION_SSH_WORKFLOW')
              start=starts[0]+1;end=len(lines)
              for i in range(start,len(lines)):
                  if lines[i].startswith('  ') and not lines[i].startswith('   ') and lines[i].strip().endswith(':'):
                      end=i;break
              section=lines[start:end];scripts=[]
              if sum(line.strip().startswith('uses: appleboy/ssh-action@') for line in section)!=2:
                  raise ValueError('COMPLETION_SSH_WORKFLOW')
              for i,line in enumerate(section):
                  if line.rstrip('\r\n')!='          script: |':continue
                  body=[]
                  for item in section[i+1:]:
                      if item.startswith('            '):body.append(item[12:])
                      elif not item.strip():body.append(item)
                      else:break
                  if not body:raise ValueError('COMPLETION_SSH_WORKFLOW')
                  scripts.append(''.join(body))
              if len(scripts)!=2:raise ValueError('COMPLETION_SSH_WORKFLOW')
              return scripts
          def require_patch_ssh_pressure(wire,transport,workflow):
              if any(type(value) is not str or not value.isascii() or any(char in value for char in "'\r\n\x00") for value in (wire,transport)):
                  raise ValueError('COMPLETION_SSH_ENV')
              exports="export COMPLETION_PATCH_B64='"+wire+"'; export COMPLETION_PATCH_TRANSPORT_B64='"+transport+"';\n"
              sizes=[len((exports+script).encode('utf-8')) for script in patch_ssh_scripts(workflow)]
              if any(size>=131072 for size in sizes):raise ValueError('COMPLETION_SSH_SIZE')
              return sizes
          P.require_pins()
          inputs=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs'];operation=inputs.pop('ad_prepare');package=json.loads(inputs.pop('ad_expected_baseline'))
          assert operation in T.FUNCTIONS and all(v=='off' for v in inputs.values())
          if operation=='preview-completion-patch-prepare':
              from naver_completion_download import download
              fields=download(package,'preview-payload');fields.update(run_id=os.environ['RUN_ID'],operation='code-prepare');package=fields
          wire=T.encode(T.bundle(operation,package,pathlib.Path('backend/tools')))
          transport=base64.b64encode(pathlib.Path('backend/tools/naver_completion_postcompletion_transport.py').read_bytes()).decode()
          assert len(transport)<=32768
          require_patch_ssh_pressure(wire,transport,pathlib.Path('.github/workflows/debug-rank.yml').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('COMPLETION_PATCH_B64='+wire+'\n');stream.write('COMPLETION_PATCH_TRANSPORT_B64='+transport+'\n')
          PYCODE
      - name: Prepare same-run incoming directory only
        if: inputs.ad_prepare == 'preview-completion-patch-prepare'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          COMPLETION_PATCH_B64: ${{ env.COMPLETION_PATCH_B64 }}
          COMPLETION_PATCH_TRANSPORT_B64: ${{ env.COMPLETION_PATCH_TRANSPORT_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COMPLETION_PATCH_B64,COMPLETION_PATCH_TRANSPORT_B64
          command_timeout: 2m
          script: |
            set -eu
            /usr/bin/python3 -I -B - <<'PYCODE'
            import base64,json,os,sys,types
            try:
                wire=os.environ['COMPLETION_PATCH_B64'];source=os.environ['COMPLETION_PATCH_TRANSPORT_B64']
                if len(source)>32768:raise ValueError('COMPLETION_TRANSPORT_SIZE')
                transport=types.ModuleType('approved_completion_transport');exec(base64.b64decode(source,validate=True),transport.__dict__)
                bundle=transport.decode(wire)
                os.environ.clear();os.environ.update(PATH='/usr/sbin:/usr/bin:/sbin:/bin',LANG='C')
                result=transport.execute(bundle,incoming=True)
            except Exception:
                result={'ok':False,'stage':'incoming','error_code':'COMPLETION_INCOMING_REFUSED'}
            print('NAVER_COMPLETION_PATCH_INCOMING='+json.dumps(result,sort_keys=True));sys.exit(0 if result.get('ok') else 1)
            PYCODE
      - name: Align encrypted transfer ownership with private modes unchanged
        if: inputs.ad_prepare == 'preview-completion-patch-prepare'
        run: |
