name: Debug Rank Batch (읽기 전용 진단)

# 08:00 순위 추적 배치·수집 상태 점검 — 수동 실행 전용(push 트리거 없음 = 재배포 미유발).
# 작업 브랜치 ref 로 dispatch. 전 쿼리 읽기 전용(SELECT) — 데이터 변경 없음.

on:
  workflow_dispatch:
    inputs:
      collector:
        description: '수집기 진단 — off(기본) / on(확장이 서버에 접속했는지·큐·토큰 상태)'
        required: false
        default: 'off'
      rank_link:
        description: '순위 축 브리지 — off(기본) / stats / preview / apply'
        required: false
        default: 'off'
      capacity:
        description: '수집 소화량 — off(기본) / on. 1대가 실제로 하루 몇 개를 소화하는지·몇 시에 도는지·시간대별 몫이 고른지. 2대 배분 설계용(읽기 전용).'
        required: false
        default: 'off'
      structure:
        description: '구조 진단 — off(기본) / on. 자격 판정이 무엇을 거르는지 · 유니버스 868개의 출처 · 새는 곳 2군데 규모 · 이상적 분산(읽기 전용).'
        required: false
        default: 'off'
      expired:
        description: '추적 기간 지난 업체 목록 — off(기본) / on. 계약 살아 있는 곳과 끝난 곳을 갈라서 전수 출력(읽기 전용). ⚠️ 업체명이 실행 로그에 남는다 — 이 저장소는 공개이므로 결과를 받은 뒤 그 런의 로그를 삭제할 것.'
        required: false
        default: 'off'
      urlshape:
        description: '상품 주소 모양 실측 — off(기본) / on. 어느 호스트(스마트스토어·브랜드스토어·카탈로그)를 쓰는지, 같은 슬러그가 두 호스트에 걸쳐 있는지(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      report253d:
        description: '신고 253 4차 — 광고 누수 지문: 기타 링크 실체·날짜별 구성·전 키워드 일제 하락 여부(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      ownerhint:
        description: '추정 업체 커버리지 — off(기본) / on. 보관 상품 중 몇 개에 추정 업체가 붙는지 서버 매칭 규칙으로 실측(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      pending248:
        description: '신고 #248 — 추가 등록 키워드가 「기록 대기」에서 안 넘어가는 원인. 시간대 분포·축A 전용 키워드 수집률·자격/억제를 갈라 본다(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      after183:
        description: '배포 #183 확인 — off(기본) / on. 압축이 실제로 붙는지·부팅 로그·본문이 원본과 같은지 재현한다(읽기 전용).'
        required: false
        default: 'off'
      after179:
        description: '배포 #179 확인 — off(기본) / on. 시각 보정 로그·보고서 시:분·커버링 인덱스 채택·서버 파일 표지를 한 번에(읽기 전용).'
        required: false
        default: 'off'
      audit:
        description: '전수 점검 — off(기본) / on. 표 존재·시각 정합·오류 집계·잡 등록 상태를 한 번에(읽기 전용).'
        required: false
        default: 'off'
      slow:
        description: '느림 진단 — off(기본) / on. DB 크기·표별 용량·실제 쿼리 소요·컨테이너 자원(읽기 전용·전체 스캔 없음).'
        required: false
        default: 'off'
      verify:
        description: '배포 반영 확인 — off(기본) / on. 서버 파일 타임스탬프·크기와 이번 차수 표지 문자열을 센다(읽기 전용).'
        required: false
        default: 'off'
      use_branch_code:
        description: '이 브랜치의 rank_link.py 로 미리보기 — off(기본) / on. 배포 전에 새 규칙이 무엇을 이을지 먼저 보려는 용도(컨테이너 /tmp 에 얹었다 지운다·앱 파일 무접촉). apply 와 함께 쓰지 말 것.'
        required: false
        default: 'off'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      # 브랜치 코드 미리보기용 — 평소(off)엔 받아만 두고 쓰지 않는다.
      - uses: actions/checkout@v4
      - name: 브랜치 rank_link.py 인코딩
        if: ${{ github.event.inputs.use_branch_code == 'on' }}
        run: echo "RL_SRC_GZ=$(gzip -9c backend/rank_link.py | base64 -w0)" >> "$GITHUB_ENV"

      - name: Rank batch read-only diagnosis
        uses: appleboy/ssh-action@v1.0.3
        env:
          RL_SRC_GZ: ${{ env.RL_SRC_GZ }}
          IN_COLLECTOR: ${{ github.event.inputs.collector }}
          IN_RANK_LINK: ${{ github.event.inputs.rank_link }}
          IN_CAPACITY: ${{ github.event.inputs.capacity }}
          IN_STRUCTURE: ${{ github.event.inputs.structure }}
          IN_EXPIRED: ${{ github.event.inputs.expired }}
          IN_VERIFY: ${{ github.event.inputs.verify }}
          IN_SLOW: ${{ github.event.inputs.slow }}
          IN_AUDIT: ${{ github.event.inputs.audit }}
          IN_RTIME: ${{ github.event.inputs.rtime }}
          IN_BRANCH_CODE: ${{ github.event.inputs.use_branch_code }}
        with:
          envs: RL_SRC_GZ,IN_COLLECTOR,IN_RANK_LINK,IN_CAPACITY,IN_STRUCTURE,IN_EXPIRED,IN_VERIFY,IN_SLOW,IN_AUDIT,IN_RTIME,IN_BRANCH_CODE
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "== 컨테이너 상태 =="
            docker ps --filter name=logic-analysis --format '{{.Names}} {{.Status}}'
            docker inspect -f 'RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} OOMKilled={{.State.OOMKilled}}' logic-analysis
            echo
            if [ "$IN_AUDIT" = "on" ]; then
              echo "== 전수 점검 (읽기 전용) =="
              echo "-- 등록된 잡 --"
              docker logs --since 24h logic-analysis 2>&1 | grep -oE 'Added job "[^"]+"' | sort -u | sed "s/^/    /" | head -20
              echo "-- 최근 24h 오류 상위 --"
              docker logs --since 24h logic-analysis 2>&1 | grep -E "ERROR|CRITICAL|Traceback" | sed -E "s/\[[^]]*\]//g" | awk '{$1="";print}' | sort | uniq -c | sort -rn | head -8 | sed "s/^/    /"
              echo "-- DB --"
              timeout 60 docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, time, datetime
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            print("  컨테이너 현재시각 %s" % datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"))
            print("  -- 이번 주 만든 표가 실제로 있나 --")
            for t in ["client_detail_html","client_keyword_mute","sbiz_health","rank_link","collected_serp"]:
                try:
                    n = c.execute("SELECT COUNT(*) FROM %s" % t).fetchone()[0]
                    print("    %-22s 있음 · %d행" % (t, n))
                except Exception as e:
                    print("    %-22s ⚠️ %s" % (t, e))
            print("  -- 시각 정합(① 전산 통지 검증) --")
            for t, col in [("reports","created_at"), ("client_rank_history","checked_at"), ("collected_serp","created_at")]:
                try:
                    r = c.execute("SELECT MAX(%s) FROM %s" % (col, t)).fetchone()[0]
                    print("    %-22s 최신 %s" % (t+"."+col, r))
                except Exception as e:
                    print("    %-22s %s" % (t, e))
            print("  -- reports 표의 실제 정의(시각 기본값) --")
            try:
                sql = c.execute("SELECT sql FROM sqlite_master WHERE name='reports'").fetchone()[0]
                for line in sql.split("\n"):
                    if "created_at" in line or "updated_at" in line:
                        print("    %s" % line.strip())
            except Exception as e:
                print("    조회 실패: %s" % e)
            print("    참고 — 지금 UTC %s / localtime %s" % (
                c.execute("SELECT datetime('now')").fetchone()[0],
                c.execute("SELECT datetime('now','localtime')").fetchone()[0]))
            print("  -- 주간 보고서(① 소비) --")
            try:
                for r in c.execute("SELECT substr(created_at,1,10) d, COUNT(*) n, MIN(created_at), MAX(created_at) FROM reports WHERE is_auto=1 GROUP BY d ORDER BY d DESC LIMIT 3"):
                    print("    %s · %d건 · %s ~ %s" % (r[0], r[1], r[2], r[3]))
            except Exception as e:
                print("    조회 실패: %s" % e)
            PY
              echo
            fi
            if [ "$IN_RTIME" = "on" ]; then
              echo "== 보고서 시각 판정 (읽기 전용 · 업체명/제목 미출력) =="
              timeout 90 docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, os
            c = sqlite3.connect(os.getenv("DB_PATH", "/app/data/logic_data.db"))
            print("  현재 UTC %s / localtime %s" % (
                c.execute("SELECT datetime('now')").fetchone()[0],
                c.execute("SELECT datetime('now','localtime')").fetchone()[0]))

            print("  -- ① 서버 표 정의(코드가 아니라 실제 표) --")
            for t in ["reports"]:
                try:
                    sql = c.execute("SELECT sql FROM sqlite_master WHERE name=?", (t,)).fetchone()[0]
                    for line in sql.split("\n"):
                        if "_at" in line:
                            print("    %s" % line.strip())
                except Exception as e:
                    print("    %s 조회 실패: %s" % (t, e))

            print("  -- ② 자동 보고서 시:분 분포 (실행은 항상 월 09:40 KST) --")
            print("     00:4x = UTC 로 적힘 · 09:4x = KST 로 적힘")
            try:
                rows = list(c.execute(
                    "SELECT substr(created_at,12,5) hm, COUNT(*) n, MIN(substr(created_at,1,10)),"
                    " MAX(substr(created_at,1,10)) FROM reports WHERE is_auto=1"
                    " GROUP BY hm ORDER BY n DESC LIMIT 12"))
                for r in rows:
                    print("    %s · %5d건 · %s ~ %s" % (r[0], r[1], r[2], r[3]))
                if not rows:
                    print("    (자동 보고서 없음)")
            except Exception as e:
                print("    조회 실패: %s" % e)

            print("  -- ③ 수동 보고서 시각대 분포 (업무시간 09~19 KST 가 정상) --")
            try:
                for r in c.execute(
                    "SELECT substr(created_at,12,2) h, COUNT(*) n FROM reports"
                    " WHERE COALESCE(is_auto,0)=0 GROUP BY h ORDER BY h"):
                    print("    %s시 · %5d건" % (r[0], r[1]))
            except Exception as e:
                print("    조회 실패: %s" % e)

            print("  -- ④ 시계가 도중에 바뀌었나 (id 순 역행 점검) --")
            print("     한 시계만 썼다면 id 가 커질수록 시각도 커진다. 9시간짜리 역행이 있으면 도중에 바뀐 것이다.")
            try:
                prev = None
                jumps = []
                for rid, ts in c.execute(
                        "SELECT id, created_at FROM reports WHERE created_at IS NOT NULL"
                        " AND created_at <> '' ORDER BY id"):
                    if prev is not None and ts < prev[1]:
                        d = (c.execute("SELECT (julianday(?) - julianday(?)) * 24",
                                       (prev[1], ts)).fetchone()[0] or 0)
                        if d >= 1.0:
                            jumps.append((prev[0], rid, round(d, 2)))
                    prev = (rid, ts)
                if jumps:
                    print("    ⚠️ 역행 %d곳:" % len(jumps))
                    for a, b, d in jumps[:10]:
                        print("      id %s → %s 에서 %s시간 되돌아감" % (a, b, d))
                else:
                    print("    역행 0곳 — 처음부터 끝까지 한 시계다.")
            except Exception as e:
                print("    조회 실패: %s" % e)

            print("  -- ⑤ 소급 보정(+9시간)이 날짜를 넘기는 행 --")
            print("     15시 이후에 적힌 행만 날짜가 하루 밀린다. 0건이면 보정해도 ①의 날짜 축은 그대로다.")
            try:
                tot = c.execute("SELECT COUNT(*) FROM reports").fetchone()[0]
                cross = c.execute(
                    "SELECT COUNT(*) FROM reports WHERE created_at IS NOT NULL"
                    " AND substr(created_at,12,2) >= '15'").fetchone()[0]
                nullish = c.execute(
                    "SELECT COUNT(*) FROM reports WHERE created_at IS NULL OR created_at = ''"
                    " OR length(created_at) < 16").fetchone()[0]
                print("    전체 %d건 · 날짜 넘김 %d건 · 시각 없음/짧음 %d건" % (tot, cross, nullish))
            except Exception as e:
                print("    조회 실패: %s" % e)

            print("  -- ⑥ 같은 병을 앓는 다른 표 (기본값이 UTC 인 칸) --")
            try:
                hits = 0
                for name, sql in c.execute(
                        "SELECT name, sql FROM sqlite_master WHERE type='table' AND sql IS NOT NULL"):
                    for line in (sql or "").split("\n"):
                        u = line.upper()
                        if "CURRENT_TIMESTAMP" in u:
                            print("    %-26s %s" % (name, line.strip()))
                            hits += 1
                if not hits:
                    print("    없음 — reports 말고는 전부 localtime 이다.")
            except Exception as e:
                print("    조회 실패: %s" % e)
            PY
              echo
            fi
            echo
            echo
            if [ "$IN_SLOW" = "on" ]; then
              echo "== 느림 진단 (읽기 전용) =="
              echo "-- 컨테이너 자원 --"
              timeout 20 docker stats --no-stream --format '  CPU {{.CPUPerc}} · MEM {{.MemUsage}} ({{.MemPerc}}) · IO {{.BlockIO}}' logic-analysis || echo "  (stats 실패)"
              echo "-- 디스크·파일 --"
              timeout 15 df -h / | tail -1 | awk '{print "  루트 "$3"/"$2" ("$5")"}'
              timeout 20 du -sh /root/logic-analysis-deploy/data/*.db* 2>/dev/null | sed 's/^/  /' || true
              echo "-- DB 내부 --"
              timeout 90 docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, time
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            def one(q):
                return c.execute(q).fetchone()[0]
            ps, pc, fl = one("PRAGMA page_size"), one("PRAGMA page_count"), one("PRAGMA freelist_count")
            print("  파일 %.0f MB · 빈 페이지 %.0f MB (%.0f%%) · journal=%s" % (ps*pc/1048576, ps*fl/1048576, fl*100.0/max(pc,1), one("PRAGMA journal_mode")))
            print("  -- 표별 크기(최근 200행 평균 × 행수) --")
            for t, col in [("collected_serp","products_json"), ("client_analyses","analysis_json"), ("client_analyses","report_html"), ("clients","detail_html")]:
                try:
                    n = one("SELECT COUNT(*) FROM %s" % t)
                    avg = c.execute("SELECT AVG(LENGTH(COALESCE(%s,''))) FROM (SELECT %s FROM %s ORDER BY rowid DESC LIMIT 200)" % (col, col, t)).fetchone()[0] or 0
                    print("    %-30s %8d행 · 평균 %6.0f KB · 추정 %7.0f MB" % (t+"."+col, n, avg/1024, n*avg/1048576))
                except Exception as e:
                    print("    %s.%s 조회 실패: %s" % (t, col, e))
            for t in ["rankings", "client_rank_history", "collect_requests"]:
                try:
                    print("    %-30s %8d행" % (t, one("SELECT COUNT(*) FROM %s" % t)))
                except Exception as e:
                    print("    %s: %s" % (t, e))
            print("  -- 관리 목록이 매번 도는 쿼리 실제 소요 --")
            def timed(label, q, args=()):
                t0 = time.perf_counter()
                try:
                    rows = c.execute(q, args).fetchall()
                    print("    %-32s %8.0f ms · %d행" % (label, (time.perf_counter()-t0)*1000, len(rows)))
                except Exception as e:
                    print("    %s 실패: %s" % (label, e))
            timed("① 업체 목록", "SELECT id,name,status,contract_stage FROM clients WHERE status='active'")
            ids = [r[0] for r in c.execute("SELECT id FROM clients WHERE status='active' LIMIT 400")]
            ph = ",".join("?"*len(ids))
            timed("② 분석 집계", "SELECT client_id,COUNT(*),MAX(updated_at),COUNT(DISTINCT keyword) FROM client_analyses WHERE client_id IN (%s) GROUP BY client_id" % ph, ids)
            timed("③ 순위 롤업", "SELECT client_id,keyword,MAX(id) FROM client_rank_history WHERE client_id IN (%s) GROUP BY client_id,keyword" % ph, ids)
            timed("④ 수집분 1건 읽기", "SELECT products_json FROM collected_serp ORDER BY id DESC LIMIT 1")
            print("  -- 이관 결과 --")
            try:
                left = one("SELECT COUNT(*) FROM clients WHERE COALESCE(detail_html,'') != ''")
                n2 = one("SELECT COUNT(*) FROM client_detail_html")
                sz = c.execute("SELECT AVG(LENGTH(html)) FROM (SELECT html FROM client_detail_html LIMIT 200)").fetchone()[0] or 0
                print("    옆 표 %d곳 · 평균 %.0f KB · 업체 표에 남은 덩어리 %d곳" % (n2, sz/1024, left))
            except Exception as e:
                print("    이관 확인 실패: %s" % e)
            print("  -- A/B: 큰 칸(detail_html)을 지나가야 하는가 --")
            timed("A. id 만(인덱스만)", "SELECT id FROM clients WHERE status='active'")
            timed("B. id+name(큰 칸 앞)", "SELECT id,name FROM clients WHERE status='active'")
            timed("C. id+contract_stage(뒤)", "SELECT id,contract_stage FROM clients WHERE status='active'")
            cols = [r[1] for r in c.execute("PRAGMA table_info(clients)")]
            print("    clients 칸 순서 %d개 · detail_html 은 %d번째" % (len(cols), cols.index("detail_html")+1 if "detail_html" in cols else -1))
            print("    detail_html 뒤 칸: %s" % ", ".join(cols[cols.index("detail_html")+1:]) if "detail_html" in cols else "")
            print("  -- 인덱스 사용 여부 --")
            for lbl, q in [("분석 집계", "EXPLAIN QUERY PLAN SELECT client_id,COUNT(*) FROM client_analyses WHERE client_id IN (1,2) GROUP BY client_id"), ("순위 롤업", "EXPLAIN QUERY PLAN SELECT client_id,keyword,MAX(id) FROM client_rank_history WHERE client_id IN (1,2) GROUP BY client_id,keyword")]:
                print("    %s: %s" % (lbl, " / ".join(r[-1] for r in c.execute(q))))
            PY
              echo
            fi
            echo
            if [ "$IN_VERIFY" = "on" ]; then
              echo "== 배포 반영 확인 (읽기 전용) =="
              docker exec logic-analysis sh -c '
                for f in keyword_mute.py client_dashboard.py scheduler.py collector.py rank_record.py main.py; do
                  if [ -f /app/$f ]; then
                    printf "  %-22s %s  %s bytes\n" "$f" "$(date -r /app/$f +%m-%d\ %H:%M)" "$(wc -c < /app/$f)"
                  else
                    printf "  %-22s (없음)\n" "$f"
                  fi
                done'
              echo "  -- 이번 차수 표지 --"
              docker exec logic-analysis sh -c '
                echo "  archived-clients   : $(grep -c "archived-clients" /app/client_dashboard.py 2>/dev/null)"
                echo "  보관 목록 범위 규칙: $(grep -c "status='"'"'terminated'"'"'" /app/client_dashboard.py 2>/dev/null)"
                echo "  keyword_mute import: $(grep -rl "from keyword_mute import" /app/*.py 2>/dev/null | wc -l) 개 파일"
                echo "  untrack-keyword    : $(grep -c "untrack-keyword" /app/client_dashboard.py 2>/dev/null)"
                echo "  rank-links         : $(grep -c "rank-links" /app/client_dashboard.py 2>/dev/null)"
                echo "  source_label       : $(grep -c "source_label" /app/client_dashboard.py 2>/dev/null)"
