              def literals(items):
                  return tuple((token.type, token.string) for token in items
                      if token.type == tokenize.STRING or tokenize.tok_name[token.type].startswith('FSTRING'))
              result = dict(bundle)
              for key, source in bundle.items():
                  if key != 'source' and not key.endswith('_source'):
                      continue
                  if type(source) is not str:
                      raise ValueError('SOURCE_AST_MISMATCH')
                  lines = source.splitlines(keepends=True)
                  strings = set()
                  tokens = list(tokenize.generate_tokens(io.StringIO(source).readline))
                  for token in tokens:
                      if token.type == tokenize.STRING or tokenize.tok_name[token.type].startswith('FSTRING'):
                          strings.update(range(token.start[0], token.end[0] + 1))
                  for token in tokens:
                      if token.type == tokenize.COMMENT:
                          index = token.start[0] - 1
                          lines[index] = lines[index][:token.start[1]].rstrip() + '\n'
                  compact = ''.join(line for number, line in enumerate(lines, 1) if line.strip() or number in strings)
                  pairs, level = [], 0
                  for token in tokenize.generate_tokens(io.StringIO(compact).readline):
                      value = token.string
                      if token.type == tokenize.INDENT:
                          level += 1
                          value = ' ' * level
                      elif token.type == tokenize.DEDENT:
                          level -= 1
                      pairs.append((token.type, value))
                  compact = tokenize.untokenize(pairs)
                  if literals(tokens) != literals(tokenize.generate_tokens(io.StringIO(compact).readline)):
                      raise ValueError('SOURCE_STRING_MISMATCH')
                  if fields(ast.parse(source)) != fields(ast.parse(compact)):
                      raise ValueError('SOURCE_AST_MISMATCH')
                  result[key] = compact
              return result
