                      assert approved_config_operation_id==naver_preview_code_only.REVIEWED_CONFIG_OPERATION_V26
                  elif (type(naver_preview_code_only.REVIEWED_TRANSITION_V25[1]) is str
                          and package.get('source_commit')==naver_preview_code_only.REVIEWED_TRANSITION_V25[1]):
                      assert approved_config_operation_id==naver_preview_code_only.REVIEWED_CONFIG_OPERATION_V25
                  else:
