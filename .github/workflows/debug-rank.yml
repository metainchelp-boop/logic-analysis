name: Debug Rank Batch (읽기 전용 진단)

# 08:00 순위 추적 배치·수집 상태 점검 — 수동 실행 전용(push 트리거 없음 = 재배포 미유발).
# 작업 브랜치 ref 로 dispatch. 전 쿼리 읽기 전용(SELECT) — 데이터 변경 없음.

on:
  workflow_dispatch:
    inputs:
      collector:
        description: '수집기 진단 — off(기본) / on(확장이 서버에 접속했는지·큐·토큰 상태)'
        required: false
        default: 'off'
      rank_link:
        description: '순위 축 브리지 — off(기본) / stats / preview / apply'
        required: false
        default: 'off'
      capacity:
        description: '수집 소화량 — off(기본) / on. 1대가 실제로 하루 몇 개를 소화하는지·몇 시에 도는지·시간대별 몫이 고른지. 2대 배분 설계용(읽기 전용).'
        required: false
        default: 'off'
      structure:
        description: '구조 진단 — off(기본) / on. 자격 판정이 무엇을 거르는지 · 유니버스 868개의 출처 · 새는 곳 2군데 규모 · 이상적 분산(읽기 전용).'
        required: false
        default: 'off'
      expired:
        description: '추적 기간 지난 업체 목록 — off(기본) / on. 계약 살아 있는 곳과 끝난 곳을 갈라서 전수 출력(읽기 전용). ⚠️ 업체명이 실행 로그에 남는다 — 이 저장소는 공개이므로 결과를 받은 뒤 그 런의 로그를 삭제할 것.'
        required: false
        default: 'off'
      urlshape:
        description: '상품 주소 모양 실측 — off(기본) / on. 어느 호스트(스마트스토어·브랜드스토어·카탈로그)를 쓰는지, 같은 슬러그가 두 호스트에 걸쳐 있는지(읽기 전용·업체명 미출력).'
        required: false
        default: 'off'
      slow:
        description: '느림 진단 — off(기본) / on. DB 크기·표별 용량·실제 쿼리 소요·컨테이너 자원(읽기 전용·전체 스캔 없음).'
        required: false
        default: 'off'
      verify:
        description: '배포 반영 확인 — off(기본) / on. 서버 파일 타임스탬프·크기와 이번 차수 표지 문자열을 센다(읽기 전용).'
        required: false
        default: 'off'
      use_branch_code:
        description: '이 브랜치의 rank_link.py 로 미리보기 — off(기본) / on. 배포 전에 새 규칙이 무엇을 이을지 먼저 보려는 용도(컨테이너 /tmp 에 얹었다 지운다·앱 파일 무접촉). apply 와 함께 쓰지 말 것.'
        required: false
        default: 'off'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      # 브랜치 코드 미리보기용 — 평소(off)엔 받아만 두고 쓰지 않는다.
      - uses: actions/checkout@v4
      - name: 브랜치 rank_link.py 인코딩
        if: ${{ github.event.inputs.use_branch_code == 'on' }}
        run: echo "RL_SRC_GZ=$(gzip -9c backend/rank_link.py | base64 -w0)" >> "$GITHUB_ENV"

      - name: Rank batch read-only diagnosis
        uses: appleboy/ssh-action@v1.0.3
        env:
          RL_SRC_GZ: ${{ env.RL_SRC_GZ }}
          IN_COLLECTOR: ${{ github.event.inputs.collector }}
          IN_RANK_LINK: ${{ github.event.inputs.rank_link }}
          IN_CAPACITY: ${{ github.event.inputs.capacity }}
          IN_STRUCTURE: ${{ github.event.inputs.structure }}
          IN_EXPIRED: ${{ github.event.inputs.expired }}
          IN_VERIFY: ${{ github.event.inputs.verify }}
          IN_SLOW: ${{ github.event.inputs.slow }}
          IN_BRANCH_CODE: ${{ github.event.inputs.use_branch_code }}
        with:
          envs: RL_SRC_GZ,IN_COLLECTOR,IN_RANK_LINK,IN_CAPACITY,IN_STRUCTURE,IN_EXPIRED,IN_VERIFY,IN_SLOW,IN_BRANCH_CODE
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "== 컨테이너 상태 =="
            docker ps --filter name=logic-analysis --format '{{.Names}} {{.Status}}'
            docker inspect -f 'RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} OOMKilled={{.State.OOMKilled}}' logic-analysis
            echo
            if [ "$IN_SLOW" = "on" ]; then
              echo "== 느림 진단 (읽기 전용) =="
              echo "-- 컨테이너 자원 --"
              timeout 20 docker stats --no-stream --format '  CPU {{.CPUPerc}} · MEM {{.MemUsage}} ({{.MemPerc}}) · IO {{.BlockIO}}' logic-analysis || echo "  (stats 실패)"
              echo "-- 디스크·파일 --"
              timeout 15 df -h / | tail -1 | awk '{print "  루트 "$3"/"$2" ("$5")"}'
              timeout 20 du -sh /root/logic-analysis-deploy/data/*.db* 2>/dev/null | sed 's/^/  /' || true
              echo "-- DB 내부 --"
              timeout 90 docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3, time
            c = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            def one(q):
                return c.execute(q).fetchone()[0]
            ps, pc, fl = one("PRAGMA page_size"), one("PRAGMA page_count"), one("PRAGMA freelist_count")
            print("  파일 %.0f MB · 빈 페이지 %.0f MB (%.0f%%) · journal=%s" % (ps*pc/1048576, ps*fl/1048576, fl*100.0/max(pc,1), one("PRAGMA journal_mode")))
            print("  -- 표별 크기(최근 200행 평균 × 행수) --")
            for t, col in [("collected_serp","products_json"), ("client_analyses","analysis_json"), ("client_analyses","report_html"), ("clients","detail_html")]:
                try:
                    n = one("SELECT COUNT(*) FROM %s" % t)
                    avg = c.execute("SELECT AVG(LENGTH(COALESCE(%s,''))) FROM (SELECT %s FROM %s ORDER BY rowid DESC LIMIT 200)" % (col, col, t)).fetchone()[0] or 0
                    print("    %-30s %8d행 · 평균 %6.0f KB · 추정 %7.0f MB" % (t+"."+col, n, avg/1024, n*avg/1048576))
                except Exception as e:
                    print("    %s.%s 조회 실패: %s" % (t, col, e))
            for t in ["rankings", "client_rank_history", "collect_requests"]:
                try:
                    print("    %-30s %8d행" % (t, one("SELECT COUNT(*) FROM %s" % t)))
                except Exception as e:
                    print("    %s: %s" % (t, e))
            print("  -- 관리 목록이 매번 도는 쿼리 실제 소요 --")
            def timed(label, q, args=()):
                t0 = time.perf_counter()
                try:
                    rows = c.execute(q, args).fetchall()
                    print("    %-32s %8.0f ms · %d행" % (label, (time.perf_counter()-t0)*1000, len(rows)))
                except Exception as e:
                    print("    %s 실패: %s" % (label, e))
            timed("① 업체 목록", "SELECT id,name,status,contract_stage FROM clients WHERE status='active'")
            ids = [r[0] for r in c.execute("SELECT id FROM clients WHERE status='active' LIMIT 400")]
            ph = ",".join("?"*len(ids))
            timed("② 분석 집계", "SELECT client_id,COUNT(*),MAX(updated_at),COUNT(DISTINCT keyword) FROM client_analyses WHERE client_id IN (%s) GROUP BY client_id" % ph, ids)
            timed("③ 순위 롤업", "SELECT client_id,keyword,MAX(id) FROM client_rank_history WHERE client_id IN (%s) GROUP BY client_id,keyword" % ph, ids)
            timed("④ 수집분 1건 읽기", "SELECT products_json FROM collected_serp ORDER BY id DESC LIMIT 1")
            print("  -- A/B: 큰 칸(detail_html)을 지나가야 하는가 --")
            timed("A. id 만(인덱스만)", "SELECT id FROM clients WHERE status='active'")
            timed("B. id+name(큰 칸 앞)", "SELECT id,name FROM clients WHERE status='active'")
            timed("C. id+contract_stage(뒤)", "SELECT id,contract_stage FROM clients WHERE status='active'")
            cols = [r[1] for r in c.execute("PRAGMA table_info(clients)")]
            print("    clients 칸 순서 %d개 · detail_html 은 %d번째" % (len(cols), cols.index("detail_html")+1 if "detail_html" in cols else -1))
            print("    detail_html 뒤 칸: %s" % ", ".join(cols[cols.index("detail_html")+1:]) if "detail_html" in cols else "")
            print("  -- 인덱스 사용 여부 --")
            for lbl, q in [("분석 집계", "EXPLAIN QUERY PLAN SELECT client_id,COUNT(*) FROM client_analyses WHERE client_id IN (1,2) GROUP BY client_id"), ("순위 롤업", "EXPLAIN QUERY PLAN SELECT client_id,keyword,MAX(id) FROM client_rank_history WHERE client_id IN (1,2) GROUP BY client_id,keyword")]:
                print("    %s: %s" % (lbl, " / ".join(r[-1] for r in c.execute(q))))
            PY
              echo
            fi
            echo
            if [ "$IN_VERIFY" = "on" ]; then
              echo "== 배포 반영 확인 (읽기 전용) =="
              docker exec logic-analysis sh -c '
                for f in keyword_mute.py client_dashboard.py scheduler.py collector.py rank_record.py main.py; do
                  if [ -f /app/$f ]; then
                    printf "  %-22s %s  %s bytes\n" "$f" "$(date -r /app/$f +%m-%d\ %H:%M)" "$(wc -c < /app/$f)"
                  else
                    printf "  %-22s (없음)\n" "$f"
                  fi
                done'
              echo "  -- 이번 차수 표지 --"
              docker exec logic-analysis sh -c '
                echo "  archived-clients   : $(grep -c "archived-clients" /app/client_dashboard.py 2>/dev/null)"
                echo "  보관 목록 범위 규칙: $(grep -c "status='"'"'terminated'"'"'" /app/client_dashboard.py 2>/dev/null)"
                echo "  keyword_mute import: $(grep -rl "from keyword_mute import" /app/*.py 2>/dev/null | wc -l) 개 파일"
                echo "  untrack-keyword    : $(grep -c "untrack-keyword" /app/client_dashboard.py 2>/dev/null)"
                echo "  rank-links         : $(grep -c "rank-links" /app/client_dashboard.py 2>/dev/null)"
                echo "  source_label       : $(grep -c "source_label" /app/client_dashboard.py 2>/dev/null)"
                echo "  나눠적기 억제 스킵 : $(grep -c "_share_muted" /app/scheduler.py 2>/dev/null)"
                echo "  즉시기록 자격통일  : $(grep -c "eligible_clients_sql" /app/rank_record.py 2>/dev/null)"
                echo "  상품등록 양방향    : $(grep -c "대표 키워드 .*동반 등록\|동반 등록" /app/main.py 2>/dev/null)"'
              echo "  -- 화면(FE) 번들 --"
              sh -c '
                B=$(ls -t /root/logic-analysis-deploy/frontend/dist/app.*.js 2>/dev/null | head -1)
                if [ -n "$B" ]; then
                  echo "  $B ($(date -r $B +%m-%d\ %H:%M))"
                  for m in "목록에서 내리기" "내린 업체" "되돌리기" "archived-clients" "그만 재기"; do
                    echo "    $m: $(grep -c "$m" $B)"
                  done
                else
                  echo "  (번들 못 찾음)"
                fi' 2>/dev/null || echo "  (FE 경로 확인 필요)"
              echo
              echo "== 어젯밤 잡 결과 (01:20 · 04:00 · 08:00) =="
              docker logs --since 24h logic-analysis 2>&1 | grep -iE "주인 없어|백필 적용|고아|계약단계|자동 추적|추적 상품 자격 판정|이어진 짝|나눠 적음|큐 정리|남은 대기|기록 완료|순위 추적 완료" | tail -30 || echo "(매칭 없음)"
              echo
            fi
            if [ "$IN_VERIFY" != "on" ]; then
            echo "== 오늘 배치 로그 (순위/수집/스케줄러) =="
            docker logs --since 12h logic-analysis 2>&1 | grep -iE '순위 추적|수집 실패|검색 결과 0건|스케줄러|전체 분석|rank_tracking|daily_analysis' | tail -60 || echo "(매칭 없음)"
            fi
            echo
            echo "== DB 현황 (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()

            print("[client_rank_history 오늘 · check_type별]")
            for r in c.execute("""SELECT check_type, COUNT(*) n,
                                    SUM(CASE WHEN rank_position IS NULL THEN 1 ELSE 0 END) nr,
                                    MIN(checked_at) mn, MAX(checked_at) mx
                                  FROM client_rank_history
                                  WHERE DATE(checked_at)=DATE('now','localtime')
                                  GROUP BY check_type"""):
                print(f"  {r['check_type']}: {r['n']}건 (미노출 {r['nr']}) {r['mn']} ~ {r['mx']}")

            print("\n[rankings(추적상품) 오늘 · check_type별]")
            for r in c.execute("""SELECT check_type, COUNT(*) n,
                                    SUM(CASE WHEN rank_position IS NULL THEN 1 ELSE 0 END) nr,
                                    MIN(checked_at) mn, MAX(checked_at) mx
                                  FROM rankings
                                  WHERE DATE(checked_at)=DATE('now','localtime')
                                  GROUP BY check_type"""):
                print(f"  {r['check_type']}: {r['n']}건 (미노출 {r['nr']}) {r['mn']} ~ {r['mx']}")
            n = c.execute("SELECT COUNT(*) n FROM rankings WHERE DATE(checked_at)=DATE('now','localtime')").fetchone()['n']
            if not n:
                print("  (오늘 기록 없음)")

            print("\n[수집 데이터(collected_serp) 최근 3일]")
            try:
                for r in c.execute("""SELECT collected_date d, COUNT(DISTINCT keyword) kw, COUNT(*) rows
                                      FROM collected_serp
                                      WHERE collected_date >= DATE('now','localtime','-2 day')
                                      GROUP BY collected_date ORDER BY d"""):
                    print(f"  {r['d']}: 키워드 {r['kw']} · 행 {r['rows']}")
            except Exception as e:
                print("  collected_serp 조회 실패:", e)
                print("  테이블 목록:", [t[0] for t in c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%collect%'")])

            print("\n[통합 설계용 — 두 축 규모·겹침]")
            import re as _re
            def _pid(u):
                u = u or ""
                for pat in (r"[?&]nvMid=(\d+)", r"/products/(\d+)", r"/catalog/(\d+)"):
                    m = _re.search(pat, u)
                    if m: return m.group(1)
                return ""
            tp = c.execute("SELECT COUNT(*) n FROM tracked_products").fetchone()["n"]
            tk = c.execute("SELECT COUNT(*) n FROM tracked_keywords").fetchone()["n"]
            cl = c.execute("SELECT COUNT(*) n FROM clients WHERE status='active'").fetchone()["n"]
            crh = c.execute("SELECT COUNT(*) n FROM client_rank_history").fetchone()["n"]
            rk = c.execute("SELECT COUNT(*) n FROM rankings").fetchone()["n"]
            print(f"  축A 추적상품 {tp} · 추적키워드 {tk} · rankings {rk}행")
            print(f"  축B 업체(active) {cl} · client_rank_history {crh}행")
            a_pids = set()
            for r in c.execute("SELECT product_url FROM tracked_products"):
                p = _pid(r["product_url"])
                if p: a_pids.add(p)
            b_pids = set()
            for r in c.execute("SELECT naver_store_url FROM clients WHERE status='active'"):
                p = _pid(r["naver_store_url"])
                if p: b_pids.add(p)
            inter = a_pids & b_pids
            print(f"  상품ID 보유: 축A {len(a_pids)}/{tp} · 축B {len(b_pids)}/{cl}")
            pa = round(len(inter)*100/max(1,len(a_pids)))
            pb = round(len(inter)*100/max(1,len(b_pids)))
            print(f"  * 상품ID 기준 겹침 {len(inter)}건 (축A의 {pa}% / 축B의 {pb}%)")
            orph = c.execute("SELECT COUNT(*) n FROM client_rank_history WHERE client_id NOT IN (SELECT id FROM clients)").fetchone()["n"]
            print(f"  고아 순위행(업체 삭제됨): {orph}")
            kw_a = {r[0] for r in c.execute("SELECT DISTINCT keyword FROM tracked_keywords")}
            kw_b = {r[0] for r in c.execute("SELECT DISTINCT keyword FROM client_rank_history")}
            print(f"  키워드 축A {len(kw_a)} · 축B {len(kw_b)} · 공통 {len(kw_a & kw_b)} · 합집합 {len(kw_a | kw_b)}")

            print("\n[추적 상품 스토어명 슬러그]")
            import re
            tot = slug = 0
            for r in c.execute("SELECT product_url, store_name FROM tracked_products"):
                tot += 1
                m = re.search(r"smartstore\.naver\.com/([^/?#]+)", r["product_url"] or "")
                s = (r["store_name"] or "").strip().lower()
                if m and s == m.group(1).strip().lower():
                    slug += 1
            print(f"  총 {tot} / 슬러그 {slug}")
            PY
            echo
            if [ "$IN_COLLECTOR" = "on" ]; then
              echo "== 수집기 진단 =="
              echo "-- 확장이 서버에 접속한 기록(오늘) --"
              # 확장은 GET /api/collector/keywords 로 목록을 받고 POST /serp 로 올린다.
              # 한 줄도 없으면 '확장이 서버에 아예 말을 걸지 않은 것' = 맥북 쪽 문제.
              docker logs --since 24h logic-analysis 2>&1 | grep -E 'api/collector' \
                | awk '{print $0}' | tail -25 || echo "  (접속 기록 없음)"
              echo "-- 접속 횟수(경로별·24시간) --"
              docker logs --since 24h logic-analysis 2>&1 | grep -oE 'GET /api/collector/[a-z]+|POST /api/collector/[a-z]+' \
                | sort | uniq -c || echo "  (없음)"
              echo "-- 기계별 집계(24시간) — 같은 통신사 대역이면 앞 두 자리가 같아 뭉친다 --"
              # ⚠️ 저장소가 공개라 실제 IP 를 찍지 않는다. **전체 IP 로 묶은 뒤** 앞 두 자리 + 그룹번호로만 표기.
              #    같은 앞자리에 그룹이 둘 이상이면 = 같은 통신사 대역의 서로 다른 기계다(집·회사가 겹칠 수 있음).
              for f in /var/log/nginx/access.log.1 /var/log/nginx/access.log; do
                [ -f "$f" ] && cat "$f"
              done 2>/dev/null | grep -E 'api/(collector/(serp|keywords|requests)|place/(ingest|track-targets))' \
                | awk '{ ip=$1; split(ip,o,"."); pre=o[1]"."o[2];
                        if (!(ip in gid)) { gid[ip] = ++gn[pre]; order[++m]=ip }
                        t=$4; gsub(/^\[/,"",t); split(t,d,":"); hh=d[2];
                        p=$7; sub(/\?.*$/,"",p); sub(/^.*\/api\//,"",p); sub(/^collector\//,"",p); sub(/^place\//,"",p);
                        tot[ip]++; last[ip]=t; ep[ip" "p]++; hrs[ip" "hh]=1; pfx[ip]=pre }
                   END { for (i=1;i<=m;i++) { ip=order[i]; hc=0;
                           for (k in hrs) { split(k,a," "); if (a[1]==ip) hc++ }
                           printf "  [%s · 그룹%d] 총 %d건 · 활동시간대 %d/24 · 마지막 %s\n", pfx[ip], gid[ip], tot[ip], hc, last[ip];
                           for (k in ep) { split(k,b," "); if (b[1]==ip) printf "        %-14s %d건\n", b[2], ep[k] } } }' \
                | sort -s -t'[' -k2,2 || echo "  (집계 실패)"
              echo "  ↑ 같은 앞자리에 그룹이 2개 이상이면 같은 통신사 대역의 다른 기계 = 앞자리만으로는 못 가른다"
              echo "-- 지도 순위 기록(place/ingest)을 보내는 IP — 어느 기계가 플레이스를 도는지 --"
              # 플레이스 러너는 로직 탭(브라우저)을 거쳐 기록하므로 그 PC 의 IP 로 잡힌다.
              for f in /var/log/nginx/access.log.1 /var/log/nginx/access.log; do
                [ -f "$f" ] && cat "$f"
              done 2>/dev/null | grep -E 'api/place/(ingest|track-targets)' \
