            echo "  [ufw]"; (sudo -n ufw status 2>/dev/null || echo "  (ufw 없음/권한 없음)") | grep -vi "^$" | head -15 | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/ip:***/g' | sed 's/^/  /'
