            for m in '📊 전체' '로직분석 대표 키워드' '담당자 추가 키워드' 'kr_rank_tab' '담당자가 추가한 키워드가 아직 없습니다' '첫 수집 대기' '300위 밖' '순위 미확인'; do
              n=$(cat "$D"/app.*.js 2>/dev/null | grep -o -- "$m" | wc -l)
              echo "  [$n] $m"
            done
            echo "  (index.bundle.html 이 가리키는 번들)"; grep -o 'app\.[a-f0-9]*\.js' /root/logic-analysis-deploy/frontend/index.bundle.html | head -2
            echo
            echo "== 컨테이너 안 백엔드 파일 =="
            docker exec -i logic-analysis sh -c 'ls -l /app/rank_axes.py /app/client_dashboard.py 2>&1; grep -c "registered_axes" /app/client_dashboard.py'
            echo
            echo "== 오늘 /api/collector 접속처 (해시 앞 6자 · 건수 · 마지막 시각 · IP 원문 없음) =="
            TODAY=$(date +%d/%b/%Y)
            for f in /var/log/nginx/access.log /var/log/nginx/logic-analysis.access.log; do [ -f "$f" ] && LOG="$f" && break; done
            if [ -z "$LOG" ]; then echo "(nginx 접속 로그 파일을 못 찾음)"; else
              grep -a "$TODAY" "$LOG" | grep -a '/api/collector' \
                | awk '{ip=$1; t=$4; cmd="printf %s " ip " | sha256sum | cut -c1-6"; cmd | getline h; close(cmd); n[h]++; last[h]=t; if($7 ~ /serp/) s[h]++ } END { for (h in n) printf "  %s  요청 %4d  serp %4d  마지막 %s\n", h, n[h], s[h]+0, last[h] }'
            fi
            echo
            echo "== 최근 40분 출처 × 경로 — ⚠️ 사이트 전체 요청(수집기 경로만이 아님 · 「기타」= /api/collector 밖 = 화면·정적 파일·스캐너) (해시 앞 6자) =="
            SINCE=$(date -d '40 min ago' +%H:%M); [ "$SINCE" \> "$(date +%H:%M)" ] && SINCE=00:00   # 자정 넘김이면 오늘 0시부터
            if [ -n "$LOG" ]; then
              grep -a "$TODAY" "$LOG" | awk -v since="$SINCE" '{
                split($4,t,":"); hm=t[2] ":" t[3]; if (hm < since) next;
                ip=$1; cmd="printf %s " ip " | sha256sum | cut -c1-6"; cmd | getline h; close(cmd);
                n[h]++; if(!(h in first)) first[h]=hm; last[h]=hm;
                p=$7; sub(/\?.*/,"",p);
                if (p ~ /serp/) serp[h]++; else if (p ~ /heartbeat/) hb[h]++; else if (p ~ /health/) he[h]++; else if (p ~ /keywords/) kw[h]++; else if (p ~ /requests/) rq[h]++; else if (p ~ /blocked/) bl[h]++; else oth[h]++;
                if ($9 >= 400) bad[h]++
              } END { for (h in n) printf "  %s  %s~%s  요청 %3d | serp %d heartbeat %d keywords %d requests %d blocked %d health %d 기타 %d | 4xx/5xx %d\n", h, first[h], last[h], n[h], serp[h]+0, hb[h]+0, kw[h]+0, rq[h]+0, bl[h]+0, he[h]+0, oth[h]+0, bad[h]+0 }'
              echo "  (health 만 있는 출처 = 로직분석 화면을 열어 둔 직원 브라우저 · heartbeat/keywords/serp 가 있는 출처 = 수집기)"
              echo "  [같은 출처가 오늘 /autobid(③ 자동입찰)도 보냈나]"
              A=$(grep -a "$TODAY" "$LOG" | grep -a '/autobid' | awk '{print $1}' | sort -u | while read -r ip; do printf %s "$ip" | sha256sum | cut -c1-6; done | tr '\n' ' ')
              echo "   /autobid 출처: ${A:-(없음)}"
              echo "  [옛 노트북 회선 해시] 1번=b9c354 · 2번=bc7fb8 — 새 출처가 이 둘과 다르면 새 회선"
              echo "  [최근 40분 4xx/5xx 상세(출처·상태·경로 앞 40자)]"
              grep -a "$TODAY" "$LOG" | awk -v since="$SINCE" '{split($4,t,":"); hm=t[2] ":" t[3]; if (hm < since) next; if ($9 < 400) next; if ($7 !~ /api\/collector/) next; ip=$1; cmd="printf %s " ip " | sha256sum | cut -c1-6"; cmd | getline h; close(cmd); p=$7; sub(/\?.*/,"",p); k=h " " $9 " " substr(p,1,40); n[k]++} END {for (k in n) printf "   %s x%d\n", k, n[k]}' | sort | head -20
            fi
            echo
