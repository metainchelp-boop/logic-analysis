name: Debug Rank Batch (읽기 전용 진단)

# 08:00 순위 추적 배치·수집 상태 점검 — 수동 실행 전용(push 트리거 없음 = 재배포 미유발).
# 작업 브랜치 ref 로 dispatch. 전 쿼리 읽기 전용(SELECT) — 데이터 변경 없음.

on:
  workflow_dispatch:
    inputs:
      collector:
        description: '수집기 진단 — off(기본) / on(확장이 서버에 접속했는지·큐·토큰 상태)'
        required: false
        default: 'off'
      rank_link:
        description: '순위 축 브리지 — off(기본) / impact(통합 시 영향 측정·배포 전 가능) / stats / preview / apply'
        required: false
        default: 'off'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Rank batch read-only diagnosis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "== 컨테이너 상태 =="
            docker ps --filter name=logic-analysis --format '{{.Names}} {{.Status}}'
            docker inspect -f 'RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}} OOMKilled={{.State.OOMKilled}}' logic-analysis
            echo
            echo "== 오늘 배치 로그 (순위/수집/스케줄러) =="
            docker logs --since 12h logic-analysis 2>&1 | grep -iE '순위 추적|수집 실패|검색 결과 0건|스케줄러|전체 분석|rank_tracking|daily_analysis' | tail -60 || echo "(매칭 없음)"
            echo
            echo "== DB 현황 (읽기 전용) =="
            docker exec -i logic-analysis python3 - <<'PY'
            import sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()

            print("[client_rank_history 오늘 · check_type별]")
            for r in c.execute("""SELECT check_type, COUNT(*) n,
                                    SUM(CASE WHEN rank_position IS NULL THEN 1 ELSE 0 END) nr,
                                    MIN(checked_at) mn, MAX(checked_at) mx
                                  FROM client_rank_history
                                  WHERE DATE(checked_at)=DATE('now','localtime')
                                  GROUP BY check_type"""):
                print(f"  {r['check_type']}: {r['n']}건 (미노출 {r['nr']}) {r['mn']} ~ {r['mx']}")

            print("\n[rankings(추적상품) 오늘 · check_type별]")
            for r in c.execute("""SELECT check_type, COUNT(*) n,
                                    SUM(CASE WHEN rank_position IS NULL THEN 1 ELSE 0 END) nr,
                                    MIN(checked_at) mn, MAX(checked_at) mx
                                  FROM rankings
                                  WHERE DATE(checked_at)=DATE('now','localtime')
                                  GROUP BY check_type"""):
                print(f"  {r['check_type']}: {r['n']}건 (미노출 {r['nr']}) {r['mn']} ~ {r['mx']}")
            n = c.execute("SELECT COUNT(*) n FROM rankings WHERE DATE(checked_at)=DATE('now','localtime')").fetchone()['n']
            if not n:
                print("  (오늘 기록 없음)")

            print("\n[수집 데이터(collected_serp) 최근 3일]")
            try:
                for r in c.execute("""SELECT collected_date d, COUNT(DISTINCT keyword) kw, COUNT(*) rows
                                      FROM collected_serp
                                      WHERE collected_date >= DATE('now','localtime','-2 day')
                                      GROUP BY collected_date ORDER BY d"""):
                    print(f"  {r['d']}: 키워드 {r['kw']} · 행 {r['rows']}")
            except Exception as e:
                print("  collected_serp 조회 실패:", e)
                print("  테이블 목록:", [t[0] for t in c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%collect%'")])

            print("\n[통합 설계용 — 두 축 규모·겹침]")
            import re as _re
            def _pid(u):
                u = u or ""
                for pat in (r"[?&]nvMid=(\d+)", r"/products/(\d+)", r"/catalog/(\d+)"):
                    m = _re.search(pat, u)
                    if m: return m.group(1)
                return ""
            tp = c.execute("SELECT COUNT(*) n FROM tracked_products").fetchone()["n"]
            tk = c.execute("SELECT COUNT(*) n FROM tracked_keywords").fetchone()["n"]
            cl = c.execute("SELECT COUNT(*) n FROM clients WHERE status='active'").fetchone()["n"]
            crh = c.execute("SELECT COUNT(*) n FROM client_rank_history").fetchone()["n"]
            rk = c.execute("SELECT COUNT(*) n FROM rankings").fetchone()["n"]
            print(f"  축A 추적상품 {tp} · 추적키워드 {tk} · rankings {rk}행")
            print(f"  축B 업체(active) {cl} · client_rank_history {crh}행")
            a_pids = set()
            for r in c.execute("SELECT product_url FROM tracked_products"):
                p = _pid(r["product_url"])
                if p: a_pids.add(p)
            b_pids = set()
            for r in c.execute("SELECT naver_store_url FROM clients WHERE status='active'"):
                p = _pid(r["naver_store_url"])
                if p: b_pids.add(p)
            inter = a_pids & b_pids
            print(f"  상품ID 보유: 축A {len(a_pids)}/{tp} · 축B {len(b_pids)}/{cl}")
            pa = round(len(inter)*100/max(1,len(a_pids)))
            pb = round(len(inter)*100/max(1,len(b_pids)))
            print(f"  * 상품ID 기준 겹침 {len(inter)}건 (축A의 {pa}% / 축B의 {pb}%)")
            orph = c.execute("SELECT COUNT(*) n FROM client_rank_history WHERE client_id NOT IN (SELECT id FROM clients)").fetchone()["n"]
            print(f"  고아 순위행(업체 삭제됨): {orph}")
            kw_a = {r[0] for r in c.execute("SELECT DISTINCT keyword FROM tracked_keywords")}
            kw_b = {r[0] for r in c.execute("SELECT DISTINCT keyword FROM client_rank_history")}
            print(f"  키워드 축A {len(kw_a)} · 축B {len(kw_b)} · 공통 {len(kw_a & kw_b)} · 합집합 {len(kw_a | kw_b)}")

            print("\n[추적 상품 스토어명 슬러그]")
            import re
            tot = slug = 0
            for r in c.execute("SELECT product_url, store_name FROM tracked_products"):
                tot += 1
                m = re.search(r"smartstore\.naver\.com/([^/?#]+)", r["product_url"] or "")
                s = (r["store_name"] or "").strip().lower()
                if m and s == m.group(1).strip().lower():
                    slug += 1
            print(f"  총 {tot} / 슬러그 {slug}")
            PY
            echo
            if [ "${{ github.event.inputs.collector }}" = "on" ]; then
              echo "== 수집기 진단 =="
              echo "-- 확장이 서버에 접속한 기록(오늘) --"
              # 확장은 GET /api/collector/keywords 로 목록을 받고 POST /serp 로 올린다.
              # 한 줄도 없으면 '확장이 서버에 아예 말을 걸지 않은 것' = 맥북 쪽 문제.
              docker logs --since 24h logic-analysis 2>&1 | grep -E 'api/collector' \
                | awk '{print $0}' | tail -25 || echo "  (접속 기록 없음)"
              echo "-- 접속 횟수(경로별·24시간) --"
              docker logs --since 24h logic-analysis 2>&1 | grep -oE 'GET /api/collector/[a-z]+|POST /api/collector/[a-z]+' \
                | sort | uniq -c || echo "  (없음)"
              echo "-- 수집기가 몇 대인가(접속 IP 개수·24시간) --"
              # 도커 로그의 클라이언트는 전부 nginx(172.18.0.1)라 구분이 안 된다 → 호스트 nginx 로그를 본다.
              # ⚠️ 저장소가 공개라 Actions 로그에 실제 IP 를 찍지 않는다. 뒤 두 자리를 가리고 대수만 센다.
              for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
                [ -f "$f" ] && cat "$f"
              done 2>/dev/null | grep -E 'api/collector/(serp|keywords|requests)' \
                | awk '{print $1}' | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1.x.x/' \
                | sort | uniq -c | sort -rn | head -10 \
                || echo "  (nginx 로그를 못 읽음 — 권한·경로 확인)"
              echo "  ↑ 줄이 2개 이상이면 수집기가 2대 이상 돌고 있다는 뜻"
              echo
              docker exec -i logic-analysis python3 - <<'PY'
            import os, sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()
            print("[수집 적재 — 최근 7일]")
            n = 0
            for r in c.execute("""SELECT collected_date d, COUNT(*) kw, MAX(created_at) last_at
                                    FROM collected_serp
                                   WHERE collected_date >= date('now','localtime','-6 day')
                                   GROUP BY collected_date ORDER BY d DESC"""):
                n += 1
                print(f"  {r['d']}: 키워드 {r['kw']}건 · 마지막 업로드 {r['last_at']}")
            if not n:
                print("  (최근 7일 수집 없음)")
            print("\n[온디맨드 요청 큐]")
            for r in c.execute("""SELECT status, COUNT(*) n, MIN(requested_at) oldest, MAX(attempts) mx
                                    FROM collect_requests GROUP BY status"""):
                print(f"  {r['status']}: {r['n']}건 (가장 오래된 {r['oldest']} · 최대 시도 {r['mx']})")
            print("\n[수집 깊이 실측 — pagingSize=80 이 실제로 먹히는지]")
            # 한 키워드당 몇 개를 모았는지. 300 근처면 80 이 정상 수용된 것,
            # 40·80 에서 멈춰 있으면 페이지를 더 못 넘긴 것(= 300위 추적이 깨져 있던 것).
            try:
                rows = list(c.execute("""SELECT product_count n, COUNT(*) c
                                          FROM collected_serp
                                         GROUP BY product_count ORDER BY c DESC LIMIT 8"""))
                for r in rows:
                    print(f"  {r['n']}개 수집 — 키워드 {r['c']}건")
                agg = c.execute("""SELECT MIN(product_count) mn, MAX(product_count) mx,
                                          AVG(product_count) av FROM collected_serp""").fetchone()
                print(f"  최소 {agg['mn']} · 최대 {agg['mx']} · 평균 {round(agg['av'] or 0, 1)}")
            except Exception as e:
                print("  조회 실패:", e)

            print("\n[수집 대상 키워드 규모]")
            kws = set()
            for sql in ("SELECT DISTINCT keyword FROM tracked_keywords",
                        "SELECT DISTINCT keyword FROM client_analyses"):
                for r in c.execute(sql):
                    k = (r[0] or "").strip()
                    if k: kws.add(k)
            done = {r[0] for r in c.execute(
                "SELECT keyword FROM collected_serp WHERE collected_date = date('now','localtime')")}
            print(f"  대상 {len(kws)} · 오늘 완료 {len(done)} · 남음 {len(kws - done)}")
            print("\n[서버 토큰 설정]")
            tok = os.getenv("COLLECTOR_TOKEN", "")
            print(f"  COLLECTOR_TOKEN: {'설정됨(len=%d)' % len(tok) if tok else '❌ 미설정 — 전 경로 503'}")

            # ⚠️ 「수집됐다」와 「값이 맞다」는 다른 명제다(2026-08-05 검색량 오판 교훈).
            #    플랜 B(2026-08-06)로 판독 원천이 API 응답 → 페이지 __NEXT_DATA__ 로 바뀌었으므로
            #    필드 이름이 달라져 title·productId 가 빈 채로 쌓일 수 있다. 실제 적재분을 열어본다.
            print("\n[적재 품질 — 오늘 수집분 실측]")
            import json as _json
            rows = list(c.execute("""SELECT keyword, products_json, product_count
                                       FROM collected_serp
                                      WHERE collected_date = date('now','localtime')
                                      ORDER BY created_at DESC LIMIT 20"""))
            if not rows:
                print("  (오늘 수집분 없음)")
            else:
                tot = 0
                miss = {"productId": 0, "title": 0, "link": 0, "price": 0, "mallName": 0}
                rank_bad = 0
                for r in rows:
                    try:
                        prods = _json.loads(r["products_json"]) or []
                    except Exception:
                        print(f"  ⚠️ {r['keyword']}: products_json 파손"); continue
                    for i, p in enumerate(prods):
                        tot += 1
                        for k in miss:
                            if not str(p.get(k) or "").strip():
                                miss[k] += 1
                    ranks = [p.get("rank") for p in prods]
                    if ranks != list(range(1, len(prods) + 1)):
                        rank_bad += 1
                print(f"  표본 키워드 {len(rows)}건 · 상품 {tot}개")
                for k, v in miss.items():
                    pct = round(v * 100 / tot, 1) if tot else 0
                    mark = "❌" if pct > 5 else ("⚠️" if pct > 0 else "✅")
                    print(f"  {mark} {k} 빈 값 {v}개 ({pct}%)")
                print(f"  {'❌' if rank_bad else '✅'} 순위 1..n 연속 — 어긋난 키워드 {rank_bad}건")
                s = None
                for r in rows:
                    try:
                        s = (_json.loads(r["products_json"]) or [None])[0]
                    except Exception:
                        s = None
                    if s: break
                if s:
                    print(f"  샘플 1위: {_json.dumps(s, ensure_ascii=False)[:400]}")
            PY
              echo
            fi
            RL="${{ github.event.inputs.rank_link }}"
            if [ "$RL" = "impact" ]; then
              # 조회 통합(4단계)을 하면 전산① portal-summary 가 실제로 얼마나 달라지는지 측정.
              # rank_link 배포 이전에도 돌 수 있게 순수 SQL 로만 읽는다(쓰기 없음).
              echo "== 조회 통합 영향 측정 (읽기 전용) =="
              docker exec -i logic-analysis python3 - <<'PY'
            import re, sqlite3
            conn = sqlite3.connect("file:/app/data/logic_data.db?mode=ro", uri=True)
            conn.row_factory = sqlite3.Row
            c = conn.cursor()

            def pid(u):
                u = u or ""
                for pat in (r"[?&]nvMid=(\d+)", r"/products/(\d+)", r"/catalog/(\d+)"):
                    m = re.search(pat, u)
                    if m: return m.group(1)
                return ""

            # 축A: 상품ID → {키워드: 최신 순위}
            a_rank = {}
            for r in c.execute("""
                SELECT p.product_url, k.keyword, rk.rank_position, rk.checked_at
                  FROM tracked_products p
                  JOIN tracked_keywords k ON k.product_id = p.id
                  JOIN rankings rk ON rk.id = (SELECT MAX(id) FROM rankings
                                                WHERE keyword_id = k.id)
            """):
                key = pid(r["product_url"])
                if key:
                    a_rank.setdefault(key, {})[r["keyword"]] = (r["rank_position"], r["checked_at"])

            # 축B: 업체별 키워드 최신 순위
            filled = same = diff = still = 0
            diff_samples = []
            cells = 0
            linked_clients = set()
            # ⚠ 바깥 루프를 커서로 돌면서 같은 커서로 안쪽 질의를 하면 이터레이션이 끊긴다
            #   (첫 업체만 돌고 끝남 — 실측 「총 1개」로 드러남). 목록을 먼저 확정하고
            #   안쪽 질의는 conn.execute(매번 새 커서)로 돈다.
            client_rows = c.execute("""SELECT id, name, naver_store_url FROM clients
                                        WHERE status='active' AND COALESCE(vertical,'store')='store'""").fetchall()
            for cl in client_rows:
                key = pid(cl["naver_store_url"])
                amap = a_rank.get(key) if key else None
                # portal-summary 와 같은 선택: client_analyses 키워드별 최신 8개
                kws = [r["keyword"] for r in conn.execute("""
                    SELECT keyword, MAX(analyzed_date) d FROM client_analyses
                     WHERE client_id=? GROUP BY keyword ORDER BY d DESC LIMIT 8""", (cl["id"],))]
                if not kws:
                    continue
                bmap = {}
                for r in conn.execute("""
                    SELECT keyword, rank_position FROM client_rank_history
                     WHERE client_id=? AND id IN (SELECT MAX(id) FROM client_rank_history
                                                   WHERE client_id=? GROUP BY keyword)""",
                    (cl["id"], cl["id"])):
                    bmap[r["keyword"]] = r["rank_position"]
                if amap:
                    linked_clients.add(cl["id"])
                for kw in kws:
                    cells += 1
                    b = bmap.get(kw)
                    a = (amap or {}).get(kw)
                    av = a[0] if a else None
                    if b in (None, 0):
                        if av not in (None, 0):
                            filled += 1          # 「-」 → 실제 순위 (개선)
                        else:
                            still += 1           # 여전히 「-」 (변화 없음)
                    else:
                        if av in (None, 0):
                            pass                 # 축B 값 유지 (변화 없음)
                        elif av == b:
                            same += 1            # 두 축이 같은 값 (안전 확인)
                        else:
                            diff += 1            # 두 축이 다른 값 (⚠ 검토 대상)
                            if len(diff_samples) < 10:
                                diff_samples.append((cl["name"], kw, b, av, a[1]))

            print(f"  전산① 이 보는 칸(업체×키워드) 총 {cells}개")
            print(f"  ├ 지금 「-」인데 축A 에 순위가 있는 칸 : {filled}개  ← 통합하면 채워짐")
            print(f"  ├ 지금도 앞으로도 「-」               : {still}개  ← 변화 없음")
            print(f"  ├ 두 축 값이 같음                     : {same}개  ← 안전")
            print(f"  └ 두 축 값이 다름                     : {diff}개  ← 다르면 검토 필요")
            print(f"  축A 링크가 있는 업체: {len(linked_clients)}곳")
            if diff_samples:
                print("  값이 다른 샘플(업체 · 키워드 · 축B · 축A · 축A측정시각):")
                for s in diff_samples:
                    print(f"   - {s[0]} · {s[1]} · 축B {s[2]} vs 축A {s[3]} ({s[4]})")
            PY
              echo
            fi
            if [ -n "$RL" ] && [ "$RL" != "off" ] && [ "$RL" != "impact" ]; then
              echo "== 순위 축 브리지 ($RL) =="
              # 실제 진입점(rank_link 모듈)을 그대로 호출한다 — 내부 로직 재현 금지 원칙.
              docker exec -i -e RL_MODE="$RL" logic-analysis python3 - <<'PY'
            import os, sys, json
            sys.path.insert(0, "/app")   # Dockerfile WORKDIR=/app 에 backend 내용이 그대로 복사됨
            import rank_link
            mode = os.getenv("RL_MODE", "stats")
            if mode == "apply":
                rank_link.init_rank_link_db()
                print(json.dumps(rank_link.run_maintenance(), ensure_ascii=False, indent=2))
            elif mode == "preview":
                rank_link.init_rank_link_db()
                r = rank_link.preview_backfill(limit=10)
                s = r.pop("samples", [])
                print(json.dumps(r, ensure_ascii=False, indent=2))
                print("  샘플(최대 10):")
                for x in s:
                    print(f"   - 업체 {x['client_id']} {x['client_name']} ↔ 상품 {x['tracked_product_id']} "
                          f"{x['product_name'][:30]} (키 {x['product_key']})")
            else:
                print(json.dumps(rank_link.link_stats(), ensure_ascii=False, indent=2))
            PY
              echo
            fi
            echo "== 최근 오류 tail =="
            docker logs --tail 60 logic-analysis 2>&1 | grep -iE 'error|exception|traceback' | tail -15 || echo "(오류 없음)"
