            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_saved_exports test_naver_saved_exports_failed_unit_recovery -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/saved-export-tests.txt"
