name: 저장 상품 내보내기 개발 검증 (배포 없음)

on:
  push:
    branches: [codex/naver-claude-reference-ops-20261011]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-product-export-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-export:
