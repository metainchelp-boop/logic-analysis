name: 저장 상품 내보내기 개발 검증 (배포 없음)

on:
  push:
    branches: [codex/naver-claude-reference-ops-20261011]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-product-export-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-export:
    if: github.ref == 'refs/heads/codex/naver-claude-reference-ops-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 개발 소스 받기 (배포 자격 없음)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 합성 SQLite·파일 검사 (외부망 차단)
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/product-tests" "$RUNNER_TEMP/product-home"
          git rev-parse HEAD > "$RUNNER_TEMP/product-tests/source-sha.txt"
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m unittest discover -s backend/tests -p test_naver_product_export.py -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/export-tests.txt"
      - name: 실제 Linux 서비스 문법·격리된 설치 회귀 검사
        run: |
          set -euo pipefail
          command -v systemd-analyze
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_saved_exports test_naver_saved_exports_failed_unit_recovery -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/saved-export-tests.txt"
      - name: 큰 DB 배포·정확한 실패 복구 Linux 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_preview_completion_release test_naver_completion_transport test_naver_completion_failed_apply_recovery test_naver_completion_migration_inspect test_naver_completion_failed_database_archive test_naver_completion_exports_reinstall -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/completion-database-tests.txt"
      - name: 스키마 유지 코드 패치·롤백·전송 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_completion_postcompletion_transport test_naver_completion_patch_workflow -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/completion-patch-tests.txt"
      - name: Claude 문안 코드 패치·현재판 복구 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_claude_quality_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/claude-quality-patch-tests.txt"
      - name: AI 검증 진단 코드 패치·faa0 복구 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_strategy_validation_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/strategy-validation-patch-tests.txt"
      - name: 고정 광고주 번호 v2·source 진단·읽기 전용 전송 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_completion_source_diagnostics test_naver_completion_source_diagnostics_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/completion-source-diagnostics-tests.txt"
      - name: 점검 연속 수집 코드 패치·70e 복구 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_inspection_continuity_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/inspection-continuity-patch-tests.txt"
      - name: 현재 15f 점검 진척·증명·읽기 전용 진단 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_current_inspection_diagnostics test_naver_current_inspection_diagnostics_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/current-inspection-diagnostics-tests.txt"
      - name: 현재 dc168 설정 원천·scope·읽기 전용 진단 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_setup_stale_diagnostics test_naver_setup_stale_diagnostics_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/setup-stale-diagnostics-tests.txt"
      - name: 기존 예산 초안·상품 가설 패치·15f 복구 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_budget_draft_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/budget-draft-patch-tests.txt"
      - name: 학습 실패 관측 패치·dc168 복구 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/product-home" "TMPDIR=$RUNNER_TEMP/product-home" \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            env PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_learning_failure_patch test_naver_learning_failure_transport -v \
            2>&1 | tee "$RUNNER_TEMP/product-tests/learning-failure-patch-tests.txt"
      - name: 소스·합성 결과 보관 (운영 자료 없음)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: naver-product-export-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/product-tests/
          retention-days: 7
          if-no-files-found: error
