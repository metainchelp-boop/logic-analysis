name: 시장 진단 위치 수정 Linux 격리 검증
on:
  push:
    branches: [codex/naver-market-probe-layout-linux-20261018]
permissions:
  contents: read
jobs:
  synthetic:
    if: github.ref == 'refs/heads/codex/naver-market-probe-layout-linux-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 고정 원천제한 진단 및 전송 경계 검사
        run: |
          set -euo pipefail
          sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups --no-new-privs \
            env -i "PATH=$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_market_source_limit_probe test_naver_market_source_limit_probe_host test_naver_market_probe_namespace_fd_order test_naver_market_probe_fixture_fd_summary test_naver_market_probe_preflight_phases -v
      - name: Linux 격리 읽기전용 WAL 실제 경계 검사
        run: |
          set -euo pipefail
          sudo env -i "PATH=$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=backend/tools:backend/tests python -m unittest test_naver_market_source_limit_probe_namespace -v
