name: 네이버 배포 도구 합성 검증

# 서버·제품 비밀값 없이 정확한 변경 커밋을 검사한다.
on:
  pull_request:
    paths: ['deploy/naver/**', '.github/workflows/naver-deploy.yml', '.github/workflows/naver-tools-check.yml', '.github/workflows/deploy.yml']
  push:
    branches: ['codex/naver-app-inventory-20261101']
    paths: ['deploy/naver/**', '.github/workflows/naver-deploy.yml', '.github/workflows/naver-tools-check.yml', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-tools-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 정적 검사와 합성 회귀 (서버·DB·제품 키 없음)
        run: |
          set -euo pipefail
          shellcheck -S warning deploy/naver/naver-deploy.sh deploy/naver/make-source-archive.sh deploy/naver/product-tests.sh
          python -I -B -m unittest discover -s deploy/naver/tests -v
