name: 네이버 배포 도구 합성 검증

# 서버·제품 비밀값 없이 정확한 변경 커밋을 검사한다.
on:
  pull_request:
    paths: ['deploy/naver/**', '.github/workflows/naver-deploy.yml', '.github/workflows/naver-grammar-preflight.yml', '.github/workflows/naver-inspection-aggregate.yml', '.github/workflows/naver-build-cache-maintenance.yml', '.github/workflows/naver-cold-backup-archive.yml', '.github/workflows/naver-backup-status.yml', '.github/workflows/naver-retired-image-inspect.yml', '.github/workflows/naver-backup-bundle.yml', '.github/workflows/naver-content-preflight.yml', '.github/workflows/naver-autobid-key-preflight.yml', '.github/workflows/naver-image-preservation.yml', '.github/workflows/naver-images-preservation.yml', '.github/workflows/naver-data-preflight.yml', '.github/workflows/naver-login-audit-diagnostic.yml', '.github/workflows/naver-collector-diagnostic.yml', '.github/workflows/naver-data-diagnostic.yml', '.github/workflows/naver-data-continuation.yml', '.github/workflows/naver-data-preservation.yml', '.github/workflows/naver-data-control-preflight.yml', '.github/workflows/naver-control-mutation.yml', '.github/workflows/naver-key-capsule-preservation.yml', '.github/workflows/naver-tools-check.yml', '.github/workflows/deploy.yml']
  push:
    branches: ['codex/naver-app-inventory-20261101']
    paths: ['deploy/naver/**', '.github/workflows/naver-deploy.yml', '.github/workflows/naver-grammar-preflight.yml', '.github/workflows/naver-inspection-aggregate.yml', '.github/workflows/naver-build-cache-maintenance.yml', '.github/workflows/naver-cold-backup-archive.yml', '.github/workflows/naver-backup-status.yml', '.github/workflows/naver-retired-image-inspect.yml', '.github/workflows/naver-backup-bundle.yml', '.github/workflows/naver-tools-check.yml', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-tools-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 정적 검사와 합성 회귀 (서버·DB·제품 키 없음)
        env:
          NAVER_REQUIRE_DOCKER_CLI: '1'
          NAVER_MIGRATE_TESTS_SEPARATE: '1'
          # 실제 nginx -T 출력 형식 회귀(고정 digest, 네트워크 없는 컨테이너에서 설정만 읽는다).
          NAVER_REAL_NGINX_IMAGE: 'nginx@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609'
        run: |
          set -euo pipefail
          shellcheck -S warning deploy/naver/naver-deploy.sh deploy/naver/make-source-archive.sh deploy/naver/product-tests.sh
          python -I -B -m unittest discover -s deploy/naver/tests -v

  # 스키마 이관(migrate-*) 합성 시험은 오래 걸려 따로 병렬로 돈다(같은 저장소 사본, 서버·제품 키 없음).
  migrate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 스키마 이관 합성 회귀 (서버·DB·제품 키 없음)
        run: |
          set -euo pipefail
          python -I -B -m unittest discover -s deploy/naver/tests -p 'test_naver_*migrate*.py' -v
