<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>광고 연동 정보 입력 — 메타아이앤씨</title>
<style>
  :root{--blue:#2563eb;--text:#1f2937;--sub:#6b7280;--line:#e5e7eb;--bg:#f3f6fb;--card:#fff;--green:#16a34a;--amber:#b45309}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
  .top{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
  .top img{height:26px}
  .top .t{font-size:13px;color:var(--sub);font-weight:600}
  h1{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px}
  .lead{font-size:13.5px;color:#374151;background:#eaf1fe;border:1px solid #d4e3fb;border-radius:12px;padding:13px 15px;line-height:1.7;margin-bottom:8px}
  .sec{font-size:11.5px;color:var(--sub);margin:0 0 18px;display:flex;align-items:center;gap:5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;font-weight:800;margin:0 0 4px}
  .gbtn{background:none;border:none;color:var(--blue);font-size:12px;cursor:pointer;padding:0;margin:2px 0 0;text-decoration:underline}
  .guide{display:none;background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12px;color:#41464f;line-height:1.7;margin:8px 0 2px}
  .guide ol{margin:4px 0 0;padding-left:18px}
  .fg{margin-top:11px}
  .fg label{display:block;font-size:12.5px;font-weight:700;color:#374151;margin-bottom:5px}
  .fg input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:14px;color:var(--text);background:#fff}
  .fg input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .note{font-size:11.5px;color:var(--amber);margin-top:9px}
  .submit{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
  .submit:disabled{opacity:.5;cursor:default}
  .msg{text-align:center;padding:40px 20px}
  .msg .ic{font-size:44px}
  .msg h2{font-size:19px;margin:12px 0 6px}
  .msg p{color:var(--sub);font-size:13.5px}
  .secure{font-size:12px;color:var(--green);background:#ecfdf3;border:1px solid #bbf7d0;border-radius:10px;padding:9px 12px;text-align:center;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="top"><img src="/logo.png" alt="METAINC" onerror="this.style.display='none'"><span class="t">메타아이앤씨 광고 연동</span></div>
  <div id="body" style="color:var(--sub);text-align:center;padding:50px 0">불러오는 중…</div>
</div>
<script>
var TOKEN = location.pathname.split('/').filter(Boolean).pop();
var INFO = null;
function esc(s){return s==null?"":String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function el(id){return document.getElementById(id);}

function showMsg(ic, title, sub){
  el('root').innerHTML='<div class="top"><img src="/logo.png" alt="METAINC" onerror="this.style.display=\'none\'"><span class="t">메타아이앤씨 광고 연동</span></div>'+
    '<div class="msg"><div class="ic">'+ic+'</div><h2>'+esc(title)+'</h2><p>'+sub+'</p></div>';
}

function toggleGuide(i){ var g=el('gd-'+i); g.style.display = g.style.display==='block'?'none':'block'; }

async function load(){
  try{
    var r = await fetch('/api/connect/'+TOKEN+'/info');
    if(!r.ok){ showMsg('⚠️','유효하지 않은 링크예요','링크가 잘못되었거나 만료되었습니다.<br>담당자에게 새 링크를 요청해주세요.'); return; }
    INFO = await r.json();
    if(INFO.expired){ showMsg('⏰','만료된 링크예요','보안을 위해 일정 기간이 지나면 만료됩니다.<br>담당자에게 새 링크를 요청해주세요.'); return; }
    render();
  }catch(e){ showMsg('⚠️','문제가 발생했어요', esc(e.message)); }
}

function render(){
  var chans = INFO.channels||[];
  var cards = chans.map(function(ch, i){
    var fields = (ch.fields||[]).map(function(f){
      return '<div class="fg"><label>'+esc(f.label)+'</label><input data-ch="'+esc(ch.key)+'" data-k="'+esc(f.k)+'" type="'+(f.pw?'password':'text')+'" autocomplete="off" placeholder="입력"></div>';
    }).join('');
    var guide = (ch.guide&&ch.guide.length)?(
      '<button type="button" class="gbtn" onclick="toggleGuide('+i+')">📖 발급 방법 보기</button>'+
      '<div class="guide" id="gd-'+i+'"><b>'+esc(ch.name)+' 키 발급</b><ol>'+ch.guide.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol></div>'):'';
    return '<div class="card"><h2>'+esc(ch.name)+'</h2>'+guide+fields+'</div>';
  }).join('');
  el('body').outerHTML =
    '<div id="body">'+
    '<h1>'+esc(INFO.client_name)+'님, 광고 연동 정보를 입력해주세요</h1>'+
    '<div class="lead"><b>'+esc(INFO.agency||'메타아이앤씨')+'</b>가 '+esc(INFO.client_name)+'님의 광고 성과를 한 곳에서 관리해 드리기 위해, 아래 채널의 <b>API 연동 정보</b>를 요청드립니다. 보유하신 채널만 입력하시면 됩니다.</div>'+
    '<div class="sec">🔒 입력하신 정보는 <b>암호화되어 안전하게 저장</b>되며, 광고 성과 <b>조회 용도로만</b> 사용됩니다.</div>'+
    cards+
    '<button class="submit" id="submitBtn" onclick="submit()">연동 정보 제출하기</button>'+
    '</div>';
}

async function submit(){
  var btn = el('submitBtn');
  var data = {};
  document.querySelectorAll('input[data-ch]').forEach(function(inp){
    var v = inp.value.trim(); if(!v) return;
    var ch = inp.getAttribute('data-ch'), k = inp.getAttribute('data-k');
    (data[ch] = data[ch] || {})[k] = v;
  });
  if(!Object.keys(data).length){ alert('입력하신 항목이 없어요. 보유하신 채널의 정보를 입력해주세요.'); return; }
  btn.disabled = true; btn.textContent = '제출 중…';
  try{
    var r = await fetch('/api/connect/'+TOKEN, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({channels: data})});
    var res = await r.json();
    if(r.ok && res.ok){
      showMsg('✅','제출이 완료되었어요!','입력하신 '+res.saved.length+'개 채널 정보가 안전하게 전달되었습니다.<br>메타아이앤씨 담당자가 확인 후 연동을 시작합니다.<br>이 창은 닫으셔도 됩니다.');
    } else {
      alert((res && res.detail) || '제출에 실패했어요. 다시 시도해주세요.');
      btn.disabled = false; btn.textContent = '연동 정보 제출하기';
    }
  }catch(e){ alert('제출 중 오류: '+e.message); btn.disabled = false; btn.textContent = '연동 정보 제출하기'; }
}
load();
</script>
</body>
</html>
