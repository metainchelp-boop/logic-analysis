<meta charset="utf-8">
<style>
  /* 쇼핑 순위 수집기 팝업과 같은 톤(2026-08-28 대표 지시 「디자인 동일하게」) —
     전산 표준 파랑 #3b82f6 · 흰 바탕. 값·클래스도 쇼핑 popup.html 과 맞춘다. */
  body{width:340px;margin:0;padding:14px;font-family:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;font-size:13px;color:#1e293b}
  h1{font-size:15px;margin:0 0 10px}
  button{padding:7px 12px;border:0;border-radius:6px;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:12.5px}
  button.ghost{background:#e2e8f0;color:#334155}
  button.off{background:#fff;color:#b45309;border:1px solid #fcd34d}
  .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin:8px 0;line-height:1.7}
  .b{font-weight:800}
  .ok{color:#16a34a}.bad{color:#dc2626}.wr{color:#b45309}
  .sec{margin:7px 0;padding-top:7px;border-top:1px solid #e2e8f0}
  .sec:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .dim{color:#64748b;font-size:11.5px}
  .bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:5px 0 3px}
  .bar>i{display:block;height:100%;background:#3b82f6;border-radius:99px;transition:width .4s}
  #logs{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:9px;height:130px;overflow:auto;font-size:11px;line-height:1.55;white-space:pre-wrap}
  .btns{display:flex;gap:6px;margin:8px 0}
</style>
<h1>메타아이앤씨 플레이스 순위 추적기</h1>
<!-- 버전은 manifest 에서 읽어 넣는다 — 숫자를 박아두면 교체해도 옛 버전으로 보여
     「안 바뀌었다」는 오판을 부른다(2026-08-12 이 확장에서 실제로 있었던 사고). -->
<div id="ver" style="margin:-6px 0 10px;font-size:11.5px;color:#64748b"></div>

<div class="stat" id="stat">상태를 불러오는 중…</div>

<div class="btns">
  <button id="run">지금 전체 수집</button>
  <button id="refresh" class="ghost">새로고침</button>
  <button id="toggle" class="off">…</button>
</div>

<div id="logs"></div>
<div class="dim" style="margin-top:8px">추적 목록은 로직분석 「📍 플레이스 추적」 화면에서 관리합니다.
이 컴퓨터의 크롬이 켜져 있으면 매일 06:30 자동 수집됩니다.</div>
<script src="popup.js"></script>
