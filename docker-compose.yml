# ⛔ 이 파일은 **배포에 쓰이지 않습니다.**
#
#    배포 스크립트(.github/workflows/deploy.yml)가 서버에 docker-compose.yml 을 **직접 써 넣는다.**
#    그 안은 `build: ./backend` 라서 여기의 `build: .`(루트 Dockerfile)은 쓰이지 않는다.
#
# ⛔ 여기를 고쳐도 서버는 안 바뀐다. 배포 구성을 바꾸려면 deploy.yml 의 compose 블록을 고칠 것.
#    (로컬에서 단독 실행할 때만 쓰인다.)
#
# ⚠️ 2026-09-14 — 이 사실을 몰라 루트 Dockerfile 을 읽고 워커 수를 틀리게 보고한 일이 있다.
#    `backend/tests/test_deploy_source.py` 가 이 관계를 회귀로 지킨다.
#
# logic-analysis 표준 Docker 구성
# 사용법: docker compose up -d --build
# 중요: .env 파일이 같은 디렉토리에 있어야 합니다.

services:
  app:
    build: .
    container_name: logic-analysis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - DB_PATH=/app/data/logic_data.db
    volumes:
      # 중요: 이 볼륨이 업체(광고주) DB를 영속적으로 저장합니다.
      # 절대로 이 경로를 변경하지 마세요!
      - ./data:/app/data
    ports:
      - "127.0.0.1:5050:5050"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os,sys;db=os.getenv('DB_PATH','/app/data/logic_data.db');conn=sqlite3.connect(db,timeout=5);r=conn.execute('SELECT COUNT(*) FROM clients').fetchone();conn.close();print(f'OK: {r[0]} clients');sys.exit(0)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
