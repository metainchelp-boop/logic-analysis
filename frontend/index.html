<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일: 데스크톱 레이아웃(1280px)을 그대로 그린 뒤 화면 폭에 맞게 축소(줌아웃). PC는 viewport meta 무시 → 무변화. -->
  <meta name="viewport" content="width=1280">
  <title>로직 분석 v3 - 네이버 쇼핑 키워드 분석 & 순위 추적</title>
  <!-- CDN 프리커넥트 (DNS+TLS 사전 연결) -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- React (Babel 불필요 — JSX는 사전 빌드된 번들로 제공) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Chart.js 는 차트 렌더링 전까지 불필요 → 지연 로드 -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <!-- 폰트 (display=swap 으로 FOUT 허용, 로딩 중 시스템 폰트 표시) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- 스타일시트 -->
  <link rel="stylesheet" href="css/styles.css?v=6.6.0">
  <!-- 보고서 디자인 테마 (styles.css 덮어쓰기) -->
  <link rel="stylesheet" href="css/report-theme.css?v=6.5.8">
</head>
<body>
  <div id="root"></div>
  <!-- 사전 빌드된 단일 번들 (인-브라우저 Babel 제거 → 로딩 빠름, 해시 파일명 → 캐시 자동 갱신) -->
  <!-- ⚠️ 컴포넌트(.jsx) 수정 후에는 `node frontend/build.js`로 번들을 재생성해야 합니다 -->
  <script src="dist/app.f52836d35a52.js"></script>
</body>
</html>
